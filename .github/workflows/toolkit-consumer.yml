name: Toolkit consumer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running build. Runs on
# main are never cancelled, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  published-consumer:
    # The job checks out a fixed consumer revision, so a pull request cannot
    # change what it tests; it runs on main and by hand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Public snapshots are published manually. This consumer revision is
      # verified against the currently published API (snapshot source fd068852).
      # Update this pin after publishing incompatible API changes and verifying
      # the corresponding consumer. candidate-consumer always tests this PR.
      - uses: actions/checkout@v4
        with:
          ref: 95387ac1d7fd31d12ecdaa355af88a3d1867a8a3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the standalone consumer against public Maven artifacts
        run: ./gradlew -p examples/protobuf-toolkit run --refresh-dependencies --console=plain
      - name: Save generated OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-openapi
          path: examples/protobuf-toolkit/build/contact-openapi.json
          if-no-files-found: error

  candidate-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage candidate Maven artifacts
        run: >-
          ./gradlew -I gradle/toolkit-consumer.init.gradle
          -PtoolkitRepository="${{ runner.temp }}/toolkit-maven"
          -PpublishVersion=0.1.0-consumer-candidate-SNAPSHOT
          stageToolkitConsumer --console=plain
      - name: Run standalone consumer against candidate artifacts
        run: >-
          ./gradlew -p examples/protobuf-toolkit
          -PtoolkitRepository="${{ runner.temp }}/toolkit-maven"
          -PprotomoltVersion=0.1.0-consumer-candidate-SNAPSHOT
          run --refresh-dependencies --console=plain
      - name: Save candidate OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-candidate-openapi
          path: examples/protobuf-toolkit/build/contact-openapi.json
          if-no-files-found: error
