name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running build. Every
# other run gets a group of its own (keyed on run_id), so a main push neither
# cancels nor replaces a queued main run and each commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compilation is pinned to --release 25, and the test JVM runs on that same baseline.
  # The matrix stays a matrix so a newer JDK can be added beside it without reshaping
  # the job (the build itself always runs on the toolchain JDK).
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-jdk: ['25']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.test-jdk }}
            25

      - uses: gradle/actions/setup-gradle@v4

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          # Match coordination-contract.sh: bundled well-known descriptors vary by CLI version.
          version: '1.70.0'

      - name: Main forwarding check policy
        run: bash .forgejo/scripts/forward-main-checks-test.sh

      - name: Build and test
        env:
          PROTOMOLT_APICURIO_TEST_DIAGNOSTIC_PATH: ${{ runner.temp }}/apicurio-test-diagnostics/registry.log
        run: ./gradlew build --console=plain -PtestJdk=${{ matrix.test-jdk }}

      - name: Save failed sample test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sample-test-results-jdk-${{ matrix.test-jdk }}-${{ github.run_attempt }}
          path: |
            samples/build/test-results/test/*.xml
            samples/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

      - name: Save repository test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repository-test-diagnostics-jdk-${{ matrix.test-jdk }}-${{ github.run_attempt }}
          path: |
            repo/container/build/test-results/test/*.xml
            repo/container/build/reports/tests/test/
            repo/service/build/test-results/test/*.xml
            repo/service/build/reports/tests/test/
            ${{ runner.temp }}/repository-host-diagnostics/
          if-no-files-found: warn
          retention-days: 3

      - name: Save Apicurio integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apicurio-test-diagnostics-jdk-${{ matrix.test-jdk }}-${{ github.run_attempt }}
          path: |
            schema/apicurio/runtime/build/test-results/test/*.xml
            schema/apicurio/runtime/build/reports/tests/test/
            ${{ runner.temp }}/apicurio-test-diagnostics/registry.log
          if-no-files-found: warn
          retention-days: 3

      # Every module's integrationTest results: the assertion messages and captured
      # output the console log leaves out.
      - name: Save integration test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-jdk-${{ matrix.test-jdk }}-${{ github.run_attempt }}
          path: |
            **/build/test-results/integrationTest/*.xml
          if-no-files-found: warn
          retention-days: 7

      # Excluded from `build` because these tests fork an agent JVM and shell out to
      # protoc, which is slower than anything the default test task runs. The lane keeps
      # the coverage (the agent driven exactly as an IDE drives it) without slowing the
      # main build; a single run is enough.
      - name: ACP protocol round trips
        run: ./gradlew :protomolt-acp-agent:acpProtocolTest --rerun-tasks --console=plain -PtestJdk=${{ matrix.test-jdk }}

      - name: Buf lint
        run: buf lint
      - name: Check browser coordination descriptor matches source
        run: apps/console/scripts/coordination-contract.sh --check

      # Static checks for the deployment package (compose files, Dockerfiles,
      # scripts). In-process only: no containers, GPU, or live calls.
      - name: Deployment statics
        run: scripts/check-deployment-statics.sh

      - name: Starter configuration
        run: deploy/starter/check-static.sh
      - name: Agent starter configuration
        run: deploy/agents/check-static.sh
      - name: Authoring starter configuration
        run: deploy/authoring/check-static.sh

      - name: Buf breaking (PRs)
        if: github.event_name == 'pull_request'
        env:
          PROTO_BASE_REF: origin/${{ github.base_ref }}
        run: scripts/check-proto-compatibility.sh "$PROTO_BASE_REF"

  # The console is a standalone vite app; its tests and production build run
  # here so a broken bundle fails CI even though the JVM build does not need it.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          # Match proto-stubs.sh: generated stubs depend on the CLI version.
          version: '1.70.0'

      - name: Install, check generated stubs, test, typecheck, build
        run: |
          npm ci
          scripts/proto-stubs.sh --check
          npm test
          npm run typecheck
          npm run build

  # Scores the validation executor against buf's own protovalidate-conformance
  # binary, so the documented full-suite pass rate is enforced on every push,
  # not just measured once.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install protovalidate-conformance
        # Pinned to the upstream commit the executor is verified against: 15 commits past
        # v1.2.2, adding the header-name comma refusal, the empty-bytes prefix/suffix/contains
        # cases and the 253-character hostname with a trailing dot. Move the pin when a tag
        # covers it.
        run: go install github.com/bufbuild/protovalidate/tools/protovalidate-conformance@63347b8

      - name: Build the conformance executor
        run: ./gradlew :protomolt-protobuf-validation-conformance:installDist --console=plain

      - name: Run the full conformance suite
        run: |
          protovalidate-conformance \
            protobuf/validation-conformance/build/install/protomolt-protobuf-validation-conformance/bin/protomolt-protobuf-validation-conformance

  # Runs the live-registry integration suites (Apicurio native v3, Apicurio
  # ccompat, and a genuine Confluent Schema Registry backed by Redpanda) that
  # a plain build skips when no registry is reachable.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare the shared Iceberg warehouse volumes
        # The catalog container (uid 1000) and the test JVM (the runner user) share
        # these trees; both must be able to create entries under them. Gravitino gets
        # its own so the two catalogs never contend for one root.
        run: |
          mkdir -p /tmp/protomolt-iceberg-warehouse/client /tmp/protomolt-gravitino-warehouse/client
          chmod -R 777 /tmp/protomolt-iceberg-warehouse /tmp/protomolt-gravitino-warehouse

      - name: Start registries
        run: docker compose -f docker-compose.integration.yml up -d --wait

      - name: Run integration tests
        # The registry suites are opt-in (optInSuite in the root build.gradle); this job starts
        # the registries, so it opts in. Without the flag the build job leaves them out.
        env:
          PROTOMOLT_INTEGRATION_REGISTRIES: 'true'
        run: >
          ./gradlew :protomolt-schema-apicurio:test :protomolt-schema-apicurio:integrationTest
          :protomolt-schema-confluent:test :protomolt-schema-confluent:integrationTest
          :protomolt-search-index-solr:test :protomolt-search-index-solr:integrationTest
          :protomolt-search-index-opensearch:test :protomolt-search-index-opensearch:integrationTest
          :protomolt-iceberg:test :protomolt-iceberg:integrationTest
          :protomolt-iceberg-s3:test :protomolt-iceberg-s3:integrationTest
          :protomolt-kafka-connect-iceberg:test :protomolt-kafka-connect-iceberg:integrationTest
          :protomolt-kafka-serde:test :protomolt-kafka-serde:integrationTest
          --rerun-tasks --console=plain

      - name: Fail if any integration suite skipped
        run: |
          skipped=$(grep -h -o 'skipped="[0-9]*"' \
            schema/apicurio/runtime/build/test-results/integrationTest/TEST-*Integration*.xml \
            schema/confluent/build/test-results/integrationTest/TEST-*Integration*.xml \
            search/index/solr/build/test-results/integrationTest/TEST-*Integration*.xml \
            search/index/opensearch/build/test-results/integrationTest/TEST-*Integration*.xml \
            sink/iceberg/build/test-results/integrationTest/TEST-*Integration*.xml \
            sink/iceberg-s3/build/test-results/integrationTest/TEST-*Integration*.xml \
            sink/kafka/connect-iceberg/build/test-results/integrationTest/TEST-*Integration*.xml \
            sink/kafka/serde/build/test-results/integrationTest/TEST-*Integration*.xml \
            | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "skipped integration tests: $skipped"
          test "$skipped" -eq 0

      - name: Registry logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs

      - name: Gravitino server log on failure
        if: failure()
        # Gravitino logs the server to a file rather than stdout, so `compose logs` shows
        # only its start script; without this a failure there is undiagnosable from CI.
        continue-on-error: true
        run: |
          docker compose -f docker-compose.integration.yml exec -T gravitino-iceberg-rest \
            sh -c 'tail -200 logs/*.log' || true
