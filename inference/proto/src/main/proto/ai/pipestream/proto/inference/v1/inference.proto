syntax = "proto3";

package ai.pipestream.proto.inference.v1;

import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.inference.v1";

// ============================================================================
// INFERENCE — the generic model-inference contract.
//
// One typed surface in front of every inference backend in the fleet
// (OpenVINO model servers, NVIDIA TensorRT/Triton, llama.cpp on Jetson or
// Raspberry Pi). Clients speak only this contract; the serving side resolves
// a catalog model id to a provider SPI implementation and executes there.
// Adding a machine or a model is a catalog entry, not a code change.
//
// Provenance is part of the contract, not an afterthought: every response
// names the provider, the model id, and the provider-reported model version,
// so a downstream truth system can pin "which model rendered this" forever.
// ============================================================================

// The generic inference service: chat generation (unary and streaming) plus
// model-catalog introspection.
service InferenceService {
  // Generates one complete chat response from a conversation.
  rpc Generate(GenerateRequest) returns (GenerateResponse);

  // Generates a chat response as a stream of text deltas, for
  // latency-sensitive callers. The final chunk carries usage and finish
  // reason.
  rpc GenerateStream(GenerateStreamRequest) returns (stream GenerateStreamResponse);

  // Lists every model entry currently registered in the serving catalog.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // Describes one catalog model entry, including its capabilities.
  rpc DescribeModel(DescribeModelRequest) returns (DescribeModelResponse);
}

// One conversational turn.
enum Role {
  // Unused default; requests carrying it are rejected by validation.
  ROLE_UNSPECIFIED = 0;
  // System / developer instruction turn.
  ROLE_SYSTEM = 1;
  // Human input turn.
  ROLE_USER = 2;
  // Prior model output turn (conversation history).
  ROLE_ASSISTANT = 3;
  // Tool result turn (agentic loops).
  ROLE_TOOL = 4;
}

// One turn of the conversation.
message ChatTurn {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One conversational turn: a role and its text content."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Who spoke this turn.
  Role role = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    }
  ];

  // What was said, in plain text.
  string content = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 1048576}
    }
  ];
}

// A strict JSON-Schema constraint for one structured generation. The schema
// is decoder configuration, not response data; compatible providers translate
// it to their wire-level response-format envelope.
message StructuredOutputConstraint {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "A named JSON Schema that constrains one structured generation."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Provider-safe schema identity. Coordinators derive this deterministically
  // from the target protobuf type.
  string name = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {
        max_len: 64
        pattern: "^[A-Za-z0-9_-]+$"
      }
    }
  ];

  // Draft 2020-12 JSON Schema rendered from the target protobuf descriptor.
  string json_schema = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 1048576}
    },
    (ai.pipestream.proto.meta.v1.field) = {
      sensitivity: "internal"
    }
  ];
}

// The request of generate and generate-stream: a catalog model id, a
// conversation, and sampling controls.
message GenerateRequest {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One inference request: catalog model id, conversation, sampling controls."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The catalog id of the model to run (see list-models). Resolution to a
  // provider and endpoint happens server-side; unknown ids fail.
  string model = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    }
  ];

  // The conversation, oldest first.
  repeated ChatTurn messages = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 4096}
    }
  ];

  // Sampling temperature; 0 is the provider's default.
  double temperature = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 2.0}
    }
  ];

  // Nucleus sampling mass; 0 is the provider's default.
  double top_p = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 1.0}
    }
  ];

  // Hard cap on generated tokens; 0 lets the provider apply its own cap.
  int32 max_output_tokens = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 1048576}
    }
  ];

  // Requests the model's deliberation mode when the model has one (the
  // provider ignores it for models without a thinking mode).
  bool enable_thinking = 6;

  // Optional strict structured-output constraint. The selected catalog model
  // must declare structured_output before a provider can be invoked.
  StructuredOutputConstraint structured_output = 7;
}

// The request of generate-stream: identical shape to generate's request,
// declared separately so every RPC owns its request and response types.
message GenerateStreamRequest {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One streaming inference request: catalog model id, conversation, sampling controls."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The catalog id of the model to run (see list-models). Resolution to a
  // provider and endpoint happens server-side; unknown ids fail.
  string model = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    }
  ];

  // The conversation, oldest first.
  repeated ChatTurn messages = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 4096}
    }
  ];

  // Sampling temperature; 0 is the provider's default.
  double temperature = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 2.0}
    }
  ];

  // Nucleus sampling mass; 0 is the provider's default.
  double top_p = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 1.0}
    }
  ];

  // Hard cap on generated tokens; 0 lets the provider apply its own cap.
  int32 max_output_tokens = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 1048576}
    }
  ];

  // Requests the model's deliberation mode when the model has one (the
  // provider ignores it for models without a thinking mode).
  bool enable_thinking = 6;
}

// Token accounting of one completed generation.
message Usage {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Token accounting of one generation."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Tokens consumed by the prompt.
  int64 prompt_tokens = 1;

  // Tokens produced by the model.
  int64 completion_tokens = 2;
}

// Why generation stopped.
enum FinishReason {
  // Reason not reported or generation incomplete.
  FINISH_REASON_UNSPECIFIED = 0;
  // The model ended its turn naturally.
  FINISH_REASON_STOP = 1;
  // The output hit the token cap.
  FINISH_REASON_LENGTH = 2;
  // The provider aborted generation (filter, error mid-stream).
  FINISH_REASON_ABORTED = 3;
}

// The response of generate: the completed turn plus provenance.
message GenerateResponse {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One completed generation with full provenance."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The generated text.
  string text = 1;

  // The catalog model id that ran, echoed back.
  string model = 2;

  // The SPI provider that executed (e.g. "openvino", "nvidia-triton").
  string provider = 3;

  // The provider-reported model version or digest; empty when the provider
  // does not report one.
  string model_version = 4;

  // Why generation stopped.
  FinishReason finish_reason = 5;

  // Token accounting.
  Usage usage = 6;
}

// One incremental piece of a streamed generation. The final chunk has
// last=true and carries usage and finish reason; earlier chunks carry only
// text deltas.
message GenerateStreamResponse {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One streamed text delta; the final chunk carries usage and finish reason."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The incremental text of this chunk.
  string text_delta = 1;

  // True on the final chunk of the stream.
  bool last = 2;

  // Why generation stopped; set on the final chunk.
  FinishReason finish_reason = 3;

  // Token accounting; set on the final chunk when the provider reports it.
  Usage usage = 4;
}

// What one model can do, as declared by its catalog entry.
message ModelCapabilities {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Declared capabilities of one catalog model."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The model's total context window in tokens.
  int64 max_context_tokens = 1;

  // The largest supported single-generation output in tokens; 0 = unbounded
  // by the catalog.
  int32 max_output_tokens = 2;

  // Whether generate-stream is supported.
  bool streaming = 3;

  // Whether the model has a deliberation ("thinking") mode.
  bool thinking = 4;

  // Input modalities beyond text (e.g. "image", "audio"); empty = text only.
  repeated string modalities = 5;

  // Whether the model accepts a JSON-Schema response-format constraint
  // (structured output).
  bool structured_output = 6;
}

// One model registration: the unit of "dynamically add a model". An entry
// names the SPI provider, the provider-specific endpoint, and the declared
// capabilities.
message ModelEntry {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One catalog model registration: provider, endpoint, capabilities."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The catalog id clients request by (e.g. "gemma-4-31b-judge").
  string id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    }
  ];

  // The SPI provider id that executes this model (e.g. "openvino"); must
  // resolve to a loaded provider at registration time.
  string provider = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 128}
    }
  ];

  // The provider-specific target: a base URL for HTTP providers, a gRPC
  // target for gRPC providers.
  string endpoint = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 1024}
    }
  ];

  // The model name as the backend knows it, when it differs from the
  // catalog id (e.g. "OpenVINO/gemma-4-31B-it-int4-ov"); empty = same as id.
  string backend_model = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 512}
    }
  ];

  // Declared capabilities of this model.
  ModelCapabilities capabilities = 5;

  // Free-form provenance labels (e.g. machine, gpu, role).
  map<string, string> labels = 6;

  // An opaque reference to the credential the provider transport presents to
  // this model's endpoint (e.g. "env:OPENAI_TOKEN"); empty = unauthenticated.
  // The reference is resolved host-side at request time; credential material
  // itself never enters the catalog.
  string credential_ref = 7 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {
        max_len: 256
        pattern: "^[a-z][a-z0-9-]*:[A-Za-z0-9._/-]+$"
      }
    },
    (ai.pipestream.proto.meta.v1.field) = {
      description: "Opaque reference to the credential for this model's endpoint (e.g. env:OPENAI_TOKEN); resolved host-side at request time. Holds the reference only, never credential material."
      sensitivity: "secret"
    }
  ];
}

// The request of list-models.
message ListModelsRequest {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "List-models request; optionally restricted to one provider."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // When set, only entries executed by this provider are returned.
  string provider = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 128}
    }
  ];
}

// The response of list-models: every registered entry (after filtering).
message ListModelsResponse {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Every catalog model entry (after optional provider filtering)."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The registered entries.
  repeated ModelEntry models = 1;

  // The catalog generation at the time of the listing; increments on every
  // register/remove mutation.
  int64 catalog_generation = 2;
}

// The request of describe-model.
message DescribeModelRequest {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Describe-model request: one catalog model id."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The catalog id to describe.
  string model = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    }
  ];
}

// The response of describe-model: the full catalog entry.
message DescribeModelResponse {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "The full catalog entry for one model."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The catalog entry.
  ModelEntry entry = 1;
}
