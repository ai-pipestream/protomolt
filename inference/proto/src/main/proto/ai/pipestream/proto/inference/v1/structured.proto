syntax = "proto3";

package ai.pipestream.proto.inference.v1;

import "ai/pipestream/proto/inference/v1/inference.proto";
import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/prompt/v1/prompt.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.inference.v1";

// ============================================================================
// STRUCTURED GENERATION — the typed form-filling contract.
//
// Structured generation asks a model to fill one protobuf message instead of
// producing free text: the coordinator renders the prompt packet for the
// target type, calls the inference catalog, parses the response as strict
// protobuf JSON, validates it against the type's declared rules, and retries
// only from the rendered rejection feedback. The result is a validated,
// packed message with the complete attempt history — every repair the model
// needed is provenance, not lost log lines.
//
// The attempt bound is part of the contract: max_attempts is validated to at
// most 3, so a runaway repair loop is a schema violation, never a runtime
// surprise.
// ============================================================================

// One structured-generation request: the message type to fill, the catalog
// model id to fill it with, and optional sampling controls.
message GenerateStructuredRequest {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Fill one protobuf message type with a model: target type, catalog model id, sampling controls."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Fully qualified name of the message type to fill (e.g.
  // "ai.pipestream.court.v1.DecoratedOpinion"). Must resolve in the
  // coordinator's descriptor registry before any model call happens.
  string target_type = 1 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$"
  ];

  // The catalog id of the model to run (see list-models). The model's
  // declared capabilities must include structured_output; unknown or
  // incompatible ids fail before invocation.
  string model = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    }
  ];

  // The resolved persona to render the prompt for; absent renders
  // persona-free (schema instructions only).
  ai.pipestream.proto.prompt.v1.Persona persona = 3;

  // Maximum generation attempts, counting the first; 0 applies the
  // coordinator default (3). Total attempts NEVER exceed 3.
  int32 max_attempts = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 3}
    }
  ];

  // Sampling temperature; 0 is the provider's default.
  double temperature = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 2.0}
    }
  ];

  // Nucleus sampling mass; 0 is the provider's default.
  double top_p = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 1.0}
    }
  ];

  // Hard cap on generated tokens; 0 lets the provider apply its own cap.
  int32 max_output_tokens = 7 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 1048576}
    }
  ];

  // Per-document grounding projected by the workflow edge; rendered into the
  // prompt as document-specific context (RenderPromptRequest.overrides), so
  // the prompt fingerprint covers it. The model may not contradict it. An
  // unresolvable grounding type fails before any model invocation.
  google.protobuf.Any grounding = 8 [
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// How one generation attempt ended.
enum AttemptOutcome {
  // Unused default; recorded attempts always carry a concrete outcome.
  ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  // The response was not strict protobuf JSON for the target type.
  ATTEMPT_OUTCOME_PARSE_FAILED = 1;
  // The response parsed but broke the target type's validate.v1 rules.
  ATTEMPT_OUTCOME_VALIDATION_FAILED = 2;
  // The response parsed and validated; the generation stopped here.
  ATTEMPT_OUTCOME_SUCCEEDED = 3;
}

// The provenance of one generation attempt: the raw model output, how it
// ended, the rejection fed back before the next attempt, and its token
// accounting.
message StructuredAttempt {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One generation attempt: raw output, outcome, retry feedback, token accounting."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The 1-based attempt number.
  int32 attempt = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 1, lte: 3}
    }
  ];

  // How the attempt ended.
  AttemptOutcome outcome = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    }
  ];

  // The raw model output of this attempt, exactly as returned.
  string response_text = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 1048576}
    },
    (ai.pipestream.proto.meta.v1.field) = {
      sensitivity: "internal"
    }
  ];

  // The rejection rendered back to the model before the next attempt; empty
  // on the final attempt.
  string feedback = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 1048576}
    },
    (ai.pipestream.proto.meta.v1.field) = {
      sensitivity: "internal"
    }
  ];

  // Token accounting of this attempt.
  Usage usage = 5;

  // Why the model stopped generating on this attempt.
  FinishReason finish_reason = 6;
}

// The result of one structured generation: the validated, packed form plus
// the complete attempt history and prompt/schema fingerprints.
message GenerateStructuredResponse {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One validated structured generation: the packed form, attempt history, and provenance."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The validated form, packed (Any.pack of the parsed message).
  google.protobuf.Any message = 1 [
    (ai.pipestream.proto.validate.v1.field).required = true
  ];

  // The message type that was filled; echoes the request.
  string target_type = 2 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$"
  ];

  // The catalog model id that produced the final attempt.
  string model = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    }
  ];

  // The SPI provider that executed the final attempt (e.g. "openvino").
  string provider = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 128}
    }
  ];

  // The provider-reported model version or digest of the final attempt;
  // empty when the provider does not report one.
  string model_version = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 512}
    }
  ];

  // Every attempt, oldest first; the last always has outcome SUCCEEDED.
  repeated StructuredAttempt attempts = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 3}
    }
  ];

  // Token accounting summed across all attempts.
  Usage total_usage = 7;

  // SHA-256 hex of the rendered instructions the model was briefed with.
  string prompt_fingerprint = 8 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    }
  ];

  // SHA-256 hex of the response JSON Schema the model was constrained with.
  string schema_fingerprint = 9 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    }
  ];
}
