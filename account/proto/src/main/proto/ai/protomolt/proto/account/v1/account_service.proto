syntax = "proto3";

package ai.protomolt.proto.account.v1;

import "ai/protomolt/proto/account/v1/account.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.account.v1";

// ============================================================================
// AccountService — account CRUD + activation, the provisioning entry point.
//
// Creating an account also provisions its two platform drives (intake and
// pipeline) on repo-service: the account is where tenancy begins, so drive
// provisioning rides the account lifecycle, not a separate admin flow.
// Activation re-ensures the drives (repo-service CreateDrive is idempotent
// by deterministic drive id), so a re-activation after an outage converges
// instead of duplicating.
// ============================================================================

// Creates a new account (status ACTIVE) and provisions its intake and
// pipeline drives.
message CreateAccountRequest {
  // The tenancy key. Required; must not already exist (ALREADY_EXISTS).
  string account_id = 1;
  // Human-facing label.
  string display_name = 2;
  // Extensible key-value metadata (extension-metadata map — see convention).
  map<string, string> metadata = 99;
}

// The freshly created account.
message CreateAccountResponse {
  // The account as stored (status ACTIVE).
  Account account = 1;
}

// Fetches one account by id.
message GetAccountRequest {
  // The account to fetch. Required.
  string account_id = 1;
}

// The requested account.
message GetAccountResponse {
  // The account as stored (NOT_FOUND when the id is unknown).
  Account account = 1;
}

// Pages through accounts, optionally filtered by status.
message ListAccountsRequest {
  // Maximum number of results to return (default 100).
  int32 limit = 1;
  // Continuation token from a previous response.
  string continuation_token = 2;
  // Optional status filter; UNSPECIFIED lists every status.
  AccountStatus status_filter = 3;
}

// One page of accounts.
message ListAccountsResponse {
  // The accounts in this page, matching the request's filter.
  repeated Account accounts = 1;
  // Pass back as ListAccountsRequest.continuation_token for the next page;
  // empty when this page is the last.
  string next_continuation_token = 2;
  // Total rows matching the filter across all pages.
  int64 total_count = 3;
}

// Returns an account to ACTIVE and re-ensures its drives.
message ActivateAccountRequest {
  // The account to (re)activate. Required.
  string account_id = 1;
}

// The re-activated account.
message ActivateAccountResponse {
  // The account after the call (status ACTIVE).
  Account account = 1;
}

// Moves an account to DEACTIVATED; the account and its data are retained.
message DeactivateAccountRequest {
  // The account to deactivate. Required.
  string account_id = 1;
}

// The deactivated account.
message DeactivateAccountResponse {
  // The account after the call (status DEACTIVATED).
  Account account = 1;
}

// Account lifecycle API. Peer process of repo-service: account data lives
// here, document/drive storage stays there.
service AccountService {
  // Creates the account (status ACTIVE) and provisions its intake and
  // pipeline drives; ALREADY_EXISTS when the id is taken.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // Fetches one account by id; NOT_FOUND when the id is unknown.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  // Pages through accounts, optionally filtered by status.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // Returns a SUSPENDED/DEACTIVATED account to ACTIVE and re-ensures its
  // drives; a no-op (no event) when already ACTIVE.
  rpc ActivateAccount(ActivateAccountRequest) returns (ActivateAccountResponse);
  // Moves an account to DEACTIVATED, retaining its data; a no-op (no event)
  // when already DEACTIVATED.
  rpc DeactivateAccount(DeactivateAccountRequest) returns (DeactivateAccountResponse);
}
