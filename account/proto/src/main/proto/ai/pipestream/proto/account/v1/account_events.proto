syntax = "proto3";

package ai.pipestream.proto.account.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.account.v1";

// ============================================================================
// ACCOUNT EVENTS — the transactional-outbox Kafka contract.
//
// Every account commit point (create, activate, deactivate) writes one
// envelope here into the account_events_outbox table IN THE SAME TRANSACTION
// as the account mutation (Flyway V2); a background relay publishes PENDING
// rows to the single account-events topic, keyed by account_id so each
// account's events are partition-ordered. Delivery is at-least-once:
// consumers dedupe on AccountEvent.event_id (the outbox row id).
//
// The three event types ride one topic inside the AccountEvent wrapper: the
// protomolt serde is pinned to the wrapper type, so no schema registry is
// needed on either side. (Same shape as repo's document_events.proto: a
// oneof envelope instead of a type enum, so each arm carries exactly the
// snapshot its consumers need.)
// ============================================================================

// A new account landed (status ACTIVE) and its drives were provisioned.
message AccountCreated {
  // The tenancy key of the new account.
  string account_id = 1;
  // Human-facing label, as stored.
  string display_name = 2;
  // When the create committed.
  google.protobuf.Timestamp occurred_at = 3;
  // Extensible key-value metadata (extension-metadata map — see convention).
  map<string, string> metadata = 99;
}

// A SUSPENDED/DEACTIVATED account returned to ACTIVE. Re-activation of an
// already-ACTIVE account is a no-op and fires nothing.
message AccountActivated {
  // The tenancy key of the re-activated account.
  string account_id = 1;
  // When the transition committed.
  google.protobuf.Timestamp occurred_at = 2;
  // Extensible key-value metadata (extension-metadata map — see convention).
  map<string, string> metadata = 99;
}

// An account left ACTIVE/SUSPENDED for DEACTIVATED. Deactivating an
// already-DEACTIVATED account is a no-op and fires nothing.
message AccountDeactivated {
  // The tenancy key of the deactivated account.
  string account_id = 1;
  // When the transition committed.
  google.protobuf.Timestamp occurred_at = 2;
  // Extensible key-value metadata (extension-metadata map — see convention).
  map<string, string> metadata = 99;
}

// The single-topic wrapper: exactly one event per record. event_id is the
// outbox row id (account_events_outbox.event_id) — the consumer dedupe key
// under at-least-once delivery.
message AccountEvent {
  // The outbox row id; stable across relay retries, so redeliveries dedupe.
  string event_id = 1;
  oneof event {
    AccountCreated created = 2;
    AccountActivated activated = 3;
    AccountDeactivated deactivated = 4;
  }
  // Extensible key-value metadata (extension-metadata map — see convention).
  map<string, string> metadata = 99;
}
