syntax = "proto3";

package ai.protomolt.proto.parse.v1;

import "ai/protomolt/proto/parse/v1/routing.proto";
import "ai/protomolt/proto/repo/v1/address.proto";
import "ai/protomolt/proto/repo/v1/document.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.parse.v1";

// ============================================================================
// PARSE COORDINATOR — routing, scatter-gather fan-out, and the metadata fold.
//
// The coordinator consumes repo documents (never raw uploads), routes each
// to its parsers by CEL RoutingRule, fans the parse out to the parser gRPC
// services, assembles one repo ParserResult per parser, and folds the
// parsers' extracted_fields into the arbitrated SearchMetadata repo stores.
// Reads are part-masked: the coordinator fetches CORE+BLOBS only — PARSED
// and CHUNKS are its outputs, not its inputs.
// ============================================================================

// Request to plan the parse of one document WITHOUT running it — the
// dry-run operators use to test routing rules.
message RouteDocumentRequest {
  // Where the document to route comes from: a stored row the coordinator
  // fetches, or one supplied inline for content that is not (or not yet)
  // stored.
  oneof source {
    // Address of a stored repo row; the coordinator reads CORE+BLOBS for
    // the routing context (sniffing needs the first bytes of the blob).
    ai.protomolt.proto.repo.v1.NodeAddress address = 1;
    // An inline Document — route content that is not (or not yet) stored.
    ai.protomolt.proto.repo.v1.Document document = 2;
  }
}

// The routing plan: which parsers WOULD run, with the rule that selected
// each and the content type the decision was made on. Nothing is executed
// and nothing is written.
message RouteDocumentResponse {
  // One entry per parser the current rule set selects for this document,
  // in execution order (rule priority, ties on rule_id).
  repeated PlannedParse planned_parses = 1;
  // The content type routing used: the SNIFFED type when the blob bytes
  // were available, otherwise the declared mime type. The response says
  // which through `content_type_sniffed`.
  string content_type = 2;
  // True when content_type came from magic-byte sniffing; false when it
  // fell back to the declared mime type (no bytes available to sniff).
  bool content_type_sniffed = 3;
}

// Request to execute the parse of one stored document.
message ParseDocumentRequest {
  // Address of the stored repo row to parse.
  ai.protomolt.proto.repo.v1.NodeAddress address = 1;
  // Explicit parser list. Non-empty BYPASSES rule matching: exactly these
  // parsers run, each with the coordinator's default configuration (their
  // PlannedParse entries carry no matched_rule_id). Empty = route by the
  // configured RoutingRules.
  repeated string parser_override = 2;
}

// The arbitrated fold of every parser's extracted_fields into the document
// SearchMetadata — the coordinator arbitrates, repo stores. Kept
// deliberately flat: which fields were folded, and which parser won each.
message SearchMetadataFold {
  // SearchMetadata field names the fold set on this run (e.g. "title",
  // "author", "language").
  repeated string folded_fields = 1;
  // Winning parser per folded field: SearchMetadata field name -> the
  // parser_name whose extracted_fields supplied the stored value.
  map<string, string> winners = 2;
}

// The outcome of executing one document's parse plan.
message ParseDocumentResponse {
  // Per-parser outcomes, keyed by parser name — the same entries the
  // coordinator persists under the document's parser_results map. A failed
  // parse is recorded (status FAILED, error set), never silently absent.
  // Each entry's config_fingerprint incorporates the routing-rule version,
  // so a rule edit cleanly invalidates the result.
  map<string, ai.protomolt.proto.repo.v1.ParserResult> parser_results = 1;
  // The fold summary of extracted_fields into SearchMetadata.
  SearchMetadataFold search_metadata_fold = 2;
}

// The parsing coordinator: routes documents to parsers, executes the plan,
// and folds parser output into search metadata.
service ParseCoordinatorService {
  // DRY-RUN routing: evaluate the rule set (or report what an override
  // would do) against one document and return the plan. Executes nothing,
  // writes nothing — this is how operators test CEL routing rules.
  rpc RouteDocument(RouteDocumentRequest) returns (RouteDocumentResponse);

  // Execute: route, fan out to the parser services, assemble the
  // ParserResults, fold extracted_fields into SearchMetadata, and persist
  // the PARSED part (and folded CORE) back to repo.
  rpc ParseDocument(ParseDocumentRequest) returns (ParseDocumentResponse);
}
