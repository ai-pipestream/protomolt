syntax = "proto3";

package ai.pipestream.proto.parse.v1;

import "google/protobuf/struct.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.parse.v1";

// ============================================================================
// ROUTING RULES — CEL-driven parser selection.
//
// Rules ship as SERVICE CONFIG, not RPC CRUD: the coordinator loads its
// rule set at startup (and on config reload); there is deliberately no
// CreateRule/UpdateRule rpc. Operators test rules against real documents
// with the RouteDocument dry-run instead of mutating live config.
// ============================================================================

// The coordinator's whole rule set as one config document: what a
// deployment distributes when routing rules move out of environment
// variables and into distributed config. Exactly the shape the
// header describes — service config, reloaded, never RPC CRUD.
message RoutingConfig {
  // The complete rule set; an empty set is refused, because a coordinator
  // with no rules routes nothing and that must be said, not configured.
  repeated RoutingRule rules = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1}
    }
  ];
}

// One routing rule: when the CEL guard matches the routing context, the
// named parser runs with the given configuration.
//
// The `when` expression evaluates over the routing context — a scope with
// these variables:
//   - mime_type           string  the SNIFFED content type (magic bytes on
//                                 the first bytes of the blob) — the routing
//                                 source of truth
//   - declared_mime_type  string  the mime type the intake caller declared
//                                 (a hint; never trusted alone)
//   - filename            string  the original filename, when known
//   - extension           string  lowercase filename extension, "" when none
//   - size_bytes          int     the blob size in bytes
//   - account_id          string  the owning account (tenant root)
// e.g. `when: "mime_type == 'application/pdf' && size_bytes < 52428800"`.
//
// Rules are evaluated in descending priority order; every matching rule
// contributes one PlannedParse (routing is a SET, not first-match — a
// document may fan out to several parsers).
message RoutingRule {
  // Stable rule identity. Carried onto PlannedParse.matched_rule_id and
  // incorporated into the ParserResult config_fingerprint, so a rule edit
  // cleanly invalidates prior parser results.
  string rule_id = 1;
  // CEL guard over the routing context (see the header for the variables).
  // Empty matches nothing; a rule that should always fire says "true".
  string when = 2;
  // Parser to run when the guard matches (e.g. "tika", "docling").
  string parser_name = 3;
  // Parser-specific configuration handed to the parser verbatim; hashed
  // into the result's config_fingerprint.
  google.protobuf.Struct parser_config = 4;
  // Evaluation order: higher priority evaluates first. Ties break on
  // rule_id (lexicographic) so the plan is deterministic.
  int32 priority = 5;
}

// One parser run the coordinator would execute for a document: the routing
// decision for one matched rule, or one explicit override entry.
message PlannedParse {
  // Parser that would run.
  string parser_name = 1;
  // The parser configuration that would be handed over (from the matched
  // rule, or the coordinator default for an override).
  google.protobuf.Struct parser_config = 2;
  // The rule that selected this parser. Empty when the plan came from an
  // explicit parser override list rather than rule matching.
  string matched_rule_id = 3;
}
