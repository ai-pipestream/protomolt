description = 'The parsing coordinator runtime: magic-byte content sniffing, CEL routing rules, scatter-gather parser fan-out over the plugin contract, and the SearchMetadata fold persisted back through repo-service'

dependencies {
    implementation project(':protomolt-schema-registry-git')
    api project(':protomolt-composer')
    implementation project(':protomolt-parse-document')
    // Content detection lives on the asset family's one seam; routing and
    // characterization consult the same table.
    implementation project(':protomolt-asset-characterize')
    implementation project(':protomolt-registry')
    api project(':protomolt-parse-proto')

    // The coordinator rides the repo wire contract only — the DocumentServiceGrpc
    // blocking stub, never repo container/service internals.
    implementation project(':protomolt-repo-proto')
    // CelEvaluator drives the routing-rule guards.
    implementation project(':protomolt-cel')
    // Parser discovery reads the toolkit's service-profile store.
    implementation project(':protomolt-grpc-service-profile')
    implementation libs.grpc.netty.shaded
    implementation libs.grpc.services
    implementation libs.grpc.inprocess
    implementation libs.protobuf.java.util
    // ParseWorkflows builds the durable-parse workflow envelope (Jackson is the
    // repo-wide JSON library).
    implementation libs.jackson.databind
    implementation libs.slf4j.api

    runtimeOnly libs.slf4j.simple

    // The durable-parse IT drives ParseDocument as a checkpointed workflow run.
    testImplementation project(':protomolt-jobs-service')
    testImplementation project(':protomolt-workflow')
    testImplementation project(':protomolt-actions')
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.junit.jupiter
    testRuntimeOnly libs.slf4j.simple

    // v2 real-provider qualification (runtime stays on the wire contract).
    testImplementation project(':protomolt-repo-accession')
    testImplementation project(':protomolt-repo-admission')
    testImplementation project(':protomolt-repo-blob-s3')
    testImplementation libs.awssdk.s3
    testImplementation libs.awssdk.url.connection.client
    testImplementation project(':protomolt-authz-grpc')
}
