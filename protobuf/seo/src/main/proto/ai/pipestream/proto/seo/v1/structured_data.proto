syntax = "proto3";

package ai.pipestream.proto.seo.v1;

import "ai/pipestream/proto/index/hints/v1/indexing_hints.proto";
import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.seo.v1";

// ============================================================================
// GOOGLE STRUCTURED DATA — the schema.org types Google Search documents at
// developers.google.com/search, strongly typed: one message per type, with
// meta.v1 descriptions naming the schema.org mapping, validate.v1 rules that
// mirror Google's required properties, and index hints so every field lands
// in the search index the way its shape demands. Durations use
// google.protobuf.Duration where schema.org wants ISO 8601 durations.
// ============================================================================

// A person (maps to schema.org/Person): article authors, recipe authors, and
// standalone person entities.
message Person {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/Person: a named person with profile links and affiliation."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "Person"}
  };

  // The person's name (schema.org name); Google requires author.name.
  string name = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 500}
    }
  ];
  // Link to a page that unambiguously identifies the person (schema.org url).
  optional string url = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {
        uri: true
        max_len: 2048
      }
    }
  ];
  // Profile URLs on other sites that identify the same person
  // (schema.org sameAs).
  repeated string same_as = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {
        max_items: 50
        unique: true
        items: {
          string: {
            uri: true
            max_len: 2048
          }
        }
      }
    }
  ];
  // The person's job title (schema.org jobTitle).
  string job_title = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_TEXT},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 500}
    }
  ];
  // Organization the person is affiliated with (schema.org affiliation),
  // by name.
  string affiliation = 5 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_KEYWORD
      facetable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 500}
    }
  ];
}

// A contact channel of an organization (maps to schema.org/ContactPoint).
message ContactPoint {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/ContactPoint: one contact channel (telephone/email) of an organization."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "ContactPoint"}
  };

  // The contact telephone number (schema.org telephone).
  string telephone = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 50, phone_number: true}
    }
  ];
  // The kind of contact this is, e.g. "customer service"
  // (schema.org contactType).
  string contact_type = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_KEYWORD
      facetable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 200}
    }
  ];
  // The contact email address (schema.org email).
  optional string email = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {email: true}
    }
  ];
}

// An organization (maps to schema.org/Organization): publishers, brands,
// employers, and standalone organization entities. Google's Organization
// guidance recommends url + logo for the knowledge panel.
message Organization {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/Organization: a named organization with site, logo, and contact point."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "Organization"}
  };

  // The organization's name (schema.org name); Google requires publisher.name.
  string name = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 500}
    }
  ];
  // The organization's website (schema.org url).
  optional string url = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {
        uri: true
        max_len: 2048
      }
    }
  ];
  // URL of the organization's logo image (schema.org logo).
  optional string logo_url = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {
        uri: true
        max_len: 2048
      }
    }
  ];
  // Profile URLs on other sites that identify the same organization
  // (schema.org sameAs).
  repeated string same_as = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {
        max_items: 50
        unique: true
        items: {
          string: {
            uri: true
            max_len: 2048
          }
        }
      }
    }
  ];
  // A contact channel for the organization (schema.org contactPoint).
  ContactPoint contact_point = 5;
}

// A named place with a postal address (maps to schema.org/Place): event
// venues and job locations. The address is carried flat; the standard trims
// schema.org/PostalAddress to one display string.
message Place {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/Place: a named location with a flat address string."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "Place"}
  };

  // The place's name (schema.org name), e.g. the venue name.
  string name = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 500}
    }
  ];
  // The full postal address as one display string (schema.org address).
  string address = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 1000}
    }
  ];
}

// A news, sports, or blog article (maps to schema.org/Article). Google's
// article guidance drives the rules: headline capped at Google's 110
// characters, datePublished required, dateModified never before it.
message Article {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/Article: headline, authorship, publication dates, images, publisher."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "Article"}
  };
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "modified-not-before-published"
      message: "dateModified must not be before datePublished"
      expression: "!has(this.date_modified) || !has(this.date_published) || this.date_modified >= this.date_published"
    }
  };

  // The article headline (schema.org headline); Google truncates past 110
  // characters.
  string headline = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 110}
    }
  ];
  // The article author (schema.org author): a person or an organization.
  oneof author {
    // The authoring person (schema.org author as Person).
    Person author_person = 2;
    // The authoring organization (schema.org author as Organization).
    Organization author_organization = 3;
  }
  // First publication date (schema.org datePublished).
  google.protobuf.Timestamp date_published = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_DATE
      sortable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Date of the most recent modification (schema.org dateModified).
  google.protobuf.Timestamp date_modified = 5 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_DATE
      sortable: true
    }
  ];
  // URLs of representative images (schema.org image); Google asks for
  // multiple aspect ratios.
  repeated string image_urls = 6 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {
        max_items: 50
        items: {
          string: {
            uri: true
            max_len: 2048
          }
        }
      }
    }
  ];
  // The publishing organization (schema.org publisher).
  Organization publisher = 7;
}

// One offer to sell a product (maps to schema.org/Offer). Google requires
// price and priceCurrency on product offers.
message Offer {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/Offer: price, currency, availability, and offer URL."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "Offer"}
  };

  // Availability state of the offered item (maps to the schema.org
  // ItemAvailability enumeration).
  enum Availability {
    // Availability was not stated.
    AVAILABILITY_UNSPECIFIED = 0;
    // schema.org/InStock.
    AVAILABILITY_IN_STOCK = 1;
    // schema.org/OutOfStock.
    AVAILABILITY_OUT_OF_STOCK = 2;
    // schema.org/PreOrder.
    AVAILABILITY_PRE_ORDER = 3;
    // schema.org/BackOrder.
    AVAILABILITY_BACK_ORDER = 4;
    // schema.org/Discontinued.
    AVAILABILITY_DISCONTINUED = 5;
    // schema.org/LimitedAvailability.
    AVAILABILITY_LIMITED = 6;
    // schema.org/SoldOut.
    AVAILABILITY_SOLD_OUT = 7;
  }

  // The offer price as a decimal string (schema.org price); a string because
  // binary floating point cannot carry prices exactly.
  string price = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {
        max_len: 30
        decimal: true
      }
    }
  ];
  // ISO 4217 currency code of the price (schema.org priceCurrency).
  string price_currency = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_KEYWORD
      facetable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {currency_code: true}
    }
  ];
  // Availability of the offered item (schema.org availability).
  Availability availability = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_KEYWORD
      facetable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      enum: {defined_only: true}
    }
  ];
  // URL of the page where the item can be bought (schema.org url).
  optional string url = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {
        uri: true
        max_len: 2048
      }
    }
  ];
  // The date after which the price is no longer available
  // (schema.org priceValidUntil).
  google.protobuf.Timestamp price_valid_until = 5 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_DATE
      sortable: true
    }
  ];
}

// The overall rating of an item based on multiple ratings or reviews (maps
// to schema.org/AggregateRating).
message AggregateRating {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/AggregateRating: average rating value and rating/review counts."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "AggregateRating"}
  };

  // The average rating (schema.org ratingValue).
  double rating_value = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_DOUBLE
      sortable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      double: {
        gte: 0
        finite: true
      }
    }
  ];
  // Number of ratings received (schema.org ratingCount).
  int64 rating_count = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_INT64},
    (ai.pipestream.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // Number of reviews received (schema.org reviewCount).
  int64 review_count = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_INT64},
    (ai.pipestream.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // The highest value in the rating scale (schema.org bestRating); 0 means
  // the conventional 5 applies.
  double best_rating = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_DOUBLE},
    (ai.pipestream.proto.validate.v1.field) = {
      double: {
        gte: 0
        finite: true
      }
    }
  ];
}

// A product listing (maps to schema.org/Product). Google requires a name;
// offers carry their own required price fields.
message Product {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/Product: name, identifiers, brand, offers, and aggregate rating."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "Product"}
  };

  // The product name (schema.org name).
  string name = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 500}
    }
  ];
  // The product description (schema.org description).
  string description = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 10000}
    }
  ];
  // Merchant-specific identifier (schema.org sku).
  string sku = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_KEYWORD
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 200}
    }
  ];
  // Global Trade Item Number: 8, 12, 13, or 14 digits with a valid GS1
  // check digit (schema.org gtin). A deliberate tightening over the old
  // digit-count pattern, which accepted invalid barcodes.
  optional string gtin = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {gtin: true}
    }
  ];
  // The product's brand name (schema.org brand).
  string brand = 5 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_KEYWORD
      facetable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 500}
    }
  ];
  // Offers to sell the product (schema.org offers).
  repeated Offer offers = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {max_items: 100}
    }
  ];
  // The product's aggregate rating (schema.org aggregateRating).
  AggregateRating aggregate_rating = 7;
}

// One question with its accepted answer (maps to schema.org/Question with a
// schema.org/Answer acceptedAnswer, flattened to the answer text).
message Question {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/Question: the question text and its accepted answer text."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "Question"}
  };

  // The full question text (schema.org name); Google requires it.
  string question = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 2000}
    }
  ];
  // The accepted answer text (schema.org acceptedAnswer.text); Google
  // requires it.
  string accepted_answer = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 10000}
    }
  ];
}

// A frequently-asked-questions page (maps to schema.org/FAQPage). Google
// requires at least one Question with an accepted answer.
message FaqPage {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/FAQPage: the page's questions with their accepted answers."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "FAQPage"}
  };

  // The page's questions (schema.org mainEntity); at least one.
  repeated Question questions = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {
        min_items: 1
        max_items: 500
      }
    }
  ];
}

// One step of a how-to (maps to schema.org/HowToStep).
message HowToStep {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/HowToStep: one step's name, text, and image."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "HowToStep"}
  };

  // A short step label (schema.org name).
  string name = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 500}
    }
  ];
  // The full step instruction text (schema.org text); Google requires it.
  string text = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 10000}
    }
  ];
  // URL of an image illustrating the step (schema.org image).
  optional string image_url = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {
        uri: true
        max_len: 2048
      }
    }
  ];
}

// Step-by-step instructions to accomplish a task (maps to schema.org/HowTo).
message HowTo {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/HowTo: the task name, ordered steps, and total time."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "HowTo"}
  };

  // The task the how-to accomplishes (schema.org name); Google requires it.
  string name = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 500}
    }
  ];
  // The ordered steps (schema.org step); at least one.
  repeated HowToStep steps = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {
        min_items: 1
        max_items: 500
      }
    }
  ];
  // Total time to perform all steps (schema.org totalTime, an ISO 8601
  // duration).
  google.protobuf.Duration total_time = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      duration: {
        gte: {seconds: 0}
      }
    }
  ];
}

// One element of a breadcrumb trail (maps to schema.org/ListItem inside a
// BreadcrumbList).
message BreadcrumbItem {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/ListItem in a BreadcrumbList: position, name, and item URL."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "ListItem"}
  };

  // 1-based position in the trail (schema.org position); Google requires it.
  int64 position = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_INT64
      sortable: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      int64: {gte: 1}
    }
  ];
  // Title of the breadcrumb (schema.org name).
  string name = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      stored: true
    },
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 500}
    }
  ];
  // URL of the page the breadcrumb points at (schema.org item).
  optional string item_url = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD},
    (ai.pipestream.proto.validate.v1.field) = {
      string: {
        uri: true
        max_len: 2048
      }
    }
  ];
}

// A page's breadcrumb trail (maps to schema.org/BreadcrumbList).
message BreadcrumbList {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/BreadcrumbList: the ordered breadcrumb trail of a page."
    owner: "protomolt"
    labels: {key: "component", value: "seo"}
    labels: {key: "schema-org", value: "BreadcrumbList"}
  };

  // The trail's items in position order (schema.org itemListElement);
  // at least one.
  repeated BreadcrumbItem items = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {
        min_items: 1
        max_items: 50
      }
    }
  ];
}

// A video (maps to schema.org/VideoObject). Google requires name,
// description, thumbnailUrl, and uploadDate for video rich results.
message VideoObject {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Maps to schema.org/VideoObject: title, description, thumbnails, upload date, duration, URLs."
