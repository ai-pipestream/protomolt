// Fixtures for the quality scorer. Each message isolates one behaviour of the
// scorer so a failure names the behaviour that broke rather than a composite.
syntax = "proto3";

package ai.pipestream.proto.quality.testdata.v1;

import "ai/pipestream/proto/quality/v1/quality.proto";

option java_package = "ai.protomolt.proto.quality.testdata";
option java_multiple_files = true;

// The primary scoring fixture. It declares four dimensions that between them
// cover a weighted dimension, an unweighted one, a boolean expression coerced
// to a score, and an expression that fails at evaluation time.
message ScoredDoc {
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      id: "completeness"
      cel: "(this.title != '' ? 0.5 : 0.0) + (this.author != '' ? 0.5 : 0.0)"
    }
    dimension: {
      id: "body"
      weight: 2.0
      cel: "clamp(double(this.body.size()) / 100.0, 0.0, 1.0)"
    }
    dimension: {
      id: "has_title"
      cel: "this.title != ''"
    }
    dimension: {
      // Integer division that raises at evaluation when divisor is zero. The
      // scorer must surface that as a dimension-level failure rather than
      // aborting the whole score.
      id: "fragile"
      cel: "double(2 / this.divisor) / 4.0"
    }
  };

  // Read by the completeness and has_title dimensions. Leaving it empty
  // lowers one score and flips the other.
  string title = 1;
  // Read by the completeness dimension as the second of its two halves.
  string author = 2;
  // Read by the body dimension, whose expression scales length to a bounded
  // score.
  string body = 3;
  // Divisor for the fragile dimension. Zero makes that dimension raise at
  // evaluation, which is the case the fixture exists to produce.
  int32 divisor = 4;
}

// A message with no quality annotation. The scorer must report it as
// unscorable rather than returning a default or an empty score set.
message Unscored {
  // Present only so the message has content; no dimension reads it.
  string anything = 1;
}

// Declares the same dimension id twice. Duplicate ids must be rejected when
// the annotation is read, because a later score keyed by id could not say
// which dimension produced it.
message DuplicateDimensionIds {
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      id: "completeness"
      cel: "this.present != '' ? 1.0 : 0.0"
    }
    dimension: {
      id: "completeness"
      cel: "0.0"
    }
  };
  // The single field the duplicated dimensions read.
  string present = 1;
}

// Declares an expression referring to a field the message does not have. The
// failure must appear when the rule is compiled, not when it is evaluated.
message BrokenRules {
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      id: "bad"
      cel: "this.no_such_field > 1"
    }
  };
  // The only field that exists, deliberately not the one the expression names.
  string present = 1;
}

// Declares a dimension with an expression but no id. An unnamed dimension
// cannot be reported against, so it must be rejected.
message MissingDimensionId {
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      cel: "this.present != '' ? 1.0 : 0.0"
    }
  };
  // The field the unnamed dimension reads.
  string present = 1;
}

// Declares a dimension with an id but no expression. There is nothing to
// evaluate, so it must be rejected rather than scored as zero.
message MissingCelExpression {
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      id: "completeness"
    }
  };
  // Present so the message is not empty; no expression reads it.
  string present = 1;
}

// Declares a negative weight. Weights scale a dimension's contribution, so a
// negative one would let a dimension subtract from the total and must be
// rejected.
message NegativeWeight {
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      id: "completeness"
      weight: -1.0
      cel: "this.present != '' ? 1.0 : 0.0"
    }
  };
  // The field the negatively weighted dimension reads.
  string present = 1;
}

// Exercises the exp() helper through a recency decay curve, which is the case
// the helper was added for.
message DecayingDoc {
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      id: "recency"
      cel: "exp(-double(this.age_days) / 10.0)"
    }
  };
  // Age in days, fed to the decay curve. Larger values produce lower scores.
  int32 age_days = 1;
}
