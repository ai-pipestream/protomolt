syntax = "proto3";

package ai.pipestream.proto.indexing.testdata.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.indexing.testdata";

import "ai/pipestream/proto/index/hints/v1/indexing_hints.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

// Test fixture for the indexing-hint integration tests: a document exercising
// keyword, text, numeric, vector (with HNSW tuning and engine_params),
// analyzed-with-sub-field, and range hint annotations, combined with
// protovalidate constraints on the same fields.
message IndexableDoc {
  // Required document id, indexed as an exact-match keyword.
  string doc_id = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: { min_len: 1 }
    }
  ];

  // Required title, indexed as analyzed full text (minimum length 2).
  string title = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_TEXT },
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: { min_len: 2 }
    }
  ];

  // Non-negative page count, indexed as an int32 point field.
  int32 page_count = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_INT32 },
    (ai.pipestream.proto.validate.v1.field) = {
      int32: { gte: 0 }
    }
  ];

  // 3-dim test vector indexed with dot-product similarity, explicit HNSW
  // tuning, and an OpenSearch engine_params override — exercises the vector
  // hint attributes end to end.
  repeated float embedding = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_VECTOR
      vector_dims: 3
      vector_similarity: VECTOR_SIMILARITY_DOT_PRODUCT
      hnsw: { m: 16, ef_construction: 100 }
      engine_params: [{ key: "opensearch.mode", value: "on_disk" }]
    }
  ];

  // Category indexed as english-analyzed text, sortable, with a null_value
  // substitute and a keyword "raw" sub-field.
  string category = 5 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      analyzer: "english"
      sortable: true
      null_value: "uncategorized"
      sub_fields: [{ type: INDEX_FIELD_TYPE_KEYWORD, name: "raw" }]
    }
  ];

  // Singular message field hinted as INT_RANGE; PageSpan's (gte, lte) pair
  // resolves as the range bounds.
  PageSpan page_span = 6 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_INT_RANGE }
  ];
}

// Bounds message for INT_RANGE hints: the (gte, lte) pair resolves as the range bounds.
message PageSpan {
  // Lower bound of the range (inclusive).
  int32 gte = 1;
  // Upper bound of the range (inclusive).
  int32 lte = 2;
}
