syntax = "proto3";

package ai.pipestream.proto.types.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.types";
option java_outer_classname = "TreePathProto";

import "ai/pipestream/proto/validate/v1/validate.proto";

// A taxonomy path: ordered segments from root to leaf.
//
// The path stays wire-plain as a repeated string; the "/" delimiter
// exists only in rendered forms, which is why a segment must not
// contain it — "a/b" as one segment and ["a", "b"] as two would
// otherwise render identically. The indexing SPI recognizes this type
// by name and emits the ancestor chain ("a", "a/b", "a/b/c") as
// keyword terms, which is what hierarchical drill-down facets and
// path-prefix filters count and match against.
message TreePath {
  // Path segments, root first. At least one; each non-empty and free
  // of the "/" render delimiter. Segments may repeat ("a/b/a" is a
  // legal path), so no uniqueness rule.
  repeated string segments = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {
        min_items: 1
        items: {string: {min_len: 1, not_contains: "/"}}
      }
    }
  ];
}
