syntax = "proto3";

package ai.pipestream.proto.types.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.types";
option java_outer_classname = "TaxonomyProto";

import "ai/pipestream/proto/types/v1/tree_path.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

// An operator-loaded taxonomy: the set of nodes a bound TreePath field
// may take, distributed as a config document on the config lane.
//
// The document carries no name and no version. Its config subject
// ("taxonomy:<name>") is the identity and the config source's version
// (a git commit, a topic offset) is the version; a copy of either
// inside the document could only agree or lie. An entry names a node
// by its full path from the root, and every ancestor along the way is
// a node too, so listing the leaves is enough.
message Taxonomy {
  // The taxonomy's nodes, each named by its full root-first path.
  // At least one entry; a duplicate entry is pure redundancy, refused.
  repeated TreePath entries = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, unique: true}
    }
  ];
}
