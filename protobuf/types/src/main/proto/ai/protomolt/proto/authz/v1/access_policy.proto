syntax = "proto3";

package ai.protomolt.proto.authz.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.authz";
option java_outer_classname = "AccessPolicyProto";

import "ai/protomolt/proto/types/v1/ranges.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";

// The access-policy config document: named principals resolved from
// credential digests, each holding scopes from the closed vocabulary
// (docs/design/authorization-scopes.md). Distributed on the config lane
// (subject "access-policy") or loaded from a startup file; the document
// carries no secrets — credentials appear only as SHA-256 digests.
message AccessPolicy {
  // The named principals; names and digests must be unique across the
  // document, refused at load otherwise.
  repeated Principal principals = 1 [
    (ai.protomolt.proto.validate.v1.field).repeated.min_items = 1
  ];
}

// One named caller and the authority it holds.
message Principal {
  // Principal name: appears in refusals and logs; never a credential.
  string name = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // Lowercase-hex SHA-256 digests of the credentials that resolve to this
  // principal; several during rotation-with-grace.
  repeated string credential_sha256 = 2 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      min_items: 1
      unique: true
      items: {
        string: {sha256_hex: true}
      }
    }
  ];
  // Scopes the principal holds, each from the closed vocabulary; the
  // vocabulary check itself is the loader's, naming the unknown scope.
  repeated string scopes = 3 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      min_items: 1
      unique: true
      items: {
        string: {slug: true, max_len: 64}
      }
    }
  ];
  // Per-scope budgets, following the intake scope's per-key caps: each
  // entry names a scope the principal holds (the loader refuses one it
  // does not, or a duplicate) and caps what the principal may spend
  // there. Absent means unbudgeted; the operator is never budgeted.
  repeated ScopeBudget budgets = 4;
  // Row and member security on metric mappings: what this principal may
  // see and which rows its queries reduce over. Absent means the full
  // mapping; the operator is never rewritten.
  MetricAccess metric_access = 5;
}

// Row and member security on metric mappings for one principal: the
// compile-time rewrite the metric service applies before a query runs.
// Denied members disappear from DescribeMapping and refuse QueryMetrics
// by name; row filters are ANDed into every query the principal runs on
// the subject, using equality sets, typed date/numeric ranges, or
// schema-checked boolean CEL predicates.
message MetricAccess {
  // Members the principal may not see or query, by mapping subject.
  repeated MetricMemberDeny deny = 1;
  // Rows every query by the principal reduces over, by mapping subject.
  repeated MetricRowFilter row_filters = 2;
}

// Denied members on one mapping subject.
message MetricMemberDeny {
  // The mapping subject the denial applies to.
  string mapping_subject = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The denied member names; non-empty, unique.
  repeated string members = 2 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      min_items: 1
      unique: true
      items: {
        string: {min_len: 1, max_len: 128}
      }
    }
  ];
}

// One row-security filter injected into every query the principal runs on
// the subject: an equality set over a keyword or bool dimension, a date or
// numeric range over a date or numeric member, or a boolean CEL predicate
// over the mapping's members and fields. Exactly one form.
message MetricRowFilter {
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: {
      id: "metric_row_filter.one_form"
      message: "metric row filter must specify exactly one of equals, range, long_range, double_range, or cel"
      expression:
        "(size(this.equals) > 0 ? 1 : 0)"
        " + (has(this.range) ? 1 : 0)"
        " + (has(this.long_range) ? 1 : 0)"
        " + (has(this.double_range) ? 1 : 0)"
        " + (this.cel != '' ? 1 : 0) == 1"
    }
    cel: {
      id: "metric_row_filter.member_required"
      message: "metric row filter using equals, range, long_range, or double_range requires a member name"
      expression: "this.cel != '' || this.member != ''"
    }
  };

  // The mapping subject the filter applies to.
  string mapping_subject = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The member the filter constrains; required for equals, range, long_range,
  // and double_range, optional for cel.
  string member = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 128}
    }
  ];
  // The values the member must equal (any of); non-empty when chosen.
  repeated string equals = 3 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      unique: true
      items: {
        string: {min_len: 1}
      }
    }
  ];
  // Date range over a DATE member; the canonical types.v1 day-grain range.
  ai.protomolt.proto.types.v1.DateRange range = 4;
  // Signed 64-bit integer range over a NUMERIC member.
  ai.protomolt.proto.types.v1.LongRange long_range = 5;
  // IEEE-754 double range over a NUMERIC member.
  ai.protomolt.proto.types.v1.DoubleRange double_range = 6;
  // Boolean CEL predicate over the mapping's members and fields.
  string cel = 7 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 2048}
    }
  ];
}

// A budget on one scope of one principal. At least one limit must be
// set — an entry with neither caps nothing and is refused at load as
// the dead configuration it is.
message ScopeBudget {
  // The budgeted scope; must be one the principal holds.
  string scope = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 64}
    }
  ];
  // Requests per minute across every surface that checks this scope;
  // zero means unlimited.
  uint32 requests_per_minute = 2;
  // Largest request payload in bytes on surfaces that know their
  // payload size; zero means uncapped.
  uint64 max_payload_bytes = 3;
}
