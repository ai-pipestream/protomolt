syntax = "proto3";

package ai.pipestream.proto.validate.testdata.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.validate.testdata";

import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// One field per rule so each test exercises a single constraint; unset fields
// are skipped by presence semantics (collections excepted).

// Exhaustive string-rule fixture: each field pins exactly one string
// constraint family so StringRulesTest can assert a single violation per case.
message StringGauntlet {
  // Must equal the constant "fixed" exactly.
  optional string exact = 1 [(ai.pipestream.proto.validate.v1.field) = {
    string: { const: "fixed" }
  }];
  // Must be exactly 3 characters long.
  optional string three = 2 [(ai.pipestream.proto.validate.v1.field) = {
    string: { len: 3 }
  }];
  // Affix/content rules: must start with "pre", end with "fix", contain
  // "mid", and not contain "bad".
  optional string affixed = 3 [(ai.pipestream.proto.validate.v1.field) = {
    string: { prefix: "pre", suffix: "fix", contains: "mid", not_contains: "bad" }
  }];
  // Must be one of the listed values ("red" or "green").
  optional string choice = 4 [(ai.pipestream.proto.validate.v1.field) = {
    string: { in: "red", in: "green" }
  }];
  // Must not be one of the listed values ("nope").
  optional string veto = 5 [(ai.pipestream.proto.validate.v1.field) = {
    string: { not_in: "nope" }
  }];
  // Must be a well-formed UUID.
  optional string id = 6 [(ai.pipestream.proto.validate.v1.field) = {
    string: { uuid: true }
  }];
  // Must be a well-formed hostname.
  optional string host = 7 [(ai.pipestream.proto.validate.v1.field) = {
    string: { hostname: true }
  }];
  // Must be a well-formed URI.
  optional string link = 8 [(ai.pipestream.proto.validate.v1.field) = {
    string: { uri: true }
  }];
  // Must be a valid IP address (v4 or v6).
  optional string addr = 9 [(ai.pipestream.proto.validate.v1.field) = {
    string: { ip: true }
  }];
  // Must be a valid IPv4 address.
  optional string addr4 = 10 [(ai.pipestream.proto.validate.v1.field) = {
    string: { ipv4: true }
  }];
  // Must be a valid IPv6 address.
  optional string addr6 = 11 [(ai.pipestream.proto.validate.v1.field) = {
    string: { ipv6: true }
  }];
}

// Exhaustive numeric-rule fixture: covers comparison, const, in/not_in,
// finite, and the sint32/fixed64 encoding variants, one rule per field so
// NumericRulesTest can assert a single violation per case.
message NumberGauntlet {
  // Must be at most 10.
  optional uint32 small = 1 [(ai.pipestream.proto.validate.v1.field) = {
    uint32: { lte: 10 }
  }];
  // Must be strictly greater than 5.
  optional uint64 big = 2 [(ai.pipestream.proto.validate.v1.field) = {
    uint64: { gt: 5 }
  }];
  // Must equal the constant 7.
  optional int32 exact = 3 [(ai.pipestream.proto.validate.v1.field) = {
    int32: { const: 7 }
  }];
  // Must be one of the listed values (1 or 2).
  optional int64 choice = 4 [(ai.pipestream.proto.validate.v1.field) = {
    int64: { in: 1, in: 2 }
  }];
  // Must not be one of the listed values (13).
  optional int32 veto = 5 [(ai.pipestream.proto.validate.v1.field) = {
    int32: { not_in: 13 }
  }];
  // Must be finite (NaN and the infinities are rejected).
  optional double finite = 6 [(ai.pipestream.proto.validate.v1.field) = {
    double: { finite: true }
  }];
  // Half-open range: must be >= 0.5 and < 2.5.
  optional float ranged = 7 [(ai.pipestream.proto.validate.v1.field) = {
    float: { gte: 0.5, lt: 2.5 }
  }];
  // Zig-zag encoded sint32 that must be negative; checks that sint32 rules
  // are evaluated on the decoded value.
  optional sint32 negative = 8 [(ai.pipestream.proto.validate.v1.field) = {
    int32: { lt: 0 }
  }];
  // Fixed-width 64-bit field that must be at most 100; checks that fixed64
  // rules are evaluated on the decoded value.
  optional fixed64 fixed = 9 [(ai.pipestream.proto.validate.v1.field) = {
    uint64: { lte: 100 }
  }];
}

// Implicit-presence probe: -0.0 has different raw bits from +0.0 and is serialized,
// so it satisfies required, while +0.0 is the unpopulated zero value.
message ZeroGauntlet {
  // Non-optional double that must be populated; -0.0 counts as present,
  // +0.0 does not.
  double weight = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
  }];
}

// Self-recursive message for the nesting depth guard; the label rule gives the
// walk something to validate at every level.
message Matryoshka {
  // Non-empty label validated at every nesting level of the recursion.
  optional string label = 1 [(ai.pipestream.proto.validate.v1.field) = {
    string: { min_len: 1 }
  }];
  // Nested child; recursion terminates when unset.
  Matryoshka child = 2;
}

// Simple rank ladder used to exercise the enum rules in MiscGauntlet;
// RANK_BANNED is the designated forbidden value.
enum Rank {
  // Default zero value; also the undefined-value probe for `defined_only`.
  RANK_UNSPECIFIED = 0;
  // First real rank; an allowed value for the in/not_in rules.
  RANK_BRONZE = 1;
  // Second rank; the const target for `fixed_rank` and an allowed value.
  RANK_SILVER = 2;
  // Forbidden rank; rejected by the `not_in` rule on `rank`.
  RANK_BANNED = 3;
}

// Fixture for the remaining scalar rule families: bool const, bytes length /
// affix rules, and the enum rules (defined_only, const, in, not_in).
message MiscGauntlet {
  // Must be the constant true.
  optional bool accepted = 1 [(ai.pipestream.proto.validate.v1.field) = {
    bool: { const: true }
  }];
  // Must be between 2 and 4 bytes long.
  optional bytes payload = 2 [(ai.pipestream.proto.validate.v1.field) = {
    bytes: { min_len: 2, max_len: 4 }
  }];
  // Must start with 0x01, end with 0xFF, and contain the byte "B".
  optional bytes framed = 3 [(ai.pipestream.proto.validate.v1.field) = {
    bytes: { prefix: "\001", suffix: "\377", contains: "B" }
  }];
  // Must be exactly 3 bytes long.
  optional bytes token = 4 [(ai.pipestream.proto.validate.v1.field) = {
    bytes: { len: 3 }
  }];
  // Must be a defined Rank value other than RANK_BANNED.
  optional Rank rank = 5 [(ai.pipestream.proto.validate.v1.field) = {
    enum: { defined_only: true, not_in: 3 }
  }];
  // Must be exactly RANK_SILVER (enum const rule by number).
  optional Rank fixed_rank = 6 [(ai.pipestream.proto.validate.v1.field) = {
    enum: { const: 2 }
  }];
  // Must be RANK_BRONZE or RANK_SILVER (enum in rule by number).
  optional Rank listed_rank = 7 [(ai.pipestream.proto.validate.v1.field) = {
    enum: { in: 1, in: 2 }
  }];
}

// Element type for RepeatedGauntlet.widgets and MapGauntlet.parts; carries a
// `required` field so collection tests can observe per-item validation.
message Widget {
  // Widget name; must be populated on every item.
  optional string name = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
  }];
}

// Repeated-rule fixture: covers min/max items, uniqueness, per-item scalar
// rules, and per-item message validation.
message RepeatedGauntlet {
  // 1-3 unique tags, each at least 2 characters long.
  repeated string tags = 1 [(ai.pipestream.proto.validate.v1.field) = {
    repeated: {
      min_items: 1
      max_items: 3
      unique: true
      items: { string: { min_len: 2 } }
    }
  }];
  // Each port must be in the unprivileged range 1024-65535.
  repeated int32 ports = 2 [(ai.pipestream.proto.validate.v1.field) = {
    repeated: { items: { int32: { gte: 1024, lte: 65535 } } }
  }];
  // Each widget is validated recursively (its `name` is required).
  repeated Widget widgets = 3;
}

// Map-rule fixture: covers min/max pairs plus per-key and per-value rules,
// and a message-valued map whose values are validated recursively.
message MapGauntlet {
  // 1-2 entries; keys at least 2 characters, values non-negative.
  map<string, int32> scores = 1 [(ai.pipestream.proto.validate.v1.field) = {
    map: {
      min_pairs: 1
      max_pairs: 2
      keys: { string: { min_len: 2 } }
      values: { int32: { gte: 0 } }
    }
  }];
  // Each widget value is validated recursively (its `name` is required).
  map<string, Widget> parts = 2;
}

// Timestamp- and duration-rule fixture: covers lt_now/gt_now, explicit
// comparisons, `within`, and bounded durations, one rule per field so
// TimeRulesTest can assert a single violation per case.
message TimeGauntlet {
  // Must be in the past relative to validation time.
  google.protobuf.Timestamp past = 1 [(ai.pipestream.proto.validate.v1.field) = {
    timestamp: { lt_now: true }
  }];
  // Must be in the future relative to validation time.
  google.protobuf.Timestamp future = 2 [(ai.pipestream.proto.validate.v1.field) = {
    timestamp: { gt_now: true }
  }];
  // Must be >= the epoch and before epoch + 1,000,000 seconds.
  google.protobuf.Timestamp epoch_window = 3 [(ai.pipestream.proto.validate.v1.field) = {
    timestamp: { gte: { seconds: 0 }, lt: { seconds: 1000000 } }
  }];
  // Must be within one hour of validation time.
  google.protobuf.Timestamp recent = 4 [(ai.pipestream.proto.validate.v1.field) = {
    timestamp: { within: { seconds: 3600 } }
  }];
  // Inclusive duration bounds: between 1 and 60 seconds.
  google.protobuf.Duration timeout = 5 [(ai.pipestream.proto.validate.v1.field) = {
    duration: { gte: { seconds: 1 }, lte: { seconds: 60 } }
  }];
  // Exclusive duration bounds: strictly between 500 nanoseconds and 1 second.
  google.protobuf.Duration strict = 6 [(ai.pipestream.proto.validate.v1.field) = {
    duration: { gt: { nanos: 500 }, lt: { seconds: 1 } }
  }];
}
