syntax = "proto3";

package ai.protomolt.proto.validate.testdata.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.validate.testdata";

import "ai/protomolt/proto/validate/v1/validate.proto";

// Fixtures for the well-known string formats and the ignore_if_zero
// escape: one field per probe.
message WellKnownDoc {
  // Strict ISO calendar date.
  string date = 1 [(ai.protomolt.proto.validate.v1.field).string.date = true];
  // RFC 3339 date-time with an offset.
  string date_time = 2 [(ai.protomolt.proto.validate.v1.field).string.date_time = true];
  // RFC 6838 media type.
  string mime_type = 3 [(ai.protomolt.proto.validate.v1.field).string.mime_type = true];
  // BCP 47 language tag.
  string language = 4 [(ai.protomolt.proto.validate.v1.field).string.language_tag = true];
  // ISO 4217 currency code.
  string currency = 5 [(ai.protomolt.proto.validate.v1.field).string.currency_code = true];
  // Display-tolerant E.164 phone number.
  string telephone = 6 [(ai.protomolt.proto.validate.v1.field).string.phone_number = true];
  // Lowercase hex SHA-256 digest.
  string digest = 7 [(ai.protomolt.proto.validate.v1.field).string.sha256_hex = true];
  // Lowercase hex SHA-1 digest.
  string legacy_digest = 8 [(ai.protomolt.proto.validate.v1.field).string.sha1_hex = true];
  // Base64 payload.
  string encoded = 9 [(ai.protomolt.proto.validate.v1.field).string.base64 = true];
  // The declared form of the ^$|... regex idiom: absent or a valid UUID.
  string optional_uuid = 10 [
    (ai.protomolt.proto.validate.v1.field) = {ignore_if_zero: true, string: {uuid: true}}
  ];
  // hex composes with len for sized ids (a W3C trace id).
  string trace_id = 11 [
    (ai.protomolt.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {hex: true, len: 32}
    }
  ];
}
