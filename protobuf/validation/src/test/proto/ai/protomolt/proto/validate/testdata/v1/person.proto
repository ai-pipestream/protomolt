syntax = "proto3";

package ai.protomolt.proto.validate.testdata.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.validate.testdata";

import "ai/protomolt/proto/validate/v1/validate.proto";

// Primary happy-path fixture for ProtoValidatorTest: combines a message-level
// CEL rule (adults may have short names; minors need names of length >= 3)
// with ordinary per-field rules and a field-level CEL rule on email, so the
// tests can exercise message scoping, field scoping, and both together.
message Person {
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: {
      id: "adult.name"
      message: "adults need names of length >= 3"
      expression: "this.age < 18 || this.name.size() >= 3"
    }
  };

  // Display name; must be present and 2-40 characters long.
  optional string name = 1 [(ai.protomolt.proto.validate.v1.field) = {
    required: true
    string: { min_len: 2, max_len: 40 }
  }];

  // Age in years; must be a plausible human age.
  optional int32 age = 2 [(ai.protomolt.proto.validate.v1.field) = {
    int32: { gte: 0, lte: 150 }
  }];

  // Contact address; must be a well-formed email and additionally satisfy the
  // field-level CEL rule forbidding @localhost addresses.
  optional string email = 3 [(ai.protomolt.proto.validate.v1.field) = {
    string: { email: true }
    cel: {
      id: "email.not_localhost"
      message: "localhost emails are forbidden"
      expression: "!this.endsWith('@localhost')"
    }
  }];
}
