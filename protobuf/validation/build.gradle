plugins {
    alias(libs.plugins.protobuf)
}

description = 'Protobuf validation standard — CEL-driven field and message constraints'

dependencies {
    api project(':protomolt-cel')
    api libs.protobuf.java
    implementation project(':protomolt-formats')
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
}

ext.forbiddenRuntimeModules = ['protomolt-mapper', 'protomolt-mapper-cel']
apply from: rootProject.file('gradle/runtime-boundaries.gradle')
