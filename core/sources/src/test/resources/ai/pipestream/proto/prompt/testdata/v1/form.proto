syntax = "proto3";

package ai.pipestream.proto.prompt.testdata.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.prompt.testdata";
option java_outer_classname = "FormProto";

import "ai/pipestream/proto/llm/v1/llm.proto";
import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/quality/v1/quality.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

// A decorated court opinion: the form the renderer tests exercise, annotated with
// every family the renderer reads (meta, validate, quality, llm).
message DecoratedOpinion {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Metadata extracted from a court opinion."
  };
  option (ai.pipestream.proto.llm.v1.message) = {
    instruction: "Fill this form from the opinion text alone."
    safeguards: "Do not use outside legal knowledge."
  };
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "court.when.summary"
      expression: "size(this.summary) == 0 || size(this.court) > 0"
      message: "a summary requires a court"
    }
  };
  option (ai.pipestream.proto.quality.v1.quality) = {
    dimension: {
      id: "completeness"
      cel: "size(this.court) > 0 && size(this.summary) > 0 ? 1.0 : 0.5"
      weight: 2.0
    }
  };

  // The court that issued the opinion.
  string court = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 200}
    },
    (ai.pipestream.proto.meta.v1.field) = {
      description: "The issuing court, as it appears in the caption."
    },
    (ai.pipestream.proto.llm.v1.field) = {
      instruction: "Name the court exactly as it appears in the caption."
      safeguards: "Do not abbreviate."
    }
  ];

  // Topics assigned to the opinion.
  repeated string topics = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 10, unique: true}
    }
  ];

  // The procedural posture of the opinion.
  Posture posture = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      enum: {defined_only: true}
    }
  ];

  // The authority the opinion treats as controlling.
  string leading_authority = 4 [
    (ai.pipestream.proto.llm.v1.field) = {
      instruction: "Cite the authority the opinion treats as controlling."
      volatile: true
    }
  ];

  // A headnote-style summary of the opinion.
  string summary = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 2000}
    }
  ];

  // The year the opinion was decided.
  int32 year = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 1600, lte: 2100}
    }
  ];
}

// The procedural posture of an opinion.
enum Posture {
  // Default, means unknown.
  POSTURE_UNSPECIFIED = 0;
  // The lower court was affirmed.
  POSTURE_AFFIRMED = 1;
  // The lower court was reversed.
  POSTURE_REVERSED = 2;
}
