# Publishes the current SNAPSHOT of every module to the ai.pipestream dev
# registry on this Forgejo instance, which the CI runners resolve every
# ai.pipestream.* artifact from (runner image global init script). This is
# the Forgejo half of snapshot publishing: direct Maven publishing with the
# runner's own ambient identity. The GitHub half publishes to Maven Central
# via nmcp and never needs Forgejo credentials; neither side holds the
# other's tokens.
#
# Runs on every push to main so the registry cannot drift behind the code,
# and on manual dispatch. Forgejo is the master repo for this project
# (since 2026-08-01); GitHub receives the same commits after.
name: Publish Registry Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # axion derives the version from tags; a shallow clone would
          # mis-version the publish.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish snapshot to the dev registry
        env:
          FORGEJO_ACTOR: ${{ github.actor }}
          # Repo secret holding a publish-capable token. The ambient
          # GITHUB_TOKEN cannot publish packages on this instance even with
          # `permissions: packages: write` (kept above as defense in depth).
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_PUBLISH_TOKEN }}
        # One upload at a time, with HTTP timeouts above the registry's
        # slowest observed PUT (51 s on 2026-11-10). With the 30 s Gradle
        # default, the client gave up on uploads the server still stored,
        # and the retry of the same file got HTTP 409 Conflict (#857).
        run: >-
          ./gradlew publishMavenPublicationToRegistryRepository
          --no-daemon --console=plain --no-parallel --max-workers=1
          -Dorg.gradle.internal.http.connectionTimeout=180000
          -Dorg.gradle.internal.http.socketTimeout=180000

      - name: Print resolved snapshot version
        run: ./gradlew currentVersion --no-daemon --console=plain -q
