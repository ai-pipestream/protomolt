name: TEI integration

# Forgejo-only lane: GitHub ignores .forgejo/. The suite self-provisions OpenSearch plus two
# TEI CPU containers (embeddings and reranker) and is excluded by its @Tag("tei") gate from
# both test and default integrationTest (unless -PincludeTei is set), running via
# :protomolt-search-index-opensearch:teiIntegrationTest so cold-cache model downloads stay isolated.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'search/**'
      - '.forgejo/workflows/tei-integration.yml'
      - 'gradle/libs.versions.toml'
      - 'build.gradle'
  # Forgejo is master and nothing mirrors into it (mirror: false, no push
  # mirrors), so commits arrive here by direct push. The manual trigger stays
  # because a lane this expensive is worth being able to start by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running build. Every
# other run gets a group of its own (keyed on run_id), so a main push neither
# cancels nor replaces a queued main run and each commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tei-integration:
    # Repository variables select a Docker-capable runner and persistent cache path.
    runs-on: ${{ vars.PROTOMOLT_TEI_RUNNER || 'ubuntu-latest' }}
    env:
      PROTOMOLT_TEI_CACHE: ${{ vars.PROTOMOLT_TEI_CACHE || '/work/tei-model-cache' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # TEI downloads missing models on startup and reuses the bind-mounted cache.
      # With Docker outside the job container, this absolute path must also exist
      # on the Docker host (mount it at the same path in the runner job).
      - name: Prepare the persistent TEI model cache
        shell: bash
        run: |
          if [[ "$PROTOMOLT_TEI_CACHE" != /* ]]; then
            echo "::error::PROTOMOLT_TEI_CACHE must be an absolute path shared with the Docker host."
            exit 1
          fi
          mkdir -p -- "$PROTOMOLT_TEI_CACHE"
          test -w "$PROTOMOLT_TEI_CACHE"

      - name: Run the TEI rerank lane (download missing models)
        run: ./gradlew :protomolt-search-index-opensearch:teiIntegrationTest --no-daemon --console=plain
