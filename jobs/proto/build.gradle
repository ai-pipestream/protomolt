plugins {
    alias(libs.plugins.protobuf)
}

description = 'The chain-jobs contract: the ChainJobEvent lifecycle envelope and the ChainJobRequest request-topic payload'

dependencies {
    api libs.protobuf.java
    // Struct and Timestamp ride the contract (event detail, request input).
    api libs.protobuf.java.util
}

// Messages only — the verbs live in the descriptor-native ProtoMoltService,
// so no gRPC service (and no protoc-gen-grpc-java) here.
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.1"
    }
}
