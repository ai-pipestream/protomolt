// DRAFT FOR REVIEW ONLY. Committed documentation; not built into any module.
// Compile qualification and remaining runtime checks are in component-mapping.md.
//
// Concrete contract for docs/design/parts-based-repository-requirements.md (v2.3).
// Section references (§n) point at that document.
//
// Package choice is OPEN. repo.v2 isolates this review draft from production.
// It does not authorize a second deployed service or side-by-side public APIs.
// Final package/shared-message placement must be reviewed before implementation.
// Messages that do not change (NodeAddress, Document, OwnershipContext, Blob,
// WriteProvenance) are imported from v1 rather than copied.
//
// This draft is one file for reading. When implemented it splits into
// document_service.proto, manifest.proto, semantic.proto, events.proto,
// errors.proto and catalog_internal.proto.

syntax = "proto3";

package ai.protomolt.proto.repo.v2;

import "ai/protomolt/proto/repo/v1/address.proto";   // NodeAddress (call number)
import "ai/protomolt/proto/repo/v1/document.proto";  // Document, Blob
import "ai/protomolt/proto/repo/v1/manifest.proto";  // WriteProvenance
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "ai/protomolt/proto/repo/v1/schema_occurrence.proto";
import "ai/protomolt/proto/repo/v1/schema_asset_reference.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.repo.v2";

// ============================================================================
// Service
// ============================================================================

// The only public repository contract (§12). History lives here; the separate
// history, history-materialization and publication services are removed.
service DocumentService {
  // --- Writes (§7) ---------------------------------------------------------

  // Commit one accession. Returns the outcome, or a gRPC error:
  //   ABORTED             stale expected revision; details = RevisionConflict
  //   ALREADY_EXISTS      operation ID reused with different intent; details = OperationReuse
  //   INVALID_ARGUMENT    request structure or composed-candidate validation failed;
  //                       details = SaveRejection (the rejection is also recorded as
  //                       the operation's outcome)
  //   FAILED_PRECONDITION schema missing, carried-forward object purged, or embedding
  //                       set bound to a changed segmentation; details = SaveRejection
  //   UNAVAILABLE         schema registry or catalog unreachable (never recorded)
  rpc SaveDocument(SaveDocumentRequest) returns (SaveDocumentResponse);

  // Bulk saves (§4.1). Each request yields exactly one SaveDocumentsResponse,
  // correlated by request_id, independent of the durable operation_id. Responses may
  // arrive out of order; request IDs are unique within one stream.
  // One document's failure never fails the stream; transport failures do.
  rpc SaveDocuments(stream SaveDocumentsRequest) returns (stream SaveDocumentsResponse);

  // Streamed raw-file OR encoded-part upload (§11). Header, then bytes, then
  // client half-close. Both use the same save/validation/commit handler.
  // Bytes go to the stacks; raw blobs receive a claim check, encoded parts their
  // immutable reference. Then the same commit as SaveDocument runs. The HTTP upload route is a surface onto this operation.
  rpc UploadDocument(stream UploadDocumentRequest) returns (SaveDocumentResponse);

  // Tombstone (§6). Itself an accession: it gets a revision, takes
  // expected_revision and operation_id, and emits a Tombstoned event.
  // No bytes are removed.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Admin purge (§6). Marks the document's references purged in one catalog
  // transaction; bytes are deleted afterwards only for objects with no unpurged
  // reference from any document. Idempotent by purge_id.
  rpc PurgeDocument(PurgeDocumentRequest) returns (PurgeDocumentResponse);

  // Three-state outcome lookup (§7 Cancellation).
  // "Lookup unavailable" is the gRPC status UNAVAILABLE, never an empty answer.
  rpc GetOperationOutcome(GetOperationOutcomeRequest) returns (GetOperationOutcomeResponse);

  // --- Reads (§8) ----------------------------------------------------------

  // Unary read of a whole or partial document, for results that fit one message.
  // An exact revision that does not exist is NOT_FOUND, never the current one.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

  // Streamed read for large documents: the manifest frame first (pinned to one
  // revision for the whole stream), then the selected parts' serialized bytes.
  rpc ReadDocument(ReadDocumentRequest) returns (stream ReadDocumentResponse);

  // Per-request streams may interleave; request_id identifies each one.
  // Each item ends in complete or error, never both. Transport failure interrupts
  // unfinished items without claiming success. No batch-wide transaction.
  rpc ReadDocuments(stream ReadDocumentsRequest) returns (stream ReadDocumentsResponse);

  // Streamed raw-file read with optional byte range (§11). A full read ends with a
  // SHA-256 check; a mismatch ends the stream with DATA_LOSS, never valid-looking bytes.
  rpc ReadBlob(ReadBlobRequest) returns (stream ReadBlobResponse);

  // Manifest only. Fetches no payloads.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);

  // Revision history, newest first, paginated (§4.3, §8).
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);

  // Current documents in a scope. Kept from v1, reshaped to the v2 manifest.
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);

  // Removed from v1: GetDocumentByReference, PutBlob, GetBlob (now ReadBlob),
  // GetBlobForUpdate, CompareAndPutBlob, DeleteBlob, GetDocumentManifest (now
  // GetManifest). The conditional-blob RPCs contradict write-once stacks (§6).
}

// ============================================================================
// Selectors and identities (§5)
// ============================================================================

enum DocumentPart {
  DOCUMENT_PART_UNSPECIFIED = 0;
  DOCUMENT_PART_CORE = 1;
  DOCUMENT_PART_BLOBS = 2;
  DOCUMENT_PART_CHUNKS = 3;      // one object per segmentation; select by segmentation_id
  DOCUMENT_PART_PARSED = 4;
  DOCUMENT_PART_EMBEDDINGS = 5;  // one object per embedding set; select by EmbeddingSetKey
}

message EmbeddingSetKey {
  string segmentation_id = 1 [(buf.validate.field).string.min_len = 1];
  string embedding_set_id = 2 [(buf.validate.field).string.min_len = 1];
}

// Names exactly one stored object of a document.
// CORE, BLOBS and PARSED are selected by `part`. CHUNKS and EMBEDDINGS are always
// selected by their ID, never by `part`. A request that names the same selector
// twice, or names a selector in two contradicting ways, is rejected (§5).
message PartSelector {
  oneof selector {
    option (buf.validate.oneof).required = true;
    DocumentPart part = 1 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 4]}];
    string segmentation_id = 2 [(buf.validate.field).string.min_len = 1];
    EmbeddingSetKey embedding_set = 3;
  }
}

// Read selection. Empty = every part. `all_segmentations` / `all_embedding_sets`
// avoid listing IDs the caller does not know yet.
message PartSelection {
  repeated PartSelector selectors = 1;
  bool all_segmentations = 2;
  bool all_embedding_sets = 3;
}

// Which revision a read resolves. Unset = current, resolved once per call.
message RevisionSelector {
  oneof selector {
    bool current = 1 [(buf.validate.field).bool.const = true];
    int64 revision = 2 [(buf.validate.field).int64.gt = 0];
  }
}

// The caller's view of the document's current revision (§7 step 2).
// There is no unconditional option. v1 force_save bypassed content deduplication,
// not optimistic concurrency; its removal is a separate dedupe-policy decision.
message ExpectedRevision {
  oneof expected {
    option (buf.validate.oneof).required = true;
    bool none = 1 [(buf.validate.field).bool.const = true];       // the document must not exist yet
    int64 revision = 2 [(buf.validate.field).int64.gt = 0];  // the current revision must equal this
  }
}

// How the call number is chosen. Same rules as v1 SaveDocumentRequest, collected.
message DocumentTarget {
  oneof target {
    option (buf.validate.oneof).required = true;
    ai.protomolt.proto.repo.v1.NodeAddress address = 1;
    // Derive the call number from document.doc_id + ownership, as v1 does.
    string use_datasource_id = 2 [(buf.validate.field).string.min_len = 1];
    string graph_location_id = 3 [(buf.validate.field).string.min_len = 1];
  }
}

// ============================================================================
// Save (§7, §9)
// ============================================================================

enum WriteAction {
  WRITE_ACTION_UNSPECIFIED = 0;
  WRITE_ACTION_PUT = 1;     // content comes from SaveDocumentRequest.document
  WRITE_ACTION_EMPTY = 2;   // part present, intentionally empty
  WRITE_ACTION_DELETE = 3;  // part marked DELETED from this revision on
}

message PartWrite {
  option (buf.validate.message).cel = {
    id: "delete-reason"
    message: "only DELETE carries a nonempty deletion reason"
    expression: "this.action == 3 ? size(this.deleted_reason) > 0 : size(this.deleted_reason) == 0"
  };
  PartSelector selector = 1 [(buf.validate.field).required = true];
  WriteAction action = 2 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  string deleted_reason = 3;  // DELETE only
}

// Carry a part from an exact revision of another (or the same) document (§4.5).
// The new accession references the same stack object; nothing is copied.
message PartSource {
  PartSelector selector = 1 [(buf.validate.field).required = true];
  ai.protomolt.proto.repo.v1.NodeAddress from_address = 2 [(buf.validate.field).required = true];
  int64 from_revision = 3 [(buf.validate.field).int64.gt = 0];  // required; exact revisions only
}

enum ValidationMode {
  VALIDATION_MODE_UNSPECIFIED = 0;  // = TYPED
  VALIDATION_MODE_TYPED = 1;
  // Unresolvable Any values are stored as type URL + exact bytes, never decoded.
  // Refused with PERMISSION_DENIED unless host policy allows it (§9).
  VALIDATION_MODE_OPAQUE_ALLOWED = 2;
}

// Save attribution is checked against trusted caller identity, not self-authorized.
message IntakeOrigin {
  string datasource_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string connector_id = 2 [(buf.validate.field).string.min_len = 1];
}
message SaveOwner {
  oneof owner {
    option (buf.validate.oneof).required = true;
    IntakeOrigin intake = 1;
    ai.protomolt.proto.repo.v1.WriteProvenance step = 2;
  }
  // Step fields, exact registration and caller delegation are handler checks (§5).
}
message SourceRevision {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  int64 revision = 2 [(buf.validate.field).int64.gt = 0];
}
message OpaqueSource {
  SourceRevision source = 1 [(buf.validate.field).required = true];
  OccurrenceLocator occurrence = 2 [(buf.validate.field).required = true];
}
message OpaqueAttestation {
  OccurrenceLocator occurrence = 1 [(buf.validate.field).required = true];
  string type_url = 2 [(buf.validate.field).string.min_len = 1];
  // Omitted means the save's step owner. Intake cannot be an opaque producer.
  ai.protomolt.proto.repo.v1.WriteProvenance owner = 3;
  // Required on edits; absent only for an initial opaque creation.
  // Effective owner on carry-forward must equal retained producer attribution.
  OpaqueSource carried_from = 4;
}

message SaveDocumentRequest {
  option (buf.validate.message).cel = {
    id: "explicit-opaque-mode"
    message: "opaque attestations require OPAQUE_ALLOWED"
    expression: "size(this.opaque_attestations) == 0 || this.validation_mode == 2"
  };
  // Client-chosen, unique per account (the account of the target call number).
  // Required. The server records the outcome under (account_id, operation_id).
  string operation_id = 1 [(buf.validate.field).string.min_len = 1];

  DocumentTarget target = 2 [(buf.validate.field).required = true];
  ExpectedRevision expected = 3 [(buf.validate.field).required = true];

  // Content for every PUT in `writes`, and nothing else. Content present for a
  // part that is not listed as PUT is rejected, never silently dropped.
  // CHUNKS/EMBEDDINGS content goes in the new segmentation fields (see the
  // "Document placement" note in the semantic section).
  ai.protomolt.proto.repo.v1.Document document = 4;

  repeated PartWrite writes = 5;

  // Parts taken from other revisions. Every part neither written nor listed here
  // carries forward from `expected` (same document). For a new document they are absent.
  repeated PartSource sources = 6;

  ValidationMode validation_mode = 7 [(buf.validate.field).enum = {defined_only: true}];

  // Named storage selection for new objects. Resolves to the stack currently
  // configured for that drive; the stack ID is recorded, never exposed (§6).
  string drive = 8;

  SaveOwner owner = 9 [(buf.validate.field).required = true];
  repeated OpaqueAttestation opaque_attestations = 10;
  repeated SourceRevision derived_from = 11;

  // Schema resolution is server-owned; retained bindings are output evidence.
  map<string, string> metadata = 99;

  // Removed from v1: force_save (content-dedupe bypass), parts_written and
  // chunk_sets_written (replaced by `writes`), copy_unwritten_parts_from
  // (replaced by `sources`), delete_source_blobs_on_settle and
  // source_blob_delete_reason (bytes are kept; removal is an admin purge),
  // connector_id (already carried in Document.ownership).
}

// Intent is SHA-256 of the versioned canonical protobuf SaveIntent below.
// Handler rules for canonical ordering, unknown fields and upload normalization
// are specified in requirements §7. No JSON or physical-key hashing.
message IntentMetadata { string key = 1; string value = 2; }
message IntentWrite {
  PartWrite write = 1;
  string content_sha256 = 2 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"]; // PUT only; EMPTY/DELETE have no payload digest.
  int64 content_length = 3 [(buf.validate.field).int64.gte = 0];
}
message SaveIntent {
  uint32 encoding_version = 1 [(buf.validate.field).uint32.const = 1];
  ai.protomolt.proto.repo.v1.NodeAddress address = 2 [(buf.validate.field).required = true];
  ExpectedRevision expected = 3 [(buf.validate.field).required = true];
  ValidationMode validation_mode = 4 [(buf.validate.field).enum = {defined_only: true}];
  repeated IntentWrite writes = 5;
  repeated PartSource sources = 6;
  string drive = 7;
  SaveOwner owner = 8 [(buf.validate.field).required = true];
  repeated IntentMetadata metadata = 9; // Persisted metadata, never transport tracing.
  repeated OpaqueAttestation opaque_attestations = 10;
  repeated SourceRevision derived_from = 12;
  // Domain separation: save/delete/purge must not share an intent namespace.
  string operation_kind = 11 [(buf.validate.field).string.const = "save"];
}

message Accession {
  option (buf.validate.message).cel = {
    id: "save-owner-present"
    message: "save accessions require an owner"
    expression: "this.tombstone || has(this.owner)"
  };
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  int64 revision = 2 [(buf.validate.field).int64.gt = 0];
  int64 previous_revision = 3 [(buf.validate.field).int64.gte = 0];  // 0 when the document is new
  google.protobuf.Timestamp committed_at = 4;
  DocumentManifest manifest = 5 [(buf.validate.field).required = true];
  RevisionValidation validation = 6 [(buf.validate.field).required = true];
  bool tombstone = 7;
  SaveOwner owner = 8; // Required for saves; delete remains an authenticated tombstone.
  repeated SourceRevision derived_from = 9;
}

message SaveDocumentResponse {
  string operation_id = 1 [(buf.validate.field).string.min_len = 1];
  Accession accession = 2 [(buf.validate.field).required = true];
  // True when this response is a recorded outcome returned for a retry,
  // including the concurrent same-ID case (§7).
  bool replayed = 3;
}

message SaveDocumentsRequest {
  string request_id = 1 [(buf.validate.field).string.min_len = 1];
  SaveDocumentRequest save = 2 [(buf.validate.field).required = true];
}

message SaveDocumentsResponse {
  string request_id = 4 [(buf.validate.field).string.min_len = 1];
  string operation_id = 1 [(buf.validate.field).string.min_len = 1];
  oneof result {
    option (buf.validate.oneof).required = true;
    SaveDocumentResponse saved = 2;
    ItemError error = 3;
  }
}

// ============================================================================
// Upload (§11)
// ============================================================================

message UploadHeader {
  // The save this upload commits. Its document carries the blob's metadata
  // (Blob with blob_id, mime_type, filename, no data/storage_ref); the server fills
  // the claim check once the bytes are in the stacks. Raw uploads require BLOBS PUT.
  // For encoded_part, its selected PUT has no inline content; the stream supplies it.
  SaveDocumentRequest save = 1 [(buf.validate.field).required = true];
  oneof payload {
    option (buf.validate.oneof).required = true;
    string blob_id = 2 [(buf.validate.field).string.min_len = 1];
    StreamedPart encoded_part = 5;
  }
  // Presence distinguishes an expected zero-byte object from unknown length.
  optional int64 declared_length = 3 [(buf.validate.field).int64.gte = 0];
  string expected_sha256 = 4 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"];
}

// The bytes are one stored codec fragment, not JSON and not an entire transport
// message. No new claim-check/publication service is needed. The matching PUT in
// header.save has no inline body; all other PUTs use header.save.document.
message StreamedPart {
  PartSelector selector = 1 [(buf.validate.field).required = true];
  // The server selects the fragment schema from the part layout.
}

message UploadDocumentRequest {
  oneof frame {
    option (buf.validate.oneof).required = true;
    UploadHeader header = 1;  // first frame, exactly once
    bytes data = 2;           // any number of frames
  }
}

// ============================================================================
// Delete, purge, outcomes
// ============================================================================

message DeleteDocumentRequest {
  string operation_id = 1 [(buf.validate.field).string.min_len = 1];
  ai.protomolt.proto.repo.v1.NodeAddress address = 2 [(buf.validate.field).required = true];
  ExpectedRevision expected = 3 [(buf.validate.field).required = true];
  string reason = 4;
}

message DeleteDocumentResponse {
  string operation_id = 1 [(buf.validate.field).string.min_len = 1];
  Accession accession = 2 [(buf.validate.field).required = true];  // tombstone = true
  bool replayed = 3;
}

message PurgeDocumentRequest {
  string purge_id = 1 [(buf.validate.field).string.min_len = 1];  // idempotency key for the purge
  ai.protomolt.proto.repo.v1.NodeAddress address = 2 [(buf.validate.field).required = true];
  string reason = 3;
}

message PurgeDocumentResponse {
  string purge_id = 1 [(buf.validate.field).string.min_len = 1];
  int64 references_purged = 2 [(buf.validate.field).int64.gte = 0];
  // Objects whose bytes are now eligible for deletion (no unpurged reference left).
  int64 objects_to_delete = 3 [(buf.validate.field).int64.gte = 0];
  // Objects kept because another document still references them (§15.16).
  int64 objects_retained_shared = 4 [(buf.validate.field).int64.gte = 0];
}

message GetOperationOutcomeRequest {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  string operation_id = 2 [(buf.validate.field).string.min_len = 1];
}

message RecordedOutcome {
  oneof result {
    option (buf.validate.oneof).required = true;
    Accession accession = 1;       // committed success
    SaveRejection rejection = 2;   // committed failure, e.g. validation rejection
  }
  google.protobuf.Timestamp recorded_at = 3;
}

// No outcome recorded. This does NOT mean the request failed: an outstanding
// request may still commit later.
message NoRecordedOutcome {}

message GetOperationOutcomeResponse {
  oneof state {
    option (buf.validate.oneof).required = true;
    RecordedOutcome committed = 1;
    NoRecordedOutcome none = 2;
  }
}

// ============================================================================
// Reads (§8)
// ============================================================================

message GetDocumentRequest {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  RevisionSelector revision = 2;
  PartSelection selection = 3;
  // Default false: an opaque payload fails a typed read clearly (§9).
  bool allow_opaque = 4;
}

message GetDocumentResponse {
  // Assembled from the selected parts only.
  ai.protomolt.proto.repo.v1.Document document = 1;
  DocumentManifest manifest = 2 [(buf.validate.field).required = true];  // entries mark which content was included
  RevisionValidation validation = 3 [(buf.validate.field).required = true];
}

message ReadDocumentRequest {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  RevisionSelector revision = 2;
  PartSelection selection = 3;
  bool allow_opaque = 4;
}

// Each part's bytes are that part's serialized protobuf fragment, as stored.
// The Java client assembles a Document with the parts codec when it fits.
message PartData {
  PartSelector selector = 1 [(buf.validate.field).required = true];
  int64 offset = 2 [(buf.validate.field).int64.gte = 0];
  bytes data = 3;
  bool last = 4;  // last frame of this part; its SHA-256 was verified server-side
}

message ReadComplete {}

message ReadDocumentResponse {
  oneof frame {
    option (buf.validate.oneof).required = true;
    DocumentManifest manifest = 1;  // first frame
    PartData part_data = 2;
    ReadComplete complete = 3; // after all selected parts are verified
  }
}

message ReadDocumentsRequest {
  string request_id = 1 [(buf.validate.field).string.min_len = 1];
  ReadDocumentRequest read = 2 [(buf.validate.field).required = true];
}
message ReadDocumentsResponse {
  string request_id = 1 [(buf.validate.field).string.min_len = 1];
  oneof result {
    option (buf.validate.oneof).required = true;
    ReadDocumentResponse frame = 2;
    ItemError error = 3; // Shared status/detail envelope; no save side effects.
  }
}

message ReadBlobRequest {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  RevisionSelector revision = 2;
  string blob_id = 3 [(buf.validate.field).string.min_len = 1];
  int64 offset = 4 [(buf.validate.field).int64.gte = 0];   // 0 = start
  int64 length = 5 [(buf.validate.field).int64.gte = 0];   // 0 = to end
}

message BlobHeader {
  int64 revision = 1 [(buf.validate.field).int64.gt = 0];
  int64 total_length = 2 [(buf.validate.field).int64.gte = 0];
  string sha256 = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];  // of the whole object
  string mime_type = 4;
  string filename = 5;
}

message ReadBlobResponse {
  oneof frame {
    option (buf.validate.oneof).required = true;
    BlobHeader header = 1;  // first frame
    bytes data = 2;
  }
}

message GetManifestRequest {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  RevisionSelector revision = 2;
}

message GetManifestResponse {
  DocumentManifest manifest = 1 [(buf.validate.field).required = true];
  RevisionValidation validation = 2 [(buf.validate.field).required = true];
}

message ListRevisionsRequest {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  int32 page_size = 2 [(buf.validate.field).int32.gt = 0];
  string page_token = 3;
}

message RevisionSummary {
  int64 revision = 1 [(buf.validate.field).int64.gt = 0];
  int64 previous_revision = 2 [(buf.validate.field).int64.gte = 0];
  google.protobuf.Timestamp committed_at = 3;
  string operation_id = 4 [(buf.validate.field).string.min_len = 1];
  SaveOwner owner = 5; // Present for save revisions; preserves intake or step attribution.
  bool tombstone = 6;
  ValidationStatus validation_status = 7 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  repeated PartChange changes = 8;
}

message ListRevisionsResponse {
  repeated RevisionSummary revisions = 1;  // revision descending
  string next_page_token = 2;
}

message ListDocumentsRequest {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  string graph_address_id = 2;  // optional scope
  string graph_id = 3;          // optional scope
  bool include_tombstoned = 4;
  int32 page_size = 5 [(buf.validate.field).int32.gt = 0];
  string page_token = 6;
}

message DocumentSummary {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  int64 revision = 2 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp committed_at = 3;
  bool tombstone = 4;
}

message ListDocumentsResponse {
  repeated DocumentSummary documents = 1;
  string next_page_token = 2;
}

// ============================================================================
// Manifest (§5, §8) — public shape; stack references are not exposed
// ============================================================================

enum PartState {
  PART_STATE_UNSPECIFIED = 0;
  PART_STATE_PRESENT = 1;
  PART_STATE_EMPTY = 2;
  PART_STATE_DELETED = 3;
}

message PartManifestEntry {
  PartSelector selector = 1 [(buf.validate.field).required = true];
  PartState state = 2 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  int64 size_bytes = 3 [(buf.validate.field).int64.gte = 0];
  string sha256 = 4 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"];
  int64 written_in_revision = 5 [(buf.validate.field).int64.gt = 0];  // the accession that wrote these bytes
  SaveOwner owner = 6 [(buf.validate.field).required = true];
  string deleted_reason = 7;
  // CHUNKS: the segmentation's digest. EMBEDDINGS: the digest it is bound to.
  string segmentation_digest = 8 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"];
  bool opaque = 9;            // holds opaque Any occurrences
  bool content_included = 10; // false = not requested, independent of state
}

// Every part the revision has is listed, requested or not, in codec order.
// A part never written is absent from the list; absent, EMPTY and DELETED differ.
message DocumentManifest {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  int64 revision = 2 [(buf.validate.field).int64.gt = 0];
  bool tombstone = 3;
  repeated PartManifestEntry parts = 4;
}

// ============================================================================
// Validation record (§9)
// ============================================================================

enum ValidationStatus {
  VALIDATION_STATUS_UNSPECIFIED = 0;
  VALIDATION_STATUS_TYPED_VALID = 1;     // every rule evaluated and passed
  // Accepted with opaque occurrences; at least one rule is NOT_EVALUATED or
  // opaque content exists. Never reported as typed-valid.
  VALIDATION_STATUS_OPAQUE_ACCEPTED = 2;
}

// Relative to the part's retained codec fragment. Steps select the Any envelope;
// intermediate Any boundaries are resolved; the terminal opaque value is not
// entered. Reuses typed field/index/map-key steps, not a JSON path interpreter.
message OccurrenceLocator {
  PartSelector part = 1 [(buf.validate.field).required = true];
  repeated ai.protomolt.proto.repo.v1.RepositorySchemaOccurrenceStep steps = 2 [(buf.validate.field).repeated.min_items = 1];
}
message ResolvedOccurrence {
  OccurrenceLocator occurrence = 1 [(buf.validate.field).required = true];
  ai.protomolt.proto.repo.v1.RepositorySchemaAssetReference schema = 2 [(buf.validate.field).required = true];
  string payload_sha256 = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  int64 payload_length = 4 [(buf.validate.field).int64.gte = 0];
}
message PartSchemaBinding {
  PartSelector part = 1 [(buf.validate.field).required = true];
  ai.protomolt.proto.repo.v1.RepositorySchemaAssetReference fragment_schema = 2 [(buf.validate.field).required = true];
}
message OpaqueOccurrence {
  OccurrenceLocator occurrence = 1 [(buf.validate.field).required = true];
  reserved 2; // No ambiguous text path as authoritative identity.
  string type_url = 3 [(buf.validate.field).string.min_len = 1];
  string sha256 = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  int64 length = 5 [(buf.validate.field).int64.gte = 0];
  ai.protomolt.proto.repo.v1.WriteProvenance owner = 6 [(buf.validate.field).required = true];
  OpaqueSource carried_from = 7; // Server-verified source, not a client success flag.
  string owner_definition_sha256 = 8 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
}

enum RuleResultState {
  RULE_RESULT_STATE_UNSPECIFIED = 0;
  RULE_RESULT_STATE_NOT_EVALUATED = 1;  // needed opaque contents
}

message RuleResult {
  string rule_id = 1 [(buf.validate.field).string.min_len = 1];
  string field_path = 2;
  RuleResultState state = 3 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
}

message RevisionValidation {
  option (buf.validate.message).cel = {
    id: "typed-validation-complete"
    message: "typed-valid must not contain opaque values or unevaluated rules"
    expression: "this.status != 1 || (size(this.opaque_occurrences) == 0 && size(this.rule_results) == 0)"
  };
  ValidationStatus status = 1 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  // Schema artifacts used at save time. Historical reads decode with these, never
  // with whatever the live registry holds now.
  repeated ResolvedOccurrence resolved_occurrences = 2;
  repeated OpaqueOccurrence opaque_occurrences = 3;
  // Only non-passing results are listed (a failed rule means no accession).
  repeated RuleResult rule_results = 4;
  repeated PartSchemaBinding part_schemas = 5;
  string candidate_sha256 = 6 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  string policy_sha256 = 7 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  string validator_profile = 8 [(buf.validate.field).string.min_len = 1];
  // Required for step-owned saves; absent for intake. Handler verifies the definition.
  optional string owner_definition_sha256 = 9 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
}

// ============================================================================
// Errors (carried in gRPC status details, and per item in bulk streams)
// ============================================================================

message RevisionConflict {
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  ExpectedRevision expected = 2 [(buf.validate.field).required = true];
  int64 current_revision = 3 [(buf.validate.field).int64.gte = 0];  // 0 = document does not exist
  bool current_is_tombstone = 4;
}

message OperationReuse {
  string operation_id = 1 [(buf.validate.field).string.min_len = 1];
  string recorded_intent_sha256 = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  string request_intent_sha256 = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_MALFORMED_REQUEST = 1;      // duplicate/contradicting selectors, stray content
  REJECTION_REASON_VALIDATION_FAILED = 2;      // composed candidate failed a rule
  REJECTION_REASON_SCHEMA_MISSING = 3;         // Any type not registered
  REJECTION_REASON_INVALID_BYTES = 4;          // Any bytes do not decode as their type
  REJECTION_REASON_OPAQUE_NOT_ALLOWED = 5;     // opaque requested, host policy refuses
  REJECTION_REASON_SOURCE_PURGED = 6;          // carried-forward object is purged
  REJECTION_REASON_SOURCE_NOT_FOUND = 7;       // PartSource revision/part does not exist
  REJECTION_REASON_SEGMENTATION_MISMATCH = 8;  // embedding set bound to a changed segmentation
  REJECTION_REASON_UPLOAD_MISMATCH = 9;        // declared length or SHA-256 differs
  REJECTION_REASON_OPAQUE_UNOWNED = 10;
  REJECTION_REASON_OWNER_UNKNOWN = 11;
}

message FieldViolation {
  PartSelector part = 1 [(buf.validate.field).required = true];
  string field_path = 2;
  string rule_id = 3 [(buf.validate.field).string.min_len = 1];
  string message = 4;
}

message SaveRejection {
  RejectionReason reason = 1 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  string message = 2;
  repeated FieldViolation violations = 3;
}

// Per-item error in bulk reads or saves. `code` is the gRPC status code the
// corresponding unary operation would return, with the same detail message.
message ItemError {
  int32 code = 1 [(buf.validate.field).int32 = {gte: 1, lte: 16}];
  string message = 2;
  oneof detail {
    RevisionConflict conflict = 3;
    OperationReuse reuse = 4;
    SaveRejection rejection = 5;
  }
}

// ============================================================================
// Semantic results (§5) — replaces SemanticProcessingResult / SemanticChunk /
// ChunkEmbedding
// ============================================================================
//
// Document placement (pending the §16.2 consumer inventory): two new fields on
// v1 SearchMetadata, `repeated Segmentation segmentations = 16` and
// `repeated EmbeddingSet embedding_sets = 17` (v2 types). The codec maps each
// segmentation to one CHUNKS object and each embedding set to one EMBEDDINGS
// object. Field 13 (semantic_results) is reserved once consumers have moved.

enum SegmentationKind {
  SEGMENTATION_KIND_UNSPECIFIED = 0;
  SEGMENTATION_KIND_SENTENCE = 1;
  SEGMENTATION_KIND_TOKEN_WINDOW = 2;
  SEGMENTATION_KIND_PARAGRAPH = 3;
  SEGMENTATION_KIND_SEMANTIC_BOUNDARY = 4;
}

// The allowed offset units. Offsets are half-open [start, end).
enum OffsetUnit {
  OFFSET_UNIT_UNSPECIFIED = 0;  // rejected
  OFFSET_UNIT_UTF8_BYTE = 1;
  OFFSET_UNIT_UTF16_CODE_UNIT = 2;  // Java String index
  OFFSET_UNIT_CODE_POINT = 3;       // Python str index
}

// Text that is not a field of the document, e.g. normalized text that semantic
// chunks are cut from. Stored inside the segmentation's CHUNKS object.
message DerivedText {
  string derivation_id = 1;  // e.g. the normalizer config
  string text = 2;
}

message SourceTextBinding {
  string resolved_text_sha256 = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  int64 utf8_length = 2 [(buf.validate.field).int64.gte = 0];
}

message TextSource {
  oneof source {
    option (buf.validate.oneof).required = true;
    string field_path = 1 [(buf.validate.field).string.min_len = 1];      // e.g. "search_metadata.body"
    DerivedText derived = 2;
  }
  SourceTextBinding binding = 3 [(buf.validate.field).required = true]; // verified against composed candidate/derived text
}

message Segment {
  option (buf.validate.message).cel = {
    id: "segment-offsets"
    message: "end must not precede start"
    expression: "this.end >= this.start"
  };
  string segment_id = 1 [(buf.validate.field).string.min_len = 1];  // stable; embedding vectors key on it
  int32 ordinal = 2 [(buf.validate.field).int32.gte = 0];
  string text = 3;
  int64 start = 4 [(buf.validate.field).int64.gte = 0];
  int64 end = 5 [(buf.validate.field).int64.gte = 0];
  map<string, string> metadata = 99;
}

message Lineage {
  string producer_id = 1;        // module/step that produced it
  string producer_version = 2;
  string config_id = 3;          // chunker or embedder config
  repeated string derived_from_segmentation_ids = 4;
  repeated EmbeddingSetKey derived_from_embedding_sets = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Immutable once committed. Identity = segmentation_id + content_digest.
message Segmentation {
  string segmentation_id = 1 [(buf.validate.field).string.min_len = 1];
  // Server-computed SHA-256 of SegmentationDigestInput, using the documented
  // canonical encoding. If the client sets it, it must match. A field path alone
  // never binds the source text: SourceTextBinding hashes the resolved UTF-8 bytes.
  // The same ID may have a new digest in a new accession; old revisions remain
  // immutable. Carried embeddings must match the new digest or the save fails.
  string content_digest = 2 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"];
  SegmentationKind kind = 3 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  TextSource source = 4 [(buf.validate.field).required = true];
  OffsetUnit offset_unit = 5 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  repeated Segment segments = 6;
  Lineage lineage = 7;
  map<string, string> metadata = 99;
}

// No self-digest. Includes ordered segment text, boundaries and metadata, source
// selector plus resolved-text binding, kind and offset unit. Lineage and top-level
// metadata remain immutable stored data but do not define embedding compatibility.
message SegmentationDigestInput {
  uint32 encoding_version = 1 [(buf.validate.field).uint32.const = 1];
  SegmentationKind kind = 2 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  TextSource source = 3 [(buf.validate.field).required = true];
  OffsetUnit offset_unit = 4 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  repeated Segment segments = 5;
}

enum Similarity {
  SIMILARITY_UNSPECIFIED = 0;
  SIMILARITY_COSINE = 1;
  SIMILARITY_DOT_PRODUCT = 2;
  SIMILARITY_EUCLIDEAN = 3;
}

message SegmentVector {
  string segment_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated float values = 2;  // length = EmbeddingSet.dimensions
}

// One model's vectors over one segmentation.
message EmbeddingSet {
  option (buf.validate.message).cel = {
    id: "vector-dimensions"
    message: "every vector must match declared dimensions"
    expression: "this.vectors.all(v, size(v.values) == this.dimensions)"
  };
  string embedding_set_id = 1 [(buf.validate.field).string.min_len = 1];
  string segmentation_id = 2 [(buf.validate.field).string.min_len = 1];
  // Must equal the segmentation's content_digest in the composed candidate, or
  // the save fails with SEGMENTATION_MISMATCH. Vectors are never reattached.
  string segmentation_digest = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  string model = 4 [(buf.validate.field).string.min_len = 1];
  int32 dimensions = 5 [(buf.validate.field).int32.gt = 0];
  Similarity similarity = 6 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  // Exactly one vector per segment ID of the bound segmentation.
  repeated SegmentVector vectors = 7;
  Lineage lineage = 8;
  map<string, string> metadata = 99;
}

// ============================================================================
// Events (§10) — one per accession, written in the commit transaction
// ============================================================================

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_REPLACED = 2;
  CHANGE_KIND_EMPTIED = 3;
  CHANGE_KIND_DELETED = 4;
  CHANGE_KIND_SOURCED = 5;  // taken from another document's revision
}

message PartChange {
  PartSelector selector = 1 [(buf.validate.field).required = true];
  ChangeKind kind = 2 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  string sha256 = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
}

message Accessioned {
  repeated PartChange changes = 1;  // carried-forward-unchanged parts are not listed
  ValidationStatus validation_status = 2 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
}

message Tombstoned {
  string reason = 1;
}

// References marked purged. Not an accession; dedupe by event_id.
message PurgeMarked {
  string purge_id = 1 [(buf.validate.field).string.min_len = 1];
  int64 references_purged = 2 [(buf.validate.field).int64.gte = 0];
}

// Bytes deleted for this purge (objects still shared elsewhere are kept).
message PurgeCompleted {
  string purge_id = 1 [(buf.validate.field).string.min_len = 1];
  int64 objects_deleted = 2 [(buf.validate.field).int64.gte = 0];
  int64 objects_retained_shared = 3 [(buf.validate.field).int64.gte = 0];
}

// Delivered at least once. Consumers dedupe accession and tombstone events by
// (address, revision). All events can be deduplicated by event_id. PurgeMarked
// and PurgeCompleted have distinct event IDs; purge_id groups them, not dedupes them.
message DocumentEvent {
  option (buf.validate.message).cel = {
    id: "event-revision-kind"
    message: "accessions require positive revisions and operation IDs; purge events have revision zero"
    expression: "(has(this.accessioned) || has(this.tombstoned)) ? (this.revision > 0 && size(this.operation_id) > 0) : this.revision == 0"
  };
  string event_id = 1 [(buf.validate.field).string.min_len = 1];
  ai.protomolt.proto.repo.v1.NodeAddress address = 2 [(buf.validate.field).required = true];
  int64 revision = 3 [(buf.validate.field).int64.gte = 0];           // 0 for purge events
  int64 previous_revision = 4 [(buf.validate.field).int64.gte = 0];
  string operation_id = 5; // Required for accession/tombstone by the message rule.
  google.protobuf.Timestamp occurred_at = 6;
  oneof kind {
    option (buf.validate.oneof).required = true;
    Accessioned accessioned = 10;
    Tombstoned tombstoned = 11;
    PurgeMarked purge_marked = 12;
    PurgeCompleted purge_completed = 13;
  }
  map<string, string> metadata = 99;
}

// ============================================================================
// Catalog-internal (not on the public API) — stored as binary protobuf (§10)
// ============================================================================

// A catalog record naming one configured storage namespace. Repointing
// configuration creates a new stack ID (§6).
message StackRecord {
  string stack_id = 1 [(buf.validate.field).string.min_len = 1];
  string provider = 2 [(buf.validate.field).string.min_len = 1];   // s3, redis, azure, ...
  string endpoint = 3;
  string namespace = 4 [(buf.validate.field).string.min_len = 1];  // bucket or container + prefix
  google.protobuf.Timestamp created_at = 5;
}

message StackRef {
  string stack_id = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];     // write-once, never reused
  string sha256 = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  int64 length = 4 [(buf.validate.field).int64.gte = 0];
}

message StoredPartEntry {
  PartManifestEntry entry = 1 [(buf.validate.field).required = true];  // content_included unused in storage
  StackRef ref = 2;             // unset for EMPTY / DELETED
}

// What the catalog stores per accession. Replaces today's JSON manifest,
// security and history metadata.
message StoredManifest {
  option (buf.validate.message).cel = {
    id: "save-owner-present"
    message: "save accessions require an owner"
    expression: "this.tombstone || has(this.owner)"
  };
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [(buf.validate.field).required = true];
  int64 revision = 2 [(buf.validate.field).int64.gt = 0];
  int64 previous_revision = 3 [(buf.validate.field).int64.gte = 0];
  bool tombstone = 4;
  repeated StoredPartEntry parts = 5;
  RevisionValidation validation = 6 [(buf.validate.field).required = true];
  string operation_id = 7 [(buf.validate.field).string.min_len = 1];
  string intent_sha256 = 8 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  SaveOwner owner = 9; // Required for save accessions, not delete tombstones.
  repeated SourceRevision derived_from = 10;
}
