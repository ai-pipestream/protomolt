// Isolated wiring for the replica scaling qualification. It forwards two Gradle
// properties to the existing nativeReplicaBenchmark task without editing the
// module build. Invoke with:
//   ./gradlew -I docs/evidence/repository/external-rustfs-scaling/RepositoryScalingBenchmark.init.gradle \
//     :protomolt-repo-container:nativeReplicaBenchmark -PnativeBenchmarkJournaled=true \
//     -PnativeBenchmarkHeapMiB=2048 -PnativeBenchmarkPlan=mirrored ...
// nativeBenchmarkHeapMiB is the aggregate worker heap divided equally across the
// replicas of each window; zero keeps 512 MiB per worker. nativeBenchmarkPlan is
// mirrored (one/two/four replicas) or scaleout (two/four replicas, allows 32 clients).
gradle.allprojects { project ->
    project.tasks.matching { it.name == 'nativeReplicaBenchmark' }.configureEach { task ->
        task.systemProperty 'protomolt.test.nativeBenchmarkHeapMiB', project.providers.gradleProperty('nativeBenchmarkHeapMiB').getOrElse('0')
        task.systemProperty 'protomolt.test.nativeBenchmarkPlan', project.providers.gradleProperty('nativeBenchmarkPlan').getOrElse('mirrored')
    }
}
// nativeBenchmarkSampleMillis is the interval of the parent's pg_stat_activity backend-state
// sampling during measured windows (default 25); zero disables that sampling for a control run.
gradle.allprojects { project ->
    project.tasks.matching { it.name == 'nativeReplicaBenchmark' }.configureEach { task ->
        task.systemProperty 'protomolt.test.nativeBenchmarkSampleMillis', project.providers.gradleProperty('nativeBenchmarkSampleMillis').getOrElse('25')
    }
}
