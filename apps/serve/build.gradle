plugins {
    id 'application'
}

description = 'One-process launcher: ProtoMoltService over gRPC with reflection, the same verbs over JSON/REST with OpenAPI and Swagger UI, MCP on streamable HTTP, and an optional git-backed registry'

dependencies {
    api project(':protomolt-grpc-service')
    // The access-policy loader and resolver behind --access-policy, and the
    // external caller stores (OIDC introspection, the JDBC principal table).
    implementation project(':protomolt-authz')
    implementation project(':protomolt-authz-jdbc')
    // The config lane, so the verifying verbs can follow a trust snapshot
    // published on it instead of only the operator's pinned file.
    implementation project(':protomolt-config')
    implementation project(':protomolt-config-registry')

    implementation project(':protomolt-http-json')
    implementation project(':protomolt-mcp')
    implementation project(':protomolt-workflow')
    // The live delegation coordinator and its MCP verbs mount in this process.
    implementation project(':protomolt-delegation')
    implementation project(':protomolt-mesh-cluster')
    // The delegation transcript store dials the repository service; in-process
    // endpoints ride the same process for tests and all-in-one deployments.
    implementation libs.grpc.inprocess
    implementation project(':protomolt-grpc-service-profile')
    implementation project(':protomolt-sources')
    implementation project(':protomolt-protobuf-validation')
    implementation project(':protomolt-protobuf-metadata')
    implementation project(':protomolt-search-index-spi')
    implementation project(':protomolt-http-rest')
    implementation project(':protomolt-http-openapi')
    implementation project(':protomolt-server-jdk')
    implementation project(':protomolt-registry')
    implementation project(':protomolt-registry-service')
    // The workflow-runs fleet (worker, relay, store) starts in this process
    // when --jobs-jdbc is given.
    implementation project(':protomolt-jobs-service')
    // The inference catalog boots from --inference-model specs; the OpenVINO
    // provider lands on the classpath for ServiceLoader discovery.
    implementation project(':protomolt-inference-spi')
    implementation project(':protomolt-inference-openvino')
    implementation project(':protomolt-inference-openai')
    implementation libs.kafka.clients
    implementation libs.protobuf.java.util
    implementation libs.swagger.ui

    runtimeOnly libs.slf4j.simple

    testImplementation project(':protomolt-grpc-invoke')
    testImplementation libs.grpc.inprocess
    testImplementation libs.testcontainers.junit.jupiter
}

// ContainerSmokeIntegrationTest docker-builds apps/serve/Dockerfile, whose context COPYs the
// installDist output. The Dockerfile is a declared input so editing it re-runs the suite;
// dependsOn alone is ordering and would leave a Dockerfile-only change stale-green.
tasks.named('test') {
    dependsOn 'installDist'
    inputs.file('Dockerfile')
}

application {
    mainClass = 'ai.pipestream.proto.serve.ProtoMoltServe'
}

// Bundle the console's built assets when they exist (cd apps/console && npm run
// build); without them the server still builds and /console explains itself.
processResources {
    into('ai/pipestream/proto/serve/console') {
        from("${rootDir}/apps/console/dist")
    }
}
