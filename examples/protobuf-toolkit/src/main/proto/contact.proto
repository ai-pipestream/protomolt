syntax = "proto3";

package example.toolkit.v1;

import "buf/validate/validate.proto";
import "ai/protomolt/proto/projection/v1/projection.proto";

option java_package = "example.contract";
option java_multiple_files = true;

message SourceContact {
  string full_name = 1;
  string email = 2;
}

message Contact {
  option (ai.protomolt.proto.projection.v1.sources) = {
    source: "example.toolkit.v1.SourceContact"
  };
  option (buf.validate.message).cel = {
    id: "contact.confirmed_email"
    message: "confirmation must match email"
    expression: "this.email == this.confirmed_email"
  };

  string name = 1 [
    (ai.protomolt.proto.projection.v1.from).paths.path = "full_name",
    (buf.validate.field).string.min_len = 2
  ];
  string email = 2 [
    (ai.protomolt.proto.projection.v1.from).paths.path = "email",
    (buf.validate.field).string.email = true
  ];
  string confirmed_email = 3 [
    (ai.protomolt.proto.projection.v1.from).paths.path = "email"
  ];
}

service ContactService {
  rpc Check(Contact) returns (Contact);
}
