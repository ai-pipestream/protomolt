plugins {
    id 'application'
    id 'com.google.protobuf' version '0.10.0'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://central.sonatype.com/repository/maven-snapshots')
        content { includeGroup 'ai.pipestream' }
    }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

def protomoltVersion = '0.1.0-SNAPSHOT'
dependencies {
    implementation "ai.pipestream:protomolt-mapper-cel:${protomoltVersion}"
    implementation "ai.pipestream:protomolt-projection:${protomoltVersion}"
    implementation "ai.pipestream:protomolt-protobuf-validation-protovalidate:${protomoltVersion}"
    implementation "ai.pipestream:protomolt-registry:${protomoltVersion}"
    implementation "ai.pipestream:protomolt-http-openapi:${protomoltVersion}"
}

protobuf { protoc { artifact = 'com.google.protobuf:protoc:4.36.2' } }
application { mainClass = 'example.ToolkitExample' }
