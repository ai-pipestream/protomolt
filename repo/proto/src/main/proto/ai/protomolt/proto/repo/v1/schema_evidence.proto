syntax = "proto3";

package ai.protomolt.proto.repo.v1;

import "ai/protomolt/proto/repo/v1/schema_occurrence.proto";
import "ai/protomolt/proto/repo/v1/schema_root.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.repo.v1";

// Evidence for one Any root in an exact document fragment. This representation
// does not grant authorization or certify a completed validation. The transaction
// binds it to one immutable revision-part object and its admission policy.
// Descriptor bytes and provenance remain normalized revision-scoped assets.
message DocumentRootSchemaEvidence {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "root-evidence-single-root"
    message: "exactly one root-only occurrence is required"
    expression: "size(this.occurrences.filter(p, size(p.steps) == 1)) == 1"
  };
  // Only version 1 is defined. Reject unknown fields before trusting evidence.
  uint32 encoding_version = 1 [(ai.protomolt.proto.validate.v1.field).uint32.const = 1];
  // Match the slot to exactly one immutable revision fragment, then verify its
  // original bytes, containing schema, layout, and effective root envelope.
  DocumentSchemaRootLocator root = 2 [(ai.protomolt.proto.validate.v1.field).required = true];
  // V1 canonical ordering is unsigned lexicographic order of each path's V1
  // canonical bytes. Reject duplicate paths and conflicting occurrence selectors.
  // All paths must share the root-only boundary. The completed candidate check
  // must reproduce the entire set; syntax alone cannot establish completeness.
  // Handler bounds before parse: 4 MiB total bytes, 16384 wire values, depth 16.
  // Also bound aggregate steps/text and all retained descriptor allocations.
  repeated RepositorySchemaOccurrencePath occurrences = 3 [(ai.protomolt.proto.validate.v1.field).repeated = {min_items: 1, max_items: 4096}];
}
