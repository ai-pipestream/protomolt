// Provenance record for one rendition of an archive entry version, enriched with
// live source currency metadata for inspection UIs.
message RenditionProvenanceEntry {
  // Rendition descriptor on the inspected archive entry version.
  ai.protomolt.proto.repo.archive.v1.RenditionDescriptor rendition = 1 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Immutable provenance recorded when the rendition was published.
  RenditionProvenance provenance = 2 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Current head revision of the source entity when repository-backed and readable; 0 otherwise.
  int64 current_source_revision = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    },
    (buf.validate.field).int64.gte = 0
  ];
  // True when provenance.source_revision > 0 and the source entity has advanced or been deleted.
  bool source_stale = 4;
}

// Request to list rendition provenance records for an archive entry version.
message ListRenditionProvenanceRequest {
  // Archive entry address to inspect.
  ai.protomolt.proto.repo.archive.v1.EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Entry version to inspect; 0 selects the current version.
  int64 version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    },
    (buf.validate.field).int64.gte = 0
  ];
}

// Response carrying rendition provenance records for the requested entry version.
message ListRenditionProvenanceResponse {
  // Inspected archive entry address.
  ai.protomolt.proto.repo.archive.v1.EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Resolved entry version whose renditions were inspected.
  int64 version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int64: {gt: 0}
    },
    (buf.validate.field).int64.gt = 0
  ];
  // Current latest version of the archive entry.
  int64 current_entry_version = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int64: {gt: 0}
    },
    (buf.validate.field).int64.gt = 0
  ];
  // Provenance entries in deterministic rendition order.
  repeated RenditionProvenanceEntry entries = 4;
}

// Explicit repository sink coordinating capability discovery, optional bounded
// rendering, streamed rendition publication, provenance inspection, and job control.
service RepositorySinkService {
  // Inspect an authorized source against enabled renderer capabilities without side effects.
  rpc ListSaveAsCapabilities(ListSaveAsCapabilitiesRequest) returns (ListSaveAsCapabilitiesResponse);
  // Publish selected protobuf processing state or an authorized repository source as an asset or rendition.
  rpc PublishRepositorySink(PublishRepositorySinkRequest) returns (PublishRepositorySinkResponse);
  // Retrieve the current state and receipt of a repository sink publication job.
  rpc GetRepositorySinkJob(GetRepositorySinkJobRequest) returns (GetRepositorySinkJobResponse);
  // Request cancellation of a queued or running repository sink publication job.
  rpc CancelRepositorySinkJob(CancelRepositorySinkJobRequest) returns (CancelRepositorySinkJobResponse);
  // List persisted rendition provenance records for a current or historical archive entry version.
  rpc ListRenditionProvenance(ListRenditionProvenanceRequest) returns (ListRenditionProvenanceResponse);
}
