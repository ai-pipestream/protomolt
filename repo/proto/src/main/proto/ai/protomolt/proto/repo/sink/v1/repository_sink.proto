  // Optional conversion specification; absent saves raw protobuf state directly.
  ConversionSpec conversion = 2;
  // Target entry, rendition slot, and destination precondition.
  SinkDestination destination = 3 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Retry and idempotency key bound to (source + conversion + destination) intent;
  // blank derives a deterministic UUIDv5 from the canonical intent.
  string operation_id = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
      ignore_if_zero: true
    },
    (buf.validate.field).string = {max_len: 200, pattern: "^(|.*\\S.*)$"}
  ];
  // When true, admits and enqueues background execution returning the QUEUED/RUNNING
