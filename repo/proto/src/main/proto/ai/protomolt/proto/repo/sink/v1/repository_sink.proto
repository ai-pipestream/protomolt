// Lifecycle state of a durable repository sink publication job.
enum RepositorySinkJobState {
  // Unset; never persisted on a valid job record.
  REPOSITORY_SINK_JOB_STATE_UNSPECIFIED = 0;
  // Admitted with frozen source revision, awaiting execution.
  REPOSITORY_SINK_JOB_STATE_QUEUED = 1;
  // Conversion or streamed repository upload is actively executing.
  REPOSITORY_SINK_JOB_STATE_RUNNING = 2;
  // Rendition bytes and provenance committed durably to the destination entry.
  REPOSITORY_SINK_JOB_STATE_SUCCEEDED = 3;
  // Execution terminated with an explicit refusal, conflict, or renderer/save failure.
  REPOSITORY_SINK_JOB_STATE_FAILED = 4;
  // Execution was cancelled before committing a destination revision.
  REPOSITORY_SINK_JOB_STATE_CANCELLED = 5;
  // Commit reply was lost; reconciles against v2 GetOperationOutcome before re-running.
  REPOSITORY_SINK_JOB_STATE_UNRESOLVED = 6;
}

// Structured failure recorded on a FAILED, CANCELLED, or UNRESOLVED sink job.
message RepositorySinkFailure {
  // Canonical gRPC status code number (1..16).
  int32 grpc_code = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int32: {gte: 1, lte: 16}
    },
    (buf.validate.field).int32 = {gte: 1, lte: 16}
  ];
  // Stable machine-readable failure reason code.
  string reason_code = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 128, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 128, pattern: ".*\\S.*"}
    }
  ];
  // Human-readable diagnostic message.
  string message = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 2048, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 2048, pattern: ".*\\S.*"}
    }
  ];
  // True when retrying the same operation_id and intent may succeed without edits.
  bool retryable = 4;
  // True when the failure was caused by a destination optimistic concurrency conflict.
  bool conflict = 5;
}

// Durable publication job and outcome receipt for a repository sink operation.
message RepositorySinkJob {
  // Owning account identifier.
  string account_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    }
  ];
  // Caller-supplied or deterministically derived operation identifier.
  string operation_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    }
  ];
  // Lowercase hex SHA-256 of the canonical (source + conversion + destination) intent.
  string intent_sha256 = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    },
    (buf.validate.field) = {
      required: true
      string: {len: 64, pattern: "^[0-9a-f]{64}$"}
    }
  ];
  // Current lifecycle state of the job.
  RepositorySinkJobState state = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    },
    (buf.validate.field) = {
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // Source revision frozen at admission; 0 when published from direct processing state.
  int64 frozen_source_revision = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    },
    (buf.validate.field).int64.gte = 0
  ];
  // Target archive entry address.
  ai.protomolt.proto.repo.archive.v1.EntryAddress destination_address = 6 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Target rendition descriptor.
  ai.protomolt.proto.repo.archive.v1.RenditionDescriptor destination_rendition = 7 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Requested optimistic concurrency precondition on the destination entry.
  int64 expected_destination_version = 8 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    },
    (buf.validate.field).int64.gte = 0
  ];
  // Whether create_only was requested on the destination entry.
  bool create_only = 9;
  // Bytes produced by the source or renderer; tracked separately from bytes_committed.
  int64 bytes_rendered = 10 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    },
    (buf.validate.field).int64.gte = 0
  ];
  // Bytes confirmed committed in the destination repository version (0 until committed).
  int64 bytes_committed = 11 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    },
    (buf.validate.field).int64.gte = 0
  ];
  // Landed destination entry version (0 until SUCCEEDED).
  int64 destination_version = 12 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    },
    (buf.validate.field).int64.gte = 0
  ];
  // Deterministic destination entry UUID populated when SUCCEEDED.
  string entry_uuid = 13 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 64}
      ignore_if_zero: true
    },
    (buf.validate.field).string.max_len = 64
  ];
  // Root checksum of the committed destination version populated when SUCCEEDED.
  string root_checksum = 14 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {sha256_hex: true}
      ignore_if_zero: true
    },
    (buf.validate.field).string = {max_len: 64, pattern: "^(|[0-9a-f]{64})$"}
  ];
  // True when this response replayed or reconciled an already-committed operation.
  bool replayed = 15;
  // Committed rendition provenance populated when state is REPOSITORY_SINK_JOB_STATE_SUCCEEDED.
  RenditionProvenance provenance = 16;
  // Structured failure details populated when state is FAILED, CANCELLED, or UNRESOLVED.
  RepositorySinkFailure failure = 17;
  // Timestamp when the job was first admitted.
  google.protobuf.Timestamp created_at = 18 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Timestamp when the job state was last updated.
  google.protobuf.Timestamp updated_at = 19 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
}

// Request to publish selected processing state or a repository-backed revision as an
