// Compatibility verdict for an installed renderer capability against a specific source.
enum SaveAsCompatibilityStatus {
  // Unset; never returned on a valid SaveAsCapability.
  SAVE_AS_COMPATIBILITY_STATUS_UNSPECIFIED = 0;
  // The capability accepts the source descriptor, payload, and input byte budget.
  SAVE_AS_COMPATIBILITY_STATUS_COMPATIBLE = 1;
  // The capability rejects the source descriptor, payload, or input byte budget.
  SAVE_AS_COMPATIBILITY_STATUS_INCOMPATIBLE = 2;
}

// One enabled renderer capability evaluated against an authorized source.
message SaveAsCapability {
  // Advertised bounded renderer capability contract.
  ai.protomolt.proto.emit.v1.RendererCapability capability = 1 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Compatibility verdict for the inspected source.
  SaveAsCompatibilityStatus status = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    },
    (buf.validate.field) = {
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // Diagnostic reason populated when status is SAVE_AS_COMPATIBILITY_STATUS_INCOMPATIBLE.
  string incompatibility_reason = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 1024}
      ignore_if_zero: true
    },
    (buf.validate.field).string.max_len = 1024
  ];
  // Optional closed FileDescriptorSet for capability.options_type so dynamic clients
  // can inspect and encode typed renderer options without precompiled stubs.
  bytes options_descriptors = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      bytes: {max_len: 4194304}
    },
    (buf.validate.field).bytes.max_len = 4194304
  ];
}

// Request to list enabled renderer capabilities compatible with an authorized source.
message ListSaveAsCapabilitiesRequest {
