    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 256, pattern: ".*\\S.*"}
    }
  ];
  // Canonical descriptor closure fingerprint of the inspected source schema.
  string source_schema_fingerprint = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
