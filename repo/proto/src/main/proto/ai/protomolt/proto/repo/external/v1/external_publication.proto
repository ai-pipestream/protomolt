// Durable operation record binding a stable operation_id to its immutable
// intent digest, attempt log, and verified terminal or pending outcome.
message ExternalPublicationOperationRecord {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "operation-confirmation-requires-evidence"
    message: "CONFIRMED and DELETED operations require matching terminal provider evidence; pending outcomes require pending_phase"
    expression: "(this.outcome == 2 ? (has(this.terminal_evidence) && this.terminal_evidence.settlement == 2 && this.terminal_evidence.request_intent_sha256 == this.intent_sha256 && this.pending_phase == 0) : true) && (this.outcome == 5 ? (has(this.terminal_evidence) && this.terminal_evidence.settlement == 5 && this.terminal_evidence.request_intent_sha256 == this.intent_sha256 && this.pending_phase == 0) : true) && ((this.outcome == 1 || this.outcome == 4) ? this.pending_phase != 0 : this.pending_phase == 0)"
  };
  option (buf.validate.message).cel = {
    id: "operation-confirmation-requires-evidence"
    message: "CONFIRMED and DELETED operations require matching terminal provider evidence; pending outcomes require pending_phase"
    expression: "(this.outcome == 2 ? (has(this.terminal_evidence) && this.terminal_evidence.settlement == 2 && this.terminal_evidence.request_intent_sha256 == this.intent_sha256 && this.pending_phase == 0) : true) && (this.outcome == 5 ? (has(this.terminal_evidence) && this.terminal_evidence.settlement == 5 && this.terminal_evidence.request_intent_sha256 == this.intent_sha256 && this.pending_phase == 0) : true) && ((this.outcome == 1 || this.outcome == 4) ? this.pending_phase != 0 : this.pending_phase == 0)"
  };

  // Stable operation identifier unique per ledger.
  string operation_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    }
  ];
  // Lowercase hex SHA-256 of the canonical ExternalPublicationIntent bytes.
  string intent_sha256 = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"}
    },
    (buf.validate.field) = {
      required: true
      string: {len: 64, pattern: "^[0-9a-f]{64}$"}
    }
  ];
  // Immutable semantic intent bound at operation registration.
  ExternalPublicationIntent intent = 3 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Non-secret snapshot of the referenced ExternalSystemBinding revision.
  ExternalSystemBinding binding_snapshot = 4 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Current lifecycle outcome of this operation.
  ExternalPublicationOutcome outcome = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    },
    (buf.validate.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // Sub-phase when outcome is PENDING or DELETION_PENDING; UNSPECIFIED otherwise.
  ExternalPendingPhase pending_phase = 6 [
    (ai.protomolt.proto.validate.v1.field).enum = {defined_only: true},
    (buf.validate.field).enum = {defined_only: true}
  ];
  // Ordered log of initial, retry, and reconciliation attempts.
  repeated ExternalPublicationAttempt attempts = 7 [
    (ai.protomolt.proto.validate.v1.field).repeated = {min_items: 1, max_items: 256},
    (buf.validate.field).repeated = {min_items: 1, max_items: 256}
  ];
  // Verified terminal provider receipt when outcome is CONFIRMED or DELETED.
  optional ExternalProviderEvidence terminal_evidence = 8;
  // Optional bounded failure code when outcome is FAILED.
  optional string failure_code = 9 [
    (ai.protomolt.proto.validate.v1.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9._:-]+$"},
    (buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9._:-]+$"}
  ];
  // Optional sanitized failure message when outcome is FAILED.
  optional string failure_message = 10 [
    (ai.protomolt.proto.validate.v1.field).string = {min_len: 1, max_len: 1024, pattern: ".*\\S.*"},
    (buf.validate.field).string = {min_len: 1, max_len: 1024, pattern: ".*\\S.*"}
  ];
  // Timestamp when this operation was first durably registered.
  google.protobuf.Timestamp created_at = 11 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Timestamp of the latest state transition on this operation.
  google.protobuf.Timestamp updated_at = 12 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
}

// Per-(account, binding, source_address) ledger persisted as typed structured_data
// inside external-publications:<account_id> via the selected-part DocumentService API.
// Storing this ledger outside the source document avoids mutating the source
// document's CORE part or revision counter and prevents circular publication loops.
message ExternalPublicationLedger {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "ledger-account-and-source"
    message: "source_address coordinates must be nonblank and match account_id"
    expression: "this.source_address.account_id == this.account_id && this.source_address.account_id.matches('.*\\\\S.*') && this.source_address.graph_id.matches('.*\\\\S.*') && this.source_address.graph_address_id.matches('.*\\\\S.*') && this.source_address.doc_id.matches('.*\\\\S.*')"
  };
  option (buf.validate.message).cel = {
    id: "ledger-account-and-source"
    message: "source_address coordinates must be nonblank and match account_id"
    expression: "this.source_address.account_id == this.account_id && this.source_address.account_id.matches('.*\\\\S.*') && this.source_address.graph_id.matches('.*\\\\S.*') && this.source_address.graph_address_id.matches('.*\\\\S.*') && this.source_address.doc_id.matches('.*\\\\S.*')"
  };
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "ledger-purge-consistency"
    message: "source_purged requires last_purge_id and forbids an ACTIVE current_link"
    expression: "!this.source_purged || (has(this.last_purge_id) && (!has(this.current_link) || this.current_link.projection_lifecycle == 3))"
  };
  option (buf.validate.message).cel = {
    id: "ledger-purge-consistency"
    message: "source_purged requires last_purge_id and forbids an ACTIVE current_link"
    expression: "!this.source_purged || (has(this.last_purge_id) && (!has(this.current_link) || this.current_link.projection_lifecycle == 3))"
  };

  // Owning repository account ID.
  string account_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    }
  ];
  // Stable external-system binding ID within account_id.
  string binding_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // Full canonical repository address of the source document.
  ai.protomolt.proto.repo.v1.NodeAddress source_address = 3 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Versioned, length-delimited binary tuple of source_address coordinates.
  bytes logical_source_key = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      bytes: {min_len: 1, max_len: 16384}
    },
    (buf.validate.field) = {
      required: true
      bytes: {min_len: 1, max_len: 16384}
    }
  ];
  // Highest source document revision admitted or fenced on this ledger.
  // Delayed attempts for older revisions cannot overwrite or resurrect current_link.
  int64 highest_fenced_source_revision = 5 [
    (ai.protomolt.proto.validate.v1.field).int64 = {gte: 0},
    (buf.validate.field).int64 = {gte: 0}
  ];
  // Tombstone fence revision; any PUBLISH with source_revision <= this value is fenced.
  optional int64 tombstoned_at_source_revision = 6 [
    (ai.protomolt.proto.validate.v1.field).int64 = {gt: 0},
    (buf.validate.field).int64 = {gt: 0}
  ];
  // True once a revision-0 purge event has fenced all source revisions on this ledger.
  bool source_purged = 7;
  // Correlation ID of the last processed source purge command/event when source_purged is true.
  optional string last_purge_id = 8 [
    (ai.protomolt.proto.validate.v1.field).string = {min_len: 1, max_len: 200, pattern: ".*\\S.*"},
    (buf.validate.field).string = {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
  ];
  // Current confirmed projection (ACTIVE or DELETION_PENDING); absent when none is live.
  optional ExternalLink current_link = 9;
  // Retained superseded or deleted projections under RETAIN_HISTORY policy.
  repeated ExternalLink historical_links = 10 [
    (ai.protomolt.proto.validate.v1.field).repeated = {max_items: 512},
    (buf.validate.field).repeated = {max_items: 512}
  ];
  // Durable operation records ordered by registration for replay, conflict detection,
  // and provider status reconciliation across restarts.
  repeated ExternalPublicationOperationRecord operations = 11 [
    (ai.protomolt.proto.validate.v1.field).repeated = {max_items: 1024},
    (buf.validate.field).repeated = {max_items: 1024}
  ];
}
