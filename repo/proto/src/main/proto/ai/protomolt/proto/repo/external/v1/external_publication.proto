syntax = "proto3";

package ai.protomolt.proto.repo.external.v1;

import "ai/protomolt/proto/repo/v1/address.proto";
import "ai/protomolt/proto/repo/v1/manifest.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.repo.external.v1";

// Lifecycle state of a versioned external-system binding configuration.
enum ExternalBindingLifecycle {
  // Unset; never valid in persisted or admitted bindings.
  EXTERNAL_BINDING_LIFECYCLE_UNSPECIFIED = 0;
  // Admitted for new publication, reconciliation, and deletion operations.
  EXTERNAL_BINDING_LIFECYCLE_ACTIVE = 1;
  // Retired for new publication requests; historical links and in-flight
  // settlement or deletion remain interpretable.
  EXTERNAL_BINDING_LIFECYCLE_RETIRED = 2;
}

// Retention policy governing external link history after source purge.
enum ExternalRetentionPolicy {
  // Unset; never valid in persisted or admitted bindings.
  EXTERNAL_RETENTION_POLICY_UNSPECIFIED = 0;
  // Retain historical external link and receipt records after source purge
  // once external deletion is settled, without fabricating a source revision.
  EXTERNAL_RETENTION_POLICY_RETAIN_HISTORY = 1;
  // Purge the external publication ledger document after external deletion
  // settles for a purged source document.
  EXTERNAL_RETENTION_POLICY_PURGE_WITH_SOURCE = 2;
}

// Non-secret endpoint summary preserved on binding revisions so historical
// links remain interpretable after service profile rotation or retirement.
message ExternalEndpointSummary {
  // Validated non-secret hostname or IP literal of the target service endpoint.
  string host = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 253, hostname: true}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 253, hostname: true}
    }
  ];
  // Validated TCP port in 1..65535.
  int32 port = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int32: {gte: 1, lte: 65535}
    },
    (buf.validate.field) = {
      required: true
      int32: {gte: 1, lte: 65535}
    }
  ];
  // Whether transport TLS was enabled on the referenced service endpoint.
  bool tls_enabled = 3;
}

// Typed, versioned external-system binding stored in the account config lane
// and in the dedicated external-bindings:<account_id> repository graph.
// Never persists secret values, bearer URLs, userinfo, or raw key material.
message ExternalSystemBinding {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "binding-retirement-consistency"
    message: "retired bindings require retired_reason and retired_at; active bindings forbid both"
    expression: "this.lifecycle == 2 ? (has(this.retired_reason) && has(this.retired_at)) : (!has(this.retired_reason) && !has(this.retired_at))"
  };
  option (buf.validate.message).cel = {
    id: "binding-retirement-consistency"
    message: "retired bindings require retired_reason and retired_at; active bindings forbid both"
    expression: "this.lifecycle == 2 ? (has(this.retired_reason) && has(this.retired_at)) : (!has(this.retired_reason) && !has(this.retired_at))"
  };

  // Stable path-safe binding identifier within the owning account.
  string binding_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // Tenant account owning this binding and its external publications.
  string account_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 200, pattern: ".*\\S.*"}
    }
  ];
  // Monotonic 1-based binding configuration revision.
  int64 binding_revision = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int64: {gt: 0}
    },
    (buf.validate.field) = {
      required: true
      int64: {gt: 0}
    }
  ];
  // Provider family identifier (for example protomolt-search, neo4j, opensearch).
  string provider = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // Referenced ServiceProfile.profile_id resolved at execution time for live
  // endpoint routing and ProfileCredentialResolver secret lookup.
  string service_profile_id = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // Referenced ServiceEndpoint.endpoint_id inside the selected service profile.
  string service_endpoint_id = 6 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // External dataset, collection, or index family targeted by this binding.
  string dataset = 7 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 256, pattern: ".*\\S.*"}
    }
  ];
  // External tenant, workspace, or logical namespace inside the dataset.
  string namespace = 8 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 256, pattern: ".*\\S.*"}
    }
  ];
  // Supported external wire contract identifier and version (for example managed-search/v1).
  string contract_version = 9 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"}
    }
  ];
  // Non-secret endpoint summary captured when this binding revision was created.
  ExternalEndpointSummary endpoint_summary = 10 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Current lifecycle status of this binding revision.
  ExternalBindingLifecycle lifecycle = 11 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    },
    (buf.validate.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // Retention policy for historical links when source documents are purged.
  ExternalRetentionPolicy retention_policy = 12 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    },
    (buf.validate.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // Optional config-lane document version recorded when mirrored to ConfigDocumentStore.
  optional int64 config_lane_version = 13 [
    (ai.protomolt.proto.validate.v1.field).int64 = {gt: 0},
    (buf.validate.field).int64 = {gt: 0}
  ];
  // Non-secret operator labels; forbidden from holding credentials or bearer tokens.
  map<string, string> labels = 14 [
    (ai.protomolt.proto.validate.v1.field).map = {
      max_pairs: 64
      keys: {string: {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}}
      values: {string: {max_len: 512}}
    },
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {string: {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"}}
      values: {string: {max_len: 512}}
    }
  ];
  // Creation timestamp of this binding revision.
  google.protobuf.Timestamp created_at = 15 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (buf.validate.field).required = true
  ];
  // Required when lifecycle is RETIRED; forbidden when ACTIVE.
  optional string retired_reason = 16 [
    (ai.protomolt.proto.validate.v1.field).string = {min_len: 1, max_len: 512, pattern: ".*\\S.*"},
    (buf.validate.field).string = {min_len: 1, max_len: 512, pattern: ".*\\S.*"}
  ];
  // Timestamp when this binding revision entered RETIRED; forbidden when ACTIVE.
  optional google.protobuf.Timestamp retired_at = 17;
}

// Verified digest of one retained source document part consumed by external publication.
message ExternalPartDigest {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "external-part-sub-key"
    message: "CHUNKS and EMBEDDINGS require a nonblank sub_key; other parts require an empty sub_key"
    expression: "(this.part == 3 || this.part == 5) ? this.sub_key.matches('.*\\\\S.*') : this.sub_key == ''"
  };
  option (buf.validate.message).cel = {
    id: "external-part-sub-key"
    message: "CHUNKS and EMBEDDINGS require a nonblank sub_key; other parts require an empty sub_key"
    expression: "(this.part == 3 || this.part == 5) ? this.sub_key.matches('.*\\\\S.*') : this.sub_key == ''"
  };

  // Selected repository part kind.
  ai.protomolt.proto.repo.v1.DocumentPart part = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    },
    (buf.validate.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // Chunk-set or embedding-set sub-key; empty for unkeyed parts.
  string sub_key = 2 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 1024,
    (buf.validate.field).string.max_len = 1024
  ];
  // Lowercase hex SHA-256 of the retained part payload bytes.
  string sha256 = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"}
    },
    (buf.validate.field) = {
      required: true
      string: {len: 64, pattern: "^[0-9a-f]{64}$"}
    }
  ];
  // Non-negative byte length of the retained part payload.
  int64 size_bytes = 4 [
    (ai.protomolt.proto.validate.v1.field).int64 = {gte: 0},
    (buf.validate.field).int64 = {gte: 0}
  ];
}

// Input, mapping, schema, and stateless NLP processing identities that produced
// an external projection. Processing receipts prove stateless derivation only
// and never establish external publication completion.
message ExternalProcessingIdentity {
  // Retained part digests read from the exact source revision.
  repeated ExternalPartDigest source_part_digests = 1 [
    (ai.protomolt.proto.validate.v1.field).repeated = {max_items: 1024},
    (buf.validate.field).repeated = {max_items: 1024}
  ];
  // Retained descriptor-set SHA-256 digests verified on the source revision.
  repeated string retained_schema_sha256s = 2 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      max_items: 128
      unique: true
      items: {string: {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"}}
    },
    (buf.validate.field).repeated = {
      max_items: 128
      unique: true
      items: {string: {len: 64, pattern: "^[0-9a-f]{64}$"}}
    }
  ];
  // Optional projection or field-mapping definition identifier.
  optional string mapping_id = 3 [
    (ai.protomolt.proto.validate.v1.field).string = {min_len: 1, max_len: 256, pattern: ".*\\S.*"},
    (buf.validate.field).string = {min_len: 1, max_len: 256, pattern: ".*\\S.*"}
  ];
  // Optional SHA-256 covering the complete generation/projection configuration
  // (mapping definition, descriptor closure, analyzer/chunking, model manifest).
  optional string generation_digest = 4 [
    (ai.protomolt.proto.validate.v1.field).string = {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"},
    (buf.validate.field).string = {len: 64, pattern: "^[0-9a-f]{64}$"}
  ];
  // Optional SHA-256 of the stateless NLP or Turboembed processing input envelope.
  optional string nlp_input_sha256 = 5 [
    (ai.protomolt.proto.validate.v1.field).string = {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"},
    (buf.validate.field).string = {len: 64, pattern: "^[0-9a-f]{64}$"}
  ];
  // Optional SHA-256 of the stateless NLP or Turboembed processing output artifact.
  optional string nlp_result_sha256 = 6 [
    (ai.protomolt.proto.validate.v1.field).string = {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"},
    (buf.validate.field).string = {len: 64, pattern: "^[0-9a-f]{64}$"}
  ];
  // Optional SHA-256 of the stateless NLP or Turboembed processing receipt.
  // Proves stateless model execution only, never external publication.
  optional string nlp_receipt_sha256 = 7 [
    (ai.protomolt.proto.validate.v1.field).string = {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"},
    (buf.validate.field).string = {len: 64, pattern: "^[0-9a-f]{64}$"}
  ];
}

// Separate serving-layer visibility observation for managed search, distinct
// from durable source acceptance and durable index publication.
enum ExternalServingVisibility {
  // Unset; never valid when an explicit observation enum is required.
  EXTERNAL_SERVING_VISIBILITY_UNSPECIFIED = 0;
  // No current serving observation was requested or recorded.
  EXTERNAL_SERVING_VISIBILITY_UNKNOWN = 1;
  // Serving snapshot is currently unavailable or quarantined.
  EXTERNAL_SERVING_VISIBILITY_UNAVAILABLE = 2;
  // Published historically, but superseded or not active in the current shard view.
  EXTERNAL_SERVING_VISIBILITY_NOT_CURRENT = 3;
  // Active live rows for this version are visible in the observed shard snapshot.
  EXTERNAL_SERVING_VISIBILITY_CURRENT_ROWS = 4;
  // Active zero-row projection for this version is current in the shard snapshot.
  EXTERNAL_SERVING_VISIBILITY_CURRENT_EMPTY = 5;
  // Active tombstone decision is current in the observed shard snapshot.
  EXTERNAL_SERVING_VISIBILITY_CURRENT_TOMBSTONE = 6;
}

// Managed-search source, sequence, and publication coordinates aligned with
// docs/search/managed-publication.md and docs/search/repository-rust-integration.md.
// Neither accepted_version nor accepted_sequence equals repository source_revision.
message ManagedSearchIdentity {
  // Exact 16-byte managed catalog history identifier.
  bytes history_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      bytes: {len: 16}
    },
    (buf.validate.field) = {
      required: true
      bytes: {len: 16}
    }
  ];
  // Versioned, length-delimited binary tuple of all four NodeAddress coordinates.
  bytes document_key = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      bytes: {min_len: 1, max_len: 16384}
    },
    (buf.validate.field) = {
      required: true
      bytes: {min_len: 1, max_len: 16384}
    }
  ];
  // Provisioned managed index key bound to an immutable generation and shard.
  bytes index_key = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      bytes: {min_len: 1, max_len: 1024}
    },
    (buf.validate.field) = {
      required: true
      bytes: {min_len: 1, max_len: 1024}
    }
  ];
  // Search-allocated positive per-document version (distinct from repository revision).
  uint64 accepted_version = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      uint64: {gt: 0}
    },
    (buf.validate.field) = {
      required: true
      uint64: {gt: 0}
    }
  ];
  // Catalog-wide positive accepted sequence number.
  uint64 accepted_sequence = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      uint64: {gt: 0}
    },
    (buf.validate.field) = {
      required: true
      uint64: {gt: 0}
    }
  ];
  // Durable catalog epoch assigned only when index publication commits.
  // Absent while merely accepted or staged.
  optional uint64 published_catalog_epoch = 6 [
    (ai.protomolt.proto.validate.v1.field).uint64 = {gt: 0},
    (buf.validate.field).uint64 = {gt: 0}
  ];
  // Lowercase hex SHA-256 of the durable post-publication shard manifest.
  optional string after_manifest_sha256 = 7 [
    (ai.protomolt.proto.validate.v1.field).string = {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"},
    (buf.validate.field).string = {len: 64, pattern: "^[0-9a-f]{64}$"}
  ];
  // Point-in-time serving visibility observation; advisory and separate from
  // durable publication confirmation.
  ExternalServingVisibility serving_visibility = 8 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    },
    (buf.validate.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    }
  ];
}

// Provider settlement state attested inside a verified provider receipt.
enum ExternalProviderSettlement {
  // Unset; never valid in verified provider evidence.
  EXTERNAL_PROVIDER_SETTLEMENT_UNSPECIFIED = 0;
  // Provider accepted the source write (for example ACCEPTED_FINAL), but index
  // or downstream publication has not yet committed. Remains PENDING in repo.
  EXTERNAL_PROVIDER_SETTLEMENT_ACCEPTED_ONLY = 1;
  // Provider durably committed the external object publication for the intent.
  EXTERNAL_PROVIDER_SETTLEMENT_PUBLISHED = 2;
  // Provider deterministically rejected or fenced the publication request.
  EXTERNAL_PROVIDER_SETTLEMENT_REJECTED = 3;
  // Provider accepted a deletion request that is still committing asynchronously.
  EXTERNAL_PROVIDER_SETTLEMENT_DELETION_ACCEPTED = 4;
  // Provider durably committed deletion or confirmed prior absence for tombstone/purge.
  EXTERNAL_PROVIDER_SETTLEMENT_DELETED = 5;
}

// Verified provider receipt establishing external acceptance, publication,
// rejection, or deletion. Confirmation never relies on a caller boolean flag.
message ExternalProviderEvidence {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "evidence-managed-search-epoch"
    message: "managed-search PUBLISHED evidence requires published_catalog_epoch and after_manifest_sha256; ACCEPTED_ONLY forbids them"
    expression: "!has(this.managed_search) || (this.settlement == 2 ? (has(this.managed_search.published_catalog_epoch) && has(this.managed_search.after_manifest_sha256)) : (this.settlement != 1 || (!has(this.managed_search.published_catalog_epoch) && !has(this.managed_search.after_manifest_sha256))))"
  };
  option (buf.validate.message).cel = {
    id: "evidence-managed-search-epoch"
    message: "managed-search PUBLISHED evidence requires published_catalog_epoch and after_manifest_sha256; ACCEPTED_ONLY forbids them"
    expression: "!has(this.managed_search) || (this.settlement == 2 ? (has(this.managed_search.published_catalog_epoch) && has(this.managed_search.after_manifest_sha256)) : (this.settlement != 1 || (!has(this.managed_search.published_catalog_epoch) && !has(this.managed_search.after_manifest_sha256))))"
  };

  // Provider identifier echoed by the external system adapter; must match binding.provider.
  string provider = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // Wire contract version used to verify the receipt; must match binding.contract_version.
  string contract_version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"}
    }
  ];
  // Service profile identifier used for outbound transport and credential verification.
  string verified_service_profile_id = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // Service endpoint identifier used for outbound transport verification.
  string verified_service_endpoint_id = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        path_safe_name: true
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    (buf.validate.field) = {
      required: true
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    }
  ];
  // Non-secret outbound credential reference digest proving credential resolution
  // without storing secret bytes.
  string credential_binding_sha256 = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {len: 64, sha256_hex: true, pattern: "^[0-9a-f]{64}$"}
    },
    (buf.validate.field) = {
      required: true
      string: {len: 64, pattern: "^[0-9a-f]{64}$"}
    }
  ];
  // Canonical external object identity verified by the provider.
  string external_object_id = 6 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 1024, pattern: ".*\\S.*"}
    },
    (buf.validate.field) = {
      required: true
      string: {min_len: 1, max_len: 1024, pattern: ".*\\S.*"}
    }
  ];
  // Optional provider-assigned external version; explicitly absent when unversioned.
  optional string external_version = 7 [
    (ai.protomolt.proto.validate.v1.field).string = {min_len: 1, max_len: 512, pattern: ".*\\S.*"},
    (buf.validate.field).string = {min_len: 1, max_len: 512, pattern: ".*\\S.*"}
  ];
  // Exact SHA-256 of the canonical ExternalPublicationIntent bound to this receipt.
  string request_intent_sha256 = 8 [
