// Kind of external publication mutation bound into an operation's immutable intent.
enum ExternalPublicationAction {
  // Unset; never valid in publication intents.
  EXTERNAL_PUBLICATION_ACTION_UNSPECIFIED = 0;
  // Publish or replace the external projection for an exact positive source revision.
  EXTERNAL_PUBLICATION_ACTION_PUBLISH = 1;
  // Delete/retire the external projection due to tombstone or source purge.
  EXTERNAL_PUBLICATION_ACTION_DELETE = 2;
}

// High-level lifecycle outcome of an external publication or deletion operation.
enum ExternalPublicationOutcome {
  // Unset; never valid on persisted operation or attempt records.
  EXTERNAL_PUBLICATION_OUTCOME_UNSPECIFIED = 0;
  // Publication is in flight, unresolved after a lost reply, or accepted awaiting
  // downstream index commit.
  EXTERNAL_PUBLICATION_OUTCOME_PENDING = 1;
  // Publication completed and was verified against provider PUBLISHED evidence.
  EXTERNAL_PUBLICATION_OUTCOME_CONFIRMED = 2;
  // Publication or deletion failed or was fenced by a newer revision/deletion.
  EXTERNAL_PUBLICATION_OUTCOME_FAILED = 3;
  // External deletion is in flight or unresolved after a lost reply.
  EXTERNAL_PUBLICATION_OUTCOME_DELETION_PENDING = 4;
  // External deletion completed and was verified against provider DELETED evidence.
  EXTERNAL_PUBLICATION_OUTCOME_DELETED = 5;
}

// Sub-phase distinguishing why an operation is in PENDING or DELETION_PENDING.
enum ExternalPendingPhase {
  // Unset; used when outcome is terminal (CONFIRMED, FAILED, or DELETED).
  EXTERNAL_PENDING_PHASE_UNSPECIFIED = 0;
  // Durable intent recorded before outbound provider call completed.
  EXTERNAL_PENDING_PHASE_DISPATCHING = 1;
  // Outbound call timed out, lost its reply, or encountered endpoint unavailability;
  // requires provider status reconciliation before assuming rollback or success.
  EXTERNAL_PENDING_PHASE_UNRESOLVED_LOST_REPLY = 2;
  // Provider durably accepted the write (for example ACCEPTED_FINAL), but index
  // publication has not yet committed.
  EXTERNAL_PENDING_PHASE_ACCEPTED_AWAITING_PUBLICATION = 3;
  // Deletion intent dispatched or accepted, awaiting terminal provider deletion receipt.
  EXTERNAL_PENDING_PHASE_DELETION_IN_FLIGHT = 4;
}

// How an individual attempt entry was initiated.
enum ExternalAttemptTrigger {
  // Unset; never valid on persisted attempt records.
  EXTERNAL_ATTEMPT_TRIGGER_UNSPECIFIED = 0;
  // Initial execution of a newly registered operation intent.
  EXTERNAL_ATTEMPT_TRIGGER_INITIAL = 1;
  // Caller retry supplying the identical operation_id and canonical intent.
  EXTERNAL_ATTEMPT_TRIGGER_RETRY = 2;
  // Coordinator or recovery status reconciliation against the external provider.
  EXTERNAL_ATTEMPT_TRIGGER_RECONCILIATION = 3;
}

