syntax = "proto3";

package ai.protomolt.proto.repo.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.repo.v1";

// ============================================================================
// DOCUMENT SECURITY — the typed, OIS-aligned access-control model.
//
// Extraction rides the document as first-class metadata; evaluation is
// deny-wins with case-insensitive identity match against the caller's
// principal + groups.
// ============================================================================

// Access decision of one ACL rule. Explicit DENY always wins over any grant.
enum Access {
  // Unset; never a stored decision.
  ACCESS_UNSPECIFIED = 0;
  // Grants read access to the document.
  ACCESS_READ = 1;
  // Grants write access to the document.
  ACCESS_WRITE = 2;
  // Explicit denial; overrides any READ/WRITE grant for the identity.
  ACCESS_DENY = 3;
}

// One typed access rule (OIS-style: identity + identity type + display label).
message AccessRule {
  // SID, email, group id, or "public".
  string identity = 1;
  // "windows-sid" | "oauth-group" | "user-principal-name" | "cmis-user" |
  // "local-role" | "public" | <custom>.
  string identity_type = 2;
  // Audit/debug label.
  string display_name = 3;
  // The decision this rule makes for its identity.
  Access access = 4;
}

// Document-level security. Extraction rides the document as first-class
// metadata; evaluation is deny-wins with case-insensitive identity match
// against the caller's principal + groups.
message DocumentSecurity {
  // When true, rules inherited from the container/source apply in addition
  // to the explicit permissions below.
  bool inheritance_enabled = 1;
  // The explicit ACL rules on this document; evaluated deny-wins.
  repeated AccessRule permissions = 2;
}

// A person or service principal — same identity vocabulary as AccessRule
// (identity + identity type + display label), minus the access decision.
// Used where a principal is referenced rather than granted (e.g.
// OwnershipContext.source_owner). AccessRule could converge on Principal
// later; for now the two stay separate.
message Principal {
  // SID, email, group id, or "public".
  string identity = 1;
  // "windows-sid" | "oauth-group" | "user-principal-name" | "cmis-user" |
  // "local-role" | "public" | <custom>.
  string identity_type = 2;
  // Audit/debug label.
  string display_name = 3;
}
