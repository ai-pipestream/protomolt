syntax = "proto3";

package ai.protomolt.proto.repo.archive.v1;

import "ai/protomolt/proto/asset/v1/bridge.proto";
import "ai/protomolt/proto/asset/v1/classification.proto";
import "ai/protomolt/proto/asset/v1/format.proto";
import "ai/protomolt/proto/repo/archive/v1/archive.proto";
import "ai/protomolt/proto/repo/archive/v1/entry.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.repo.archive.v1";

// ============================================================================
// ArchiveService — the generic document archive.
//
// Entries with named renditions, attached metadata, and per-archive
// versioning, over the repository engine (drives, blob stores, the Postgres
// ledger, the transactional outbox). Three doors in: unary PutEntry for
// small and medium bodies, client-streaming UploadRendition for bulk bytes,
// and the HTTP POST route for producers with no protomolt dependency.
//
// The contract publishes only implemented capability: every RPC here ships
// with the service.
// ============================================================================

// Request to create an archive.
message CreateArchiveRequest {
  // The archive to create. created_at is server-stamped; a supplied value
  // is ignored.
  Archive archive = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
}

// Response carrying the created archive.
message CreateArchiveResponse {
  // The stored archive.
  Archive archive = 1;
}

// Request to fetch one archive by account-scoped name.
message GetArchiveRequest {
  // Owning account.
  string account_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // The archive name.
  string archive = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 100}
    }
  ];
}

// Response carrying the requested archive.
message GetArchiveResponse {
  // The resolved archive.
  Archive archive = 1;
}

// Request to list an account's archives.
message ListArchivesRequest {
  // Tenant scope. Required.
  string account_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Maximum number of archives to return (default 100).
  int32 limit = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 1000}
    }
  ];
  // Continuation token from a previous response.
  string continuation_token = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// Response containing a page of the account's archives.
message ListArchivesResponse {
  // The page of archives.
  repeated Archive archives = 1;
  // Token to fetch the next page; empty when the listing is exhausted.
  string next_continuation_token = 2;
}

// Request to store one new entry version: metadata plus inline renditions
// in one shot. The payload transits the service in memory — bulk bytes
// belong on UploadRendition or the HTTP route.
message PutEntryRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // Display title.
  string title = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 500}
      ignore_if_zero: true
    }
  ];
  // Original filename, when the entry came from a file.
  string filename = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 500}
      ignore_if_zero: true
    }
  ];
  // Media type of the entry's primary content.
  string content_type = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {mime_type: true, max_len: 200}
      ignore_if_zero: true
    }
  ];
  // Where the content came from, when the source has an address.
  string source_uri = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 2000}
      ignore_if_zero: true
    }
  ];
  // The renditions this save writes. May be empty: a metadata-only entry
  // is a legitimate stub that grows later. Renditions not listed here are
  // re-referenced from the entry's current version (no copy — unchanged
  // hashes share objects).
  repeated RenditionContent renditions = 6 [
    (ai.protomolt.proto.validate.v1.field) = {
      repeated: {max_items: 256}
    }
  ];
  // Provenance stamped on the renditions THIS save writes. Unknown stays
  // blank; the archive never invents an attribution.
  WriteAttribution written_by = 7;
  // Optimistic concurrency: when non-zero, the save succeeds only if the
  // entry's current version equals this value (ABORTED otherwise). Zero =
  // no check (last write wins).
  int64 expected_version = 8 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // The source's own last-modified instant, when the source reports one.
  google.protobuf.Timestamp source_modified_at = 9;
  // The producer's format declaration for the entry's primary rendition.
  // Validated at the door against the format's own rules, and a
  // declaration must carry the format's filename — the claim is about a
  // named file. Absent = no claim; the entry classifies from the bytes
  // alone (IDENTIFIED or UNCLASSIFIED, never assumed).
  ai.protomolt.proto.asset.v1.FormatFact declared = 10;
  // Where the asset came from, when it arrived from object storage.
  // Validated strictly: an origin without its coordinates is refused.
  ai.protomolt.proto.asset.v1.ObjectStoreOrigin origin = 11;
  // Retry identity. Blank: derived deterministically (UUIDv5, see
  // ArchiveOperationKey) from the entry address, the requested
  // expected_version and the request content; never random. A supplied ID
  // shares the account's v2 operation namespace with DocumentService saves.
  //
  // A derived ID cannot tell a retry from a second write of the same
  // content. With expected_version 0, a request whose derived ID is already
  // recorded at a version that is no longer current is FAILED_PRECONDITION,
  // naming both versions: replaying it would report a write that is not
  // current, and saving it again would let a stale retry overwrite a later
  // writer. To write that content again, send expected_version equal to the
  // current version, or a new operation_id. A supplied ID always replays.
  string operation_id = 12 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {min_len: 1, max_len: 200}
      ignore_if_zero: true
    }
  ];
  // Extensible key-value labels; replaces the entry's map when non-empty.
  map<string, string> metadata = 99;
}

// Response carrying the stored version's coordinates and proof.
message PutEntryResponse {
  // The deterministic entry UUID.
  string entry_uuid = 1;
  // The version this save landed (unchanged when deduplicated).
  int64 version = 2;
  // The version's root checksum (SHA-256 over the ordered rendition
  // hashes).
  string root_checksum = 3;
  // Sum of PRESENT rendition sizes in the stored version.
  int64 total_bytes = 4;
  // True when the save was elided because the root checksum matched the
  // entry's current version: no bytes moved, no version landed.
  bool deduplicated = 5;
  // The stored version's manifest.
  VersionManifest manifest = 6;
  // The operation the save was recorded under: the request's, or the
  // derived one.
  string operation_id = 7;
  // True when this is the recorded outcome of an earlier identical save
  // under the same operation_id: nothing was saved by this call.
  bool replayed = 8;
}

// The first frame of an UploadRendition stream: everything about the
// upload except the bytes.
message UploadRenditionHeader {
  // The entry's logical identity. A missing entry is created with this
  // upload as its first version.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // What the bytes are.
  RenditionDescriptor rendition = 2 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // Declared total size of the bytes that follow. Required and exact: a
  // stream that delivers a different byte count fails — the honest mirror
  // of the HTTP route's Content-Length contract.
  int64 size_bytes = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int64: {gt: 0}
    }
  ];
  // Expected lowercase hex SHA-256 of the bytes. When set, bytes stream
  // directly to their final content-addressed key with the store's
  // checksum trailer enforcing the match; when blank, bytes stage under
  // the entry and settle onto the final key after the digest completes.
  string expected_sha256 = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {sha256_hex: true}
      ignore_if_zero: true
    }
  ];
  // Provenance of this write. Unknown stays blank.
  WriteAttribution written_by = 5;
  // The producer's format declaration, when this upload carries the
  // entry's primary rendition. Same door rules as PutEntry's.
  ai.protomolt.proto.asset.v1.FormatFact declared = 6;
  // Where the asset came from, when it arrived from object storage.
  ai.protomolt.proto.asset.v1.ObjectStoreOrigin origin = 7;
  // Retry identity, as on PutEntryRequest, including its rule for a derived
  // ID recorded at a version that is no longer current. Blank requires
  // expected_sha256: the header must carry the operation ID before any byte
  // arrives.
  string operation_id = 8 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {min_len: 1, max_len: 200}
      ignore_if_zero: true
    }
  ];
  // Optimistic concurrency, as on PutEntryRequest: when non-zero, the upload
  // lands only if the entry's current version equals this value (ABORTED
  // otherwise). Zero = no check (last write wins).
  int64 expected_version = 9 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // Original filename. Allowed only when uploading the original rendition.
  // Blank preserves an existing filename. It participates in retry identity.
  string filename = 10 [(ai.protomolt.proto.validate.v1.field) = {
    string: {max_len: 500}
    ignore_if_zero: true
  }];
}

// One frame of an UploadRendition stream: the header first, then chunks.
message UploadRenditionRequest {
  // The frame — exactly one arm; the first frame MUST be the header.
  oneof frame {
    // The upload's identity and contract; first frame only.
    UploadRenditionHeader header = 1;
    // A run of body bytes, in order.
    bytes chunk = 2;
  }
}

// Receipt for a completed rendition upload.
message UploadRenditionResponse {
  // The deterministic entry UUID.
  string entry_uuid = 1;
  // The new entry version this upload landed. The version's manifest
  // re-references every other current rendition — a large upload never
  // copies its siblings.
  int64 version = 2;
  // Lowercase hex SHA-256 of the landed bytes, computed while streaming.
  string sha256 = 3;
  // Size of the landed object in bytes.
  int64 size_bytes = 4;
  // The object's content-addressed storage key.
  string object_key = 5;
  // The new version's root checksum.
  string root_checksum = 6;
  // The operation the upload was recorded under.
  string operation_id = 7;
  // True when this is the recorded outcome of an earlier identical upload
  // under the same operation_id: nothing was saved by this call.
  bool replayed = 8;
}

// Request to read one entry version, whole or in part.
message GetEntryRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The version to read; 0 = the current version.
  int64 version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // Partial read: rendition names to assemble (every sub-key of each
  // name). Empty = all PRESENT renditions. Absent names are simply not in
  // the response; the manifest says why.
  repeated string renditions = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      repeated: {max_items: 256, items: {string: {path_safe_name: true, max_len: 200}}}
    }
  ];
}

// Response carrying the entry, its manifest, and the requested bytes.
// Unary: the requested renditions transit memory — size the read
// accordingly, or read the manifest first and fetch selectively. Large
// renditions belong on ReadRendition, which streams them.
message GetEntryResponse {
  // Current entry metadata, even when reading an older version. Historical
  // descriptive metadata, when recorded, is manifest.metadata_snapshot.
  EntryInfo info = 1;
  // The read version's full manifest — including renditions NOT requested
  // and renditions whose bytes are gone.
  VersionManifest manifest = 2;
  // The requested renditions' bytes (PRESENT entries matching the filter).
  repeated RenditionContent renditions = 3;
}

// Request to stream one rendition object of an entry version, whole or as a
// byte range. Bytes flow from the object store in bounded frames; nothing
// holds the whole rendition in memory.
message ReadRenditionRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The version to read; 0 = the current version.
  int64 version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // The rendition name.
  string rendition = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {path_safe_name: true, max_len: 200}
    }
  ];
  // The rendition's sub-key; empty selects the single-object rendition.
  string sub_key = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {path_safe_name: true, max_len: 200}
      ignore_if_zero: true
    }
  ];
  // First byte to send; 0 is the start. Must not pass the object's size.
  // Offset and length are each at most 2^62 - 1, so their sum cannot overflow.
  int64 offset = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0, lte: 4611686018427387903}
    }
  ];
  // Bytes to send; 0 = through the end of the object.
  int64 length = 6 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0, lte: 4611686018427387903}
    }
  ];
}

// The first frame of a rendition read.
message RenditionReadHeader {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "rendition-read-header-range"
    message: "the served range lies inside the object"
    expression: "this.offset <= this.size_bytes && this.length <= this.size_bytes - this.offset"
  };
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "rendition-read-header-whole"
    message: "whole_object is set exactly when the range covers every byte"
    expression: "this.whole_object == (this.offset == 0 && this.length == this.size_bytes)"
  };
  // The version read.
  int64 version = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int64: {gt: 0}
    }
  ];
  // The rendition as the version's manifest records it.
  RenditionDescriptor rendition = 2 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // Size of the whole object.
  int64 size_bytes = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // SHA-256 of the whole object, as the manifest attests it.
  string sha256 = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    }
  ];
  // First byte the stream carries.
  int64 offset = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // Bytes the stream carries.
  int64 length = 6 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
  // The stream covers the whole object. Only then is sha256 checked before
  // the stream completes; a mismatch ends it with DATA_LOSS. A range read is
  // checked for its length only and proves nothing about the object's
  // integrity.
  bool whole_object = 7;
}

// One frame of a rendition read: the header first, then data frames of at
// most 64 KiB. A stream that ends without OK status is not a complete read.
message ReadRenditionResponse {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "rendition-read-frame-required"
    message: "a frame is a header or data"
    expression: "has(this.header) || has(this.data)"
  };
  // Exactly one frame kind.
  oneof frame {
    // First frame.
    RenditionReadHeader header = 1;
    // Bytes of the range, in order.
    bytes data = 2 [
      (ai.protomolt.proto.validate.v1.field) = {
        bytes: {min_len: 1, max_len: 65536}
      }
    ];
  }
}

// Request to inspect an entry version's manifest without fetching bytes.
message GetEntryManifestRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The version to inspect; 0 = the current version.
  int64 version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      int64: {gte: 0}
    }
  ];
}

// Response carrying only the manifest and the entry metadata.
message GetEntryManifestResponse {
  // Current entry metadata. Historical descriptive metadata, when recorded,
  // is manifest.metadata_snapshot.
  EntryInfo info = 1;
  // The requested version's manifest.
  VersionManifest manifest = 2;
}

// Request to list an archive's entries.
message ListEntriesRequest {
  // Optional classification-state filter: only entries in this state.
  // Unspecified = no filter.
  ai.protomolt.proto.asset.v1.ClassificationState classification_state = 5;
  // Include each entry's current-version manifest in the response. A
  // catalog projection needs rendition sizes and content profiles, and
  // fetching them one entry at a time turns one listing into a page of
  // round trips.
  bool include_manifests = 6;
  // Owning account.
  string account_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // The archive to list.
  string archive = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 100}
    }
  ];
  // Maximum number of entries to return (default 100).
  int32 limit = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 1000}
    }
  ];
  // Continuation token from a previous response.
  string continuation_token = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// Response containing a page of entry metadata.
message ListEntriesResponse {
  // The page of entries.
  repeated EntryInfo entries = 1;
  // Token to fetch the next page; empty when the listing is exhausted.
  string next_continuation_token = 2;
  // Total number of live entries in the archive.
  int64 total_count = 3;
  // Each listed entry's current-version manifest, in the same order as
  // `entries`, when the request asked for them. Empty otherwise — a
  // listing that does not need manifests should not pay for them.
  repeated VersionManifest manifests = 4;
}

// Request to list an entry's retained versions, newest first.
message ListVersionsRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // Maximum number of versions to return (default 100).
  int32 limit = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 1000}
    }
  ];
  // Continuation token from a previous response.
  string continuation_token = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// Response containing a page of version manifests, newest first.
message ListVersionsResponse {
  // The page of manifests.
  repeated VersionManifest versions = 1;
  // Token to fetch the next page; empty when the listing is exhausted.
  string next_continuation_token = 2;
  // The page as version summaries, newest first: what the archive over v2
  // documents returns in place of versions. A summary carries no rendition
  // rows; GetEntryManifest at a version reads them.
  repeated VersionSummary summaries = 3;
}

// The UUIDv5 name an archive write's operation ID derives from when the
// caller supplies none: operation_id = UUIDv5(namespace, encoded key) per
// RFC 9562, SHA-1 over the 16 namespace bytes followed by this message's
// binary encoding (fields in number order). The namespace is the fixed
// constant 6e947da6-c6b8-49a7-9c65-fdf26dbd03e2, never configuration. The
// key is protobuf, not a joined string, so no character in an entry_id can
// make two keys encode alike.
message ArchiveOperationKey {
  // The command: "archive.put-entry" or "archive.upload-rendition".
  string operation_kind = 1;
  // The entry the write targets.
  EntryAddress address = 2;
  // The caller's requested expected_version, 0 for last write wins; never
  // the revision the translator later reads, so a retry derives the same ID.
  int64 expected_version = 3;
  // Lowercase hex SHA-256 of the request content: the request's binary
  // encoding with operation_id and expected_version cleared, renditions
  // sorted by (name, sub_key) and metadata entries in unsigned UTF-8 key
  // order. For an upload, the header's encoding with operation_id and
  // expected_version cleared and expected_sha256 kept.
  string content_sha256 = 4;
}

// Request to classify one entry: declare (or re-declare) the format, and
// have characterization read the primary rendition's bytes. The result is
// the state machine's resolution — a declaration that fails its format's
// rules is refused at this door exactly as at the save doors.
message ClassifyEntryRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The declaration to record; absent = withdraw nothing, characterize
  // only.
  ai.protomolt.proto.asset.v1.FormatFact declared = 2;
  // Who is classifying. Unknown stays blank.
  WriteAttribution classified_by = 3;
}

// Response carrying the resolved classification.
message ClassifyEntryResponse {
  // The entry's classification after this call.
  ai.protomolt.proto.asset.v1.Classification classification = 1;
}

// Delete-entry payload for ArchiveMutationRequest. Logical removal is atomic;
// physical cleanup is tracked separately by the mutation receipt.
message DeleteEntryRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
}

// Request to remove one rendition's bytes from EVERY retained version of
// an entry through ArchiveMutationRequest. Manifests keep tombstones
// (size, hash, reason) as provenance; the receipt tracks physical cleanup.
message DeleteRenditionRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The rendition name to remove (every sub-key).
  string rendition = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {path_safe_name: true, max_len: 200}
    }
  ];
  // The named reason recorded on every tombstone (e.g. "RTBF",
  // "RETENTION"). Required: bytes never disappear without a stated why.
  string reason = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
}

// Request to prune an entry's old retained versions.
message PruneVersionsRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // How many of the newest versions to keep. At least one: pruning
  // everything is DeleteEntry's job, asked for by name.
  int32 keep_latest = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int32: {gte: 1}
    }
  ];
}

// Request for one archive's ledger-maintained counters.
message GetArchiveStatsRequest {
  // Owning account.
  string account_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // The archive.
  string archive = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 100}
    }
  ];
}

// Response carrying the exact counters.
message GetArchiveStatsResponse {
  // The archive's counters, strongly consistent with the ledger.
  ArchiveStats stats = 1;
}

// Request to bridge one entry: run the transformations its classification
// makes applicable and land their derived renditions beside the original.
// Bridging derives; it never converts in place, so the original rendition is
// untouched by every outcome below.
message BridgeEntryRequest {
  // The entry's logical identity.
  EntryAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // Restrict the run to these bridges. Empty runs every applicable one; a
  // kind the entry's format does not apply is refused by name rather than
  // silently ignored.
  repeated ai.protomolt.proto.asset.v1.BridgeKind bridges = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      repeated: {max_items: 8}
    }
  ];
  // Provenance stamped on the derived renditions. Unknown stays blank; the
  // archive never invents an attribution.
  WriteAttribution bridged_by = 3;
}

// What one bridge did.
message BridgeOutcome {
  // The bridge.
  ai.protomolt.proto.asset.v1.BridgeKind bridge = 1;
  // The derived rendition's name, set whenever the bridge names one.
  string rendition = 2;
  // What happened.
  ai.protomolt.proto.asset.v1.BridgeStatus status = 3;
  // Why, in the bridge's own words: the reason a DEFERRED bridge runs
  // elsewhere, the error a FAILED one hit, the degradation a PRODUCED one
  // reported. Blank when a bridge ran clean.
  string detail = 4;
}

// Response carrying what the run produced.
message BridgeEntryResponse {
  // The entry's version after the run — unchanged when every bridge
  // deduplicated or none produced.
  int64 version = 1;
  // One outcome per bridge the run considered, in routing order. A bridge
  // that produced nothing still reports why.
  repeated BridgeOutcome outcomes = 2;
}

// The generic document archive: entries with named renditions, attached
// metadata, and per-archive versioning. Payload bytes live only in object
// storage; the database holds the manifests (locations, hashes, sizes,
// states) and the exact usage counters.
service ArchiveService {
  // Create an account-scoped archive bound to a drive.
  rpc CreateArchive(CreateArchiveRequest) returns (CreateArchiveResponse);

  // Fetch one archive by account-scoped name.
  rpc GetArchive(GetArchiveRequest) returns (GetArchiveResponse);

  // List an account's archives with pagination.
  rpc ListArchives(ListArchivesRequest) returns (ListArchivesResponse);

  // Store one new entry version: metadata plus inline renditions. Verified
  // writes; a root-checksum match against the current version dedupes the
  // whole save.
  rpc PutEntry(PutEntryRequest) returns (PutEntryResponse);

  // Stream one rendition's bytes in: a header frame, then chunks. Lands
  // one new entry version whose manifest re-references every other current
  // rendition.
  rpc UploadRendition(stream UploadRenditionRequest) returns (UploadRenditionResponse);

  // Read one entry version, whole or filtered to named renditions.
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);

  // Stream one rendition object of an entry version, whole or as a byte
  // range: a header frame, then data frames of at most 64 KiB, paced by the
  // client's flow control. A whole-object read is checked against the
  // manifest's SHA-256 before the stream completes.
  rpc ReadRendition(ReadRenditionRequest) returns (stream ReadRenditionResponse);

  // Inspect an entry version's manifest without fetching any bytes.
  rpc GetEntryManifest(GetEntryManifestRequest) returns (GetEntryManifestResponse);

  // List an archive's entries. Lightweight metadata only.
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);

  // List an entry's retained versions, newest first.
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);

  // Read one archive's exact usage counters.
  rpc GetArchiveStats(GetArchiveStatsRequest) returns (GetArchiveStatsResponse);

  // Declare an entry's format and/or re-run characterization; returns the
  // state machine's resolution.
  rpc ClassifyEntry(ClassifyEntryRequest) returns (ClassifyEntryResponse);

  // Run the bridges an entry's classification makes applicable, landing
  // their derived renditions beside the original. Refused for an entry
  // whose classification names no single format.
  rpc BridgeEntry(BridgeEntryRequest) returns (BridgeEntryResponse);
}
