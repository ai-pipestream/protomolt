syntax = "proto3";

package ai.pipestream.proto.repo.v1;

import "ai/pipestream/proto/repo/v1/document.proto";
import "ai/pipestream/proto/repo/v1/manifest.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.repo.v1";

// ============================================================================
// DocumentService — the claim-check document store API.
//
// Unary-first and grpc-web friendly. Partial saves write only the listed
// parts from the supplied document and carry the rest forward from a source
// address via object-storage server-side copy; partial reads assemble only
// the requested parts.
// ============================================================================

// Request to persist a Document with associated metadata.
message SaveDocumentRequest {
  // The Document to save.
  Document document = 1;
  // Drive/bucket identifier where this document should be stored.
  string drive = 2;
  // Connector ID that ingested this document (tracking and attribution).
  string connector_id = 3;

  // Graph address identifier - exactly one must be set. The chosen arm is
  // the EXPLICIT origin discriminator for the save (no inference from blank
  // fields anywhere in this contract):
  // - use_datasource_id: an INTAKE save. The address is the datasource id
  //   from document.ownership.datasource_id. The save MUST also carry
  //   graph_id = the account's intake graph ("intake:<accountId>").
  // - graph_location_id: a PIPELINE save at the named graph node. The save
  //   MUST also carry the owning graph_id.
  oneof graph_address {
    bool use_datasource_id = 4;
    string graph_location_id = 5;
  }

  // Additional key-value metadata to associate with this document.
  map<string, string> metadata = 6;

  // Cluster routing hint (optional). Routing metadata only — never part of
  // the storage identity. Must be omitted for intake saves.
  optional string cluster_id = 7;

  // Graph ID that produced this document. REQUIRED on both origin arms:
  // pipeline saves carry the owning graph; intake saves carry the account's
  // intake graph ("intake:<accountId>"). A save without a graph_id is
  // rejected naming the field; blank-graph rows are unrepresentable.
  optional string graph_id = 8;

  // Crawl run identifier (optional). Lets all documents from one crawl run
  // be listed/filtered together.
  optional string crawl_id = 9;

  // Bypass the SHA-256 intake dedupe and write the body even when the
  // existing row for the same logical document carries an identical
  // checksum. A forced write sends the SHA-256 checksum trailer on the
  // object-store PUT so the store verifies the landed bytes and fails
  // loudly on mismatch. Default false: a checksum match skips the PUT,
  // marks the row re-processed, and returns deduplicated=true.
  bool force_save = 10;

  // Partial save. Empty = FULL-DOC save: every part is written from the
  // supplied document. Non-empty = write ONLY these parts from the supplied
  // document; parts NOT listed are carried forward from
  // copy_unwritten_parts_from via server-side copy (their bytes never
  // transit the service).
  repeated DocumentPart parts_written = 11;

  // Source address for the parts NOT in parts_written. Required when
  // parts_written is non-empty and the destination address differs from the
  // consumed hop's address. A partial save whose copy source is gone fails
  // FAILED_PRECONDITION.
  optional DocumentReference copy_unwritten_parts_from = 12;

  // CHUNKS refinement: the chunk-set sub_keys this save writes. Empty while
  // parts_written contains CHUNKS = replace ALL chunk sets from the supplied
  // document. Non-empty = write these sub-objects from the supplied document
  // and copy-forward the sibling chunk sets like unwritten parts.
  repeated string chunk_sets_written = 13;

  // Source-blob policy stamp (intake saves only): when true, the stored row
  // is marked so a terminal-successful processing fold triggers the
  // source-blob purge (delete raw blob + tombstone the BLOBS part).
  bool delete_source_blobs_on_settle = 14;
  // Provenance reason recorded on the eventual tombstone:
  // "POST_PARSE_POLICY" (storage hygiene) or "RTBF". Empty = default policy.
  string source_blob_delete_reason = 15;

  // Provenance of the parts THIS save writes. Stamped onto the manifest
  // entries this save writes; parts carried forward keep their source stamp.
  // Absent = unknown; intake saves attribute via connector_id instead.
  WriteProvenance written_by = 16;
}

// Response containing details about the saved Document and its location.
message SaveDocumentResponse {
  // Unique repository node ID assigned to the saved Document.
  string node_id = 1;
  // Drive identifier where the document was stored.
  string drive = 2;
  // Storage key prefix of the document's part objects.
  string storage_prefix = 3;
  // Size of the saved document in bytes (sum of written part objects).
  int64 size_bytes = 4;
  // Root checksum (Merkle-style) of the stored document state.
  string checksum = 5;
  // When the document was saved (milliseconds since epoch).
  int64 created_at_epoch_ms = 6;
  // True when the save was elided by the SHA-256 intake dedupe.
  bool deduplicated = 7;
}

// Request to retrieve a Document by its node ID.
message GetDocumentRequest {
  // Unique repository node ID of the Document to retrieve.
  string node_id = 1;
  // Partial read. Empty = ALL parts — full-document assembly. Non-empty =
  // assemble only these parts; absent parts are simply unset fields on the
  // returned Document, and the response manifest says why.
  repeated DocumentPart parts = 2;
  // CHUNKS refinement: assemble only these chunk-set sub_keys. Empty = all.
  repeated string chunk_sets = 3;
}

// Request to retrieve a Document using a DocumentReference — the preferred
// method when documents are referenced via logical identifiers.
message GetDocumentByReferenceRequest {
  DocumentReference document_ref = 1;
  // Partial read; same semantics as GetDocumentRequest.parts.
  repeated DocumentPart parts = 2;
  // CHUNKS refinement; same semantics as GetDocumentRequest.chunk_sets.
  repeated string chunk_sets = 3;
}

// Response containing the retrieved Document and associated metadata.
message GetDocumentResponse {
  // The retrieved Document, assembled from the requested parts only.
  Document document = 1;
  // Repository node ID of the retrieved document.
  string node_id = 2;
  // Drive identifier where this document is stored.
  string drive = 3;
  // Size of the assembled document in bytes.
  int64 size_bytes = 4;
  // When the document was retrieved (milliseconds since epoch).
  int64 retrieved_at_epoch_ms = 5;
  // Part manifest for this stored state: every part's location, hash, size
  // and lifecycle state — including parts NOT requested on this read.
  DocumentManifest manifest = 6;
}

// Request to inspect a document's part manifest without fetching part bytes.
message GetDocumentManifestRequest {
  // Coordinate — exactly one must be set.
  oneof coordinate {
    // Unique repository node ID.
    string node_id = 1;
    // Logical reference (doc_id + graph_address_id + account_id + graph_id).
    DocumentReference document_ref = 2;
  }
}

// Response carrying only the manifest.
message GetDocumentManifestResponse {
  DocumentManifest manifest = 1;
  // Drive identifier where this document is stored.
  string drive = 2;
}

// Logical delete for one document identity: all rows for
// (account, datasource, doc_id).
message DeleteLogicalDocumentCommand {
  string doc_id = 1;
  string account_id = 2;
  string datasource_id = 3;
}

// Delete a single hop's staged row (doc_id + graph_address_id + account_id +
// graph_id). Used to reclaim inter-step claim-check bodies.
message DeleteDocumentByReferenceCommand {
  DocumentReference document_ref = 1;
}

// Per repository node affected by a delete.
message RemovedDocumentNode {
  string node_id = 1;
  optional string detail = 2;
}

// Result of a completed DeleteDocument RPC (use gRPC status for errors).
enum DeleteDocumentOutcome {
  DELETE_DOCUMENT_OUTCOME_UNSPECIFIED = 0;
  // At least one document row removed.
  DELETE_DOCUMENT_OUTCOME_REMOVED = 1;
  // Idempotent: no matching rows (no work performed).
  DELETE_DOCUMENT_OUTCOME_NOTHING_TO_REMOVE = 2;
}

message DeleteDocumentRequest {
  oneof command {
    DeleteLogicalDocumentCommand logical_document = 1;
    DeleteDocumentByReferenceCommand by_reference = 2;
  }
  // When true, the underlying storage objects are deleted immediately;
  // when false, metadata-only delete (rows tombstoned for async purge).
  bool purge_storage = 10;
  // When false (default), response includes removed_nodes.
  bool omit_removed_nodes = 11;
}

message DeleteDocumentResponse {
  DeleteDocumentOutcome outcome = 1;
  int32 documents_removed = 2;
  repeated RemovedDocumentNode removed_nodes = 3;
  string message = 4;
}

// Request to list Documents with optional filtering and pagination.
message ListDocumentsRequest {
  // Drive identifier to list documents from.
  string drive = 1;
  // Optional connector ID filter.
  string connector_id = 2;
  // Maximum number of results to return (default 100).
  int32 limit = 3;
  // Continuation token from a previous response.
  string continuation_token = 4;
  // Optional crawl run id filter.
  string crawl_id = 5;
  // Optional account filter (tenant scope).
  string account_id = 6;
}

// Lightweight metadata about a saved Document without loading the content.
message DocumentMetadata {
  string node_id = 1;
  string doc_id = 2;
  string drive = 3;
  string connector_id = 4;
  int64 size_bytes = 5;
  int64 created_at_epoch_ms = 6;
  map<string, string> metadata = 7;
  string title = 8;
  string document_type = 9;
  string crawl_id = 10;
}

// Response containing a paginated list of Document metadata entries.
message ListDocumentsResponse {
  repeated DocumentMetadata documents = 1;
  string next_continuation_token = 2;
  int32 total_count = 3;
}

// Request to store raw blob bytes on a drive's backing store.
message PutBlobRequest {
  // Drive whose backing store receives the object (resolves server-side to
  // its bucket, like GetBlob).
  string drive_name = 1;
  // Object key within the drive's backing store. Blank = the server
  // generates "<drive.prefix>/blobs/<uuidv5 of the content sha256>", so
  // identical puts land idempotently on the same object.
  string object_key = 2;
  // The blob bytes. Unary RPC: the payload transits the service in memory —
  // bulk uploads belong on the streaming HTTP upload route instead.
  bytes data = 3;
  // MIME type stored with the object (default application/octet-stream).
  string mime_type = 4;
}

// Response carrying the stored blob's coordinates and integrity proof.
message PutBlobResponse {
  // Where the object landed.
  ai.pipestream.proto.repo.v1.FileStorageReference storage_ref = 1;
  // Size of the stored object in bytes.
  int64 size_bytes = 2;
  // Lowercase hex SHA-256 of the content, computed server-side. The write
  // carries this as the store's checksum trailer, so the store verifies the
  // landed bytes and the returned value is what actually persisted.
  string sha256 = 3;
}

// Request to delete a raw blob by its coordinates. Idempotent.
message DeleteBlobRequest {
  ai.pipestream.proto.repo.v1.FileStorageReference storage_ref = 1;
}

// Result of a DeleteBlob RPC (absence is not an error).
message DeleteBlobResponse {
  // False when the object did not exist (idempotent re-delete).
  bool deleted = 1;
}

// Request to retrieve raw blob content using a FileStorageReference.
message GetBlobRequest {
  FileStorageReference storage_ref = 1;
}

// Response containing the blob binary content.
message GetBlobResponse {
  bytes data = 1;
  int64 size_bytes = 2;
  optional string mime_type = 3;
  int64 retrieved_at_epoch_ms = 4;
}

// The claim-check document store: part-decomposed storage, ledger, and
// lifecycle. Payload bytes live only in object storage; the database holds
// the manifest (locations, hashes, sizes, states).
service DocumentService {
  // Persist a Document with metadata. Supports full and partial saves.
  rpc SaveDocument(SaveDocumentRequest) returns (SaveDocumentResponse);

  // Retrieve a Document by its unique node ID (full or partial assembly).
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

  // Retrieve a Document using a DocumentReference (logical identifiers).
  rpc GetDocumentByReference(GetDocumentByReferenceRequest) returns (GetDocumentResponse);

  // Delete by command. Logical document: all rows for the identity.
  // By reference: a single hop's staged row. Idempotent.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // List Documents with optional filtering. Lightweight metadata only.
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);

  // Retrieve raw blob content using a FileStorageReference.
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);

  // Store raw blob bytes on a drive's backing store; verified write with a
  // server-computed SHA-256. Blank object_key = content-addressed key, so
  // identical puts are idempotent.
  rpc PutBlob(PutBlobRequest) returns (PutBlobResponse);

  // Delete a raw blob by its coordinates. Idempotent: deleting an absent
  // object succeeds with deleted=false.
  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse);

  // Inspect a document's part manifest without fetching any part bytes.
  rpc GetDocumentManifest(GetDocumentManifestRequest) returns (GetDocumentManifestResponse);
}
