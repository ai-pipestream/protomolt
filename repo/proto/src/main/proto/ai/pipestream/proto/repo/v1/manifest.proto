syntax = "proto3";

package ai.pipestream.proto.repo.v1;

import "ai/pipestream/proto/repo/v1/address.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.repo.v1";

// ============================================================================
// FOUR-PART ADDRESSABLE DOCUMENT — part enum, states, and the part manifest.
//
// A stored Document is split into four independently addressable parts on
// clean proto boundaries; CHUNKS is further sub-keyed per chunk set. The
// manifest is the machine-readable map of every piece: it carries the stored
// state's canonical NodeAddress, and locations, hashes, sizes and lifecycle
// states live in the database; payload bytes live only in object storage. The part boundaries themselves are descriptor-driven
// (a PartLayout over the message descriptor), so any message type can be
// decomposed the same way.
// ============================================================================

// The four addressable sections of a stored Document.
enum DocumentPart {
  // Unset; never a stored part selector.
  DOCUMENT_PART_UNSPECIFIED = 0;
  // Identity + search_metadata (minus semantic_results) + structured_data
  // + ownership + doc_id_derivation. Read by nearly every step.
  DOCUMENT_PART_CORE = 1;
  // blob_bag — raw binary content. Write-once at intake; read only by
  // parsers; tombstoned post-parse under the source-blob policy.
  DOCUMENT_PART_BLOBS = 2;
  // search_metadata.semantic_results — chunk texts, embeddings, analytics.
  // Sub-keyed per chunk set (see PartManifestEntry.sub_key).
  DOCUMENT_PART_CHUNKS = 3;
  // parser_results — append-only parser exhaust.
  DOCUMENT_PART_PARSED = 4;
}

// Lifecycle state of one part object.
enum PartState {
  // Unset; never a stored lifecycle state.
  PART_STATE_UNSPECIFIED = 0;
  // Object exists and is readable.
  PART_STATE_PRESENT = 1;
  // Part had no content when written — no object exists.
  PART_STATE_EMPTY = 2;
  // Deliberately deleted; hash/size retained as provenance.
  PART_STATE_DELETED = 3;
}

// Provenance of one write of a part's bytes: which module produced them, at
// which pipeline node, in which graph and pinned version. Stamped by the
// repository onto the manifest entries a save writes; carried-forward parts
// keep their original stamp. Absent or blank = unknown — the platform never
// invents an attribution.
message WriteProvenance {
  // Module that produced the bytes (e.g. "parser", "chunker").
  string module_id = 1;
  // The producing hop (the routing edge's source node), NOT the destination
  // stage address the copy is stored under.
  string node_id = 2;
  // The graph that owned the producing node (joins the execution trace).
  string graph_id = 3;
  // The pinned graph version the producing hop executed under.
  int64 graph_version = 4;
}

// One entry per stored part object. CHUNKS may contribute multiple entries,
// one per sub_key; all other parts are single-entry.
message PartManifestEntry {
  // Which of the four parts this entry describes.
  DocumentPart part = 1;
  // Lifecycle state of the part object.
  PartState state = 2;
  // Size of the part object in bytes (retained after deletion).
  int64 size_bytes = 3;
  // SHA-256 of the part object bytes (retained after deletion).
  string sha256 = 4;
  // When this part was last written.
  google.protobuf.Timestamp updated_at = 5;
  // Repository-internal storage object key.
  string object_key = 6;
  // Set only when state == PART_STATE_DELETED: "POST_PARSE_POLICY" | "RTBF".
  string deleted_reason = 7;
  // CHUNKS only: the chunk-set identity (SemanticProcessingResult lineage,
  // e.g. the result_id / chunker-config name). Empty for single-object parts.
  string sub_key = 8;
  // Provenance of the last write of this part's bytes. Self-contained so a
  // manifest read joins the execution trace without a graph lookup.
  WriteProvenance written_by = 9;
}

// The machine-readable map of one stored document state: which parts exist,
// where they live, what they hash to, and what happened to them.
message DocumentManifest {
  // The storage identity of the stored state this manifest describes (the
  // four logical segments of the canonical NodeAddress).
  NodeAddress address = 1;
  // Single per-address version, bumped on ANY part write at this address.
  int64 doc_version = 2;
  // One entry per part object, in assembly order (CHUNKS sub-objects keep
  // their original semantic_results ordering via this list's order).
  repeated PartManifestEntry parts = 3;
}
