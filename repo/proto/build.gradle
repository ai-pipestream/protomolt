plugins {
    alias(libs.plugins.protobuf)
}

description = 'The claim-check document store contract: Document, manifest, and the document/drive gRPC services'

dependencies {
    api libs.protobuf.java
    api libs.protobuf.java.util
    api libs.grpc.api
    api libs.grpc.stub
    api libs.grpc.protobuf
    // The purge-command contract dogfoods the house validate.v1 rules (the
    // protomolt serde enforces them on write).
    api project(':protomolt-protobuf-validation')
    // The archive stores asset classifications and content profiles.
    api project(':protomolt-asset-proto')
    // SearchMetadata.body declares the screened sensitivity class.
    api project(':protomolt-protobuf-metadata')

    // Contract fixtures exercise validate.v1 on generated and dynamic messages and
    // verify the OpenAPI-facing JSON Schema projection.
    testImplementation project(':protomolt-http-jsonschema')
    testImplementation libs.jackson.databind

    // grpc-java's generated stubs annotate with @javax.annotation.Generated.
    compileOnly libs.javax.annotation.api
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all().configureEach {
            plugins {
                grpc {}
            }
        }
    }
}

// Producer identity travels with the generated descriptors, independent of the
// protobuf runtime selected by a consuming application.
def descriptorCompilerVersion = libs.versions.protobuf.asProvider()
def compilerIdentityDirectory = layout.buildDirectory.dir('generated/compiler-identity')
def generateCompilerIdentity = tasks.register('generateCompilerIdentity') {
    inputs.property('compilerVersion', descriptorCompilerVersion)
    outputs.dir(compilerIdentityDirectory)
    doLast {
        def target = compilerIdentityDirectory.get().file('META-INF/protomolt/repo-proto/compiler.properties').asFile
        target.parentFile.mkdirs()
        target.text = "compiler.name=com.google.protobuf:protoc\ncompiler.version=${descriptorCompilerVersion.get()}\n"
    }
}
tasks.named('processResources') {
    from(compilerIdentityDirectory)
    dependsOn(generateCompilerIdentity)
}
