plugins {
    id 'application'
}

description = 'The repository fixture corpus beyond the document store: the archive loader and the dev corpus seeder that writes the corpus into a running repository host'

dependencies {
    // The corpus builder and the document loader live with the v2 accession fixtures.
    implementation(testFixtures(project(':protomolt-repo-accession'))) {
        // The seeder writes into a running host; it starts no containers.
        exclude group: 'org.testcontainers'
    }
    implementation project(':protomolt-repo-accession')
    implementation project(':protomolt-repo-admission')
    implementation project(':protomolt-repo-catalog')
    implementation project(':protomolt-repo-proto')
    implementation project(':protomolt-repo-spi')
    implementation project(':protomolt-repo-service')
    implementation libs.slf4j.api

    runtimeOnly libs.slf4j.simple

    testImplementation project(':protomolt-repo-container')
    testImplementation project(':protomolt-repo-engine')
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.junit.jupiter
    testRuntimeOnly libs.slf4j.simple
}

application {
    mainClass = 'ai.protomolt.proto.repo.fixtures.CorpusSeederMain'
}

// The console browser leg boots the seeded host with Keycloak sign-in and runs the
// Playwright specs in apps/console against it. It needs the console built there
// first (npm ci && npm run build; Gradle never runs npm) and Playwright's Chromium.
optInSuite('**/ConsoleBrowserIT*', ['PROTOMOLT_CONSOLE_BROWSER_IT=1'])
tasks.named('integrationTest') {
    systemProperty 'protomolt.console.dir', "${rootDir}/apps/console"
    // The specs and the built bundle are inputs, so a changed spec or console reruns the suite
    // instead of coming back from the build cache.
    def console = "${rootDir}/apps/console"
    inputs.files(fileTree("${console}/e2e") { exclude '.auth/**' }, fileTree("${console}/dist"),
            "${console}/playwright.config.ts", "${console}/package-lock.json")
            .withPropertyName('consoleBrowserLeg').withPathSensitivity(PathSensitivity.RELATIVE)
}
