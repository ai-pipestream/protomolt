description = 'The claim-check document store as a gRPC service set: embeddable in-JVM over the in-process transport or standalone over Netty, no framework'

dependencies {
    implementation project(':protomolt-repo-proto')
    implementation project(':protomolt-repo-container')
    implementation libs.grpc.netty.shaded
    implementation libs.grpc.services
    implementation libs.grpc.inprocess
    // S3 client construction lives here (UrlConnectionHttpClient is only an
    // `implementation` dep of repo-container, so it is not exposed).
    implementation libs.awssdk.url.connection.client
    // The HTTP upload route's JSON receipts/errors (Jackson is the repo-wide
    // JSON library; see libs.versions.toml).
    implementation libs.jackson.databind
    implementation libs.slf4j.api
    // Kafka eventing: the event relay's producer type is part of the wiring
    // here (the serde itself stays behind repo-container's EventRelay).
    implementation libs.kafka.clients

    runtimeOnly libs.slf4j.simple

    testImplementation project(':protomolt-serde')
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.redpanda
    testImplementation libs.testcontainers.junit.jupiter
}
