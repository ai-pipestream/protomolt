plugins {
    id 'application'
}

description = 'The claim-check document store as a gRPC service set: embeddable in-JVM over the in-process transport or standalone over Netty, no framework'

dependencies {
    implementation project(':protomolt-repo-engine')
    // Public composition signatures expose the repository port and
    // trusted Caller/CallerResolver bindings to embedding hosts.
    api project(':protomolt-repo-spi')
    api project(':protomolt-repo-admission')
    api project(':protomolt-authz')
    // RepoServices.withConceptSchemes takes the host's mounted concept schemes,
    // which decide bound tags at save and expand concept filters at query.
    api project(':protomolt-config')
    implementation project(':protomolt-repo-blob-s3')
    implementation project(':protomolt-repo-blob-redis')
    implementation project(':protomolt-repo-blob-cache')
    implementation project(':protomolt-schema-registry-git')
    api project(':protomolt-composer')
    implementation project(':protomolt-repo-proto')
    implementation project(':protomolt-authz-grpc')
    implementation project(':protomolt-repo-container')
    // RepositoryNamespaces namespacing for the v2 drive-stack key layout.
    implementation project(':protomolt-repo-codec')
    // The archive request validators mirror the contract's validate.v1
    // annotations onto the house format parsers.
    implementation project(':protomolt-formats')
    // Classification: the asset family's identification seam and state
    // machine behind the archive's doors.
    implementation project(':protomolt-asset-characterize')
    // Bridging: the routing rule and the transformations this host runs
    // itself. On the api surface because a composed host supplies its own
    // BridgeEngine to RepoServices.build.
    api project(':protomolt-asset-bridge')
    // The catalog projection is exercised against a real archive.
    testImplementation project(':protomolt-asset-catalog')
    implementation libs.grpc.netty.shaded
    implementation libs.grpc.services
    implementation libs.grpc.inprocess
    // The service assembly owns S3 client construction.
    implementation libs.awssdk.url.connection.client
    // The HTTP upload route's JSON receipts/errors (Jackson is the repo-wide
    // JSON library; see libs.versions.toml).
    implementation libs.jackson.databind
    // A co-mounted registry gets the bridge-entry workflow envelope; a node
    // without one still serves the RPCs the workflow calls.
    implementation project(':protomolt-registry')
    implementation libs.slf4j.api
    // Kafka eventing: the v2 outbox publisher configures its producer and serde itself.
    implementation libs.kafka.clients
    implementation project(':protomolt-kafka-serde')
    // Parts-based v2 accession: the outbox relay's publisher port and the
    // streaming HTTP upload handler this host mounts.
    implementation project(':protomolt-repo-accession')
    // Archive over v2 documents: the streaming HTTP archive upload route.
    api project(':protomolt-repo-archive')
    // The console's Connect calls on the repository HTTP port.
    api project(':protomolt-http-connect')
    // Descriptor closures/fingerprints for module-contributed admission schemas.
    implementation project(':protomolt-descriptors')

    runtimeOnly libs.slf4j.simple

    // The console sign-in tests drive a fake OpenID provider before the Keycloak one.
    testImplementation testFixtures(project(':protomolt-authz'))
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.redpanda
    testImplementation libs.testcontainers.junit.jupiter

    // The bridge-entry envelope is parsed and verified against the real
    // descriptors rather than string-matched.
    testImplementation project(':protomolt-workflow')
    testImplementation libs.hikari
}

application {
    mainClass = 'ai.protomolt.proto.repo.service.RepoServiceMain'
}

// The console bundle is copied into the distribution under console/ when apps/console/dist
// was built first (npm ci && npm run build in apps/console; Gradle never runs npm).
// The repo HTTP port serves it once DOCUMENT_PLATFORM_CONSOLE_DIR names that
// directory, and a directory without index.html fails the boot.
distributions {
    main {
        contents {
            from("${rootDir}/apps/console/dist") {
                into 'console'
            }
        }
    }
}

// The process-host suites are integration suites (*IT), so their
// settings belong to the integrationTest task.
tasks.named('integrationTest') {
    // Separate-JVM host tests need the complete test runtime, not Gradle's worker bootstrap classpath.
    doFirst { systemProperty 'protomolt.test.runtimeClasspath', sourceSets.test.runtimeClasspath.asPath }
}

tasks.register('checkRuntimeBoundaries') {
    group = 'verification'
    description = 'Reject retired ledger archive types in protomolt-repo-service sources'
    def mainSources = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(mainSources)
    doLast {
        def forbidden = ['ArchiveLedger', 'PostgresArchiveLedger', 'ArchiveOperations', 'ArchiveMutationOperations']
        def violations = []
        mainSources.files.sort().each { file ->
            def text = file.getText('UTF-8')
            forbidden.each { symbol ->
                if (text.contains(symbol)) {
                    violations << "${projectDir.toPath().relativize(file.toPath())}: references retired ${symbol}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(project.name + ' references retired ledger archive symbols:\n  ' + violations.join('\n  '))
        }
    }
}

tasks.named('check') { dependsOn tasks.named('checkRuntimeBoundaries') }
tasks.named('test') { dependsOn tasks.named('checkRuntimeBoundaries') }

// The release evaluation: the production entry point (RepoServiceMain) booted
// in a child JVM from environment variables against Postgres, RustFS (the
// deployment's object store, not LocalStack) and a Kafka-API broker, then one
// document and one archive entry followed through their whole life over the
// wire, the Kafka events read back off the topic, and a SIGTERM restart. It is
// its own source set and task, reachable only by name: test, integrationTest,
// check and build never run it, so a release job adds it as one extra line.
sourceSets {
    eval {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    evalImplementation.extendsFrom implementation
    evalRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    evalImplementation platform(libs.junit.bom)
    evalImplementation libs.junit.jupiter
    evalImplementation libs.assertj.core
    evalRuntimeOnly libs.junit.platform.launcher
    evalImplementation libs.testcontainers.postgresql
    evalImplementation libs.testcontainers.redpanda
    evalImplementation libs.testcontainers.junit.jupiter
    // The event key and the archive entry's node address are computed, not guessed.
    evalImplementation project(':protomolt-repo-catalog')
    // Objects are checked in the store itself, with the same SDK the service uses.
    evalImplementation platform(libs.awssdk.bom)
    evalImplementation libs.awssdk.s3
    evalImplementation libs.awssdk.url.connection.client
}
tasks.register('repoEval', Test) {
    group = 'verification'
    description = 'Release evaluation of the production repo host over Postgres, RustFS and Kafka (opt-in, never part of check or build)'
    testClassesDirs = sourceSets.eval.output.classesDirs
    classpath = sourceSets.eval.runtimeClasspath
    // One ordered walk through the host; the steps build on each other.
    maxParallelForks = 1
    // An evaluation is a fresh run every time it is asked for.
    outputs.upToDateWhen { false }
    // The child JVM needs the complete runtime, not Gradle's worker bootstrap classpath.
    doFirst { systemProperty 'protomolt.eval.runtimeClasspath', sourceSets.eval.runtimeClasspath.asPath }
}
