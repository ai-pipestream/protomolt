plugins {
    id 'application'
}

description = 'The claim-check document store as a gRPC service set: embeddable in-JVM over the in-process transport or standalone over Netty, no framework'

dependencies {
    implementation project(':protomolt-repo-engine')
    // Public composition signatures expose the repository port and
    // trusted Caller/CallerResolver bindings to embedding hosts.
    api project(':protomolt-repo-spi')
    api project(':protomolt-repo-admission')
    api project(':protomolt-authz')
    implementation project(':protomolt-repo-blob-s3')
    implementation project(':protomolt-repo-blob-redis')
    implementation project(':protomolt-repo-blob-cache')
    implementation project(':protomolt-schema-registry-git')
    api project(':protomolt-composer')
    implementation project(':protomolt-repo-proto')
    implementation project(':protomolt-authz-grpc')
    implementation project(':protomolt-repo-container')
    // RepositoryNamespaces namespacing for the v2 drive-stack key layout.
    implementation project(':protomolt-repo-codec')
    // The archive request validators mirror the contract's validate.v1
    // annotations onto the house format parsers.
    implementation project(':protomolt-formats')
    // Classification: the asset family's identification seam and state
    // machine behind the archive's doors.
    implementation project(':protomolt-asset-characterize')
    // Bridging: the routing rule and the transformations this host runs
    // itself. On the api surface because a composed host supplies its own
    // BridgeEngine to RepoServices.build.
    api project(':protomolt-asset-bridge')
    // The catalog projection is exercised against a real archive.
    testImplementation project(':protomolt-asset-catalog')
    implementation libs.grpc.netty.shaded
    implementation libs.grpc.services
    implementation libs.grpc.inprocess
    // The service assembly owns S3 client construction.
    implementation libs.awssdk.url.connection.client
    // The HTTP upload route's JSON receipts/errors (Jackson is the repo-wide
    // JSON library; see libs.versions.toml).
    implementation libs.jackson.databind
    // A co-mounted registry gets the bridge-entry workflow envelope; a node
    // without one still serves the RPCs the workflow calls.
    implementation project(':protomolt-registry')
    implementation libs.slf4j.api
    // Kafka eventing: the v2 outbox publisher configures its producer and serde itself.
    implementation libs.kafka.clients
    implementation project(':protomolt-kafka-serde')
    // Parts-based v2 accession: the outbox relay's publisher port and the
    // streaming HTTP upload handler this host mounts.
    implementation project(':protomolt-repo-accession')
    // Descriptor closures/fingerprints for module-contributed admission schemas.
    implementation project(':protomolt-descriptors')

    runtimeOnly libs.slf4j.simple

    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.redpanda
    testImplementation libs.testcontainers.junit.jupiter

    // The bridge-entry envelope is parsed and verified against the real
    // descriptors rather than string-matched.
    testImplementation project(':protomolt-workflow')
    testImplementation libs.hikari
}

application {
    mainClass = 'ai.protomolt.proto.repo.service.RepoServiceMain'
}

tasks.named('test') {
    // Separate-JVM host tests need the complete test runtime, not Gradle's worker bootstrap classpath.
    doFirst { systemProperty 'protomolt.test.runtimeClasspath', sourceSets.test.runtimeClasspath.asPath }
    def replicaBenchmark = providers.environmentVariable('PROTOMOLT_REPLICA_BENCHMARK').map { it == 'true' }.orElse(false)
    def archiveReadBenchmark = providers.environmentVariable('PROTOMOLT_ARCHIVE_READ_BENCHMARK').map { it == 'true' }.orElse(false)
    inputs.property('replicaBenchmark', replicaBenchmark)
    inputs.property('archiveReadBenchmark', archiveReadBenchmark)
    doFirst {
        // Benchmark classes must not compete with each other in separate test forks.
        if (replicaBenchmark.get() || archiveReadBenchmark.get()) maxParallelForks = 1
    }
    outputs.upToDateWhen { !replicaBenchmark.get() && !archiveReadBenchmark.get() }
    outputs.cacheIf { !replicaBenchmark.get() && !archiveReadBenchmark.get() }
}

// Opt-in suites (root build.gradle optInSuite): left out of the plain test task unless their environment is set.
optInSuite('**/ArchiveReadBenchmarkIT*', ['PROTOMOLT_ARCHIVE_READ_BENCHMARK=true'])
optInSuite('**/RepositoryScaleBenchmarkIT*', ['PROTOMOLT_REPLICA_BENCHMARK=true'])
