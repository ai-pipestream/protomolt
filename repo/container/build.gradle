    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'ai.protomolt.proto.repo.container.ledger.HistoricalRuntimeQualificationTest' }
    inputs.dir(transportAdmissionInventory)
    inputs.files(configurations.assessmentTransportRuntime)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doFirst {
        systemProperty 'protomolt.test.admissionRuntimeBundle', transportAdmissionInventory.get().asFile.absolutePath
        systemProperty 'protomolt.test.storageHostClasspath', files(tasks.named('jar').get().archiveFile,
                configurations.assessmentTransportRuntime).asPath
    }
    useJUnitPlatform()
}
