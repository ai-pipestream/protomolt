description = 'Claim-check part storage and Postgres ledger over the provider-neutral byte SPI'

dependencies {
    implementation project(':protomolt-repo-admission')
    testImplementation project(':protomolt-descriptors')
    api project(':protomolt-repo-codec')
    api project(':protomolt-repo-blob-spi')
    testImplementation project(':protomolt-repo-blob-s3')
    testImplementation project(':protomolt-repo-blob-redis')
    testImplementation project(':protomolt-repo-blob-cache')
    // Real SQL/provider integration of ledger-issued read plans with the shared reader.
    // This test-only edge does not add engine code to the container's published runtime.
    testImplementation project(':protomolt-repo-engine')
    api project(':protomolt-repo-proto')
    api project(':protomolt-repo-spi')
    api libs.protobuf.java
    testImplementation libs.awssdk.s3
    api libs.hibernate.core
    api libs.hikari
    testImplementation libs.jedis

    implementation libs.protobuf.java.util
    testImplementation libs.awssdk.url.connection.client
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql
    implementation libs.postgresql
    implementation libs.slf4j.api
    // Kafka eventing: the outbox relay publishes through the protomolt serde
    // (Confluent wire format over the packaged document_events.proto contract).
    implementation project(':protomolt-kafka-serde')
    implementation libs.kafka.clients

    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.redpanda
    testImplementation libs.testcontainers.junit.jupiter
    testRuntimeOnly libs.slf4j.simple
}

tasks.named('test') {
    def documentBenchmark = providers.environmentVariable('PROTOMOLT_DOCUMENT_BENCHMARK').map { it == 'true' }.orElse(false)
    inputs.property('documentBenchmark', documentBenchmark)
    // Timing evidence must execute, never come from an up-to-date or cached test result.
    outputs.upToDateWhen { !documentBenchmark.get() }
    outputs.cacheIf { !documentBenchmark.get() }
    doFirst {
        systemProperty 'protomolt.test.runtimeClasspath', sourceSets.test.runtimeClasspath.asPath
    }
}

// Qualify the resolved production admission bundle without ambient test dependencies.
// The ordinary test task excludes this fixture because it requires the generated bundle.
tasks.named('test') { exclude '**/DocumentAdmissionRuntimeTest*' }
def admissionInventory = project(':protomolt-repo-admission').layout.buildDirectory.dir('admission-runtime')
tasks.register('admissionRuntimeTest', Test) {
    group = 'verification'
    description = 'Run the admission validator in an isolated production bundle classloader'
    dependsOn ':protomolt-repo-admission:admissionRuntimeInventory'
    dependsOn tasks.named('jar')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'ai.protomolt.proto.repo.container.ledger.DocumentAdmissionRuntimeTest' }
    inputs.dir(admissionInventory)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    systemProperty 'protomolt.test.admissionRuntimeBundle', admissionInventory.get().asFile.absolutePath
    systemProperty 'protomolt.test.containerJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn tasks.named('admissionRuntimeTest') }
