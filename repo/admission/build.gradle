description = 'Schema binding and typed repository admission without storage or transport'

dependencies {
    api project(':protomolt-repo-proto')
    implementation project(':protomolt-descriptors')
    implementation project(':protomolt-protobuf-validation')
    implementation libs.protobuf.java.util
    testImplementation project(':protomolt-sources')
}

ext.forbiddenRuntimeModules = [
        'protomolt-repo-container', 'protomolt-repo-engine', 'protomolt-repo-service',
        'protomolt-sources', 'protomolt-schema-registry',
        's3', 'jedis', 'hibernate-core', 'HikariCP', 'postgresql',
        'flyway-core', 'kafka-clients', 'grpc-netty-shaded', 'grpc-inprocess'
]
apply from: rootProject.file('gradle/runtime-boundaries.gradle')
