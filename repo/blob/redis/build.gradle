plugins {
    id 'java-test-fixtures'
}

description = 'Redis byte storage adapter'
dependencies {
    api project(':protomolt-repo-blob-spi')
    implementation libs.jedis
    testImplementation project(':protomolt-repo-codec')
    testFixturesApi libs.testcontainers.junit.jupiter
    testFixturesImplementation libs.jedis
    testImplementation libs.testcontainers.junit.jupiter
    testRuntimeOnly libs.slf4j.simple
}
ext.forbiddenRuntimeModules = ['protomolt-repo-container', 's3', 'hibernate-core', 'HikariCP', 'postgresql', 'kafka-clients']
apply from: rootProject.file('gradle/runtime-boundaries.gradle')

// The bounded-heap transfer qualification forks a JVM smaller than its object.
// Supply the actual test runtime rather than relying on Gradle's worker bootstrap classpath.
tasks.named('integrationTest', Test) {
    doFirst {
        systemProperty 'protomolt.redis.transfer.classpath', sourceSets.test.runtimeClasspath.asPath
    }
}
