plugins {
    id 'application'
}

description = 'MCP server over the action catalog and registry: JSON-RPC 2.0 on stdio, no framework'

dependencies {
    api project(':protomolt-actions')
    api project(':protomolt-registry')
    api project(':protomolt-gather-git')
    api project(':protomolt-grpc-invoke')
    api project(':protomolt-grpc-service-workspace')
    api project(':protomolt-codegen')
    api project(':protomolt-chain')
    // DelegationResources exposes a live delegation bridge's workers, tasks, and
    // transcripts as bounded MCP resources.
    api project(':protomolt-delegation')

    implementation libs.slf4j.api
    // The stdio launcher needs a real backend: SimpleLogger writes to stderr,
    // keeping stdout clean for protocol traffic.
    runtimeOnly libs.slf4j.simple

    testImplementation libs.grpc.services
}

application {
    mainClass = 'ai.pipestream.proto.mcp.McpMain'
}
