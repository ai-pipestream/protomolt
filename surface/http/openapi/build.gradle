plugins {
    alias(libs.plugins.protobuf)
}

description = 'OpenAPI 3.x generation from protobuf service descriptors'

dependencies {
    api project(':protomolt-http-rest')
    api libs.jackson.databind
    implementation project(':protomolt-http-jsonschema')

    testImplementation project(':protomolt-protobuf-validation')
    testImplementation libs.protobuf.java.util
    testImplementation 'com.networknt:json-schema-validator:3.0.7'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
}
