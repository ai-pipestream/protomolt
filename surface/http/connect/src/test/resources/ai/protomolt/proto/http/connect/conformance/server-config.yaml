# What the gateway supports, as the Connect conformance runner reads it: the Connect protocol
# over HTTP/1.1, binary protobuf only, no compression, unary and server-streaming calls.
features:
  versions:
    - HTTP_VERSION_1
  protocols:
    - PROTOCOL_CONNECT
  codecs:
    - CODEC_PROTO
  compressions:
    - COMPRESSION_IDENTITY
  stream_types:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_SERVER_STREAM
  supports_h2c: false
  supports_tls: false
  supports_tls_client_certs: false
  supports_trailers: false
  supports_half_duplex_bidi_over_http1: false
  supports_connect_get: false
  supports_message_receive_limit: false
