  // earlier ones at join time. 'message' is unused here. Merging fewer than
  // two schemas has no merge to perform.
  repeated ShapeSource sources = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 2, max_items: 64}
    }
  ];
  // Keyed by clashing field name.
  map<string, MergeResolution> resolutions = 3;
  // Return only the clash report, even when the merge is clean.
  bool report_only = 4;
}

// One source's contribution to a clashing field name.
message ClashOrigin {
  // The name of the source contributing this field.
  string source = 1;
  // Proto keyword or full type name, 'repeated '-prefixed when repeated.
  string type = 2;
}

// One clashing field name, its origins, and the suggested resolution.
message MergeClash {
  // The clashing field name.
  string field = 1;
  // 'coalesced' (info: same type, merged into one field - the natural join
  // keys), 'type-clash', or 'cardinality-clash'.
  string kind = 2;
  // Each source's contribution to the clash.
  repeated ClashOrigin origins = 3;
  // The resolution merge-schemas suggests; the caller may override it in
  // MergeSchemasRequest.resolutions.
  MergeResolution suggested = 4;
}

// The clash report and, once resolved, the merged type with its mapping
// rules.
message MergeSchemasResponse {
  // False while hard clashes await resolutions (or report_only was set);
  // the emission fields below are present only when true.
  bool resolved = 1;
  // The clash report: one entry per clashing field name.
  repeated MergeClash clashes = 2;
  // Fully qualified name of the merged message.
  string type = 3;
  // Import path of the merged file.
  string file = 4;
  // Registrable proto source; imports carry the sources' true paths.
  string proto_source = 5;
  // Self-contained, dependency-ordered descriptor set of the merged schema,
  // serialized and base64-encoded.
  string descriptor_set_base64 = 6;
  // The defined join: one ruleset reading every source at once.
  repeated string join_rules = 7;
  // The defined union: one ruleset per source, mapping it alone onto the
  // merged shape.
  map<string, MergeRuleList> union_rules = 8;
}

// A list of mapping rules; the value type of
// MergeSchemasResponse.union_rules.
message MergeRuleList {
  // The rules mapping one source alone onto the merged shape.
  repeated string rules = 1;
}

// The input of check-rules.
message CheckRulesRequest {
  // One source (in-place mode: unscoped paths, the name is the CEL variable)
  // or many (scoped mode). A 'message' on every source enables the dry run.
  repeated ShapeSource sources = 1;
  // The output type rules write to; required with multiple sources.
  JoinTarget target = 2;
  // Text mapping rules to check.
  repeated string rules = 3;
  // CEL rules to check.
  repeated CelRule cel_rules = 4;
  // Boolean CEL predicates.
  repeated string filters = 5;
}

// One problem found in a rule or filter.
message RuleFinding {
  // 'rule', 'celRule', or 'filter'.
  string kind = 1;
  // Position of the offending entry in its own list ('rules', 'cel_rules',
  // or 'filters').
  int32 index = 2;
  // The offending rule text (for CEL rules, the target label).
  string rule = 3;
  // Why the entry failed the check.
  string error = 4;
}

// The findings of check-rules, plus dry-run results when enabled.
message CheckRulesResponse {
  // True when every rule and filter passed the static checks.
  bool ok = 1;
  // One entry per problem; empty when 'ok' is true.
  repeated RuleFinding findings = 2;
  // Dry-run results, present when every source carried a sample message
  // and the static pass was clean.
  string type = 3;
  // The mapped output message of the dry run, as proto3 JSON.
  google.protobuf.Struct message = 4;
  // The dry-run verdict of each filter, in 'filters' order.
  repeated bool filter_results = 5;
  // A dynamic failure the static pass could not see (e.g. a Struct path).
  string dry_run_error = 6;
}

// One step of a workflow: a unary call whose request is mapped from the workflow
// scope ('input' plus every prior step's response, by step name).
message WorkflowStep {
  // The step name; later steps see this step's response under it.
  string name = 1;
  // gRPC target, e.g. 'host:9090'.
  string target = 2;
  // Use TLS; default plaintext.
  bool tls = 3;
  // 'package.Service/Method'; must be unary.
  string method = 4;
  // Boolean CEL gate; a false skips the step.
  string when = 5;
  // Scoped rules building the request message.
  repeated string rules = 6;
  // CEL rules applied after 'rules'.
  repeated CelRule cel_rules = 7;
  // Validate the response against its declared rules before proceeding.
  bool validate = 8;
  // Per-step deadline, bounded by what remains of the workflow's.
  int32 deadline_ms = 9;
  // How the step obtains its response: '' (the default) invokes 'method' on
  // 'target'; 'external' parks the job until complete-step supplies the
  // response — the human-in-the-loop lane. External steps are rejected by
  // synchronous run-workflow; they only execute as jobs.
  string completion = 10;
  // Structured-generation spec; when set the step fills 'structured.target_type'
  // with the named catalog model and must not declare target, method, or tls.
  StructuredStep structured = 11;
  // Typed edge feeding this step, replacing the top-level rules/celRules:
  // the named scope entries are mapped into 'produce_type', optionally
  // projected and validated, and the delivered value becomes the step's
  // request (or, on a structured step, the generation's grounding).
  WorkflowEdge edge = 12;
  // Optional bounded fan-out over a repeated message field produced by 'edge'.
  // Branch outputs are collected deterministically into 'fan_out.collect_into'.
  WorkflowFanOut fan_out = 13;
}

// A structured-generation step: fills one message type with a catalog model
// through the structured-output coordinator instead of invoking gRPC.
message StructuredStep {
  // Fully qualified message type the model fills.
  string target_type = 1;
  // Catalog model id; must declare the structured-output capability.
  string model = 2;
  // Attempt budget; 0 takes the coordinator default (3, hard-capped at 3).
  int32 max_attempts = 3;
}

// A typed inter-step edge: map the named scope entries ('input' or prior step
// names) into 'produce_type', optionally project the produced value to a
// projection-annotated consumer form, and validate it before the step runs.
message WorkflowEdge {
  // Scope entries the edge reads: 'input' or prior step names.
  repeated string sources = 1;
  // Fully qualified type the edge rules build.
  string produce_type = 2;
  // Scoped rules building the produced message.
  repeated string rules = 3;
  // CEL rules applied after 'rules'.
  repeated CelRule cel_rules = 4;
  // Fully qualified projection-annotated consumer type the produced message is
  // projected to before delivery; empty delivers the produced message itself.
  string project_to = 5;
  // Validate the delivered value against its declared rules before the step
  // runs; a rejection fails the step before any invocation.
  bool validate = 6;
}

// Bounded fan-out for one typed edge. The workflow verifier resolves every path
// and type, applies the item and concurrency bounds, and accepts only the
// FAIL_FAST or CONTINUE failure policies before execution.
message WorkflowFanOut {
  // Dotted path of the repeated message field whose elements become branches.
  string items = 1;
  // Maximum number of elements accepted; must be within the verifier's bound.
  int32 max_items = 2;
  // Maximum concurrently executing branches; must be within the verifier's bound.
  int32 max_concurrency = 3;
  // Branch failure policy: FAIL_FAST or CONTINUE.
  string failure_policy = 4;
  // Fully qualified message type receiving the collected branch outputs.
  string collect_type = 5;
  // Repeated field of 'collect_type' receiving outputs in branch-index order.
  string collect_into = 6;
}

// The workflow's output mapping; without it the last step's response returns.
message WorkflowOutput {
  // Fully qualified output message type.
  string type = 1;
  // Scoped text rules building the output message.
  repeated string rules = 2;
  // CEL rules applied after 'rules'.
  repeated CelRule cel_rules = 3;
}

// A workflow: an input type and serial steps whose requests are mapped from
// the workflow scope.
message CompiledWorkflow {
  // The workflow name.
  string name = 1;
  // Declares every step's service and message types (e.g. from reflect,
  // gather-git, or a registry descriptor set).
  SchemaSource schema = 2;
  // Fully qualified type of the workflow input.
  string input_type = 3;
  // Overall deadline; default 30000.
  int32 deadline_ms = 4;
  // The steps, executed in order.
  repeated WorkflowStep steps = 5;
  // Optional output mapping; without it the last step's response returns.
  WorkflowOutput output = 6;
}

// The input of run-workflow: an inline workflow or the name of a stored one.
message RunWorkflowRequest {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "run_workflow.one_definition"
      message: "name either an inline workflow or a stored workflowName, not both and not neither"
      expression: "has(this.workflow) != (this.workflow_name != '')"
    }
  };

  // The inline workflow definition to execute.
  CompiledWorkflow workflow = 1;
  // The workflow input, as proto3 JSON of the workflow's declared input type.
  google.protobuf.Struct input = 2 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // A stored workflow to run instead of an inline one, registered through the
  // registry's workflows endpoint.
  string workflow_name = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 256, path_safe_name: true}
    }
  ];
}

// The outcome of one workflow step.
message WorkflowStepResult {
  // The step name.
  string name = 1;
  // True when the step's 'when' gate evaluated false and the step did not
  // run.
  bool skipped = 2;
}

// The outcome of run-workflow.
message RunWorkflowResponse {
  // True when the workflow ran to completion and produced an output.
  bool ok = 1;
  // Fully qualified type of the output message.
  string output_type = 2;
  // The workflow output, as proto3 JSON of 'output_type'.
  google.protobuf.Struct output = 3;
  // Per-step outcomes, in execution order.
  repeated WorkflowStepResult steps = 4;
  // When ok=false: which step failed and why (gRPC status, gate error, or
  // validation violations).
  string failed_step = 5;
  // Why the workflow failed, when ok=false.
  string error = 6;
}

// The input of check-workflow.
message CheckWorkflowRequest {
  // The workflow definition to verify.
  CompiledWorkflow workflow = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      // The verb's answer is a report on this workflow, so holding the request
      // to the workflow's own rules would refuse exactly the definitions it
      // exists to explain. It reads the violations and reports them instead.
      inspect_only: true
    }
  ];
}

// One problem found while verifying a workflow.
message WorkflowFinding {
  // The step name, or '' for workflow-level findings.
  string step = 1;
  // 'method', 'when', 'rule', 'celRule', 'output', or 'workflow'.
  string kind = 2;
  // Why the element failed verification.
  string error = 3;
}

// The verdict of check-workflow.
message CheckWorkflowResponse {
  // True when the workflow verified clean.
  bool ok = 1;
  // One entry per problem; empty when 'ok' is true.
  repeated WorkflowFinding findings = 2;
}

// A checked workflow to compile into a workflow.
message CompileWorkflowRequest {
  // Descriptor-grounded workflow to check and compile.
  CompiledWorkflow workflow = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
}

// Deterministic workflow content and its SHA-256 identity.
message CompileWorkflowResponse {
  // Compiled Workflow rendered as protobuf JSON.
  google.protobuf.Struct workflow = 1;
  // Lowercase SHA-256 fingerprint of the compiled workflow bytes.
  string workflow_fingerprint = 2;
}

// Descriptor-grounded mapping suggestion input.
message SuggestMappingsRequest {
  // Named source message types available to mapping rules.
  repeated ShapeSource sources = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 64}
    }
  ];
  // Message type whose fields need source mappings.
  JoinTarget target = 2 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
}

// One proposed target=source.path mapping.
message MappingCandidate {
  // Target field path populated by this candidate.
  string target_path = 1;
  // Named source field path read by this candidate.
  string source_path = 2;
  // Workflow mapping rule in target=source.path form.
  string rule = 3;
  // Deterministic reason this candidate was proposed.
  string basis = 4;
}

// Ordered conservative mapping candidates.
message SuggestMappingsResponse {
  // Fully qualified target message type.
  string target_type = 1;
  // Statically verifiable candidates in deterministic rank order.
  repeated MappingCandidate candidates = 2;
}

// A live draft-workflow probe to record for offline replay.
message RecordWorkflowRunRequest {
  // Descriptor-grounded workflow to execute.
  CompiledWorkflow workflow = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Workflow input encoded as proto3 JSON.
  google.protobuf.Struct input = 2 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Client-selected run identity. The caller chooses it so a retry can name
  // the same run rather than recording a second one.
  string run_id = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, path_safe_name: true}
    }
  ];
  // Promoted workflow version, or empty for a draft probe.
  string workflow_version = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 256, path_safe_name: true}
    }
  ];
}

// The persisted run evidence; failed executions still return their evidence.
message RecordWorkflowRunResponse {
  // True when every workflow step and output mapping succeeded.
  bool ok = 1;
  // Step name that failed, when ok is false.
  string failed_step = 2;
  // Workflow execution failure category, when ok is false.
  string failure_kind = 3;
  // Persisted RunEvidence rendered as protobuf JSON.
  google.protobuf.Struct evidence = 4;
}

// Exact workflow, evidence identity, and descriptor set for offline replay.
message ReplayWorkflowRequest {
  // The compiled workflow, as recorded. This is the durable contract from
  // grpc_workflow.proto, not the authoring shape CompiledWorkflow in this file:
  // a run executes what the compiler produced, with its dependencies resolved
  // and its deadline a Duration.
  ai.pipestream.proto.grpc.workflow.v1.Workflow workflow = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Stored run-evidence identity to replay.
  string run_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, path_safe_name: true}
    }
  ];
  // The exact descriptor set the run used, which is what makes a replay a
  // comparison rather than a re-interpretation.
  SchemaSource schema = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
}

// One step's offline replay verdict.
message WorkflowStepReplay {
  // Workflow step whose evidence was checked.
  string step_name = 1;
  // RunEvidence StepStatus enum name.
  string recorded_status = 2;
  // True when the recorded step evidence matches the workflow and fixtures.
  bool ok = 3;
  // Bounded explanation of the replay verdict.
  string detail = 4;
}

// Whole-run offline replay verdict.
message ReplayWorkflowResponse {
  // True when the complete recorded run replays without drift.
  bool ok = 1;
  // Whole-run failure summary, or empty when replay succeeds.
  string failure = 2;
  // Ordered per-step replay verdicts.
  repeated WorkflowStepReplay steps = 3;
}

// Workflow content to promote under one immutable version.
message PromoteWorkflowRequest {
  // The compiled workflow, as recorded. This is the durable contract from
  // grpc_workflow.proto, not the authoring shape CompiledWorkflow in this file:
  // a run executes what the compiler produced, with its dependencies resolved
  // and its deadline a Duration.
  ai.pipestream.proto.grpc.workflow.v1.Workflow workflow = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // The version identity to publish under. Immutable once promoted, so a
  // second promotion under the same version is refused rather than replacing
  // what the first one published.
  string version = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, path_safe_name: true}
    }
  ];
}

// The immutable promotion envelope stored in the registry.
message PromoteWorkflowResponse {
  // True when the version is present with the requested content.
  bool promoted = 1;
  // Stored VersionedWorkflow rendered as protobuf JSON.
  google.protobuf.Struct versioned_workflow = 2;
}

// The stored run to project and the record identity to issue it under.
message ExportWorkRecordRequest {
  // Stored run-evidence identity to project.
  string run_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, path_safe_name: true}
    }
  ];
  // Record identity; derived as "record-<run_id>" when empty.
  string record_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 256, path_safe_name: true}
    }
  ];
  // Manifest digest of the record this one re-issues, or empty.
  string prior_manifest_sha256 = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {sha256_hex: true}
    }
  ];
  // Sensitivity classes removed from the evidence before projection; a
  // disclosure names these and disclose_of together.
  repeated string mask_classes = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {max_items: 64, items: {string: {min_len: 1, max_len: 128}}}
    }
  ];
  // Manifest digest of the record this disclosure projects, or empty.
  string disclose_of = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {sha256_hex: true}
    }
  ];
}

// The signed record and its identity.
message ExportWorkRecordResponse {
  // Serialized SignedWorkRecord, base64.
  string record_base64 = 1;
  // SHA-256 of the manifest bytes: the record's identity.
  string manifest_digest = 2;
  // The record identity the manifest carries.
  string record_id = 3;
  // Evidence paths the disclosure policy removed, when disclosing.
  repeated string masked_paths = 4;
}

// A signed record and the trust snapshot to verify it against.
message VerifyWorkRecordRequest {
  // The record to verify: a serialized SignedWorkRecord, base64. It stays
  // encoded rather than declared, because verification covers the exact bytes
  // that were signed and re-encoding a parsed message would not reproduce
  // them.
  string record_base64 = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, base64: true}
    }
  ];
  // The trust snapshot to verify signatures against. Not required here,
  // because a node may pin one through PROTOMOLT_TRUST_SNAPSHOT; the verb
  // publishes it as required only when its own node has no pin.
  ai.pipestream.proto.receipt.v1.TrustSnapshot trust = 2;
  // Referenced artifact bytes, base64-encoded, keyed by their SHA-256. When
  // present the rehash check runs all-or-nothing instead of being skipped.
  map<string, string> artifacts = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      map: {max_pairs: 4096, keys: {string: {sha256_hex: true}}}
    }
  ];
}

// One named verification check's outcome.
message WorkRecordCheck {
  // Stable check identifier.
  string id = 1;
  // PASSED, FAILED, or SKIPPED.
  string status = 2;
  // What passed, failed, or why the check was skipped.
  string detail = 3;
}

// The verification outcome with its checks and non-claims.
message VerifyWorkRecordResponse {
  // True when no check failed.
  bool verified = 1;
  // SHA-256 of the manifest bytes, empty until the container parsed.
  string manifest_digest = 2;
  // Every check that ran, in pipeline order.
  repeated WorkRecordCheck checks = 3;
  // What verification does not establish, as stable identifiers.
  repeated string non_claims = 4;
}

// A signed record, its trust snapshot, and the replay inputs to evaluate it
// beside its stored evidence.
message EvaluateWorkRecordRequest {
  // The record to evaluate: a serialized SignedWorkRecord, base64, for the
  // same reason verify-work-record takes it encoded.
  string record_base64 = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, base64: true}
    }
  ];
  // The trust snapshot to verify signatures against. Not required here,
  // because a node may pin one through PROTOMOLT_TRUST_SNAPSHOT; the verb
  // publishes it as required only when its own node has no pin.
  ai.pipestream.proto.receipt.v1.TrustSnapshot trust = 2;
  // The compiled workflow, as recorded. This is the durable contract from
  // grpc_workflow.proto, not the authoring shape CompiledWorkflow in this file:
  // a run executes what the compiler produced, with its dependencies resolved
  // and its deadline a Duration.
  ai.pipestream.proto.grpc.workflow.v1.Workflow workflow = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Exact descriptor set used by the recorded run.
  SchemaSource schema = 4 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Referenced artifact bytes, base64-encoded, keyed by their SHA-256; when
  // present, runs the rehash check.
  map<string, string> artifacts = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      map: {max_pairs: 4096, keys: {string: {sha256_hex: true}}}
    }
  ];
}

// The versioned evaluation record, written beside the signed record.
message EvaluateWorkRecordResponse {
  // True exactly when the predeclared policy accepts: no check failed.
  bool accepted = 1;
  // SHA-256 of the manifest bytes, empty until the container parsed.
  string manifest_digest = 2;
  // The predeclared evaluation policy's identity.
  string policy_id = 3;
  // The policy's version.
  string policy_version = 4;
  // The policy text's digest.
  string policy_sha256 = 5;
  // When the evaluation ran (RFC 3339).
  string evaluated_at = 6;
  // Verification checks followed by the evaluation's own, in order.
  repeated WorkRecordCheck checks = 7;
  // Ordered per-step offline replay verdicts.
  repeated WorkflowStepReplay replay_steps = 8;
  // What the evaluation does not establish, as stable identifiers.
  repeated string non_claims = 9;
}

// The input of submit-workflow: an inline workflow or the name of a stored one,
// the workflow input, and an optional client-generated job id.
message SubmitWorkflowRequest {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "submit_workflow.one_definition"
      message: "name either an inline workflow or a stored workflowName, not both and not neither"
      expression: "has(this.workflow) != (this.workflow_name != '')"
    }
  };

  // The inline workflow definition to execute.
  CompiledWorkflow workflow = 1;
  // A stored workflow to run instead of an inline one, registered through the
  // registry's workflows endpoint.
  string workflow_name = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 256, path_safe_name: true}
    }
  ];
  // The workflow input, as proto3 JSON of the workflow's declared input type.
  google.protobuf.Struct input = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Client-generated job id. Supplying one makes submit idempotent: a second
  // submit with the same id returns the existing job rather than starting a
  // second one. The server mints one when empty.
  string job_id = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {uuid: true}
    }
  ];
}

// The outcome of submit-workflow.
message SubmitWorkflowResponse {
  // True when the job was accepted (or already existed under 'job_id').
  bool ok = 1;
  // The job id, for get-job / complete-step / topic correlation.
  string job_id = 2;
  // The job's status after the call: 'QUEUED', or the existing job's status
  // on an idempotent resubmit.
  string status = 3;
  // Why submission failed, when ok=false (workflow does not parse or verify,
  // jobs not configured, malformed input).
  string error = 4;
  // The step the run was refused at, when a definition failed to compile or
  // validate. Set only when ok=false and the refusal names a step.
  string failed_step = 5;
}

// One checkpointed step of a workflow run: the persisted response the workflow
// resumes from after a restart or a park.
message WorkflowRunCheckpoint {
  // The step name.
  string name = 1;
  // True when the step's 'when' gate evaluated false and the step did not
  // run; 'response' is then the output type's default instance.
  bool skipped = 2;
  // The step's response, as proto3 JSON of its output type.
  google.protobuf.Struct response = 3;
}

// One workflow run. Job statuses: QUEUED (awaiting a worker), RUNNING (claimed),
// WAITING (parked on an 'external' step, expecting complete-step), COMPLETED,
// FAILED (a verdict: validation gate or non-retryable failure), DEAD
// (attempts exhausted — the dead-letter row).
message WorkflowRun {
  // The job id (a UUID).
  string job_id = 1;
  // The workflow's name.
  string workflow_name = 2;
  // QUEUED, RUNNING, WAITING, COMPLETED, FAILED, or DEAD.
  string status = 3;
  // Execution attempts so far.
  int32 attempt = 4;
  // The parked step's name; set only while WAITING.
  string outstanding_step = 5;
  // The workflow input, as proto3 JSON.
  google.protobuf.Struct input = 6;
  // Persisted per-step responses, in execution order.
  repeated WorkflowRunCheckpoint checkpoints = 7;
  // The workflow output, as proto3 JSON; set only when COMPLETED.
  google.protobuf.Struct result = 8;
  // The last failure, verbatim; set when FAILED or DEAD.
  string error = 9;
  // RFC 3339; when the job was submitted.
  string created_at = 10;
  // RFC 3339; when the job row last changed.
  string updated_at = 11;
  // RFC 3339; set when the job reached a terminal state.
  string completed_at = 12;
  // One line on how the run ended, written at the terminal commit point: what
  // completed, or which gate failed it. Set once the job is COMPLETED, FAILED
  // or DEAD.
  string verdict = 13;
}

// The input of get-job.
message GetJobRequest {
  // The job id returned by submit-workflow.
  string job_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
}

// The outcome of get-job.
message GetJobResponse {
  // True when the job exists.
  bool ok = 1;
  // The full job record, checkpoints and result included.
  WorkflowRun job = 2;
  // Why the read failed, when ok=false (unknown job, jobs not configured).
  string error = 3;
}

// Where a workflow run has got to.
enum JobStatus {
  // No filter: every status is listed.
  JOB_STATUS_UNSPECIFIED = 0;
  // Accepted and waiting for a worker.
  JOB_STATUS_QUEUED = 1;
  // A worker is executing it.
  JOB_STATUS_RUNNING = 2;
  // Parked on an external step until complete-step supplies the response.
  JOB_STATUS_WAITING = 3;
  // Finished successfully.
  JOB_STATUS_COMPLETED = 4;
  // Finished unsuccessfully, and may still be retried.
  JOB_STATUS_FAILED = 5;
  // Out of attempts; no further retry will be made.
  JOB_STATUS_DEAD = 6;
}

// The input of list-jobs.
message ListJobsRequest {
  // Status filter; unspecified lists every status.
  JobStatus status = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      enum: {defined_only: true}
    }
  ];
  // Workflow-name filter; empty lists every workflow.
  string workflow_name = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 256, path_safe_name: true}
    }
  ];
  // Maximum jobs returned; zero selects the default of 50. A larger value is
  // clamped to the ceiling of 500 rather than refused, so a caller asking for
  // everything gets a page instead of an error. The ceiling is not declared as
  // a rule for that reason: it bounds the answer, not the request.
  int32 limit = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0}
    }
  ];
  // Offset into the created_at-descending ordering.
  int32 offset = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0}
    }
  ];
}

// The outcome of list-jobs.
message ListJobsResponse {
  // True when the listing succeeded.
  bool ok = 1;
  // The matching jobs, newest first; summary rows (checkpoints and result
  // are omitted — use get-job for those).
  repeated WorkflowRun jobs = 2;
  // Why the listing failed, when ok=false.
  string error = 3;
}

// The input of complete-step: the parked step's response, supplied by
// whoever the job was parked for.
message CompleteStepRequest {
  // The job id.
  string job_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // The parked step's name; must match the job's outstanding step.
  string step_name = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, path_safe_name: true}
    }
  ];
  // The step's response, as proto3 JSON of the step's output type. When the
  // step declares 'validate', the response is checked against its declared
  // rules before the workflow resumes — a rejection fails the job as a verdict.
  google.protobuf.Struct response = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
}

// The outcome of complete-step.
message CompleteStepResponse {
  // True when the response was accepted and the job requeued (or the step
  // was already completed — idempotent redelivery).
  bool ok = 1;
  // The job's status after the call.
  string status = 2;
  // Why completion failed, when ok=false (job not WAITING, step mismatch,
  // response does not parse or failed validation).
  string error = 3;
  // The step the run is actually parked on, when it is not the one supplied.
  // Set only when ok=false, and only while the run is still waiting.
  string outstanding_step = 4;
}

// The input of infer-schema.
message InferSchemaRequest {
  // Fully qualified name for the inferred message.
  string name = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 512, protobuf_fqn: true}
    }
  ];
  // Sample documents; keys union across samples and numbers stay int64 only
  // when integral in every occurrence. At least one, because inferring a
  // schema from nothing has no evidence to work from. The cap bounds what one
  // call asks the inferencer to read.
  repeated google.protobuf.Struct samples = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 1000}
    }
  ];
}

// The inferred message type, ready to register.
message InferSchemaResponse {
  // Fully qualified name of the inferred message.
  string type = 1;
  // Import path of the inferred file.
  string file = 2;
  // Registrable proto source (json_name preserves sanitized keys).
  string proto_source = 3;
  // The descriptor set of the inferred schema, serialized and
  // base64-encoded.
  string descriptor_set_base64 = 4;
}

// What masking does to a field it covers.
enum MaskStrategy {
  // Selects REMOVE, the verb's default.
  MASK_STRATEGY_UNSPECIFIED = 0;
  // The field is dropped from the output entirely.
  MASK_STRATEGY_REMOVE = 1;
  // The field is kept with its value replaced.
  MASK_STRATEGY_REDACT = 2;
  // String and bytes values become AES-GCM ciphertext and other types clear.
  // Requires a key.
  MASK_STRATEGY_ENCRYPT = 3;
  // Reverses ENCRYPT with the same key. A wrong key fails loudly.
  MASK_STRATEGY_DECRYPT = 4;
}

// The input of mask-message.
message MaskMessageRequest {
  // The schema declaring the field sensitivity classes.
  SchemaSource schema = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Fully qualified type of the message to mask; not required, because a
  // schema declaring exactly one message identifies it.
  string type = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 512, protobuf_fqn: true}
    }
  ];
  // The message to mask, as canonical proto3 JSON.
  google.protobuf.Struct message = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Sensitivity classes to mask, for example 'pii'. At least one: masking no
  // class would return the message unchanged, which the caller can do without
  // calling this verb.
  repeated string classes = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 64, items: {string: {min_len: 1, max_len: 128}}}
    }
  ];
  // What to do with a covered field; unspecified removes it.
  MaskStrategy strategy = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      enum: {defined_only: true}
    }
  ];
  // Base64 AES key of 16, 24, or 32 bytes, required by ENCRYPT and DECRYPT
  // and unused by the other strategies. The caller's key: it is never stored
  // and never appears in a response.
  string key = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {base64: true, max_len: 128}
    }
  ];
}

// The masked message.
message MaskMessageResponse {
  // The masked message, as proto3 JSON.
  google.protobuf.Struct message = 1;
  // Paths of the fields that were masked.
  repeated string masked_fields = 2;
}

// ============================================================================
// INFERENCE VERBS — the inference SPI exposed through the catalog. Payloads
// mirror ai.pipestream.proto.inference.v1; they are re-declared here (like
// the jobs payloads) because this file is self-contained for the runtime
// compiler. The canonical proto3 JSON form is the action envelope, so the
// same call works over gRPC, the REST gateway, and MCP.
// ============================================================================

// One conversational turn for inference-generate.
message InferenceChatTurn {
  // The speaker: 'system', 'user', 'assistant', or 'tool'.
  string role = 1;
  // The turn's plain-text content.
  string content = 2;
}

// The input of inference-generate.
message InferenceGenerateRequest {
  // The catalog id of the model to run; inference-list-models names them.
  string model = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, path_safe_name: true}
    }
  ];
  // The conversation, oldest first. At least one turn: a generation with no
  // conversation has nothing to continue.
  repeated InferenceChatTurn messages = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      repeated: {min_items: 1, max_items: 1000}
    }
  ];
  // Sampling temperature; zero selects the provider's default. The range is
  // the one every supported provider accepts.
  double temperature = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 2.0}
    }
  ];
  // Nucleus sampling mass; zero selects the provider's default.
  double top_p = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 1.0}
    }
  ];
  // Hard cap on generated tokens; zero lets the provider apply its own.
  int32 max_output_tokens = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0}
    }
  ];
  // Requests the model's deliberation mode when it has one.
  bool enable_thinking = 6;
}

// Token accounting of one inference generation.
message InferenceUsage {
  // Tokens consumed by the prompt.
  int64 prompt_tokens = 1;
  // Tokens produced by the model.
  int64 completion_tokens = 2;
}

// The outcome of inference-generate.
message InferenceGenerateResponse {
  // True when the model answered; false carries 'error'.
  bool ok = 1;
  // The generated text.
  string text = 2;
  // The catalog model id that ran.
  string model = 3;
  // The SPI provider that executed (e.g. 'openvino').
  string provider = 4;
  // The provider-reported model version or digest; empty when unreported.
  string model_version = 5;
  // Why generation stopped ('stop', 'length', 'aborted').
  string finish_reason = 6;
  // Token accounting.
  InferenceUsage usage = 7;
  // Why the call failed, when ok=false (unknown model, provider error,
  // inference not configured).
  string error = 8;
}

// What one inference catalog model can do.
message InferenceModelCapabilities {
  // The model's total context window in tokens.
  int64 max_context_tokens = 1;
  // The largest supported single-generation output in tokens; 0 = unbounded.
  int32 max_output_tokens = 2;
  // Whether streaming generation is supported.
  bool streaming = 3;
  // Whether the model has a deliberation ('thinking') mode.
  bool thinking = 4;
  // Input modalities beyond text; empty = text only.
  repeated string modalities = 5;
  // Whether the model accepts a strict JSON-Schema response format.
  bool structured_output = 6;
}

// One inference catalog model registration.
message InferenceModelEntry {
  // The catalog id clients request by.
  string id = 1;
  // The SPI provider id that executes this model.
  string provider = 2;
  // The provider-specific target (base URL or gRPC target).
  string endpoint = 3;
  // The model name as the backend knows it; empty = same as id.
  string backend_model = 4;
  // Declared capabilities.
  InferenceModelCapabilities capabilities = 5;
  // Free-form provenance labels (e.g. machine, gpu, role).
  map<string, string> labels = 6;
}

// The input of inference-list-models.
message InferenceListModelsRequest {
  // When set, only entries executed by this provider are returned.
  string provider = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 128, path_safe_name: true}
    }
  ];
}

// The outcome of inference-list-models.
message InferenceListModelsResponse {
  // True when inference is configured; false carries 'error'.
  bool ok = 1;
  // The registered entries (after optional filtering).
  repeated InferenceModelEntry models = 2;
  // The catalog generation at the time of the listing.
  int64 catalog_generation = 3;
  // Why the read failed, when ok=false (inference not configured).
  string error = 4;
}

// The input of inference-describe-model.
message InferenceDescribeModelRequest {
  // The catalog id to describe.
  string model = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 256, path_safe_name: true}
    }
  ];
}

// The outcome of inference-describe-model.
message InferenceDescribeModelResponse {
  // True when the model is registered; false carries 'error'.
  bool ok = 1;
  // The catalog entry.
  InferenceModelEntry entry = 2;
  // Why the read failed, when ok=false (unknown model, inference not
  // configured).
  string error = 3;
}
