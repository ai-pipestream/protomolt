// The ProtoMolt action catalog as a gRPC service.
//
// Every verb in the catalog is a typed RPC here. The canonical proto3 JSON
// form of each message is exactly the action's JSON envelope, so the same
// call works identically over gRPC, over the JSON/REST gateway, and as an
// MCP tool.
//
// ProtoMolt serves this file descriptor-natively: the runtime compiles this
// source with its own compiler and binds the service with dynamic messages.
// There are no generated stubs on the server side; clients may generate
// theirs with the GenerateStubs RPC below.
syntax = "proto3";

package ai.pipestream.proto.grpc.service.v1;

import "ai/pipestream/proto/grpc/profile/v1/service_profile.proto";
import "ai/pipestream/proto/grpc/workflow/v1/grpc_workflow.proto";
import "ai/pipestream/proto/receipt/v1/receipt.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/struct.proto";

// The ProtoMolt toolkit: compile, introspect, validate, diff, render,
// evaluate, map, reflect, invoke, and generate — one service.
service ProtoMoltService {
  // Compiles inline .proto sources to a serialized FileDescriptorSet.
  // Compilation failures return ok=false with diagnostics, not an error.
  rpc Compile(CompileRequest) returns (CompileResponse);

  // Lists the types in a schema (or the shared registry when no schema is
  // given) — the grounding verb: call it first to discover exact names.
  rpc ListTypes(ListTypesRequest) returns (ListTypesResponse);

  // Validates a message against the validation rules declared on its schema.
  rpc ValidateMessage(ValidateMessageRequest) returns (ValidateMessageResponse);

  // Reports every change between two schema versions as typed entries.
  rpc DiffSchemas(DiffSchemasRequest) returns (DiffSchemasResponse);

  // Checks the new schema against the old under a compatibility mode.
  rpc CheckCompat(CheckCompatRequest) returns (CheckCompatResponse);

  // Renders the JSON Schema (draft 2020-12) for a message type. The response
  // is the schema document itself.
  rpc RenderJsonSchema(RenderJsonSchemaRequest) returns (RenderJsonSchemaResponse);

  // Renders the prompt packet for a message type: the complete LLM
  // form-filling briefing (instruction prose from the schema's metadata,
  // validation, quality and llm.v1 annotations, plus the JSON Schema decoder
  // constraint, plus an optional resolved persona).
  rpc RenderPrompt(RenderPromptRequest) returns (RenderPromptResponse);

  // Renders the search-index artifact for a message type from its indexing
  // hints. The response shape is engine-specific (OpenSearch mappings, Solr
  // schema pieces, or Lucene field specs).
  rpc RenderIndexMappings(RenderIndexMappingsRequest) returns (RenderIndexMappingsResponse);

  // Evaluates a CEL expression against a message bound as 'input'.
  rpc EvalCel(EvalCelRequest) returns (EvalCelResponse);

  // Transforms a message with text mapping rules and/or CEL rules.
  rpc MapMessage(MapMessageRequest) returns (MapMessageResponse);

  // Extracts the declared metadata bag for a message type.
  rpc ExtractMetadata(ExtractMetadataRequest) returns (ExtractMetadataResponse);

  // Synthesizes a join or union output shape — envelope, projection, or
  // tagged union — from named source types, returning registrable proto
  // source and the implied mapping rules.
  rpc SynthesizeShape(SynthesizeShapeRequest) returns (SynthesizeShapeResponse);

  // Joins named source messages into one output message: an authored target
  // populated by scoped rules, or a shape synthesized on the fly.
  rpc JoinMessages(JoinMessagesRequest) returns (JoinMessagesResponse);

  // Merges the fields of two or more message types into one new type: a
  // clash report first, caller-decided resolutions, then the merged proto
  // plus its join and union mapping rules in one move.
  rpc MergeSchemas(MergeSchemasRequest) returns (MergeSchemasResponse);

  // Statically validates mapping rules and CEL expressions (filters must be
  // boolean) against descriptors; with sample messages, also dry-runs them.
  rpc CheckRules(CheckRulesRequest) returns (CheckRulesResponse);

  // Struct-to-proto: infers a message type from JSON sample documents and
  // returns registrable proto source plus the linked descriptor set.
  rpc InferSchema(InferSchemaRequest) returns (InferSchemaResponse);

  // Masks fields by their schema-declared sensitivity classes
  // (ai.pipestream.proto.meta.v1.field.sensitivity).
  rpc MaskMessage(MaskMessageRequest) returns (MaskMessageResponse);

  // Executes an inline workflow: serial typed gRPC calls, each request mapped
  // from the workflow input and every prior step's response.
  rpc RunWorkflow(RunWorkflowRequest) returns (RunWorkflowResponse);

  // Statically verifies a workflow: methods resolve and are unary, every
  // mapping and CEL expression type-checks at each step's scope.
  rpc CheckWorkflow(CheckWorkflowRequest) returns (CheckWorkflowResponse);

  // Compiles a checked workflow into the durable descriptor-grounded workflow contract.
  rpc CompileWorkflow(CompileWorkflowRequest) returns (CompileWorkflowResponse);

  // Suggests conservative, statically verifiable mappings onto a target type.
  rpc SuggestMappings(SuggestMappingsRequest) returns (SuggestMappingsResponse);

  // Executes a live workflow and records redacted content-addressed fixtures.
  rpc RecordWorkflowRun(RecordWorkflowRunRequest) returns (RecordWorkflowRunResponse);

  // Replays recorded fixtures offline and reports any drift.
  rpc ReplayWorkflow(ReplayWorkflowRequest) returns (ReplayWorkflowResponse);

  // Promotes workflow content as an immutable version in the git registry.
  rpc PromoteWorkflow(PromoteWorkflowRequest) returns (PromoteWorkflowResponse);

  // Projects a stored run's evidence into a canonical signed work record.
  rpc ExportWorkRecord(ExportWorkRecordRequest) returns (ExportWorkRecordResponse);

  // Verifies a signed work record offline against a caller-supplied trust
  // snapshot.
  rpc VerifyWorkRecord(VerifyWorkRecordRequest) returns (VerifyWorkRecordResponse);

  // Evaluates a signed work record beside its stored evidence: verification,
  // the evidence match, and offline replay under the predeclared policy.
  rpc EvaluateWorkRecord(EvaluateWorkRecordRequest) returns (EvaluateWorkRecordResponse);

  // Fetches a live gRPC server's schema over server reflection, given only
  // its address. Servers without reflection return ok=false.
  rpc Reflect(ReflectRequest) returns (ReflectResponse);

  // Invokes a unary or server-streaming method on a live gRPC server with no
  // generated stubs. gRPC status failures return ok=false with the status
  // name rather than an error.
  rpc GrpcInvoke(GrpcInvokeRequest) returns (GrpcInvokeResponse);

  // Generates client/message source code from a schema with protoc compiled
  // to WebAssembly — no native toolchain on the server.
  rpc GenerateStubs(GenerateStubsRequest) returns (GenerateStubsResponse);

  // Gathers .proto sources from a git repository and compiles them — the
  // lane for services that publish their contract instead of reflecting.
  rpc GatherGit(GatherGitRequest) returns (GatherGitResponse);

  // Registers a stable service profile, reflects its selected endpoint, and
  // stores the descriptor set outside the response as a content-addressed artifact.
  rpc ServiceRegister(ServiceRegisterRequest) returns (ServiceRegisterResponse);

  // Lists registered service identities, endpoint names, and descriptor fingerprints.
  rpc ServiceList(ServiceListRequest) returns (ServiceListResponse);

  // Describes one registered profile and its reflected service/method contracts.
  rpc ServiceInspect(ServiceInspectRequest) returns (ServiceInspectResponse);

  // Re-reflects a registered endpoint and advances its descriptor fingerprint.
  rpc ServiceRefresh(ServiceRefreshRequest) returns (ServiceRefreshResponse);

  // Invokes a registered service while resolving its endpoint and pinned
  // descriptor inside ProtoMolt.
  rpc ServiceInvoke(ServiceInvokeRequest) returns (ServiceInvokeResponse);

  // Renders a schema as an Open Knowledge Format (OKF v0.1) bundle: markdown
  // concept documents with YAML frontmatter for every message, enum, and
  // service, cross-linked into the knowledge graph agents and catalogs read.
  rpc EmitOkf(EmitOkfRequest) returns (EmitOkfResponse);

  // Submits a workflow for asynchronous execution as a job: the same workflow
  // definition and serial semantics as run-workflow, detached. The worker
  // checkpoints every step response, parks on steps declared with
  // completion='external', and resumes on complete-step. Requires the server
  // to be started with jobs storage configured.
  rpc SubmitWorkflow(SubmitWorkflowRequest) returns (SubmitWorkflowResponse);

  // Reads one workflow run by id: status, per-step checkpoints, the result when
  // completed, and the last error verbatim when failed.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // Lists workflow runs, optionally filtered by status and workflow name; summary
  // rows only (checkpoints and result are omitted — use GetJob for those).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Completes a parked ('external') step of a waiting job with the supplied
  // response message and resumes the workflow. This is the human-in-the-loop
  // lane: a judge, reviewer, or external agent resolves the step the worker
  // parked on. Idempotent on job_id + step_name.
  rpc CompleteStep(CompleteStepRequest) returns (CompleteStepResponse);

  // Runs one inference generation against a model registered in the server's
  // inference catalog (the inference SPI: OpenVINO today, more providers as
  // they land). Unary only; streaming lives on the native InferenceService.
  rpc InferenceGenerate(InferenceGenerateRequest) returns (InferenceGenerateResponse);

  // Lists the server's inference model catalog: the registered models a
  // caller may name in inference-generate.
  rpc InferenceListModels(InferenceListModelsRequest)
      returns (InferenceListModelsResponse);

  // Describes one inference catalog model entry, capabilities included.
  rpc InferenceDescribeModel(InferenceDescribeModelRequest)
      returns (InferenceDescribeModelResponse);
}

// A schema source. Provide exactly one of 'type', 'sources', or
// 'descriptor_set_base64'; 'root' optionally names the entry file within
// 'sources'.
message SchemaSource {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "schema_source.exactly_one"
      message: "a schema source names exactly one of type, sources, or descriptorSetBase64"
      expression: "[this.type != '', size(this.sources) > 0, this.descriptor_set_base64 != ''].filter(set, set).size() == 1"
    }
  };

  // Fully qualified message name resolved from the shared descriptor
  // registry, e.g. 'google.protobuf.Struct'. Discover names with ListTypes.
  string type = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 512, protobuf_fqn: true}
    }
  ];

  // Inline .proto files keyed by import path; compiled per call and never
  // registered. The cap bounds what one call asks the compiler to do.
  map<string, string> sources = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      map: {max_pairs: 256, keys: {string: {min_len: 1, max_len: 1024}}}
    }
  ];

  // Optional entry file within 'sources'. When it declares exactly one
  // message, that message becomes the default type.
  string root = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 1024}
    }
  ];

  // Base64-encoded serialized google.protobuf.FileDescriptorSet.
  string descriptor_set_base64 = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {base64: true}
    }
  ];
}

// A service profile in the canonical proto3 JSON form of
// ai.pipestream.proto.grpc.profile.v1.ServiceProfile. Struct keeps this
// descriptor-native service self-contained while the profile remains its own
// published protobuf standard.
message ServiceRegisterRequest {
  // Caller-authored profile; reflection replaces its schemaSource value.
  ai.pipestream.proto.grpc.profile.v1.ServiceProfile profile = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Endpoint name to reflect; empty selects the first endpoint.
  string endpoint = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 128}
    }
  ];
  // Reflection deadline in milliseconds; zero selects the action default of
  // 15000. The ceiling matches the outbound channel policy, which refuses a
  // longer deadline than 60000 whatever a caller asks for.
  int32 deadline_ms = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 60000}
    }
  ];
}

// One field of a reflected message, as the service workspace reports it.
message ReflectedField {
  // Field name as declared in the .proto source.
  string name = 1;
  // Name this field carries in canonical proto3 JSON, which differs from
  // 'name' whenever the declared name contains an underscore.
  string json_name = 2;
  // Field number on the wire.
  int32 number = 3;
  // Protobuf type in lower case, for example 'string', 'int64' or 'message'.
  string type = 4;
  // Either 'singular' or 'repeated'. Map fields report as repeated, because
  // that is how they are encoded.
  string cardinality = 5;
  // Fully qualified name of the message or enum this field carries. Empty for
  // scalar fields, which have no named type.
  string type_name = 6;
}

// One method of a reflected service, with both sides of its contract expanded
// so a caller can build a request without a second reflection round trip.
message ReflectedMethod {
  // Method name on its own, as declared.
  string name = 1;
  // Fully qualified 'package.Service/Method' form used to address the call.
  string full_name = 2;
  // Fully qualified name of the request message type.
  string input_type = 3;
  // Fully qualified name of the response message type.
  string output_type = 4;
  // True when the client sends a stream of requests.
  bool client_streaming = 5;
  // True when the server returns a stream of responses.
  bool server_streaming = 6;
  // Fields of the request message.
  repeated ReflectedField input_fields = 7;
  // Fields of the response message.
  repeated ReflectedField output_fields = 8;
}

// One service found by reflecting a registered endpoint.
message ReflectedService {
  // Fully qualified service name.
  string name = 1;
  // Every method the service declares.
  repeated ReflectedMethod methods = 2;
}

// A registered profile as it appears in a listing: enough to choose one, not
// the whole contract. Use ServiceInspect for the expanded form.
message ServiceSummary {
  // Profile name, unique within the workspace.
  string name = 1;
  // Operator-supplied description. Empty when none was given.
  string description = 2;
  // Names of the endpoints this profile declares.
  repeated string endpoints = 3;
  // Fingerprint of the descriptor set currently pinned for this profile.
  string descriptor_fingerprint = 4;
}

// Outcome of registering a profile and reflecting its endpoint.
message ServiceRegisterResponse {
  // True when the profile was stored and its endpoint reflected.
  bool ok = 1;
  // Why registration failed. Empty when 'ok' is true.
  string error = 2;
  // The stored profile, including the descriptor identity reflection
  // resolved for it.
  ai.pipestream.proto.grpc.profile.v1.ServiceProfile profile = 3;
  // Contracts found at the reflected endpoint.
  repeated ReflectedService services = 4;
}


// The service-list action has no input fields.
message ServiceListRequest {}

// Every profile the workspace holds.
message ServiceListResponse {
  // One entry per registered profile, in registration order.
  repeated ServiceSummary services = 1;
}


// Identifies one stored service profile to inspect.
message ServiceInspectRequest {
  // Stable profile name.
  string name = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 128, path_safe_name: true}
    }
  ];
}

// One profile and the contracts reflection found behind it.
message ServiceInspectResponse {
  // The stored profile.
  ai.pipestream.proto.grpc.profile.v1.ServiceProfile profile = 1;
  // Contracts found at the profile's endpoint.
  repeated ReflectedService services = 2;
}


// Selects a registered endpoint to reflect again.
message ServiceRefreshRequest {
  // Stable profile name.
  string name = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 128, path_safe_name: true}
    }
  ];
  // Endpoint name to reflect; empty selects the first endpoint.
  string endpoint = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 128}
    }
  ];
  // Reflection deadline in milliseconds; zero selects the action default of
  // 15000, and 60000 is the outbound channel policy's ceiling.
  int32 deadline_ms = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 60000}
    }
  ];
}

// Outcome of re-reflecting a registered endpoint.
message ServiceRefreshResponse {
  // True when reflection succeeded.
  bool ok = 1;
  // True when the descriptor fingerprint moved, meaning the remote contract
  // changed since it was last pinned.
  bool changed = 2;
  // Why the refresh failed. Empty when 'ok' is true.
  string error = 3;
  // The profile after refreshing, carrying the new descriptor identity.
  ai.pipestream.proto.grpc.profile.v1.ServiceProfile profile = 4;
  // Contracts found at the endpoint on this pass.
  repeated ReflectedService services = 5;
}


// Invokes a method through a stored service profile. The action contract
// validates the profile and method names, requires a request object, and
// bounds deadline_ms and max_responses before resolving registry state.
message ServiceInvokeRequest {
  // Stable profile name.
  string name = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 128, path_safe_name: true}
    }
  ];
  // Fully qualified method as package.Service/Method.
  string method = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 3, max_len: 512, contains: "/"}
    }
  ];
  // Request message as canonical proto3 JSON. Struct is the honest type here:
  // the message type is only known once the profile's descriptors resolve the
  // method, so the payload cannot be declared any more narrowly at this layer.
  google.protobuf.Struct request = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Named profile endpoint; empty selects the first endpoint.
  string endpoint = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 128}
    }
  ];
  // Call deadline in milliseconds; zero selects the registered method policy's
  // value, or 15000. A registered method deadline is a ceiling, and 60000 is
  // the outbound channel policy's.
  int32 deadline_ms = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 60000}
    }
  ];
  // Maximum server-streaming responses to collect; zero selects the action
  // default. The cap bounds what one call can hold in memory.
  int32 max_responses = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0, lte: 4096}
    }
  ];
}

// Outcome of invoking a method on a registered profile. The invocation fields
// mirror GrpcInvokeResponse, because the call is performed by the same
// machinery once the profile has resolved the endpoint and descriptor.
message ServiceInvokeResponse {
  // Name of the profile that resolved the endpoint.
  string service_profile = 1;
  // Name of the endpoint the call was placed against.
  string endpoint = 2;
  // Fingerprint of the descriptor set the call was encoded with, so a caller
  // can tell which contract version answered.
  string descriptor_fingerprint = 3;
  // The invoked method, echoed back as 'package.Service/Method'.
  string method = 4;
  // UNARY or SERVER_STREAMING.
  string method_type = 5;
  // True when the call completed with gRPC status OK.
  bool ok = 6;
  // The gRPC status name, 'OK' on success.
  string status = 7;
  // Response messages as proto3 JSON.
  repeated google.protobuf.Struct responses = 8;
  // Status detail, when the call failed.
  string description = 9;
}


// The input of compile: the inline .proto sources to compile.
message CompileRequest {
  // The .proto files to compile, keyed by import path, for example
  // 'example/v1/doc.proto'. At least one, because compiling nothing is a
  // request the caller did not mean.
  map<string, string> sources = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      map: {min_pairs: 1, max_pairs: 256, keys: {string: {min_len: 1, max_len: 1024}}}
    }
  ];
}

// The result of compile: diagnostics on failure, the descriptor set on
// success.
message CompileResponse {
  // True when compilation succeeded; failures return diagnostics, not an
  // error.
  bool ok = 1;
  // Compiler diagnostics when ok=false.
  repeated string errors = 2;
  // Compiled file names when ok=true.
  repeated string files = 3;
  // The serialized google.protobuf.FileDescriptorSet of the compiled
  // sources, base64-encoded.
  string descriptor_set_base64 = 4;
}

// The input of list-types: which schema to introspect and an optional name
// filter.
message ListTypesRequest {
  // Optional; without it the shared descriptor registry is listed.
  SchemaSource schema = 1;
  // Case-insensitive substring filter on the fully qualified name.
  string filter = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 512}
    }
  ];
}

// One field of a message type.
message TypeField {
  // The field name.
  string name = 1;
  // The field number (tag).
  int32 number = 2;
  // Wire type, lowercase (e.g. 'string', 'int64', 'message').
  string type = 3;
  // Full name of the message or enum type, when applicable.
  string type_name = 4;
  // 'optional', 'required', or 'repeated'.
  string label = 5;
}

// One named type (message, enum, or service) in a schema.
message TypeEntry {
  // The fully qualified type name.
  string full_name = 1;
  // The import path of the .proto file that declares the type.
  string file = 2;
  // 'message', 'enum', or 'service'.
  string kind = 3;
  // Field shapes; present for messages.
  repeated TypeField fields = 4;
}

// The types found by list-types.
message ListTypesResponse {
  // The types matching the request.
  repeated TypeEntry types = 1;
}

// The input of validate-message: the schema, the type, and the message to
// check.
message ValidateMessageRequest {
  // The schema declaring the type and its validation rules.
  SchemaSource schema = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Fully qualified type to validate against; required unless the schema
  // identifies a single message, which is why it is not required here.
  string type = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 512, protobuf_fqn: true}
    }
  ];
  // The message as canonical proto3 JSON. Struct is the honest type: the
  // message type is only known once the schema source resolves it.
  google.protobuf.Struct message = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
}

// One broken validation rule.
message Violation {
  // The path of the field that broke the rule.
  string field = 1;
  // The path of the broken rule within the schema.
  string rule = 2;
  // The stable identifier of the broken rule.
  string rule_id = 3;
  // Human-readable description of the violation.
  string message = 4;
}

// The verdict of validate-message.
message ValidateMessageResponse {
  // True when no rule was broken.
  bool valid = 1;
  // One entry per broken rule; empty when 'valid' is true.
  repeated Violation violations = 2;
}

// The input of diff-schemas: the two schema versions to compare.
message DiffSchemasRequest {
  // The old schema version.
  SchemaSource old = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // The new schema version.
  SchemaSource new = 2 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
}

// One typed change between two schema versions.
message SchemaChange {
  // Stable identifier of the change kind.
  string rule_id = 1;
  // The protobuf path of the changed element.
  string path = 2;
  // Snippet of the element in the old schema.
  string before = 3;
  // Snippet of the element in the new schema.
  string after = 4;
  // Human-readable description of the change.
  string message = 5;
  // The compatibility impacts the change carries; empty marks a purely
  // informational change.
  repeated string impacts = 6;
}

// Every change between the two schema versions.
message DiffSchemasResponse {
  // The changes found between 'old' and 'new'.
  repeated SchemaChange changes = 1;
}

// How much compatibility a schema change must preserve.
//
// A transitive variant checks the new version against every earlier version
// rather than only the one it is compared with, which is what catches a
// change that is compatible with its immediate predecessor but not with a
// version still in the field.
enum CompatibilityMode {
  // Selects BACKWARD, the mode most callers want and the one the verb has
  // always defaulted to.
  COMPATIBILITY_MODE_UNSPECIFIED = 0;
  // Any change is allowed.
  COMPATIBILITY_MODE_NONE = 1;
  // New readers can read data written by the old schema.
  COMPATIBILITY_MODE_BACKWARD = 2;
  // Old readers can read data written by the new schema.
  COMPATIBILITY_MODE_FORWARD = 3;
  // Both directions hold.
  COMPATIBILITY_MODE_FULL = 4;
  // BACKWARD against every earlier version.
  COMPATIBILITY_MODE_BACKWARD_TRANSITIVE = 5;
  // FORWARD against every earlier version.
  COMPATIBILITY_MODE_FORWARD_TRANSITIVE = 6;
  // FULL against every earlier version.
  COMPATIBILITY_MODE_FULL_TRANSITIVE = 7;
}

// The input of check-compat: both versions plus the mode and the optional
// rule families.
message CheckCompatRequest {
  // The old schema version.
  SchemaSource old = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // The new schema version.
  SchemaSource new = 2 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Compatibility to enforce; unspecified selects BACKWARD.
  CompatibilityMode mode = 3;
  // Also treat canonical proto3 JSON payload breaks (field and enum name
  // changes, removals) as violations.
  bool include_json_rules = 4;
  // Also treat generated-code and gRPC surface breaks as violations.
  bool include_source_rules = 5;
}

// The verdict of check-compat.
message CheckCompatResponse {
  // True when no violation was found under 'mode'.
  bool compatible = 1;
  // The compatibility mode that was enforced, in the same vocabulary the
  // request names it in, so a caller can compare what it asked for with what
  // was applied.
  CompatibilityMode mode = 2;
  // The changes that break 'mode'.
  repeated SchemaChange violations = 3;
  // The full change list, informational entries included.
  repeated SchemaChange changes = 4;
}

// The input of render-json-schema.
message RenderJsonSchemaRequest {
  // The schema declaring the message type.
  SchemaSource schema = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Fully qualified message type to render; not required, because a schema
  // declaring exactly one message identifies it on its own.
  string type = 2 [
