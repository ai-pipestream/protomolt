plugins {
    alias(libs.plugins.protobuf)
}

description = 'Protobuf service profiles and durable descriptor artifacts for the gRPC workflow workbench'

dependencies {
    api libs.protobuf.java
    api libs.protobuf.java.util
    // Validation delegates name, fingerprint, and host checks to the shared
    // linear-scan parsers instead of hand-rolled regexes.
    implementation project(':protomolt-formats')
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.1"
    }
}
