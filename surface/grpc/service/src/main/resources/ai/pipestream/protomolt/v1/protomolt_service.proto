// The ProtoMolt action catalog as a gRPC service.
//
// Every verb in the catalog is a typed RPC here. The canonical proto3 JSON
// form of each message is exactly the action's JSON envelope, so the same
// call works identically over gRPC, over the JSON/REST gateway, and as an
// MCP tool.
//
// ProtoMolt serves this file descriptor-natively: the runtime compiles this
// source with its own compiler and binds the service with dynamic messages.
// There are no generated stubs on the server side; clients may generate
// theirs with the GenerateStubs RPC below.
syntax = "proto3";

package ai.pipestream.protomolt.v1;

import "google/protobuf/struct.proto";

// The ProtoMolt toolkit: compile, introspect, validate, diff, render,
// evaluate, map, reflect, invoke, and generate — one service.
service ProtoMoltService {
  // Compiles inline .proto sources to a serialized FileDescriptorSet.
  // Compilation failures return ok=false with diagnostics, not an error.
  rpc Compile(CompileRequest) returns (CompileResponse);

  // Lists the types in a schema (or the shared registry when no schema is
  // given) — the grounding verb: call it first to discover exact names.
  rpc ListTypes(ListTypesRequest) returns (ListTypesResponse);

  // Validates a message against the validation rules declared on its schema.
  rpc ValidateMessage(ValidateMessageRequest) returns (ValidateMessageResponse);

  // Reports every change between two schema versions as typed entries.
  rpc DiffSchemas(DiffSchemasRequest) returns (DiffSchemasResponse);

  // Checks the new schema against the old under a compatibility mode.
  rpc CheckCompat(CheckCompatRequest) returns (CheckCompatResponse);

  // Renders the JSON Schema (draft 2020-12) for a message type. The response
  // is the schema document itself.
  rpc RenderJsonSchema(RenderJsonSchemaRequest) returns (google.protobuf.Struct);

  // Renders the prompt packet for a message type: the complete LLM
  // form-filling briefing (instruction prose from the schema's metadata,
  // validation, quality and llm.v1 annotations, plus the JSON Schema decoder
  // constraint, plus an optional resolved persona).
  rpc RenderPrompt(RenderPromptRequest) returns (google.protobuf.Struct);

  // Renders the search-index artifact for a message type from its indexing
  // hints. The response shape is engine-specific (OpenSearch mappings, Solr
  // schema pieces, or Lucene field specs).
  rpc RenderIndexMappings(RenderIndexMappingsRequest) returns (google.protobuf.Struct);

  // Evaluates a CEL expression against a message bound as 'input'.
  rpc EvalCel(EvalCelRequest) returns (EvalCelResponse);

  // Transforms a message with text mapping rules and/or CEL rules.
  rpc MapMessage(MapMessageRequest) returns (MapMessageResponse);

  // Extracts the declared metadata bag for a message type.
  rpc ExtractMetadata(ExtractMetadataRequest) returns (ExtractMetadataResponse);

  // Synthesizes a join or union output shape — envelope, projection, or
  // tagged union — from named source types, returning registrable proto
  // source and the implied mapping rules.
  rpc SynthesizeShape(SynthesizeShapeRequest) returns (SynthesizeShapeResponse);

  // Joins named source messages into one output message: an authored target
  // populated by scoped rules, or a shape synthesized on the fly.
  rpc JoinMessages(JoinMessagesRequest) returns (JoinMessagesResponse);

  // Merges the fields of two or more message types into one new type: a
  // clash report first, caller-decided resolutions, then the merged proto
  // plus its join and union mapping rules in one move.
  rpc MergeSchemas(MergeSchemasRequest) returns (MergeSchemasResponse);

  // Statically validates mapping rules and CEL expressions (filters must be
  // boolean) against descriptors; with sample messages, also dry-runs them.
  rpc CheckRules(CheckRulesRequest) returns (CheckRulesResponse);

  // Struct-to-proto: infers a message type from JSON sample documents and
  // returns registrable proto source plus the linked descriptor set.
  rpc InferSchema(InferSchemaRequest) returns (InferSchemaResponse);

  // Masks fields by their schema-declared sensitivity classes
  // (ai.pipestream.proto.meta.v1.field.sensitivity).
  rpc MaskMessage(MaskMessageRequest) returns (MaskMessageResponse);

  // Executes an inline workflow: serial typed gRPC calls, each request mapped
  // from the workflow input and every prior step's response.
  rpc RunWorkflow(RunWorkflowRequest) returns (RunWorkflowResponse);

  // Statically verifies a workflow: methods resolve and are unary, every
  // mapping and CEL expression type-checks at each step's scope.
  rpc CheckWorkflow(CheckWorkflowRequest) returns (CheckWorkflowResponse);

  // Compiles a checked workflow into the durable descriptor-grounded workflow contract.
  rpc CompileWorkflow(CompileWorkflowRequest) returns (CompileWorkflowResponse);

  // Suggests conservative, statically verifiable mappings onto a target type.
  rpc SuggestMappings(SuggestMappingsRequest) returns (SuggestMappingsResponse);

  // Executes a live workflow and records redacted content-addressed fixtures.
  rpc RecordWorkflowRun(RecordWorkflowRunRequest) returns (RecordWorkflowRunResponse);

  // Replays recorded fixtures offline and reports any drift.
  rpc ReplayWorkflow(ReplayWorkflowRequest) returns (ReplayWorkflowResponse);

  // Promotes workflow content as an immutable version in the git registry.
  rpc PromoteWorkflow(PromoteWorkflowRequest) returns (PromoteWorkflowResponse);

  // Projects a stored run's evidence into a canonical signed work record.
  rpc ExportWorkRecord(ExportWorkRecordRequest) returns (ExportWorkRecordResponse);

  // Verifies a signed work record offline against a caller-supplied trust
  // snapshot.
  rpc VerifyWorkRecord(VerifyWorkRecordRequest) returns (VerifyWorkRecordResponse);

  // Fetches a live gRPC server's schema over server reflection, given only
  // its address. Servers without reflection return ok=false.
  rpc Reflect(ReflectRequest) returns (ReflectResponse);

  // Invokes a unary or server-streaming method on a live gRPC server with no
  // generated stubs. gRPC status failures return ok=false with the status
  // name rather than an error.
  rpc GrpcInvoke(GrpcInvokeRequest) returns (GrpcInvokeResponse);

  // Generates client/message source code from a schema with protoc compiled
  // to WebAssembly — no native toolchain on the server.
  rpc GenerateStubs(GenerateStubsRequest) returns (GenerateStubsResponse);

  // Gathers .proto sources from a git repository and compiles them — the
  // lane for services that publish their contract instead of reflecting.
  rpc GatherGit(GatherGitRequest) returns (GatherGitResponse);

  // Registers a stable service profile, reflects its selected endpoint, and
  // stores the descriptor set outside the response as a content-addressed artifact.
  rpc ServiceRegister(ServiceRegisterRequest) returns (google.protobuf.Struct);

  // Lists registered service identities, endpoint names, and descriptor fingerprints.
  rpc ServiceList(ServiceListRequest) returns (google.protobuf.Struct);

  // Describes one registered profile and its reflected service/method contracts.
  rpc ServiceInspect(ServiceInspectRequest) returns (google.protobuf.Struct);

  // Re-reflects a registered endpoint and advances its descriptor fingerprint.
  rpc ServiceRefresh(ServiceRefreshRequest) returns (google.protobuf.Struct);

  // Invokes a registered service while resolving its endpoint and pinned
  // descriptor inside ProtoMolt.
  rpc ServiceInvoke(ServiceInvokeRequest) returns (google.protobuf.Struct);

  // Renders a schema as an Open Knowledge Format (OKF v0.1) bundle: markdown
  // concept documents with YAML frontmatter for every message, enum, and
  // service, cross-linked into the knowledge graph agents and catalogs read.
  rpc EmitOkf(EmitOkfRequest) returns (EmitOkfResponse);

  // Submits a workflow for asynchronous execution as a job: the same workflow
  // definition and serial semantics as run-workflow, detached. The worker
  // checkpoints every step response, parks on steps declared with
  // completion='external', and resumes on complete-step. Requires the server
  // to be started with jobs storage configured.
  rpc SubmitWorkflow(SubmitWorkflowRequest) returns (SubmitWorkflowResponse);

  // Reads one workflow run by id: status, per-step checkpoints, the result when
  // completed, and the last error verbatim when failed.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // Lists workflow runs, optionally filtered by status and workflow name; summary
  // rows only (checkpoints and result are omitted — use GetJob for those).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Completes a parked ('external') step of a waiting job with the supplied
  // response message and resumes the workflow. This is the human-in-the-loop
  // lane: a judge, reviewer, or external agent resolves the step the worker
  // parked on. Idempotent on job_id + step_name.
  rpc CompleteStep(CompleteStepRequest) returns (CompleteStepResponse);

  // Runs one inference generation against a model registered in the server's
  // inference catalog (the inference SPI: OpenVINO today, more providers as
  // they land). Unary only; streaming lives on the native InferenceService.
  rpc InferenceGenerate(InferenceGenerateRequest) returns (InferenceGenerateResponse);

  // Lists the server's inference model catalog: the registered models a
  // caller may name in inference-generate.
  rpc InferenceListModels(InferenceListModelsRequest)
      returns (InferenceListModelsResponse);

  // Describes one inference catalog model entry, capabilities included.
  rpc InferenceDescribeModel(InferenceDescribeModelRequest)
      returns (InferenceDescribeModelResponse);
}

// A schema source. Provide exactly one of 'type', 'sources', or
// 'descriptor_set_base64'; 'root' optionally names the entry file within
// 'sources'.
message SchemaSource {
  // Fully qualified message name resolved from the shared descriptor
  // registry, e.g. 'google.protobuf.Struct'.
  string type = 1;

  // Inline .proto files keyed by import path; compiled per call.
  map<string, string> sources = 2;

  // Optional entry file within 'sources'.
  string root = 3;

  // Base64-encoded serialized google.protobuf.FileDescriptorSet.
  string descriptor_set_base64 = 4;
}

// A service profile in the canonical proto3 JSON form of
// ai.pipestream.proto.grpc.profile.v1.ServiceProfile. Struct keeps this
// descriptor-native service self-contained while the profile remains its own
// published protobuf standard.
message ServiceRegisterRequest {
  // Caller-authored profile; reflection replaces its schemaSource value.
  google.protobuf.Struct profile = 1;
  // Endpoint name to reflect; empty selects the first endpoint.
  string endpoint = 2;
  // Reflection deadline in milliseconds; zero selects the action default.
  int32 deadline_ms = 3;
}

// The service-list action has no input fields.
message ServiceListRequest {}

// Identifies one stored service profile to inspect.
message ServiceInspectRequest {
  // Stable profile name.
  string name = 1;
}

// Selects a registered endpoint to reflect again.
message ServiceRefreshRequest {
  // Stable profile name.
  string name = 1;
  // Endpoint name to reflect; empty selects the first endpoint.
  string endpoint = 2;
  // Reflection deadline in milliseconds; zero selects the action default.
  int32 deadline_ms = 3;
}

// Invokes a method through a stored service profile. The action contract
// validates the profile and method names, requires a request object, and
// bounds deadline_ms and max_responses before resolving registry state.
message ServiceInvokeRequest {
  // Stable profile name.
  string name = 1;
  // Fully qualified method as package.Service/Method.
  string method = 2;
  // Request message as canonical proto3 JSON.
  google.protobuf.Struct request = 3;
  // Named profile endpoint; empty selects the first endpoint.
  string endpoint = 4;
  // Call deadline in milliseconds; zero selects the registered/default value.
  int32 deadline_ms = 5;
  // Maximum server-streaming responses; zero selects the action default.
  int32 max_responses = 6;
}

// The input of compile: the inline .proto sources to compile.
message CompileRequest {
  // The .proto files to compile, keyed by import path.
  map<string, string> sources = 1;
}

// The result of compile: diagnostics on failure, the descriptor set on
// success.
message CompileResponse {
  // True when compilation succeeded; failures return diagnostics, not an
  // error.
  bool ok = 1;
  // Compiler diagnostics when ok=false.
  repeated string errors = 2;
  // Compiled file names when ok=true.
  repeated string files = 3;
  // The serialized google.protobuf.FileDescriptorSet of the compiled
  // sources, base64-encoded.
  string descriptor_set_base64 = 4;
}

// The input of list-types: which schema to introspect and an optional name
// filter.
message ListTypesRequest {
  // Optional; without it the shared descriptor registry is listed.
  SchemaSource schema = 1;
  // Case-insensitive substring filter on the fully qualified name.
  string filter = 2;
}

// One field of a message type.
message TypeField {
  // The field name.
  string name = 1;
  // The field number (tag).
  int32 number = 2;
  // Wire type, lowercase (e.g. 'string', 'int64', 'message').
  string type = 3;
  // Full name of the message or enum type, when applicable.
  string type_name = 4;
  // 'optional', 'required', or 'repeated'.
  string label = 5;
}

// One named type (message, enum, or service) in a schema.
message TypeEntry {
  // The fully qualified type name.
  string full_name = 1;
  // The import path of the .proto file that declares the type.
  string file = 2;
  // 'message', 'enum', or 'service'.
  string kind = 3;
  // Field shapes; present for messages.
  repeated TypeField fields = 4;
}

// The types found by list-types.
message ListTypesResponse {
  // The types matching the request.
  repeated TypeEntry types = 1;
}

// The input of validate-message: the schema, the type, and the message to
// check.
message ValidateMessageRequest {
  // The schema declaring the type and its validation rules.
  SchemaSource schema = 1;
  // Fully qualified type to validate against; required unless the schema
  // identifies a single message.
  string type = 2;
  // The message as canonical proto3 JSON.
  google.protobuf.Struct message = 3;
}

// One broken validation rule.
message Violation {
  // The path of the field that broke the rule.
  string field = 1;
  // The path of the broken rule within the schema.
  string rule = 2;
  // The stable identifier of the broken rule.
  string rule_id = 3;
  // Human-readable description of the violation.
  string message = 4;
}

// The verdict of validate-message.
message ValidateMessageResponse {
  // True when no rule was broken.
  bool valid = 1;
  // One entry per broken rule; empty when 'valid' is true.
  repeated Violation violations = 2;
}

// The input of diff-schemas: the two schema versions to compare.
message DiffSchemasRequest {
  // The old schema version.
  SchemaSource old = 1;
  // The new schema version.
  SchemaSource new = 2;
}

// One typed change between two schema versions.
message SchemaChange {
  // Stable identifier of the change kind.
  string rule_id = 1;
  // The protobuf path of the changed element.
  string path = 2;
  // Snippet of the element in the old schema.
  string before = 3;
  // Snippet of the element in the new schema.
  string after = 4;
  // Human-readable description of the change.
  string message = 5;
  // The compatibility impacts the change carries; empty marks a purely
  // informational change.
  repeated string impacts = 6;
}

// Every change between the two schema versions.
message DiffSchemasResponse {
  // The changes found between 'old' and 'new'.
  repeated SchemaChange changes = 1;
}

// The input of check-compat: both versions plus the mode and the optional
// rule families.
message CheckCompatRequest {
  // The old schema version.
  SchemaSource old = 1;
  // The new schema version.
  SchemaSource new = 2;
  // NONE, BACKWARD, FORWARD, FULL, or a _TRANSITIVE variant; defaults to
  // BACKWARD.
  string mode = 3;
  // Also treat canonical proto3 JSON payload breaks (field/enum name
  // changes, removals) as violations; default false.
  bool include_json_rules = 4;
  // Also treat generated-code and gRPC surface breaks as violations;
  // default false.
  bool include_source_rules = 5;
}

// The verdict of check-compat.
message CheckCompatResponse {
  // True when no violation was found under 'mode'.
  bool compatible = 1;
  // The compatibility mode that was enforced.
  string mode = 2;
  // The changes that break 'mode'.
  repeated SchemaChange violations = 3;
  // The full change list, informational entries included.
  repeated SchemaChange changes = 4;
}

// The input of render-json-schema.
message RenderJsonSchemaRequest {
  // The schema declaring the message type.
  SchemaSource schema = 1;
  // Fully qualified message type to render.
  string type = 2;
}

// The input of render-prompt.
message RenderPromptRequest {
  // The schema declaring the message type.
  SchemaSource schema = 1;
  // Fully qualified message type to render the prompt packet for.
  string type = 2;
  // The resolved persona to render for, as canonical proto3 JSON of
  // ai.pipestream.proto.prompt.v1.Persona. Absent renders persona-free.
  google.protobuf.Struct persona = 3;
  // Opaque registry reference echoed into the packet so the receiver can
  // rebuild the descriptor set; empty when the caller has no registry context.
  string descriptor_set_ref = 4;
}

// The input of render-index-mappings.
message RenderIndexMappingsRequest {
  // The schema declaring the message type and its indexing hints.
  SchemaSource schema = 1;
  // Fully qualified message type to render mappings for.
  string type = 2;
  // 'opensearch', 'solr', or 'lucene'.
  string engine = 3;
}

// The input of eval-cel.
message EvalCelRequest {
  // The schema declaring the message type.
  SchemaSource schema = 1;
  // Fully qualified type of the bound message.
  string type = 2;
  // The message bound as the CEL variable 'input', as proto3 JSON.
  google.protobuf.Struct message = 3;
  // The CEL expression to evaluate.
  string expression = 4;
}

// The result of eval-cel.
message EvalCelResponse {
  // The value the expression evaluated to, as a protobuf Value.
  google.protobuf.Value result = 1;
  // A short type label: 'string', 'int', 'bool', 'list', 'map',
  // 'message:<full.Name>', ...
  string result_type = 2;
}

// A mapping rule written in CEL: an optional gate, a value expression, and
// the target it writes to.
message CelRule {
  // Optional boolean CEL gate; the rule is skipped when false.
  string filter = 1;
  // Optional CEL value expression written to 'target'.
  string selector = 2;
  // The output field path the selector value is written to.
  string target = 3;
  // Text rules applied when no selector is given.
  repeated string fallback = 4;
}

// The input of map-message.
message MapMessageRequest {
  // The schema declaring the message type.
  SchemaSource schema = 1;
  // Fully qualified type of the message being transformed.
  string type = 2;
  // The message to transform, as canonical proto3 JSON.
  google.protobuf.Struct message = 3;
  // Text rules applied in order: 'target = source.path',
  // 'target += source.path', '-field.to.clear'.
  repeated string rules = 4;
  // CEL rules applied after 'rules'.
  repeated CelRule cel_rules = 5;
}

// The result of map-message.
message MapMessageResponse {
  // The transformed message as proto3 JSON.
  google.protobuf.Struct message = 1;
}

// The input of extract-metadata.
message ExtractMetadataRequest {
  // The schema declaring the message type and its metadata options.
  SchemaSource schema = 1;
  // Fully qualified message type to extract metadata from.
  string type = 2;
}

// The metadata bag of one message type.
message ExtractMetadataResponse {
  // The fully qualified type the metadata was extracted from.
  string type = 1;
  // Flat bag keyed 'message.*' and 'field.<name>.*'.
  google.protobuf.Struct metadata = 2;
}

// The input of reflect: where the server is and how to reach it.
message ReflectRequest {
  // gRPC target, e.g. 'localhost:9090' or 'dns:///svc:443'.
  string target = 1;
  // Default 15000.
  int32 deadline_ms = 2;
  // Connect with TLS (system trust roots); plaintext by default.
  bool tls = 3;
}

// The schema fetched over server reflection.
message ReflectResponse {
  // True when the server answered reflection; servers without reflection
  // return false.
  bool ok = 1;
  // Fully qualified names of the services the server exposes.
  repeated string services = 2;
  // Usable directly as SchemaSource.descriptor_set_base64.
  string descriptor_set_base64 = 3;
  // Number of files in the returned descriptor set.
  int32 file_count = 4;
  // Why reflection failed, when ok=false.
  string error = 5;
}

// The input of grpc-invoke.
message GrpcInvokeRequest {
  // gRPC target, e.g. 'localhost:9090' or 'dns:///svc:443'.
  string target = 1;
  // Fully qualified 'package.Service/Method'.
  string method = 2;
  // Must declare the target service.
  SchemaSource schema = 3;
  // The request message as canonical proto3 JSON.
  google.protobuf.Struct request = 4;
  // Optional ASCII request headers.
  map<string, string> metadata = 5;
  // Default 15000.
  int32 deadline_ms = 6;
  // Cap on collected server-streaming responses; default 64.
  int32 max_responses = 7;
  // Connect with TLS (system trust roots); plaintext by default.
  bool tls = 8;
}

// The outcome of grpc-invoke.
message GrpcInvokeResponse {
  // The invoked method, echoed back as 'package.Service/Method'.
  string method = 1;
  // UNARY or SERVER_STREAMING.
  string method_type = 2;
  // True when the call completed with gRPC status OK.
  bool ok = 3;
  // The gRPC status name, 'OK' on success.
  string status = 4;
  // Response messages as proto3 JSON.
  repeated google.protobuf.Struct responses = 5;
  // Status detail, when the call failed.
  string description = 6;
}

// The input of generate-stubs.
message GenerateStubsRequest {
  // The schema to generate code from.
  SchemaSource schema = 1;
  // 'java', 'kotlin', 'grpc-java', 'python', 'cpp', 'csharp', 'ruby', 'php',
  // 'objc'; defaults to ['java'].
  repeated string generators = 2;
  // Proto file paths to generate for; defaults to every non-google file.
  repeated string files = 3;
  // Optional generator parameter, as protoc's --<gen>_opt.
  string parameter = 4;
}

// One generated source file.
message GeneratedFile {
  // The file's path within the generator output.
  string name = 1;
  // The generator that produced the file.
  string generator = 2;
  // The generated source text.
  string content = 3;
}

// The generated files, or the failure.
message GenerateStubsResponse {
  // True when every requested generator succeeded.
  bool ok = 1;
  // The generated files.
  repeated GeneratedFile files = 2;
  // The number of generated files.
  int32 file_count = 3;
  // The generator that failed, when ok=false.
  string generator = 4;
  // Why generation failed, when ok=false.
  string error = 5;
}

// The input of gather-git: where the repository is and which .proto files
// to take.
message GatherGitRequest {
  // Git repository URL (https or ssh).
  string repo = 1;
  // Branch, tag, or commit SHA; default 'main'.
  string ref = 2;
  // Specific files or directories relative to 'subdir'; default: every
  // .proto under 'subdir'.
  repeated string paths = 3;
  // Directory import paths are relative to; default 'proto', '.' for root.
  string subdir = 4;
}

// The gathered and compiled schema.
message GatherGitResponse {
  // True when the sources were gathered and compiled.
  bool ok = 1;
  // Why the gather or compile failed, when ok=false.
  string error = 2;
  // Import paths of the gathered .proto files.
  repeated string files = 3;
  // Source texts keyed by import path — registerable as registry subjects.
  map<string, string> sources = 4;
  // Usable directly as SchemaSource.descriptor_set_base64.
  string descriptor_set_base64 = 5;
}

// The input of emit-okf.
message EmitOkfRequest {
  // The schema to render as an OKF bundle.
  SchemaSource schema = 1;
  // Heading of the bundle's root index.md; default 'Schema knowledge bundle'.
  string title = 2;
}

// The rendered OKF bundle.
message EmitOkfResponse {
  // True when the bundle was rendered.
  bool ok = 1;
  // Why the render failed, when ok=false.
  string error = 2;
  // Number of files in the bundle.
  int32 file_count = 3;
  // Every bundle file: markdown text keyed by bundle-relative path.
  map<string, string> files = 4;
  // The same bundle as one zip archive.
  string zip_base64 = 5;
}

// A named source type (and, for joins, its message) in shape order; the
// name becomes the scope name rules reference and the synthesized field or
// case name.
message ShapeSource {
  // The scope name; becomes the synthesized field or case name.
  string name = 1;
  // The schema declaring the source type.
  SchemaSource schema = 2;
  // Fully qualified message type; required unless the schema identifies one.
  string type = 3;
  // join-messages only: the source message as proto3 JSON.
  google.protobuf.Struct message = 4;
}

// A projected field: its type is inferred from the scoped source path.
message ProjectedField {
  // The field's name in the projected output.
  string name = 1;
  // e.g. 'order.ship_to.city'.
  string from = 2;
}

// The input of synthesize-shape.
message SynthesizeShapeRequest {
  // 'envelope', 'projection', or 'union'.
  string mode = 1;
  // Fully qualified name of the synthesized message.
  string name = 2;
  // The named source types, in shape order.
  repeated ShapeSource sources = 3;
  // Projection only.
  repeated ProjectedField fields = 4;
}

// The synthesized shape, ready to register.
message SynthesizeShapeResponse {
  // Fully qualified name of the synthesized message.
  string type = 1;
  // Import path of the synthesized file.
  string file = 2;
  // Registrable proto source; imports carry the sources' true paths.
  string proto_source = 3;
  // Self-contained, dependency-ordered descriptor set.
  string descriptor_set_base64 = 4;
  // The rules the shape implies (projection and envelope).
  repeated string implied_rules = 5;
}

// The authored output type of a join.
message JoinTarget {
  // The schema declaring the target type.
  SchemaSource schema = 1;
  // Fully qualified target message type.
  string type = 2;
}

// A shape to synthesize as the join output.
message JoinShape {
  // 'envelope', 'projection', or 'union'.
  string mode = 1;
  // Fully qualified name of the synthesized output message.
  string name = 2;
  // Projection only: the projected fields.
  repeated ProjectedField fields = 3;
}

// The input of join-messages.
message JoinMessagesRequest {
  // The named source messages, in shape order.
  repeated ShapeSource sources = 1;
  // Exactly one of 'target' or 'shape'.
  JoinTarget target = 2;
  // A shape synthesized on the fly as the join output.
  JoinShape shape = 3;
  // Scoped text rules: 'target.path = source.path', '+=', '-clear'.
  repeated string rules = 4;
  // CEL rules applied after 'rules'; expressions see each source by name
  // plus 'target', the progressive output.
  repeated CelRule cel_rules = 5;
}

// The joined message and, for synthesized shapes, its definition.
message JoinMessagesResponse {
  // Fully qualified type of the joined message.
  string type = 1;
  // The joined message as proto3 JSON.
  google.protobuf.Struct message = 2;
  // Present when the shape was synthesized.
  string descriptor_set_base64 = 3;
  // Registrable proto source of the synthesized shape; present when the
  // shape was synthesized.
  string proto_source = 4;
}

// A caller's decision for a clashing field name in merge-schemas.
message MergeResolution {
  // 'rename', 'prefer', or 'coalesce'.
  string action = 1;
  // prefer: the source whose field wins.
  string source = 2;
  // rename: new field name per source; missing entries default to
  // '<source>_<field>'.
  map<string, string> names = 3;
}

// The input of merge-schemas.
message MergeSchemasRequest {
  // Fully qualified name of the merged message.
  string name = 1;
  // Two or more; for coalesced singular fields, later sources overwrite
  // earlier ones at join time. 'message' is unused here.
  repeated ShapeSource sources = 2;
  // Keyed by clashing field name.
  map<string, MergeResolution> resolutions = 3;
  // Return only the clash report, even when the merge is clean.
  bool report_only = 4;
}

// One source's contribution to a clashing field name.
message ClashOrigin {
  // The name of the source contributing this field.
  string source = 1;
  // Proto keyword or full type name, 'repeated '-prefixed when repeated.
  string type = 2;
}

// One clashing field name, its origins, and the suggested resolution.
message MergeClash {
  // The clashing field name.
  string field = 1;
  // 'coalesced' (info: same type, merged into one field - the natural join
  // keys), 'type-clash', or 'cardinality-clash'.
  string kind = 2;
  // Each source's contribution to the clash.
  repeated ClashOrigin origins = 3;
  // The resolution merge-schemas suggests; the caller may override it in
  // MergeSchemasRequest.resolutions.
  MergeResolution suggested = 4;
}

// The clash report and, once resolved, the merged type with its mapping
// rules.
message MergeSchemasResponse {
  // False while hard clashes await resolutions (or report_only was set);
  // the emission fields below are present only when true.
  bool resolved = 1;
  // The clash report: one entry per clashing field name.
  repeated MergeClash clashes = 2;
  // Fully qualified name of the merged message.
  string type = 3;
  // Import path of the merged file.
  string file = 4;
  // Registrable proto source; imports carry the sources' true paths.
  string proto_source = 5;
  // Self-contained, dependency-ordered descriptor set of the merged schema,
  // serialized and base64-encoded.
  string descriptor_set_base64 = 6;
  // The defined join: one ruleset reading every source at once.
  repeated string join_rules = 7;
  // The defined union: one ruleset per source, mapping it alone onto the
  // merged shape.
  map<string, MergeRuleList> union_rules = 8;
}

// A list of mapping rules; the value type of
// MergeSchemasResponse.union_rules.
message MergeRuleList {
  // The rules mapping one source alone onto the merged shape.
  repeated string rules = 1;
}

// The input of check-rules.
message CheckRulesRequest {
  // One source (in-place mode: unscoped paths, the name is the CEL variable)
  // or many (scoped mode). A 'message' on every source enables the dry run.
  repeated ShapeSource sources = 1;
  // The output type rules write to; required with multiple sources.
  JoinTarget target = 2;
  // Text mapping rules to check.
  repeated string rules = 3;
  // CEL rules to check.
  repeated CelRule cel_rules = 4;
  // Boolean CEL predicates.
  repeated string filters = 5;
}

// One problem found in a rule or filter.
message RuleFinding {
  // 'rule', 'celRule', or 'filter'.
  string kind = 1;
  // Position of the offending entry in its own list ('rules', 'cel_rules',
  // or 'filters').
  int32 index = 2;
  // The offending rule text (for CEL rules, the target label).
  string rule = 3;
  // Why the entry failed the check.
  string error = 4;
}

// The findings of check-rules, plus dry-run results when enabled.
message CheckRulesResponse {
  // True when every rule and filter passed the static checks.
  bool ok = 1;
  // One entry per problem; empty when 'ok' is true.
  repeated RuleFinding findings = 2;
  // Dry-run results, present when every source carried a sample message
  // and the static pass was clean.
  string type = 3;
  // The mapped output message of the dry run, as proto3 JSON.
  google.protobuf.Struct message = 4;
  // The dry-run verdict of each filter, in 'filters' order.
  repeated bool filter_results = 5;
  // A dynamic failure the static pass could not see (e.g. a Struct path).
  string dry_run_error = 6;
}

// One step of a workflow: a unary call whose request is mapped from the workflow
// scope ('input' plus every prior step's response, by step name).
message WorkflowStep {
  // The step name; later steps see this step's response under it.
  string name = 1;
  // gRPC target, e.g. 'host:9090'.
  string target = 2;
  // Use TLS; default plaintext.
  bool tls = 3;
  // 'package.Service/Method'; must be unary.
  string method = 4;
  // Boolean CEL gate; a false skips the step.
  string when = 5;
  // Scoped rules building the request message.
  repeated string rules = 6;
  // CEL rules applied after 'rules'.
  repeated CelRule cel_rules = 7;
  // Validate the response against its declared rules before proceeding.
  bool validate = 8;
  // Per-step deadline, bounded by what remains of the workflow's.
  int32 deadline_ms = 9;
  // How the step obtains its response: '' (the default) invokes 'method' on
  // 'target'; 'external' parks the job until complete-step supplies the
  // response — the human-in-the-loop lane. External steps are rejected by
  // synchronous run-workflow; they only execute as jobs.
  string completion = 10;
  // Structured-generation spec; when set the step fills 'structured.target_type'
  // with the named catalog model and must not declare target, method, or tls.
  StructuredStep structured = 11;
  // Typed edge feeding this step, replacing the top-level rules/celRules:
  // the named scope entries are mapped into 'produce_type', optionally
  // projected and validated, and the delivered value becomes the step's
  // request (or, on a structured step, the generation's grounding).
  WorkflowEdge edge = 12;
  // Optional bounded fan-out over a repeated message field produced by 'edge'.
  // Branch outputs are collected deterministically into 'fan_out.collect_into'.
  WorkflowFanOut fan_out = 13;
}

// A structured-generation step: fills one message type with a catalog model
// through the structured-output coordinator instead of invoking gRPC.
message StructuredStep {
  // Fully qualified message type the model fills.
  string target_type = 1;
  // Catalog model id; must declare the structured-output capability.
  string model = 2;
  // Attempt budget; 0 takes the coordinator default (3, hard-capped at 3).
  int32 max_attempts = 3;
}

// A typed inter-step edge: map the named scope entries ('input' or prior step
// names) into 'produce_type', optionally project the produced value to a
// projection-annotated consumer form, and validate it before the step runs.
message WorkflowEdge {
  // Scope entries the edge reads: 'input' or prior step names.
  repeated string sources = 1;
  // Fully qualified type the edge rules build.
  string produce_type = 2;
  // Scoped rules building the produced message.
  repeated string rules = 3;
  // CEL rules applied after 'rules'.
  repeated CelRule cel_rules = 4;
  // Fully qualified projection-annotated consumer type the produced message is
  // projected to before delivery; empty delivers the produced message itself.
  string project_to = 5;
  // Validate the delivered value against its declared rules before the step
  // runs; a rejection fails the step before any invocation.
  bool validate = 6;
}

// Bounded fan-out for one typed edge. The workflow verifier resolves every path
// and type, applies the item and concurrency bounds, and accepts only the
// FAIL_FAST or CONTINUE failure policies before execution.
message WorkflowFanOut {
  // Dotted path of the repeated message field whose elements become branches.
  string items = 1;
  // Maximum number of elements accepted; must be within the verifier's bound.
  int32 max_items = 2;
  // Maximum concurrently executing branches; must be within the verifier's bound.
  int32 max_concurrency = 3;
  // Branch failure policy: FAIL_FAST or CONTINUE.
  string failure_policy = 4;
  // Fully qualified message type receiving the collected branch outputs.
  string collect_type = 5;
  // Repeated field of 'collect_type' receiving outputs in branch-index order.
  string collect_into = 6;
}

// The workflow's output mapping; without it the last step's response returns.
message WorkflowOutput {
  // Fully qualified output message type.
  string type = 1;
  // Scoped text rules building the output message.
  repeated string rules = 2;
  // CEL rules applied after 'rules'.
  repeated CelRule cel_rules = 3;
}

// A workflow: an input type and serial steps whose requests are mapped from
// the workflow scope.
message CompiledWorkflow {
  // The workflow name.
  string name = 1;
  // Declares every step's service and message types (e.g. from reflect,
  // gather-git, or a registry descriptor set).
  SchemaSource schema = 2;
  // Fully qualified type of the workflow input.
  string input_type = 3;
  // Overall deadline; default 30000.
  int32 deadline_ms = 4;
  // The steps, executed in order.
  repeated WorkflowStep steps = 5;
  // Optional output mapping; without it the last step's response returns.
  WorkflowOutput output = 6;
}

// The input of run-workflow: an inline workflow or the name of a stored one.
message RunWorkflowRequest {
  // The inline workflow definition to execute.
  CompiledWorkflow workflow = 1;
  // The workflow input, as proto3 JSON of input_type.
  google.protobuf.Struct input = 2;
  // A stored workflow to run instead of an inline 'workflow' (registered via the
  // registry's workflows endpoint).
  string workflow_name = 3;
}

// The outcome of one workflow step.
message WorkflowStepResult {
  // The step name.
  string name = 1;
  // True when the step's 'when' gate evaluated false and the step did not
  // run.
  bool skipped = 2;
}

// The outcome of run-workflow.
message RunWorkflowResponse {
  // True when the workflow ran to completion and produced an output.
  bool ok = 1;
  // Fully qualified type of the output message.
  string output_type = 2;
  // The workflow output, as proto3 JSON of 'output_type'.
  google.protobuf.Struct output = 3;
  // Per-step outcomes, in execution order.
  repeated WorkflowStepResult steps = 4;
  // When ok=false: which step failed and why (gRPC status, gate error, or
  // validation violations).
  string failed_step = 5;
  // Why the workflow failed, when ok=false.
  string error = 6;
}

// The input of check-workflow.
message CheckWorkflowRequest {
  // The workflow definition to verify.
  CompiledWorkflow workflow = 1;
}

// One problem found while verifying a workflow.
message WorkflowFinding {
  // The step name, or '' for workflow-level findings.
  string step = 1;
  // 'method', 'when', 'rule', 'celRule', 'output', or 'workflow'.
  string kind = 2;
  // Why the element failed verification.
  string error = 3;
}

// The verdict of check-workflow.
message CheckWorkflowResponse {
  // True when the workflow verified clean.
  bool ok = 1;
  // One entry per problem; empty when 'ok' is true.
  repeated WorkflowFinding findings = 2;
}

// A checked workflow to compile into a workflow.
message CompileWorkflowRequest {
  // Descriptor-grounded workflow to check and compile.
  CompiledWorkflow workflow = 1;
}

// Deterministic workflow content and its SHA-256 identity.
message CompileWorkflowResponse {
  // Compiled Workflow rendered as protobuf JSON.
  google.protobuf.Struct workflow = 1;
  // Lowercase SHA-256 fingerprint of the compiled workflow bytes.
  string workflow_fingerprint = 2;
}

// Descriptor-grounded mapping suggestion input.
message SuggestMappingsRequest {
  // Named source message types available to mapping rules.
  repeated ShapeSource sources = 1;
  // Message type whose fields need source mappings.
  JoinTarget target = 2;
}

// One proposed target=source.path mapping.
message MappingCandidate {
  // Target field path populated by this candidate.
  string target_path = 1;
  // Named source field path read by this candidate.
  string source_path = 2;
  // Workflow mapping rule in target=source.path form.
  string rule = 3;
  // Deterministic reason this candidate was proposed.
  string basis = 4;
}

// Ordered conservative mapping candidates.
message SuggestMappingsResponse {
  // Fully qualified target message type.
  string target_type = 1;
  // Statically verifiable candidates in deterministic rank order.
  repeated MappingCandidate candidates = 2;
}

// A live draft-workflow probe to record for offline replay.
message RecordWorkflowRunRequest {
  // Descriptor-grounded workflow to execute.
  CompiledWorkflow workflow = 1;
  // Workflow input encoded as proto3 JSON.
  google.protobuf.Struct input = 2;
  // Client-selected path-safe run identity.
  string run_id = 3;
  // Promoted workflow version, or empty for a draft probe.
  string workflow_version = 4;
}

// The persisted run evidence; failed executions still return their evidence.
message RecordWorkflowRunResponse {
  // True when every workflow step and output mapping succeeded.
  bool ok = 1;
  // Step name that failed, when ok is false.
  string failed_step = 2;
  // Workflow execution failure category, when ok is false.
  string failure_kind = 3;
  // Persisted RunEvidence rendered as protobuf JSON.
  google.protobuf.Struct evidence = 4;
}

// Exact workflow, evidence identity, and descriptor set for offline replay.
message ReplayWorkflowRequest {
  // Workflow encoded as protobuf JSON.
  google.protobuf.Struct workflow = 1;
  // Stored run-evidence identity to replay.
  string run_id = 2;
  // Exact descriptor set used to decode and verify fixtures.
  SchemaSource schema = 3;
}

// One step's offline replay verdict.
message WorkflowStepReplay {
  // Workflow step whose evidence was checked.
  string step_name = 1;
  // RunEvidence StepStatus enum name.
  string recorded_status = 2;
  // True when the recorded step evidence matches the workflow and fixtures.
  bool ok = 3;
  // Bounded explanation of the replay verdict.
  string detail = 4;
}

// Whole-run offline replay verdict.
message ReplayWorkflowResponse {
  // True when the complete recorded run replays without drift.
  bool ok = 1;
  // Whole-run failure summary, or empty when replay succeeds.
  string failure = 2;
  // Ordered per-step replay verdicts.
  repeated WorkflowStepReplay steps = 3;
}

// Workflow content to promote under one immutable version.
message PromoteWorkflowRequest {
  // Workflow encoded as protobuf JSON.
  google.protobuf.Struct workflow = 1;
  // Path-safe immutable version identity.
  string version = 2;
}

// The immutable promotion envelope stored in the registry.
message PromoteWorkflowResponse {
  // True when the version is present with the requested content.
  bool promoted = 1;
  // Stored VersionedWorkflow rendered as protobuf JSON.
  google.protobuf.Struct versioned_workflow = 2;
}

// The stored run to project and the record identity to issue it under.
message ExportWorkRecordRequest {
  // Stored run-evidence identity to project.
  string run_id = 1;
  // Record identity; derived as "record-<run_id>" when empty.
  string record_id = 2;
  // Manifest digest of the record this one re-issues, or empty.
  string prior_manifest_sha256 = 3;
  // Sensitivity classes removed from the evidence before projection; a
  // disclosure names these and disclose_of together.
  repeated string mask_classes = 4;
  // Manifest digest of the record this disclosure projects, or empty.
  string disclose_of = 5;
}

// The signed record and its identity.
message ExportWorkRecordResponse {
  // Serialized SignedWorkRecord, base64.
  string record_base64 = 1;
  // SHA-256 of the manifest bytes: the record's identity.
  string manifest_digest = 2;
  // The record identity the manifest carries.
  string record_id = 3;
  // Evidence paths the disclosure policy removed, when disclosing.
  repeated string masked_paths = 4;
}

// A signed record and the trust snapshot to verify it against.
message VerifyWorkRecordRequest {
  // Serialized SignedWorkRecord, base64.
  string record_base64 = 1;
  // TrustSnapshot encoded as protobuf JSON.
  google.protobuf.Struct trust = 2;
  // Referenced artifact bytes by SHA-256, base64-encoded; when present the
  // rehash check runs all-or-nothing instead of being skipped.
  google.protobuf.Struct artifacts = 3;
}

// One named verification check's outcome.
message WorkRecordCheck {
  // Stable check identifier.
  string id = 1;
  // PASSED, FAILED, or SKIPPED.
  string status = 2;
  // What passed, failed, or why the check was skipped.
  string detail = 3;
}

// The verification outcome with its checks and non-claims.
message VerifyWorkRecordResponse {
  // True when no check failed.
  bool verified = 1;
  // SHA-256 of the manifest bytes, empty until the container parsed.
  string manifest_digest = 2;
  // Every check that ran, in pipeline order.
  repeated WorkRecordCheck checks = 3;
  // What verification does not establish, as stable identifiers.
  repeated string non_claims = 4;
}

// The input of submit-workflow: an inline workflow or the name of a stored one,
// the workflow input, and an optional client-generated job id.
message SubmitWorkflowRequest {
  // The inline workflow definition to execute.
  CompiledWorkflow workflow = 1;
  // A stored workflow to run instead of an inline 'workflow' (registered via the
  // registry's workflows endpoint).
  string workflow_name = 2;
  // The workflow input, as proto3 JSON of input_type.
  google.protobuf.Struct input = 3;
  // Optional client-generated job id (a UUID). Supplying one makes submit
  // idempotent: a second submit with the same id returns the existing job.
  // The server mints one when empty.
  string job_id = 4;
}

// The outcome of submit-workflow.
message SubmitWorkflowResponse {
  // True when the job was accepted (or already existed under 'job_id').
  bool ok = 1;
  // The job id, for get-job / complete-step / topic correlation.
  string job_id = 2;
  // The job's status after the call: 'QUEUED', or the existing job's status
  // on an idempotent resubmit.
  string status = 3;
  // Why submission failed, when ok=false (workflow does not parse or verify,
  // jobs not configured, malformed input).
  string error = 4;
}

// One checkpointed step of a workflow run: the persisted response the workflow
// resumes from after a restart or a park.
message WorkflowRunCheckpoint {
  // The step name.
  string name = 1;
  // True when the step's 'when' gate evaluated false and the step did not
  // run; 'response' is then the output type's default instance.
  bool skipped = 2;
  // The step's response, as proto3 JSON of its output type.
  google.protobuf.Struct response = 3;
}

// One workflow run. Job statuses: QUEUED (awaiting a worker), RUNNING (claimed),
// WAITING (parked on an 'external' step, expecting complete-step), COMPLETED,
// FAILED (a verdict: validation gate or non-retryable failure), DEAD
// (attempts exhausted — the dead-letter row).
message WorkflowRun {
  // The job id (a UUID).
  string job_id = 1;
  // The workflow's name.
  string workflow_name = 2;
  // QUEUED, RUNNING, WAITING, COMPLETED, FAILED, or DEAD.
  string status = 3;
  // Execution attempts so far.
  int32 attempt = 4;
  // The parked step's name; set only while WAITING.
  string outstanding_step = 5;
  // The workflow input, as proto3 JSON.
  google.protobuf.Struct input = 6;
  // Persisted per-step responses, in execution order.
  repeated WorkflowRunCheckpoint checkpoints = 7;
  // The workflow output, as proto3 JSON; set only when COMPLETED.
  google.protobuf.Struct result = 8;
  // The last failure, verbatim; set when FAILED or DEAD.
  string error = 9;
  // RFC 3339; when the job was submitted.
  string created_at = 10;
  // RFC 3339; when the job row last changed.
  string updated_at = 11;
  // RFC 3339; set when the job reached a terminal state.
  string completed_at = 12;
}

// The input of get-job.
message GetJobRequest {
  // The job id returned by submit-workflow.
  string job_id = 1;
}

// The outcome of get-job.
message GetJobResponse {
  // True when the job exists.
  bool ok = 1;
  // The full job record, checkpoints and result included.
  WorkflowRun job = 2;
  // Why the read failed, when ok=false (unknown job, jobs not configured).
  string error = 3;
}

// The input of list-jobs.
message ListJobsRequest {
  // Optional status filter (QUEUED, RUNNING, WAITING, COMPLETED, FAILED,
  // DEAD); empty lists every status.
  string status = 1;
  // Optional workflow-name filter.
  string workflow_name = 2;
  // Maximum jobs returned; default 50, capped at 500.
  int32 limit = 3;
  // Offset into the created_at-descending ordering.
  int32 offset = 4;
}

// The outcome of list-jobs.
message ListJobsResponse {
  // True when the listing succeeded.
  bool ok = 1;
  // The matching jobs, newest first; summary rows (checkpoints and result
  // are omitted — use get-job for those).
  repeated WorkflowRun jobs = 2;
  // Why the listing failed, when ok=false.
  string error = 3;
}

// The input of complete-step: the parked step's response, supplied by
// whoever the job was parked for.
message CompleteStepRequest {
  // The job id.
  string job_id = 1;
  // The parked step's name; must match the job's outstanding_step.
  string step_name = 2;
  // The step's response, as proto3 JSON of the step's output type. When the
  // step declares 'validate', the response is checked against its declared
  // rules before the workflow resumes — a rejection fails the job as a verdict.
  google.protobuf.Struct response = 3;
}

// The outcome of complete-step.
message CompleteStepResponse {
  // True when the response was accepted and the job requeued (or the step
  // was already completed — idempotent redelivery).
  bool ok = 1;
  // The job's status after the call.
  string status = 2;
  // Why completion failed, when ok=false (job not WAITING, step mismatch,
  // response does not parse or failed validation).
  string error = 3;
}

// The input of infer-schema.
message InferSchemaRequest {
  // Fully qualified name for the inferred message.
  string name = 1;
  // Sample documents; keys union across samples and numbers stay int64 only
  // when integral in every occurrence.
  repeated google.protobuf.Struct samples = 2;
}

// The inferred message type, ready to register.
message InferSchemaResponse {
  // Fully qualified name of the inferred message.
  string type = 1;
  // Import path of the inferred file.
  string file = 2;
  // Registrable proto source (json_name preserves sanitized keys).
  string proto_source = 3;
  // The descriptor set of the inferred schema, serialized and
  // base64-encoded.
  string descriptor_set_base64 = 4;
}

// The input of mask-message.
message MaskMessageRequest {
  // The schema declaring the field sensitivity classes.
  SchemaSource schema = 1;
  // Fully qualified type of the message to mask.
  string type = 2;
  // The message to mask, as canonical proto3 JSON.
  google.protobuf.Struct message = 3;
  // Sensitivity classes to mask, e.g. 'pii'.
  repeated string classes = 4;
  // 'remove' (default) or 'redact'.
  string strategy = 5;
}

// The masked message.
message MaskMessageResponse {
  // The masked message, as proto3 JSON.
  google.protobuf.Struct message = 1;
  // Paths of the fields that were masked.
  repeated string masked_fields = 2;
}

// ============================================================================
// INFERENCE VERBS — the inference SPI exposed through the catalog. Payloads
// mirror ai.pipestream.proto.inference.v1; they are re-declared here (like
// the jobs payloads) because this file is self-contained for the runtime
// compiler. The canonical proto3 JSON form is the action envelope, so the
// same call works over gRPC, the REST gateway, and MCP.
// ============================================================================

// One conversational turn for inference-generate.
message InferenceChatTurn {
  // The speaker: 'system', 'user', 'assistant', or 'tool'.
  string role = 1;
  // The turn's plain-text content.
  string content = 2;
}

// The input of inference-generate.
message InferenceGenerateRequest {
  // The catalog id of the model to run (see inference-list-models).
  string model = 1;
  // The conversation, oldest first.
  repeated InferenceChatTurn messages = 2;
  // Sampling temperature; 0 is the provider's default.
  double temperature = 3;
  // Nucleus sampling mass; 0 is the provider's default.
  double top_p = 4;
  // Hard cap on generated tokens; 0 lets the provider apply its own cap.
  int32 max_output_tokens = 5;
  // Requests the model's deliberation mode when it has one.
  bool enable_thinking = 6;
}

// Token accounting of one inference generation.
message InferenceUsage {
  // Tokens consumed by the prompt.
  int64 prompt_tokens = 1;
  // Tokens produced by the model.
  int64 completion_tokens = 2;
}

// The outcome of inference-generate.
message InferenceGenerateResponse {
  // True when the model answered; false carries 'error'.
  bool ok = 1;
  // The generated text.
  string text = 2;
  // The catalog model id that ran.
  string model = 3;
  // The SPI provider that executed (e.g. 'openvino').
  string provider = 4;
  // The provider-reported model version or digest; empty when unreported.
  string model_version = 5;
  // Why generation stopped ('stop', 'length', 'aborted').
  string finish_reason = 6;
  // Token accounting.
  InferenceUsage usage = 7;
  // Why the call failed, when ok=false (unknown model, provider error,
  // inference not configured).
  string error = 8;
}

// What one inference catalog model can do.
message InferenceModelCapabilities {
  // The model's total context window in tokens.
  int64 max_context_tokens = 1;
  // The largest supported single-generation output in tokens; 0 = unbounded.
  int32 max_output_tokens = 2;
  // Whether streaming generation is supported.
  bool streaming = 3;
  // Whether the model has a deliberation ('thinking') mode.
  bool thinking = 4;
  // Input modalities beyond text; empty = text only.
  repeated string modalities = 5;
  // Whether the model accepts a strict JSON-Schema response format.
  bool structured_output = 6;
}

// One inference catalog model registration.
message InferenceModelEntry {
  // The catalog id clients request by.
  string id = 1;
  // The SPI provider id that executes this model.
  string provider = 2;
  // The provider-specific target (base URL or gRPC target).
  string endpoint = 3;
  // The model name as the backend knows it; empty = same as id.
  string backend_model = 4;
  // Declared capabilities.
  InferenceModelCapabilities capabilities = 5;
  // Free-form provenance labels (e.g. machine, gpu, role).
  map<string, string> labels = 6;
}

// The input of inference-list-models.
message InferenceListModelsRequest {
  // When set, only entries executed by this provider are returned.
  string provider = 1;
}

// The outcome of inference-list-models.
message InferenceListModelsResponse {
  // True when inference is configured; false carries 'error'.
  bool ok = 1;
  // The registered entries (after optional filtering).
  repeated InferenceModelEntry models = 2;
  // The catalog generation at the time of the listing.
  int64 catalog_generation = 3;
  // Why the read failed, when ok=false (inference not configured).
  string error = 4;
}

// The input of inference-describe-model.
message InferenceDescribeModelRequest {
  // The catalog id to describe.
  string model = 1;
}

// The outcome of inference-describe-model.
message InferenceDescribeModelResponse {
  // True when the model is registered; false carries 'error'.
  bool ok = 1;
  // The catalog entry.
  InferenceModelEntry entry = 2;
  // Why the read failed, when ok=false (unknown model, inference not
  // configured).
  string error = 3;
}
