description = 'The action catalog as a gRPC service: every verb a typed RPC, served descriptor-natively with no generated stubs'

dependencies {
    api project(':protomolt-actions')
    api project(':protomolt-grpc-channel-policy')
    api libs.grpc.api
    api libs.protobuf.java

    implementation project(':protomolt-proto-sources')
    implementation project(':protomolt-gather-git')
    implementation project(':protomolt-emit-okf')
    implementation project(':protomolt-chain')
    implementation project(':protomolt-grpc-invoke')
    api project(':protomolt-grpc-service-workspace')
    implementation project(':protomolt-registry')
    implementation project(':protomolt-codegen')
    // The four chain-jobs verbs (submit-chain, get-job, list-jobs,
    // complete-step) ride the catalog; the store is injected by the server.
    implementation project(':protomolt-jobs-service')
    // The three inference verbs (inference-generate, inference-list-models,
    // inference-describe-model); the facade is injected by the server.
    implementation project(':protomolt-inference-service')
    implementation libs.protobuf.java.util
    implementation libs.grpc.stub
    implementation libs.grpc.services
    implementation libs.grpc.protobuf

    implementation libs.grpc.netty.shaded

    testImplementation project(':protomolt-json')
    testImplementation libs.grpc.inprocess
}
