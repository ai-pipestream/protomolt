plugins {
    alias(libs.plugins.protobuf)
}

description = 'Descriptor-grounded gRPC workflow, artifact, and run-evidence contracts'

dependencies {
    api libs.protobuf.java
    api project(':protomolt-grpc-service-profile')
    // Persisted workflow/evidence fields carry the house validation and
    // sensitivity metadata options.
    api project(':protomolt-protobuf-validation')
    api project(':protomolt-protobuf-metadata')
    // The workflow contract names inference.v1 Usage, AttemptOutcome, and
    // FinishReason in the structured-generation evidence.
    api project(':protomolt-inference-proto')
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.1"
    }
}
