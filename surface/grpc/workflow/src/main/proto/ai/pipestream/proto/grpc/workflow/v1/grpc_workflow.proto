syntax = "proto3";

package ai.pipestream.proto.grpc.workflow.v1;

import "ai/pipestream/proto/inference/v1/inference.proto";
import "ai/pipestream/proto/inference/v1/structured.proto";
import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.grpc.workflow.v1";

// A descriptor-grounded sequence of gRPC calls that can be checked, replayed, and promoted.
message Workflow {
  // Stable slug identity used by repositories and MCP resources.
  string name = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {slug: true, max_len: 128}
  }];
  // Human-readable purpose with no execution semantics.
  string description = 2;
  // Fully-qualified protobuf message accepted as the workflow input.
  string input_type = 3;
  // Exact service profiles and descriptor fingerprints required by the steps.
  repeated ServiceDependency dependencies = 4;
  // Ordered execution steps.
  repeated WorkflowStep steps = 5;
  // Optional projection of the workflow result. When absent, the last step response is returned.
  WorkflowOutput output = 6;
  // Whole-workflow deadline. Step deadlines are nested inside this budget.
  google.protobuf.Duration deadline = 7;
}

// One named and fingerprinted service dependency used by a workflow.
message ServiceDependency {
  // Workflow-local name referenced by steps. The compiler uses service
  // fully-qualified names as aliases, so this is the path-safe reference
  // family, not the slug family.
  string alias = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {path_safe_name: true, max_len: 128}
  }];
  // Stable service-profile name; profile names carry FQNs.
  string service_profile = 2 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {path_safe_name: true, max_len: 128}
  }];
  // Endpoint name within the profile; sanitized from addresses, so path-safe.
  string endpoint = 3 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {path_safe_name: true, max_len: 128}
  }];
  // Lowercase SHA-256 fingerprint of the exact descriptor set used for checking.
  string descriptor_fingerprint = 4 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {sha256_hex: true}
  }];
}

// One serial gRPC call or externally completed step.
message WorkflowStep {
  // Unique step name used in later mapping scopes and evidence.
  string name = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {slug: true, max_len: 128}
  }];
  // Alias of a declared service dependency: the path-safe reference family,
  // because aliases carry service fully-qualified names.
  string dependency = 2 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {path_safe_name: true, max_len: 128}
  }];
  // Fully-qualified gRPC method in Service/Method form. Empty exactly when
  // structured is set: a structured step has no gRPC method.
  string method = 3;
  // Optional boolean CEL gate evaluated against the workflow scope.
  string when = 4;
  // Existing ProtoMolt mapping expressions retained for lossless workflow compilation.
  repeated string rules = 5;
  // Typed CEL mapping rules.
  repeated CelMappingRule cel_rules = 6;
  // Whether declared protobuf validation rules run before the next step.
  bool validate_response = 7;
  // Per-step deadline. Zero inherits the remaining workflow deadline.
  google.protobuf.Duration deadline = 8;
  // How the response is obtained.
  StepCompletion completion = 9;
  // Structured-generation specification. When set, this step fills one
  // protobuf message with a catalog model through the structured-generation
  // coordinator instead of invoking a gRPC method: method is empty, and
  // rules, cel_rules, when, validate_response, and deadline must be unset
  // (the coordinator always validates its typed output). The step still
  // names a declared dependency, which anchors the descriptor set the
  // target type resolves against; replay fingerprint-checks that anchor.
  StructuredGenerationSpec structured = 10 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
  // The typed edge feeding this step: which scope sources it reads, the message
  // type it produces by mapping them, and the optional projection and
  // validation applied before the step executes. When set, the top-level
  // rules and cel_rules must be empty - the edge owns request mapping.
  TypedEdge edge = 11 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
  // Bounded fan-out over a repeated field of the edge's produced message.
  // Requires edge: the items resolve against the produced value.
  FanOutSpec fan_out = 12 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
}

// A typed inter-step edge: ordered scope sources, the message type produced by
// mapping them, and the projection and validation applied before the value
// reaches the step. The produced (or projected) value is the step input: for a
// gRPC step without fan-out it is the method request; for a structured step it
// packs as the generation's grounding; with fan-out each item feeds one branch.
message TypedEdge {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "A typed inter-step edge: scoped sources, the produced type, mapping rules, optional projection and validation."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Ordered scope sources the edge reads: "input" or prior step names.
  repeated string sources = 1 [
    (ai.pipestream.proto.validate.v1.field).repeated = {
      min_items: 1
      max_items: 64
      items: {
        string: {slug: true, max_len: 128}
      }
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The message type the edge produces by mapping the joined scope. For a gRPC
  // step without fan-out this must be the method's request type.
  string produce_type = 2 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$",
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Existing ProtoMolt mapping rules over the joined scope.
  repeated string rules = 3 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 1024,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Typed CEL mapping rules.
  repeated CelMappingRule cel_rules = 4 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 1024,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Optional projection target: a MessageProjection-annotated type. The
  // produced value is projected to this consumer-visible form before
  // validation and delivery; excluded fields never reach the step. Empty when
  // no projection applies.
  string project_to = 5 [
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^$|^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$",
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Validate the produced (or projected) value before the step executes.
  // Rejection happens before any provider invocation.
  bool validate = 6 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
}

// Bounded fan-out over a repeated field of the edge's produced message: each
// item executes one branch with a stable identity, and the branch outputs
// collect, in index order, into one repeated field of the collect type.
message FanOutSpec {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Bounded fan-out: items path, item and concurrency caps, branch failure policy, and the collect target."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Path of the repeated field inside the edge's produced message whose items
  // each execute one branch.
  string items = 1 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string = {
      max_len: 512
      protobuf_fqn: true
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Item cap; a produced message with more items is rejected before execution.
  int32 max_items = 2 [
    (ai.pipestream.proto.validate.v1.field).int32 = {
      gte: 1
      lte: 1024
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // In-flight branch cap.
  int32 max_concurrency = 3 [
    (ai.pipestream.proto.validate.v1.field).int32 = {
      gte: 1
      lte: 64
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // What one failed branch does to the step.
  BranchFailurePolicy failure_policy = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The message type the collected branch outputs form.
  string collect_type = 5 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$",
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The repeated field of collect_type the ordered branch outputs land in; its
  // element type must equal the branch output type.
  string collect_into = 6 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string = {
      max_len: 256
      identifier: true
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// What one failed branch does to a fanned-out step.
enum BranchFailurePolicy {
  // Invalid until explicitly selected by a compiler or author.
  BRANCH_FAILURE_POLICY_UNSPECIFIED = 0;
  // The first branch failure fails the step; remaining branches are abandoned.
  BRANCH_FAILURE_POLICY_FAIL_FAST = 1;
  // Failed branches are recorded; the collect succeeds with the survivors.
  BRANCH_FAILURE_POLICY_CONTINUE = 2;
}

// A structured-generation workflow step: fill one message type with one model.
message StructuredGenerationSpec {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "A structured-generation workflow step: target protobuf type, catalog model, and bounded attempts."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Fully qualified message type the step fills; must resolve in the
  // dependency's descriptor set.
  string target_type = 1 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$",
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Catalog model id; must declare the structured-output capability.
  // Bounded to 256 characters by WorkflowValidation.
  string model = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Attempt cap; 0 applies the coordinator default. Never exceeds 3.
  int32 max_attempts = 3 [
    (ai.pipestream.proto.validate.v1.field).int32 = {
      gte: 0
      lte: 3
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// A CEL mapping rule with an explicit destination field path.
message CelMappingRule {
  // Optional boolean filter.
  string filter = 1;
  // Optional selector expression.
  string selector = 2;
  // Required target field path.
  string target = 3;
  // Ordered fallback expressions.
  repeated string fallback = 4;
}

// Workflow result projection.
message WorkflowOutput {
  // Fully-qualified protobuf output message.
  string type = 1;
  // Existing ProtoMolt mapping expressions retained for lossless workflow compilation.
  repeated string rules = 2;
  // Typed CEL mapping rules.
  repeated CelMappingRule cel_rules = 3;
}

// Response acquisition mode for a workflow step.
enum StepCompletion {
  // Invalid until explicitly selected by a compiler or author.
  STEP_COMPLETION_UNSPECIFIED = 0;
  // ProtoMolt invokes the declared method.
  STEP_COMPLETION_LIVE = 1;
  // An external actor supplies the response through a bounded job workflow.
  STEP_COMPLETION_EXTERNAL = 2;
}

// Immutable promotion envelope for one named workflow version.
message VersionedWorkflow {
  // Validated workflow content.
  Workflow workflow = 1;
  // Immutable slug version selected by the promoter.
  string version = 2 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {slug: true, max_len: 128}
  }];
  // Lowercase SHA-256 fingerprint of the serialized workflow.
  string workflow_fingerprint = 3 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {sha256_hex: true}
  }];
  // Time this version was promoted.
  google.protobuf.Timestamp created_at = 4;
}

// Content-addressed reference to bounded evidence bytes stored outside agent context.
message ArtifactReference {
  // Lowercase SHA-256 fingerprint of the stored bytes.
  string sha256 = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {sha256_hex: true}
  }];
  // IANA media type of the stored bytes.
  string media_type = 2 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {mime_type: true}
  }];
  // Exact byte length of the stored content.
  uint64 size_bytes = 3;
  // Whether the configured redaction pass ran before the bytes were persisted.
  bool redacted = 4;
}

// Evidence from one bounded workflow probe or replay.
message RunEvidence {
  // Stable slug identity for this run.
  string run_id = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {slug: true, max_len: 128}
  }];
  // Workflow identity used for the run.
  string workflow_name = 2 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {slug: true, max_len: 128}
  }];
  // Promoted version when one was used; empty is allowed for a draft probe.
  string workflow_version = 3 [(ai.pipestream.proto.validate.v1.field) = {
    ignore_if_zero: true
    string: {slug: true, max_len: 128}
  }];
  // Lowercase SHA-256 fingerprint of the exact workflow content executed.
  string workflow_fingerprint = 4 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {sha256_hex: true}
  }];
  // Final or current run state.
  RunStatus status = 5;
  // Start time recorded by the execution host.
  google.protobuf.Timestamp started_at = 6;
  // Completion time for terminal states.
  google.protobuf.Timestamp completed_at = 7;
  // Exact service dependencies observed for the run.
  repeated ServiceDependency dependencies = 8;
  // Workflow input fixture after configured redaction.
  ArtifactReference input_artifact = 9;
  // Final output fixture, when execution produced one.
  ArtifactReference output_artifact = 10;
  // Ordered per-step evidence.
  repeated StepEvidence steps = 11;
  // Bounded diagnostic summary for a failed or cancelled run.
  string failure_summary = 12;
}

// Evidence from one workflow step.
message StepEvidence {
  // Workflow step name.
  string step_name = 1 [(ai.pipestream.proto.validate.v1.field) = {
    required: true
    string: {slug: true, max_len: 128}
  }];
  // Exact fully-qualified method observed during the run.
  string method = 2;
  // Final step state.
  StepStatus status = 3;
  // Step start time.
  google.protobuf.Timestamp started_at = 4;
  // Step completion time for terminal states.
  google.protobuf.Timestamp completed_at = 5;
  // Request fixture after configured redaction, when the step was invoked.
  ArtifactReference request_artifact = 6;
  // Response fixture after configured redaction, when one was produced.
  ArtifactReference response_artifact = 7;
  // Canonical gRPC status code in the range 0 through 16.
  int32 grpc_status_code = 8;
  // Bounded diagnostic summary.
  string summary = 9;
  // Structured-generation provenance, present exactly when the workflow step
  // carries a StructuredGenerationSpec. This is the bounded, redacted
  // evidence contract for a structured step: the raw model output text and
  // the rendered retry feedback are NEVER persisted; prompt evidence is the
  // SHA-256 fingerprint of the rendered instructions, schema evidence is
  // the SHA-256 fingerprint of the response JSON Schema, and the response
  // evidence is the sensitivity-masked typed message in the step's response
  // artifact. An empty method is allowed exactly when this is present.
  StructuredGenerationEvidence structured = 10 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
  // Typed-edge provenance, present exactly when the workflow step carries a
  // TypedEdge. Binds the evidence to the exact edge by fingerprint and records
  // the validation verdict, the declared source count, the fan-out
  // cardinality, and every branch outcome. The masked edge-produced message is
  // the step's request artifact; with fan-out the masked collected message is
  // the response artifact. Raw values beyond those artifacts and the
  // per-branch response artifacts are never persisted.
  EdgeEvidence edge = 11 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
}

// Bounded typed-edge provenance for one workflow step: a fingerprint, a verdict,
// counts, and per-branch outcomes. No produced or projected value is ever
// recorded here - those live, masked, in the artifacts.
message EdgeEvidence {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Bounded typed-edge provenance: edge fingerprint, validation verdict, source and item counts, branch outcomes."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Lowercase SHA-256 of the serialized TypedEdge (+ FanOutSpec when present)
  // from the workflow. Binds this evidence to the exact edge.
  string edge_fingerprint = 1 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.sha256_hex = true,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The produced (or projected) value validated clean before execution; with
  // fan-out, that every item did. True also when the edge declares no
  // validation; false records a pre-invocation rejection.
  bool validation_passed = 2 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
  // Declared scope sources read.
  int32 source_count = 3 [
    (ai.pipestream.proto.validate.v1.field).int32.gte = 1,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Fan-out cardinality: items found; 0 when the step is not fanned out.
  int32 item_count = 4 [
    (ai.pipestream.proto.validate.v1.field).int32 = {
      gte: 0
      lte: 1024
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Per-branch outcomes in stable identity order; empty without fan-out. Under
  // the fail-fast policy, branches abandoned after the first failure are
  // recorded FAILED with an abandonment summary, so the branch count always
  // equals the item count.
  repeated BranchEvidence branches = 5 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 1024,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// The outcome of one fan-out branch.
message BranchEvidence {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "One fan-out branch: stable identity, terminal status, masked output artifact, bounded failure summary."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Stable identity: "<step-name>#<zero-based index>".
  string branch_id = 1 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}#[0-9]{1,4}$",
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Terminal branch state: SUCCEEDED or FAILED only.
  StepStatus status = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The masked branch output, when the branch produced one.
  ArtifactReference response_artifact = 3 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
  // Bounded failure detail for a failed branch.
  string summary = 4 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 16384,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// Bounded structured-generation provenance for one workflow step. Every field
// is a scalar, an enum, a fingerprint, or token accounting: no model output
// text and no feedback text is ever recorded here.
message StructuredGenerationEvidence {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Bounded structured-generation provenance without raw model output or retry feedback."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The message type that was filled; echoes the step's specification.
  string target_type = 1 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$",
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The catalog model id that produced the final attempt.
  string model = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The SPI provider that executed the final attempt.
  string provider = 3 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 128,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The provider-reported model version or digest; empty when the provider
  // does not report one.
  string model_version = 4 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 512,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Lowercase SHA-256 hex of the rendered instructions the model was
  // briefed with. The instructions themselves are never persisted.
  string prompt_fingerprint = 5 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.sha256_hex = true,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Lowercase SHA-256 hex of the response JSON Schema the model was
  // constrained with. The schema itself is never persisted.
  string schema_fingerprint = 6 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.validate.v1.field).string.sha256_hex = true,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Whether the final typed output re-validated clean against the target
  // type's declared rules.
  bool validation_passed = 7 [(ai.pipestream.proto.meta.v1.field).sensitivity = "internal"];
  // Token accounting summed across all attempts.
  ai.pipestream.proto.inference.v1.Usage total_usage = 8 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Every recorded attempt, oldest first; 1 to 3 entries on a succeeded
  // step, empty only when the step failed before the first model
  // invocation. Attempts carry scalars only - never response text.
  repeated StructuredAttemptEvidence attempts = 9 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 3,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// The scalar provenance of one generation attempt. The raw model output and
// the retry feedback of the attempt are never persisted.
message StructuredAttemptEvidence {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Scalar provenance for one structured-generation attempt."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The 1-based attempt number; attempts are sequential.
  int32 attempt = 1 [
    (ai.pipestream.proto.validate.v1.field).int32 = {
      gte: 1
      lte: 3
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // How the attempt ended.
  ai.pipestream.proto.inference.v1.AttemptOutcome outcome = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Token accounting of this attempt.
  ai.pipestream.proto.inference.v1.Usage usage = 3 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Why the model stopped generating on this attempt.
  ai.pipestream.proto.inference.v1.FinishReason finish_reason = 4 [
    (ai.pipestream.proto.validate.v1.field).enum.defined_only = true,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
