plugins { id 'java' }

// The two metadata modes never share outputs: each compiles, resolves and
// reports into its own build directory, so an up-to-date success in one mode
// can never be reused as proof of the other mode.
def pomOnlyMode = providers.gradleProperty('pomOnly').isPresent()
def metadataMode = pomOnlyMode ? 'pom-only' : 'gradle-module'
layout.buildDirectory = layout.projectDirectory.dir("build-${metadataMode}")

def candidateVersion = providers.gradleProperty('candidateVersion').get()
def stagedRepository = new File(providers.gradleProperty('repositoryConsumerRepository').get()).canonicalPath

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = uri(stagedRepository)
                if (pomOnlyMode) {
                    metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
                }
            }
        }
        filter { includeGroup 'ai.pipestream' }
    }
    // Disposable negative fixtures only. The group sits outside the exclusive
    // ai.pipestream filter and the repository lives under the mode-specific
    // build directory; the staged candidate repository is never contaminated.
    maven {
        name = 'NegativeFixtures'
        url = uri(layout.buildDirectory.dir('negative-fixtures/repository').map { it.asFile }.get())
        content { includeGroup 'ai.pipestream.negative' }
    }
    mavenCentral()
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
sourceSets { grpcClient; publicationClient; providerDiscovery; redisConsumer; brokenDiscoveryProbe }
configurations {
    blobSpiOnly; repositorySpiOnly; codecOnly; spiPlusCodec
    s3Only; redisOnly; cacheOnly; cacheWithRedis; grpcOnly
}
dependencies {
    repositorySpiOnly "ai.pipestream:protomolt-repo-spi:${candidateVersion}"
    implementation "ai.pipestream:protomolt-repo-spi:${candidateVersion}"
    grpcClientImplementation "ai.pipestream:protomolt-repo-blob-grpc:${candidateVersion}"
    publicationClientImplementation "ai.pipestream:protomolt-repo-publication-grpc:${candidateVersion}"
    providerDiscoveryImplementation "ai.pipestream:protomolt-repo-blob-spi:${candidateVersion}"
    providerDiscoveryImplementation "ai.pipestream:protomolt-repo-blob-s3:${candidateVersion}"
    providerDiscoveryImplementation "ai.pipestream:protomolt-repo-blob-redis:${candidateVersion}"
    redisConsumerImplementation "ai.pipestream:protomolt-repo-blob-spi:${candidateVersion}"
    redisConsumerImplementation "ai.pipestream:protomolt-repo-blob-redis:${candidateVersion}"
    brokenDiscoveryProbeImplementation "ai.pipestream:protomolt-repo-blob-spi:${candidateVersion}"
    blobSpiOnly "ai.pipestream:protomolt-repo-blob-spi:${candidateVersion}"
    s3Only "ai.pipestream:protomolt-repo-blob-s3:${candidateVersion}"
    redisOnly "ai.pipestream:protomolt-repo-blob-redis:${candidateVersion}"
    grpcOnly "ai.pipestream:protomolt-repo-blob-grpc:${candidateVersion}"
    cacheOnly "ai.pipestream:protomolt-repo-blob-cache:${candidateVersion}"
    codecOnly "ai.pipestream:protomolt-repo-codec:${candidateVersion}"
    spiPlusCodec "ai.pipestream:protomolt-repo-spi:${candidateVersion}"
    spiPlusCodec "ai.pipestream:protomolt-repo-codec:${candidateVersion}"
    cacheWithRedis "ai.pipestream:protomolt-repo-blob-cache:${candidateVersion}"
    cacheWithRedis "ai.pipestream:protomolt-repo-blob-redis:${candidateVersion}"
    implementation "ai.pipestream:protomolt-repo-codec:${candidateVersion}"
    implementation "ai.pipestream:protomolt-repo-blob-spi:${candidateVersion}"
}

// --- Dependency-family classifier -------------------------------------------
// Boundary decisions use group:artifact identity, not artifact-name fragments.
// Families: SQL/ORM/pooling/migration, Kafka, repository server/engine, AWS,
// Azure and Redis. Azure has no implementation anywhere; no row allows it.
def familyOf
familyOf = { String group, String name ->
    if (group == 'software.amazon.awssdk') return 'aws-sdk'
    if (group.startsWith('com.azure')) return 'azure-sdk'
    if (group == 'redis.clients') return 'redis-sdk'
    if (group == 'org.postgresql' || group == 'org.hibernate' || group == 'org.hibernate.orm'
            || group == 'com.zaxxer' || group == 'org.flywaydb'
            || ['hibernate-core', 'HikariCP', 'postgresql', 'flyway-core'].contains(name)) return 'sql'
    if (group == 'org.apache.kafka') return 'kafka'
    if (group == 'ai.pipestream'
            && ['protomolt-repo-container', 'protomolt-repo-service', 'protomolt-repo-engine'].contains(name)) {
        return 'server-engine'
    }
    return null
}
def resolvedModules
resolvedModules = { Object classpath ->
    classpath.incoming.resolutionResult.allComponents
            .collect { it.moduleVersion }.findAll { it != null }
}
def familyLeaks
familyLeaks = { Object classpath, Set<String> allowed ->
    resolvedModules(classpath).findAll { module ->
        def family = familyOf(module.group, module.name)
        family != null && !allowed.contains(family)
    }.collect { module -> "${module.group}:${module.name}:${module.version} [${familyOf(module.group, module.name)}]" }
}
def assertBoundary
assertBoundary = { String row, Object classpath, Set<String> allowed ->
    def leaks = familyLeaks(classpath, allowed)
    if (!leaks.isEmpty()) {
        throw new GradleException(row + ' resolved forbidden dependency families: ' + leaks.sort())
    }
}

// Row -> allowed provider families. Protobuf/gRPC client libraries are
// legitimate in client rows; the byte SPI row is additionally pinned below to
// contain nothing but its own artifact (JDK-only).
def boundaryRows = [
    'byte-spi-alone':                          [classpath: { configurations.blobSpiOnly }, allowed: [] as Set],
    'repository-spi-alone':                    [classpath: { configurations.repositorySpiOnly }, allowed: [] as Set],
    'codec-alone':                             [classpath: { configurations.codecOnly }, allowed: [] as Set],
    'repository-spi-plus-codec':               [classpath: { configurations.spiPlusCodec }, allowed: [] as Set],
    's3-provider-alone':                       [classpath: { configurations.s3Only }, allowed: ['aws-sdk'] as Set],
    'redis-provider-alone':                    [classpath: { configurations.redisOnly }, allowed: ['redis-sdk'] as Set],
    'cache-alone':                             [classpath: { configurations.cacheOnly }, allowed: [] as Set],
    'cache-with-selected-redis-provider':      [classpath: { configurations.cacheWithRedis }, allowed: ['redis-sdk'] as Set],
    'blob-grpc-client-alone':                  [classpath: { configurations.grpcOnly }, allowed: [] as Set],
    'publication-grpc-client-alone':           [classpath: { configurations.publicationClientRuntimeClasspath }, allowed: [] as Set],
    'composite-consumer-main':                 [classpath: { configurations.runtimeClasspath }, allowed: [] as Set],
    'blob-grpc-consumer-sourceset':            [classpath: { configurations.grpcClientRuntimeClasspath }, allowed: [] as Set],
    'provider-discovery-probe':                [classpath: { configurations.providerDiscoveryRuntimeClasspath }, allowed: ['aws-sdk', 'redis-sdk'] as Set],
    'redis-published-consumer-probe':          [classpath: { configurations.redisConsumerRuntimeClasspath }, allowed: ['redis-sdk'] as Set],
    'broken-discovery-probe':                  [classpath: { configurations.brokenDiscoveryProbeRuntimeClasspath }, allowed: [] as Set],
]

tasks.register('verifyConsumerBoundaries') {
    group = 'verification'
    description = 'Reject forbidden dependency families in every published consumer row'
    inputs.property('metadataMode', metadataMode)
    inputs.property('candidateVersion', candidateVersion)
    doLast {
        def spiModules = resolvedModules(configurations.blobSpiOnly)
                .collect { it.name }.findAll { it != project.name }
        if (spiModules != ['protomolt-repo-blob-spi']) {
            throw new GradleException('Byte SPI must be JDK-only: ' + spiModules)
        }
        boundaryRows.each { row, spec -> assertBoundary(row, spec.classpath(), spec.allowed) }
        def publication = resolvedModules(configurations.publicationClientRuntimeClasspath)
        logger.lifecycle('Published publication client runtime (' + metadataMode + '): '
                + publication.collect { "${it.group}:${it.name}:${it.version}" }.sort())
    }
}

def stagedJar
stagedJar = { Configuration config, String artifactPrefix ->
    def jar = config.incoming.artifacts.artifactFiles.files
            .find { it.name.startsWith(artifactPrefix) && it.name.endsWith('.jar') }
    if (jar == null) throw new GradleException('staged jar not found: ' + artifactPrefix)
    return jar
}

