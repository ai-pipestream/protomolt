// Repackage a staged provider jar into a deliberately corrupted fixture:
// service entries stripped, optionally replaced with a bogus registration.
def repackageProviderJar
repackageProviderJar = { File source, File target, String serviceReplacement ->
    new java.util.jar.JarOutputStream(new FileOutputStream(target)).withCloseable { out ->
        out.putNextEntry(new java.util.jar.JarEntry('DELIBERATE-TEST-FIXTURE.txt'))
        out.write(('deliberately corrupted packaging fixture for negative discovery detection; source='
                + source.name + '\n').getBytes(java.nio.charset.StandardCharsets.UTF_8))
        out.closeEntry()
        new java.util.jar.JarFile(source).withCloseable { jar ->
            jar.entries().each { entry ->
                if (entry.name.startsWith('META-INF/services/')) return
                out.putNextEntry(new java.util.jar.JarEntry(entry.name))
                if (!entry.directory) out.write(jar.getInputStream(entry).bytes)
                out.closeEntry()
            }
        }
        if (serviceReplacement != null) {
            out.putNextEntry(new java.util.jar.JarEntry(
                    'META-INF/services/ai.protomolt.proto.repo.blob.spi.BlobStoreProvider'))
            out.write((serviceReplacement + '\n').getBytes(java.nio.charset.StandardCharsets.UTF_8))
            out.closeEntry()
        }
    }
}

['verifyBrokenServiceMissing': 'missing', 'verifyBrokenServiceWrongClass': 'wrong-class'].each { taskName, mode ->
    tasks.register(taskName, JavaExec) {
        dependsOn brokenDiscoveryProbeClasses
        mainClass = 'BrokenDiscoveryProbe'
        inputs.property('metadataMode', metadataMode)
        doFirst {
            def fixtureDir = layout.buildDirectory.dir('negative-fixtures/broken-jars').get().asFile
            fixtureDir.mkdirs()
            def redisJar = stagedJar(configurations.redisOnly, 'protomolt-repo-blob-redis-')
            def fixture = new File(fixtureDir, 'protomolt-repo-blob-redis-DELIBERATE-FIXTURE-' + mode + '.jar')
            repackageProviderJar(redisJar, fixture,
                    mode == 'wrong-class' ? 'ai.protomolt.proto.repo.blob.redis.DeliberatelyMissingProvider' : null)
            classpath = files(sourceSets.brokenDiscoveryProbe.output.classesDirs,
                    stagedJar(configurations.redisOnly, 'protomolt-repo-blob-spi-'), fixture)
            args mode
        }
    }
}

tasks.register('verifyForbiddenDependencyDetection') {
    group = 'verification'
    description = 'Prove the boundary gate detects an injected forbidden runtime dependency'
    inputs.property('metadataMode', metadataMode)
    inputs.property('candidateVersion', candidateVersion)
    doLast {
        def jedis = resolvedModules(configurations.redisOnly)
                .find { it.group == 'redis.clients' && it.name == 'jedis' }
        if (jedis == null) throw new GradleException('jedis missing from the positive Redis provider graph')
        def fixtureVersion = candidateVersion + '-DELIBERATE-FIXTURE'
        def moduleDir = layout.buildDirectory.dir(
                'negative-fixtures/repository/ai/pipestream/negative/protomolt-repo-blob-spi-injected/'
                + fixtureVersion).get().asFile
        moduleDir.mkdirs()
        def jarFile = new File(moduleDir, 'protomolt-repo-blob-spi-injected-' + fixtureVersion + '.jar')
        new java.util.jar.JarOutputStream(new FileOutputStream(jarFile)).withCloseable { out ->
            out.putNextEntry(new java.util.jar.JarEntry('DELIBERATE-TEST-FIXTURE.txt'))
            out.write('deliberately corrupted metadata fixture: injects a forbidden runtime dependency\n'
                    .getBytes(java.nio.charset.StandardCharsets.UTF_8))
            out.closeEntry()
        }
        new File(moduleDir, 'protomolt-repo-blob-spi-injected-' + fixtureVersion + '.pom').text = (
                '<?xml version="1.0" encoding="UTF-8"?>\n'
                + '<!-- DELIBERATE TEST FIXTURE: disposable negative publication, never a real artifact. -->\n'
                + '<project xmlns="http://maven.apache.org/POM/4.0.0">\n'
                + '  <modelVersion>4.0.0</modelVersion>\n'
                + '  <groupId>ai.pipestream.negative</groupId>\n'
                + '  <artifactId>protomolt-repo-blob-spi-injected</artifactId>\n'
                + "  <version>${fixtureVersion}</version>\n"
                + '  <packaging>jar</packaging>\n'
                + '  <dependencies>\n'
                + '    <dependency>\n'
                + '      <groupId>redis.clients</groupId>\n'
                + '      <artifactId>jedis</artifactId>\n'
                + "      <version>${jedis.version}</version>\n"
                + '      <scope>runtime</scope>\n'
                + '    </dependency>\n'
                + '  </dependencies>\n'
                + '</project>\n')
        def fixtureConfiguration = configurations.detachedConfiguration(
                dependencies.create("ai.pipestream.negative:protomolt-repo-blob-spi-injected:${fixtureVersion}"))
        def leaks = familyLeaks(fixtureConfiguration, Set.of())
        if (!leaks.any { it.startsWith('redis.clients:jedis:') }) {
            throw new GradleException('Boundary gate failed to detect the injected forbidden dependency in: '
                    + resolvedModules(fixtureConfiguration))
        }
        logger.lifecycle('NEGATIVE-FIXTURE forbidden dependency detected as expected (' + metadataMode + '): '
                + leaks.sort())
    }
}

tasks.register('inspectPublishedMetadata') {
    group = 'verification'
    description = 'Inspect the staged POM and Gradle module metadata of the published consumer modules'
    inputs.property('candidateVersion', candidateVersion)
    def expected = [
        'protomolt-repo-blob-spi': [],
        'protomolt-repo-blob-s3': ['compile:ai.pipestream:protomolt-repo-blob-spi',
                                   'compile:software.amazon.awssdk:s3',
                                   'runtime:software.amazon.awssdk:url-connection-client'],
        'protomolt-repo-blob-redis': ['compile:ai.pipestream:protomolt-repo-blob-spi',
                                      'runtime:redis.clients:jedis'],
        'protomolt-repo-blob-cache': ['compile:ai.pipestream:protomolt-repo-blob-spi',
                                      'runtime:org.slf4j:slf4j-api'],
        'protomolt-repo-blob-grpc': ['compile:ai.pipestream:protomolt-repo-blob-spi',
                                     'compile:ai.pipestream:protomolt-repo-proto',
                                     'runtime:ai.pipestream:protomolt-repo-codec',
                                     'runtime:ai.pipestream:protomolt-protobuf-validation'],
        'protomolt-repo-spi': ['compile:ai.pipestream:protomolt-repo-proto',
                               'runtime:ai.pipestream:protomolt-descriptors'],
        'protomolt-repo-codec': ['compile:ai.pipestream:protomolt-repo-proto',
                                 'compile:com.google.protobuf:protobuf-java',
                                 'runtime:ai.pipestream:protomolt-descriptors',
                                 'runtime:com.google.protobuf:protobuf-java-util'],
        'protomolt-repo-publication-grpc': ['compile:ai.pipestream:protomolt-repo-spi',
                                            'compile:ai.pipestream:protomolt-repo-proto',
                                            'compile:ai.pipestream:protomolt-repo-blob-spi'],
    ]
    doLast {
        def report = []
        expected.each { module, expectedDependencies ->
            def dir = new File(stagedRepository, "ai/pipestream/${module}/${candidateVersion}")
            def pom = new File(dir, "${module}-${candidateVersion}.pom")
            def moduleMetadata = new File(dir, "${module}-${candidateVersion}.module")
            if (!pom.isFile()) throw new GradleException('staged POM missing: ' + pom)
            if (!moduleMetadata.isFile()) throw new GradleException('staged Gradle module metadata missing: ' + moduleMetadata)
            if (!pom.text.contains('published-with-gradle-metadata')) {
                throw new GradleException('POM lacks the Gradle metadata marker: ' + pom)
            }
            def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
            factory.namespaceAware = false
            def parsed = factory.newDocumentBuilder().parse(pom)
            def nodes = parsed.getElementsByTagName('dependency')
            def actual = (0..<nodes.length).collect { index ->
                def dependency = nodes.item(index)
                def scopes = dependency.getElementsByTagName('scope')
                def scope = scopes.length > 0 ? scopes.item(0).textContent.trim() : 'compile'
                (scope ?: 'compile') + ':' + dependency.getElementsByTagName('groupId').item(0).textContent.trim() +
                        ':' + dependency.getElementsByTagName('artifactId').item(0).textContent.trim()
            }.sort()
            if (actual != expectedDependencies.sort()) {
                throw new GradleException(module + ' POM dependencies differ\nexpected: ' + expectedDependencies.sort()
                        + '\nactual: ' + actual)
            }
            report.add(module + ' -> ' + (actual ?: ['<no dependencies>']).join(', '))
        }
        def reportDir = layout.buildDirectory.dir('reports/published-metadata').get().asFile
        reportDir.mkdirs()
        new File(reportDir, 'pom-dependencies.txt').text =
                (["staged POM dependency inspection (${metadataMode})", ''] + report).join('\n') + '\n'
        logger.lifecycle('Published metadata inspection passed for ' + expected.size() + ' modules')
    }
}

tasks.register('recordConsumerMatrix') {
    group = 'verification'
    description = 'Record declared and resolved module inventories for every published consumer row'
    inputs.property('metadataMode', metadataMode)
    inputs.property('candidateVersion', candidateVersion)
    outputs.upToDateWhen { false }
    doLast {
        def reportDir = layout.buildDirectory.dir('reports/consumer-matrix').get().asFile
        reportDir.mkdirs()
        def index = ['metadata-mode: ' + metadataMode, 'candidate: ' + candidateVersion, '']
        boundaryRows.each { row, spec ->
            def classpath = spec.classpath()
            def declared = classpath.allDependencies
                    .collect { "${it.group}:${it.name}:${it.version}" }.unique().sort()
            def resolved = resolvedModules(classpath)
                    .collect { "${it.group}:${it.name}:${it.version}" }.unique().sort()
            new File(reportDir, row + '.txt').text =
                    (["row: ${row}", "metadata-mode: ${metadataMode}", 'allowed-provider-families: '
                            + spec.allowed.sort(), '', 'declared:'] + declared
                            + ['', 'resolved:'] + resolved).join('\n') + '\n'
            index.add(row + ' -> ' + resolved.size() + ' resolved modules')
        }
        new File(reportDir, 'index.txt').text = index.join('\n') + '\n'
    }
}

tasks.register('recordStagedArtifactHashes') {
    group = 'verification'
    description = 'Record SHA-256 hashes of the staged jars and metadata files'
    outputs.upToDateWhen { false }
    doLast {
        def root = new File(stagedRepository)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def lines = []
        root.eachFileRecurse { file ->
            if (!file.name.endsWith('.jar') && !file.name.endsWith('.pom') && !file.name.endsWith('.module')) return
            if (file.name.contains('-sources') || file.name.contains('-javadoc')) return
            digest.reset()
            file.withInputStream { input ->
                def buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
            }
            lines.add(digest.digest().encodeHex().toString() + '  ' + root.toPath().relativize(file.toPath()))
        }
        def reportDir = layout.buildDirectory.dir('reports/staged-artifacts').get().asFile
        reportDir.mkdirs()
        new File(reportDir, 'sha256.txt').text = lines.sort().join('\n') + '\n'
        logger.lifecycle('Recorded ' + lines.size() + ' staged artifact hashes')
    }
}

check {
    dependsOn 'verifyConsumerBoundaries', 'verifyConsumer', 'verifyProviderDiscovery',
            'verifyRedisPublishedConsumer', 'verifyForbiddenDependencyDetection',
            'verifyBrokenServiceMissing', 'verifyBrokenServiceWrongClass',
            'inspectPublishedMetadata', 'recordConsumerMatrix', 'recordStagedArtifactHashes'
}
