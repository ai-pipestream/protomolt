plugins {
    alias(libs.plugins.protobuf)
}

description = 'Kafka protobuf serde: the Confluent wire format, with the schema\'s own declared rules enforced on write'

repositories {
    // Test-scoped interop verification only: the Confluent serde artifacts are not on Maven Central.
    maven { url = 'https://packages.confluent.io/maven/' }
}

// Confluent's serde artifacts pull their forked kafka-clients (8.0.6-ccs); the interop tests
// must run against the kafka-clients this project ships.
configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }
        .configureEach {
            resolutionStrategy.force 'org.apache.kafka:kafka-clients:3.9.2'
        }

dependencies {
    api libs.protobuf.java
    // The canonical Confluent wire-format reader/writer; api because ConfluentWireFormat is
    // part of this serde's published surface (callers and tests import it directly).
    api project(':protomolt-kafka-wire')

    // The application brings its own Kafka clients; a serde must not pin them.
    compileOnly libs.kafka.clients

    implementation project(':protomolt-schema-confluent')
    implementation project(':protomolt-compat')
    implementation project(':protomolt-protobuf-validation')
    implementation project(':protomolt-protobuf-metadata')
    implementation project(':protomolt-protobuf-quality')

    testImplementation libs.kafka.clients
    testImplementation project(':protomolt-sources')
    testImplementation libs.slf4j.simple
    testImplementation libs.testcontainers.redpanda
    testImplementation libs.testcontainers.junit.jupiter

    // Interop verification: the reference Confluent serde and client against our wire format
    // and our registry server. Test-scoped; nothing Confluent enters the main source set.
    testImplementation project(':protomolt-registry-service')
    testImplementation project(':protomolt-repo-proto')
    testImplementation libs.confluent.kafka.protobuf.serializer
    testImplementation libs.confluent.kafka.schema.registry.client
}

// Test fixtures only: generated classes to prove the deserializer returns them.
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
}
