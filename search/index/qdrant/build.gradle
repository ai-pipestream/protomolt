plugins {
    alias(libs.plugins.protobuf)
}

description = 'Qdrant point mapper plugin (ServiceLoader) and a thin gRPC sink'

dependencies {
    api project(':protomolt-search-index-spi')
    api project(':protomolt-mapper')
    // The mapper reads vectors and chunk text out of the repo Document's
    // search_metadata.semantic_results.
    api project(':protomolt-repo-proto')

    // Validation on write: declared rules (ai.protomolt.proto.validate.v1) gate the
    // document before it becomes points.
    implementation project(':protomolt-protobuf-validation')

    api libs.protobuf.java
    api libs.protobuf.java.util
    implementation libs.grpc.api
    implementation libs.grpc.stub
    implementation libs.grpc.protobuf
    implementation libs.grpc.netty.shaded
    // grpc codegen emits @javax.annotation.Generated.
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.grpc.inprocess
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
