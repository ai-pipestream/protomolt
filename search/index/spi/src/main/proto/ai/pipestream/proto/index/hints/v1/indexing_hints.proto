syntax = "proto3";

package ai.pipestream.proto.index.hints.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.index.hints";
option java_outer_classname = "IndexingHintsProto";

import "google/protobuf/descriptor.proto";

// Engine-agnostic indexing hint attached to a field.
// Lucene / OpenSearch / Solr plugins interpret IndexFieldType; NDJSON ignores it.
// Same FieldOptions pattern as Protovalidate — no Buf CLI required; plain protoc is enough.
enum IndexFieldType {
  // No explicit type: the hint source infers the kind from the proto descriptor;
  // explicitly-set attributes on the hint still win over the inferred defaults.
  INDEX_FIELD_TYPE_UNSPECIFIED = 0;
  // Full-text analyzed string (Lucene TextField, OpenSearch text).
  INDEX_FIELD_TYPE_TEXT = 1;
  // Exact-value string, not analyzed (OpenSearch keyword, Solr StrField).
  INDEX_FIELD_TYPE_KEYWORD = 2;
  // 32-bit integer point field.
  INDEX_FIELD_TYPE_INT32 = 3;
  // 64-bit integer point field.
  INDEX_FIELD_TYPE_INT64 = 4;
  // 32-bit floating-point point field.
  INDEX_FIELD_TYPE_FLOAT = 5;
  // 64-bit floating-point point field.
  INDEX_FIELD_TYPE_DOUBLE = 6;
  // Boolean field.
  INDEX_FIELD_TYPE_BOOLEAN = 7;
  // Date/time field, typically sourced from google.protobuf.Timestamp.
  INDEX_FIELD_TYPE_DATE = 8;
  // Opaque bytes field, stored but not analyzed.
  INDEX_FIELD_TYPE_BINARY = 9;
  // KNN vector field over a repeated numeric field.
  INDEX_FIELD_TYPE_VECTOR = 10;
  // Structured message field indexed as one embedded object (OpenSearch object).
  INDEX_FIELD_TYPE_OBJECT = 11;
  // Message field whose entries are indexed as separate nested documents
  // (OpenSearch nested).
  INDEX_FIELD_TYPE_NESTED = 12;
  // Do not index this field at all.
  INDEX_FIELD_TYPE_SKIP = 13;
  // Range types apply to singular message fields whose type declares exactly one
  // matching bound pair named (gte, lte) or (min, max).
  INDEX_FIELD_TYPE_INT_RANGE = 14;
  // Range of int64 values over a bound-pair message.
  INDEX_FIELD_TYPE_LONG_RANGE = 15;
  // Range of float values over a bound-pair message.
  INDEX_FIELD_TYPE_FLOAT_RANGE = 16;
  // Range of double values over a bound-pair message.
  INDEX_FIELD_TYPE_DOUBLE_RANGE = 17;
  // Range of date/time values over a bound-pair message.
  INDEX_FIELD_TYPE_DATE_RANGE = 18;
}

// KNN similarity function (Lucene VectorSimilarityFunction, OpenSearch space_type,
// Solr similarityFunction). Unspecified defaults to cosine.
enum VectorSimilarity {
  // Engine default; consumers treat it as cosine.
  VECTOR_SIMILARITY_UNSPECIFIED = 0;
  // Cosine similarity.
  VECTOR_SIMILARITY_COSINE = 1;
  // Dot product (requires normalized vectors for ranking to match cosine).
  VECTOR_SIMILARITY_DOT_PRODUCT = 2;
  // Euclidean (L2) distance.
  VECTOR_SIMILARITY_L2 = 3;
  // Maximum inner product.
  VECTOR_SIMILARITY_MAX_INNER_PRODUCT = 4;
}

// KNN element encoding. Unspecified defaults to float32.
enum VectorElementType {
  // Engine default; consumers treat it as float32.
  VECTOR_ELEMENT_TYPE_UNSPECIFIED = 0;
  // One 32-bit float per vector element.
  VECTOR_ELEMENT_TYPE_FLOAT32 = 1;
  // One signed byte per vector element, for quantized vectors.
  VECTOR_ELEMENT_TYPE_BYTE = 2;
}

// How map<K,V> fields land in engine documents. Unspecified keeps the engine's
// documented default (OpenSearch: FLATTEN; Lucene/Solr document their flat-shape defaults).
enum MapMode {
  // Keep the engine's documented default (OpenSearch: FLATTEN).
  MAP_MODE_UNSPECIFIED = 0;
  // Dynamic keys: one engine field/property per map key.
  MAP_MODE_FLATTEN = 1;
  // Nested [{key, value}] entries.
  MAP_MODE_ENTRIES = 2;
  // The whole map serialized to one JSON string field.
  MAP_MODE_JSON = 3;
  // Do not emit the map field at all.
  MAP_MODE_SKIP = 4;
}

// Numeric emission unit for google.protobuf.Timestamp values, where engines emit
// dates numerically (Lucene points/docValues). Unspecified defaults to millis.
enum DateResolution {
  // Engine default; consumers treat it as millis.
  DATE_RESOLUTION_UNSPECIFIED = 0;
  // Epoch milliseconds.
  DATE_RESOLUTION_MILLIS = 1;
  // Epoch seconds.
  DATE_RESOLUTION_SECONDS = 2;
}

// Engine-neutral HNSW graph tuning; engines map these onto their native knobs
// (OpenSearch method.parameters, Solr hnswMaxConnections / hnswBeamWidth).
message HnswParams {
  // Max connections per graph node (Lucene maxConn, OpenSearch m). Unset =
  // engine default.
  optional int32 m = 1;
  // Beam width during graph construction (Lucene beamWidth, OpenSearch
  // ef_construction). Unset = engine default.
  optional int32 ef_construction = 2;
}

// Role a field plays in a parent/child (block-join) document layout. Flat
// engines ignore these; block engines (distributed-lucene) require CHUNKS to
// locate the child scope. The mapping factory expands the children of a CHUNKS
// field into dotted paths while keeping the container entry itself, so block
// engines see both the scope and its fields.
enum BlockRole {
  // No block role; the field is treated as a regular field.
  BLOCK_ROLE_UNSPECIFIED = 0;
  // The repeated message field holding the child documents. Exactly one per
  // indexed message; must be a repeated message field.
  BLOCK_ROLE_CHUNKS = 1;
  // Stable parent identity, consumed by the engine (indexed canonically on
  // every block member rather than re-emitted as a regular field).
  BLOCK_ROLE_DOC_ID = 2;
  // Per-chunk identity inside the CHUNKS scope; absent chunks get
  // "<doc_id>#<generation>#<ordinal>".
  BLOCK_ROLE_CHUNK_ID = 3;
}

// Deterministic chunking configuration. Everything here participates in the
// policy digest: changing any value re-chunks a corpus, so two indexes agree
// on their chunk boundaries exactly when their digests agree.
message ChunkingSpec {
  // Chunker implementation id, e.g. "sentence-packed".
  string strategy = 1;
  // The chunker's pinned implementation version; bumps on ANY behavior change.
  uint32 strategy_version = 2;
  // Chunk size in tokens the packer aims for.
  int32 target_tokens = 3;
  // Tokens shared between consecutive chunks to preserve context across
  // boundaries.
  int32 overlap_tokens = 4;
  // Smallest acceptable chunk; undersized trailing chunks are merged into a
  // neighbor rather than emitted.
  int32 min_tokens = 5;
  // Largest acceptable chunk; the chunker never emits a chunk above this size.
  int32 max_tokens = 6;
  // Boundary rule set id, e.g. "rules-v1". Never a floating default: a JDK or
  // model upgrade must not silently move sentence boundaries.
  string boundary = 7;
}

// Embedding configuration for derived vectors; participates in the policy digest.
message EmbeddingSpec {
  // Embedding model id; identifies the derivation pipeline, not a runtime
  // default.
  string model = 1;
  // Dimensionality of the vectors the model produces.
  int32 dims = 2;
  // KNN similarity the derived vector field is indexed with.
  VectorSimilarity similarity = 3;
  // L2-normalize vectors after embedding.
  bool normalize = 4;
}

// A chunking policy: derive chunks and vectors from the annotated source text
// field at index time (chunk + embed on the server). Attach to a string field.
// The policy digest (spi ChunkingPolicy.digest()) identifies the derivation
// pipeline; index consumers pin it the way they pin a schema.
message ChunkingPolicy {
  // Deterministic chunking configuration for splitting the source text.
  ChunkingSpec chunking = 1;
  // Embedding configuration for the vectors derived from each chunk.
  EmbeddingSpec embedding = 2;
  // Index field name for the derived vector; empty = engine convention
  // ("<field>#<model>").
  string vector_field = 3;
  // Store chunk text on child documents for highlighting.
  bool store_chunk_text = 4;
}

// Additional index-time representation of the same value — the classic
// "index once as text, again as keyword" pattern.
message SubFieldHint {
  // Index type of this sub-field representation.
  IndexFieldType type = 1;
  // Sub-field suffix; engines join it to the parent name using their own
  // convention (OpenSearch "field.sub", Solr "field_sub").
  string name = 2;
  // Engine-interpreted analyzer name for this sub-field.
  string analyzer = 3;
}

// Engine-agnostic indexing hint for one proto field, attached via the (index)
// field-option extension. Attributes left unset fall back to values inferred
// from the proto descriptor (see spi ProtoOptionsIndexingHintSource).
message FieldIndexHint {
  // Index type; UNSPECIFIED means infer the kind from the proto descriptor.
  IndexFieldType type = 1;
  // Store the raw value for retrieval/highlighting. Unset = inferred default.
  optional bool stored = 2;
  // Index the value for querying. Unset = inferred default.
  optional bool indexed = 3;
  // Override the index field name; empty = use proto field name.
  string name = 4;
  // Dimensionality of a VECTOR field; 0 = unspecified.
  int32 vector_dims = 5;
  // KNN similarity for a VECTOR field; UNSPECIFIED = cosine.
  VectorSimilarity vector_similarity = 6;
  // Element encoding for a VECTOR field; UNSPECIFIED = float32.
  VectorElementType vector_element_type = 7;
  // HNSW graph tuning for a VECTOR field.
  HnswParams hnsw = 8;
  // Additional index-time representations of the same value.
  repeated SubFieldHint sub_fields = 9;
  // Engine-interpreted analyzer names; Lucene consumers apply them at IndexWriter level.
  optional string analyzer = 10;
  // Analyzer applied to query text at search time, when it differs from the
  // index-time analyzer.
  optional string search_analyzer = 11;
  // Substitute emitted when the field is unset, coerced to the hinted type.
  optional string null_value = 12;
  // Default true: unset fields are simply absent. null_value overrides skipping.
  optional bool skip_if_missing = 13;
  // Emit docValues (Lucene docValues fields, OpenSearch doc_values, Solr docValues).
  optional bool sortable = 14;
  // Enable aggregations/faceting on this field (engine-mapped, typically via
  // docValues).
  optional bool facetable = 15;
  // How a map<K,V> field lands in engine documents.
  MapMode map_mode = 16;
  // Engine-side date format hint, carried into schema generation.
  optional string date_format = 17;
  // Numeric emission unit for DATE fields where engines store dates
  // numerically.
  DateResolution date_resolution = 18;
  // Per-engine escape hatch keyed by engine id with dot-suffixed keys,
  // e.g. "opensearch.index_options". Unknown keys are ignored.
  map<string, string> engine_params = 19;
  // Parent/child (block-join) role for block engines; flat engines ignore it.
  BlockRole block_role = 20;
  // Server-side chunk-and-embed derivation from this field's text.
  ChunkingPolicy chunking_policy = 21;
  // Applies to google.protobuf.Any fields: when false, payloads unpacked from this
  // field are indexed and rendered without running the AnyPayloadValidators
  // (the declared-rules gate stays off for this field only). Malformed Anys and
  // unknown type URLs still fail. Default true: payloads are validated.
  optional bool validate_payloads = 22;
}

extend google.protobuf.FieldOptions {
  // Unique extension id for pipestream indexing hints.
  FieldIndexHint index = 59100471;
}

extend google.protobuf.MessageOptions {
  // When true, walk nested fields into the index mapping (default true for top-level).
  bool index_message = 59100472;
}
