syntax = "proto3";

package ai.protomolt.proto.indexing.testdata.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.indexing.testdata";

import "ai/protomolt/proto/index/hints/v1/indexing_hints.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "google/protobuf/any.proto";

// Test fixture for the indexing-hint integration tests: a document exercising
// keyword, text, numeric, vector (with HNSW tuning and engine_params),
// analyzed-with-sub-field, and range hint annotations, combined with
// protovalidate constraints on the same fields.
message IndexableDoc {
  // Required document id, indexed as an exact-match keyword.
  string doc_id = 1 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD },
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: { min_len: 1 }
    }
  ];

  // Required title, indexed as analyzed full text (minimum length 2).
  string title = 2 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_TEXT },
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: { min_len: 2 }
    }
  ];

  // Non-negative page count, indexed as an int32 point field.
  int32 page_count = 3 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_INT32 },
    (ai.protomolt.proto.validate.v1.field) = {
      int32: { gte: 0 }
    }
  ];

  // 3-dim test vector indexed with dot-product similarity, explicit HNSW
  // tuning, and an OpenSearch engine_params override — exercises the vector
  // hint attributes end to end.
  repeated float embedding = 4 [
    (ai.protomolt.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_VECTOR
      vector_dims: 3
      vector_similarity: VECTOR_SIMILARITY_DOT_PRODUCT
      hnsw: { m: 16, ef_construction: 100 }
      engine_params: [{ key: "opensearch.mode", value: "on_disk" }]
    }
  ];

  // Category indexed as english-analyzed text, sortable, with a null_value
  // substitute and a keyword "raw" sub-field.
  string category = 5 [
    (ai.protomolt.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      analyzer: "english"
      sortable: true
      null_value: "uncategorized"
      sub_fields: [{ type: INDEX_FIELD_TYPE_KEYWORD, name: "raw" }]
    }
  ];

  // Singular message field hinted as INT_RANGE; PageSpan's (gte, lte) pair
  // resolves as the range bounds.
  PageSpan page_span = 6 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_INT_RANGE }
  ];
}

// Envelope whose payload arrives as a google.protobuf.Any: exercises write-time
// mapping expansion plus the declared-rules gate on unpacked payloads.
message AnyEnvelope {
  // Document id, indexed as an exact-match keyword.
  string doc_id = 1 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];

  // Late-bound payload; the packed type is only known on the write path.
  google.protobuf.Any payload = 2;

  // Repeated late-bound payloads: inert on the mapping-expansion path (no single packed
  // type per mapping path), but rendered by NDJSON and validated by the payload gate.
  repeated google.protobuf.Any attachments = 3;

  // Keyed late-bound payloads: exercises the payload gate's map-value walk.
  map<string, google.protobuf.Any> extras = 4;

  // Late-bound payload the schema opts out of payload validation: expanded and
  // rendered like any other Any, but the declared-rules gate stays off for it.
  google.protobuf.Any unchecked = 5 [
    (ai.protomolt.proto.index.hints.v1.index) = { validate_payloads: false }
  ];
}

// Payload type packed into AnyEnvelope.payload: declared validation rules plus the
// skip_when escape hatch, so the unpack gate has rules to enforce and to suspend.
message ValidatedPayload {
  option (ai.protomolt.proto.validate.v1.message) = { skip_when: "draft" };

  // Required title (minimum length 2), indexed as an exact-match keyword.
  string title = 1 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD },
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: { min_len: 2 }
    }
  ];

  // Non-negative page count.
  int32 page_count = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      int32: { gte: 0 }
    }
  ];

  // When true, the declared field rules above are suspended (skip_when).
  bool draft = 3;
}

// Envelope carrying BOTH a declared rule of its own and a late-bound payload, so tests
// can pin the facade's ordering: top-level validation runs before the Any payload gate.
message GatedEnvelope {
  // Required document id (minimum length 1).
  string doc_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: { min_len: 1 }
    }
  ];

  // Late-bound payload, gated only after the top-level rules above pass.
  google.protobuf.Any payload = 2;
}

// Envelope whose repeated and keyed payloads are opted out of validation by the
// schema. The annotation sits on the map field itself — a synthetic MapEntry value
// field cannot carry one — so this pins where the opt-out is resolved.
message OptedOutEnvelope {
  // Document id, indexed as an exact-match keyword.
  string doc_id = 1 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];

  // Repeated late-bound payloads, every element opted out of the declared-rules gate.
  repeated google.protobuf.Any attachments = 2 [
    (ai.protomolt.proto.index.hints.v1.index) = { validate_payloads: false }
  ];

  // Keyed late-bound payloads, every value opted out of the declared-rules gate.
  map<string, google.protobuf.Any> extras = 3 [
    (ai.protomolt.proto.index.hints.v1.index) = { validate_payloads: false }
  ];

  // Control: a sibling Any the opt-out must not reach.
  google.protobuf.Any payload = 4;
}

// Payload that itself packs late-bound payloads, one field opted out and one not:
// the gate resolves validate_payloads on the unpacked payload's own fields.
message NestedAnyPayload {
  // Free-text title; the payload type itself declares no validation rules.
  string title = 1;

  // Nested payload the schema opts out of validation.
  google.protobuf.Any unchecked_inner = 2 [
    (ai.protomolt.proto.index.hints.v1.index) = { validate_payloads: false }
  ];

  // Nested payload still gated by the declared-rules validator.
  google.protobuf.Any checked_inner = 3;
}

// Bounds message for INT_RANGE hints: the (gte, lte) pair resolves as the range bounds.
message PageSpan {
  // Lower bound of the range (inclusive).
  int32 gte = 1;
  // Upper bound of the range (inclusive).
  int32 lte = 2;
}
