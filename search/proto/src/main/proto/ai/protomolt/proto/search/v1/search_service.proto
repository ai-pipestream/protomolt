syntax = "proto3";

package ai.protomolt.proto.search.v1;

import "ai/protomolt/proto/repo/v1/address.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.search.v1";

// ============================================================================
// SEARCH SERVICE — the user-facing query surface and its indexing RPC.
//
// The service serves a fixed set of MAPPING SUBJECTS: each subject names an
// index mapping (and optionally a chunking policy) the service was mounted
// with. Every request is gated by membership: an unknown subject, a field
// outside the subject's mapping, or a vector query against a subject with
// no chunking policy is refused loudly by name — the service never guesses
// what a caller meant.
//
// Indexing is workflow-driven: a durable run's index step calls
// IndexDocument after the parse step lands, so what is searchable is
// exactly what the durable pipeline has processed.
// ============================================================================

// Asks the service to (re-)index one stored document under a mapping subject.
message IndexDocumentRequest {
  // The stored document to index; the service fetches CORE+PARSED through the
  // repository, so the folded search metadata is part of what indexes.
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The mapping subject to index under. Required; the service refuses unknown
  // subjects by name rather than assuming a default.
  string mapping_subject = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
}

// What one IndexDocument call landed.
message IndexDocumentResponse {
  // The indexed document's id.
  string doc_id = 1;
  // Number of chunk children written; 0 when the subject has no chunking
  // policy or the source text was empty.
  int32 chunks_indexed = 2;
  // Digest of the chunking policy the chunks were derived under; empty when
  // no chunks were written. Chunk identity is <doc_id>#<digest12>#<ordinal>.
  string policy_digest = 3;
  // Screening evidence, present only when a screening mount acted: the
  // screened field paths (never the detected text), and the model version
  // and threshold that produced the verdicts, because a verdict without the
  // model that produced it is not auditable.
  repeated string screened_fields = 4;
  // The version of the model that produced the verdicts.
  string screening_model_version = 5;
  // The mount's confidence threshold at verdict time.
  double screening_threshold = 6;
}

// Input of the parse-and-index workflow: parse one stored document through
// the coordinator, then index it under a mapping subject. Both identities
// are explicit; the workflow never assumes a subject.
message ParseAndIndexRequest {
  // The stored document to parse and index.
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The mapping subject the index step indexes under. Required.
  string mapping_subject = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
}

// Asks the service to remove one document from a mapping subject's index:
// the parent and every chunk child, whatever policy digest they were
// derived under. The request keys on the indexed identity directly rather
// than an address because the repository copy is typically already gone —
// that is why the delete is being called.
message DeleteDocumentRequest {
  // The mapping subject to delete from. Required; the service refuses unknown
  // subjects by name rather than assuming a default.
  string mapping_subject = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // The document id whose block (parent and chunk children) is removed.
  // Required. Deleting an id the index does not hold succeeds: the answer
  // "this id is not searchable" already holds.
  string doc_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
}

// What one DeleteDocument call removed.
message DeleteDocumentResponse {
  // The deleted document's id, echoed.
  string doc_id = 1;
  // Number of chunk children removed; 0 when the document had no chunks or
  // was never indexed, so a caller can tell a real removal from a no-op.
  int32 chunks_deleted = 2;
}

// Input of the delete-and-unindex workflow: delete one stored document
// through the repository, then remove it from a mapping subject's index.
// Both identities are explicit; the workflow never assumes a subject.
message DeleteAndUnindexRequest {
  // The stored document to delete.
  ai.protomolt.proto.repo.v1.NodeAddress address = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // The mapping subject the unindex step deletes from. Required.
  string mapping_subject = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // When set, the repository purges the stored bytes immediately; when
  // unset, rows are tombstoned for the repository's two-phase purge.
  bool purge_storage = 3;
}

// Which query lane to run.
enum SearchLane {
  // Unset. Refused: the caller must choose a lane.
  SEARCH_LANE_UNSPECIFIED = 0;
  // Analyzed term matching over the mapping's text fields.
  SEARCH_LANE_LEXICAL = 1;
  // KNN over the subject's chunk vectors; requires a chunking policy.
  SEARCH_LANE_VECTOR = 2;
  // Both lanes, fused by reciprocal rank.
  SEARCH_LANE_HYBRID = 3;
}

// One search query against a mapping subject.
message SearchRequest {
  // The mapping subject to search. Required; unknown subjects are refused
  // with the list of served subjects.
  string mapping_subject = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // The query text. Required.
  string query = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1}
    }
  ];
  // Maximum hits to return. Required; must be positive and no more than
  // the service's per-query cap (10000) — over-cap requests are refused by
  // name, not clamped, so one query cannot ask for the whole index.
  int32 k = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      int32: {gt: 0, lte: 10000}
    }
  ];
  // The lane to run. Required.
  SearchLane lane = 4 [
    (ai.protomolt.proto.validate.v1.field) = {required: true}
  ];
  // Text fields to match in the lexical lane, named by their index field
  // names. Empty means every text field in the subject's mapping; a field
  // outside the mapping is refused by name. Bounded like every other field
  // reference in the contract, so an unbounded list cannot reach the index.
  repeated string fields = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      repeated: {max_items: 100, items: {string: {min_len: 1, max_len: 200}}}
    }
  ];
}

// One stored field value, typed by the mapping that declared the field.
// The declared index kind decides the arm: TEXT/KEYWORD and JSON-folded
// object fields are strings, INT32/INT64 are int64, FLOAT/DOUBLE are
// double, BOOLEAN is bool, DATE is a timestamp, BINARY is bytes. A caller
// therefore never re-parses a rendered string to recover the value the
// mapping stored.
message StoredValue {
  // Exactly one arm, chosen by the mapping's declared field kind.
  oneof kind {
    // TEXT, KEYWORD, and JSON-folded object fields.
    string string_value = 1;
    // INT32 and INT64 fields; int32 widens losslessly.
    int64 int64_value = 2;
    // FLOAT and DOUBLE fields; float widens losslessly.
    double double_value = 3;
    // BOOLEAN fields.
    bool bool_value = 4;
    // DATE fields, from the stored engine-unit epoch.
    google.protobuf.Timestamp timestamp_value = 5;
    // BINARY fields.
    bytes bytes_value = 6;
  }
}

// One search hit.
message SearchHit {
  // The matching document's id.
  string doc_id = 1;
  // The matching chunk's identity (<doc_id>#<digest12>#<ordinal>) for
  // vector-lane chunk hits; empty for document-level hits.
  string chunk_id = 2;
  // The lane score: engine score for single-lane queries, reciprocal-rank
  // fusion score for hybrid.
  float score = 3;
  // Stored fields of the matching document or chunk, keyed by index field
  // name and typed by the mapping. Every stored field the engine returns
  // appears here, numerics and dates included, not only string-valued ones.
  map<string, StoredValue> stored = 4;
}

// Hits, best first.
message SearchResponse {
  // The hits, best first, at most k of them.
  repeated SearchHit hits = 1;
}

// A request to replay a repository's documents through a stored workflow.
//
// Replay runs one workflow per document, which is how a subject is rebuilt
// after its mapping or its chunking policy changes. Reconciliation is the
// second mode: it replays the whole repository listing and removes indexed
// documents the listing no longer contains, so a subject converges on what
// the repository actually holds.
message ReplayDocumentsRequest {
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: {
      id: "replay.scope_or_reconcile"
      message: "a scoped replay sets drive; a replay with prune covers the whole repository and must not set drive or accountId"
      expression: "this.prune ? (this.drive == '' && this.account_id == '') : this.drive != ''"
    }
  };

  // Stored workflow to run for each document, by name.
  string workflow_name = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Mapping subject the workflow indexes into.
  string mapping_subject = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Drive whose documents replay. Required for a scoped replay and refused
  // for a reconciling one, which is unscoped by definition.
  string drive = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 200}
    }
  ];
  // Restricts a scoped replay to one account. Refused for a reconciling
  // replay for the same reason as the drive.
  string account_id = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 200}
    }
  ];
  // Names this replay. Each document's run then takes a job identifier
  // derived from the name and the document, so repeating a replay with the
  // same name resubmits nothing already accepted.
  string replay_id = 5 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 200}
    }
  ];
  // Reconcile rather than replay a scope: cover the whole repository listing
  // and unindex documents it no longer contains.
  bool prune = 6;
}

// What one replay submitted, and what it removed.
message ReplayDocumentsResponse {
  // Workflow runs submitted, one per document replayed.
  int32 submitted = 1;
  // Identifier of each submitted run, in submission order, so a caller can
  // follow the replay through the jobs service without listing it again.
  repeated string job_ids = 2;
  // Indexed documents removed because the repository listing no longer
  // contained them. Zero unless the request asked to reconcile.
  int32 pruned = 3;
  // The documents removed, named. A reconcile that removes anything is worth
  // being able to audit, so the identifiers travel with the count rather than
  // only the total.
  repeated string pruned_doc_ids = 4;
}

// The indexing half of the service, driven by durable workflow steps: putting
// documents into a served index, taking them out, and rebuilding a subject
// from the repository behind it.
service SearchIndexService {
  // (Re-)indexes one stored document under a mapping subject. Idempotent:
  // re-indexing a document atomically replaces its previous index state.
  rpc IndexDocument(IndexDocumentRequest) returns (IndexDocumentResponse);

  // Removes one document's block (parent and chunk children) from a
  // mapping subject's index. Idempotent: deleting an absent id succeeds.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Replays a repository's documents through a stored workflow, or
  // reconciles the subject against the repository listing.
  rpc ReplayDocuments(ReplayDocumentsRequest) returns (ReplayDocumentsResponse);
}

// Asks the service what it serves. Deliberately empty: the served surface is
// the service's configuration, not a query.
message ListSubjectsRequest {
}

// One served mapping subject, described for callers: a UI's subject and
// field pickers, or a client validating before it queries.
message SubjectInfo {
  // The subject name.
  string subject = 1;
  // The index field carrying the document identity.
  string doc_id_field = 2;
  // The text fields the lexical lane matches, by index field name.
  repeated string text_fields = 3;
  // Whether the subject serves a vector (and therefore hybrid) lane.
  bool has_vector_lane = 4;
  // The chunking-policy digest the vector lane derives under; empty when
  // the subject has no vector lane.
  string policy_digest = 5;
}

// The service's served surface.
message ListSubjectsResponse {
  // Every served subject, in configuration order.
  repeated SubjectInfo subjects = 1;
}

// The query half of the service.
service SearchService {
  // Runs one query against a mapping subject.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Describes the served mapping subjects.
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);
}
