opennlp-runtime = { module = "ai.pipestream:opennlp-runtime", version.ref = "opennlp" }
opennlp-models-sentdetect-en = { module = "org.apache.opennlp:opennlp-models-sentdetect-en", version.ref = "opennlp-models" }
apicurio-registry-java-sdk = { module = "io.apicurio:apicurio-registry-java-sdk", version.ref = "apicurio" }
