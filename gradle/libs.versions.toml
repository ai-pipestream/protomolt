[versions]
protobuf = "4.36.1"
cel = "0.14.0"
junit = "6.1.3"
assertj = "3.27.7"
slf4j = "2.0.18"
kafka = "3.9.2"
# Confluent is boxed into the 8.0.x line from both sides. Floor: 8.0 is the first line
# compiled against protobuf-java 4.x (7.9.x's ProtobufSchema bytecode references
# GeneratedMessageV3, removed in protobuf 4). Ceiling: 8.1+ (the Kafka 4.1-based lines,
# verified through 8.3.0) reference org.apache.kafka.common.metrics.Monitorable (KIP-877),
# which does not exist in the kafka-clients 3.9 line pinned above — the interop tests fail
# to compile. Do not bump past 8.0.x until kafka-clients moves to >= 4.1.
# Test-scoped interop only.
confluent = "8.0.7"
testcontainers = "2.0.5"
opensearch-testcontainers = "4.1.0"
micrometer = "1.17.1"
swagger-ui = "5.32.14"
jackson = "2.22.2"
quarkus = "3.39.1"
axion-release = "1.21.3"
nmcp = "1.6.2"
grpc = "1.83.1"
chicory = "1.7.5"
lucene = "11.0.0-experimental-SNAPSHOT"
# The 0.1.0-alpha4 line, not 3.x-preview: the 3.x snapshots stamp
# "OpenNLP-Version: 3.x-preview-SNAPSHOT", which their own Version.parse
# rejects, so BaseModel loading (sentence-detector models et al.) fails on
# that line. alpha4 stamps a parseable version and carries the same APIs.
opennlp = "0.1.0-alpha4-SNAPSHOT"
# Pinned Apache OpenNLP model artifacts on Maven Central (the deterministic,
# offline model source; version bumps are deliberate re-derivations)
opennlp-models = "1.3.0"
apicurio = "3.3.2"
spring = "7.0.9"
# Boot line matching Spring Framework 7
spring-boot = "4.1.1"
vertx = "5.1.6"
netty = "4.2.17.Final"
# Micronaut 4.x is the JDK 21-compatible line (5.x requires JVM 25+)
micronaut = "4.10.26"
protobuf-gradle = "0.10.0"
wire = "5.5.1"
jgit = "7.7.1.202607240634-r"
parquet = "1.18.0"
hadoop = "3.5.0"
iceberg = "1.11.0"
duckdb = "1.5.5.1"
sqlite-jdbc = "3.53.4.0"
awssdk = "2.54.9"
maven-resolver = "1.9.27"
maven = "3.9.16"
graalvm-buildtools = "1.1.11"
# Persistence stack (framework-free): Hibernate ORM + HikariCP + Flyway.
hibernate = "7.4.7.Final"
hikari = "7.1.0"
flyway = "13.4.0"
postgresql = "42.7.13"
jedis = "7.5.3"

