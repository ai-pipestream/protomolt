// Fixtures for the projection engine. Source shapes come first, then one
// target message per behaviour under test, so a failing test names the
// behaviour rather than a composite of several.
syntax = "proto3";

package ai.pipestream.proto.projection.test.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.projection.test";
option java_outer_classname = "ProjectionTestProto";

import "ai/pipestream/proto/projection/v1/projection.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// A nested message inside the court-filing source, used to prove that a
// projection path can reach through one level of message nesting.
message Address {
  // The only leaf, read by the region projection through a CEL expression.
  string state = 1;
}

// Court-filing source shape. One of two differently shaped sources that
// project into the same target, which is how the engine's per-source masks
// are exercised.
message Case {
  // Identity in the filing system. Projects to the target document id.
  string case_id = 1;
  // Human-readable case name. Projects to the target title.
  string style_of_cause = 2;
  // Nested address, reached by a CEL expression rather than a plain path.
  Address address = 3;
  // Repeated value, projected into a repeated target field unchanged.
  repeated string parties = 4;
  // Filing time as an epoch value, projected without conversion.
  int64 filed_epoch = 5;
}

// Billing source shape. Carries the same information as Case under different
// field names, so the target below must resolve a different path per source.
message Matter {
  // Identity in the billing system. Projects to the same target field the
  // Case identity does.
  string matter_no = 1;
  // Human-readable matter name, the billing counterpart of style_of_cause.
  string caption = 2;
  // Present only on this source, so the target field reading it stays absent
  // when projecting from Case.
  string jurisdiction = 3;
}

// One search document projected from both source shapes. Path lists are tried
// in order, so a single target field can name the equivalent field in each
// source.
message SearchDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.Case"
    source: "ai.pipestream.proto.projection.test.v1.Matter"
  };

  // Resolves from whichever source is projecting, proving alternative paths
  // are tried in declaration order.
  string doc_id = 1 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "case_id" path: "matter_no"}
  }];
  // The title counterpart of doc_id, exercising the same alternation.
  string title = 2 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "style_of_cause" path: "caption"}
  }];
  // Compiles only against Case, because only that source has an address. The
  // field is absent when projecting from Matter rather than an error, which is
  // what makes per-source compilation observable.
  string region = 3 [(ai.pipestream.proto.projection.v1.from) = {
    cel: "source.address.state.upperAscii()"
  }];
  // The mirror of region: resolves only on Matter, absent on Case.
  string jurisdiction = 4 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "jurisdiction"}
  }];
  // A constant that depends on no source, so it is populated identically for
  // both.
  string source_system = 5 [(ai.pipestream.proto.projection.v1.from) = {
    literal: {string_value: "filing-index"}
  }];
  // Repeated to repeated with no element conversion.
  repeated string parties = 6 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "parties"}
  }];
  // Same type on both sides, so no coercion is involved.
  int64 filed_epoch = 7 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "filed_epoch"}
  }];
  // A numeric literal, proving literals are not limited to strings.
  double file_rank = 8 [(ai.pipestream.proto.projection.v1.from) = {
    literal: {number_value: 1.5}
  }];
  // Carries no provenance option at all. Projection must leave it untouched
  // rather than defaulting it, so an unmapped target field stays visibly
  // unmapped.
  string unmapped = 9;
}

// An expression naming a field no declared source has. The failure must be
// raised when the projection is constructed, not deferred to evaluation.
message BrokenProjection {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.Case"
  };

  // References a path that does not exist on Case, so compilation fails.
  string boom = 1 [(ai.pipestream.proto.projection.v1.from) = {
    cel: "source.nope.deeply_missing"
  }];
}

// An expression that compiles cleanly but raises when evaluated. The
// projection must fail rather than silently omitting the field.
message RuntimeErrorProjection {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.Case"
  };

  // Division by a literal zero: valid to compile, fatal to evaluate.
  int64 ratio = 1 [(ai.pipestream.proto.projection.v1.from) = {
    cel: "source.filed_epoch / 0"
  }];
}

// A target using paths and nothing else, so the source mask the engine
// computes is exact for every declared source.
message FlatDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.Case"
    source: "ai.pipestream.proto.projection.test.v1.Matter"
  };

  // The single mapped field, one path per source.
  string doc_id = 1 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "case_id" path: "matter_no"}
  }];
}

// Enum used by the coercion fixtures to prove an enum projects by value
// rather than by name.
enum ZooStatus {
  // Zero value, required by proto3 and treated as absent under implicit
  // presence.
  ZOO_STATUS_UNSPECIFIED = 0;
  // A non-default value, so a projected enum can be distinguished from an
  // unset one.
  ZOO_STATUS_OPEN = 1;
  // A second non-default value, so the projection cannot pass by returning a
  // constant.
  ZOO_STATUS_CLOSED = 2;
}

// A nested message inside the coercion source, used to prove a dotted path
// reaches a leaf through message nesting.
message ZooNested {
  // The leaf a dotted path resolves to.
  string leaf = 1;
}

// One source carrying every construct the coercion and presence rules touch,
// so the target fixtures below can each read from a single shared source.
message ScalarZoo {
  // Narrow integer, widened by a target field.
  int32 small = 1;
  // Wide integer, read as a double and as text by different targets.
  int64 big = 2;
  // Floating point value, present so a double source exists.
  double ratio = 3;
  // Boolean, read as text by a target to prove boolean to string coercion.
  bool active = 4;
  // Plain text that does not parse as a number, used by the failure fixture.
  string name = 5;
  // Text that does parse as a number, used by the successful parse fixture.
  string numeric_text = 6;
  // Enum value, projected into an enum target field.
  ZooStatus status = 7;
  // Repeated integers, projected into a repeated target of a wider type.
  repeated int32 scores = 8;
  // Map field, present so the unsupported-map failure can be provoked.
  map<string, int32> counts = 9;
  // Well-known timestamp, projected without conversion.
  google.protobuf.Timestamp when = 10;
  // Well-known struct, projected without conversion.
  google.protobuf.Struct attrs = 11;
  // Explicit presence, so absence is distinguishable from zero.
  optional int32 maybe_count = 12;
  // A oneof, so the engine's handling of an unset case can be observed.
  oneof choice {
    // Set in fixtures that exercise the primary provenance.
    string choice_text = 13;
    // The alternative case, left unset so the oneof can be absent.
    int64 choice_num = 14;
  }
  // Nested message reached by a dotted path.
  ZooNested nested = 15;
}

// Fallback provenance. The primary source wins whenever it resolves, and the
// fallback is evaluated only when the primary is absent, which also means the
// fallback must not be evaluated eagerly.
message DefaultedDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.ScalarZoo"
  };

  // Primary reads a oneof case that may be unset; the fallback derives a value
  // from another field when it is.
  optional string label = 1 [
    (ai.pipestream.proto.projection.v1.from) = {
      paths: {path: "choice_text"}
    },
    (ai.pipestream.proto.projection.v1.default_from) = {
      cel: "source.name.upperAscii()"
    }
  ];
  // Primary reads an explicit-presence field, so the fallback fires on genuine
  // absence rather than on a zero value.
  optional int32 count = 2 [
    (ai.pipestream.proto.projection.v1.from) = {
      paths: {path: "maybe_count"}
    },
    (ai.pipestream.proto.projection.v1.default_from) = {
      cel: "source.small + 10"
    }
  ];
  // Declares a fallback with no primary at all, so the fallback is the only
  // provenance.
  optional string category = 3 [
    (ai.pipestream.proto.projection.v1.default_from) = {
      literal: {string_value: "calculated-default"}
    }
  ];
  // The primary always resolves and the fallback would raise if evaluated.
  // Projecting this field successfully is the proof that fallbacks are lazy.
  optional int64 short_circuit = 4 [
    (ai.pipestream.proto.projection.v1.from) = {
      paths: {path: "big"}
    },
    (ai.pipestream.proto.projection.v1.default_from) = {
      cel: "source.big / 0"
    }
  ];
}

// Every coercion the engine supports, gathered so that one projection of this
// target proves them together rather than one at a time.
message CoercionDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.ScalarZoo"
  };

  // Narrower integer widened to a wider one.
  int64 widened = 1 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "small"}
  }];
  // Integer read as floating point.
  double big_as_double = 2 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "big"}
  }];
  // Integer rendered as text.
  string big_text = 3 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "big"}
  }];
  // Boolean rendered as text.
  string active_text = 4 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "active"}
  }];
  // Text parsed into an integer, the successful counterpart of BadParseDoc.
  int32 parsed = 5 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "numeric_text"}
  }];
  // Enum to enum, carried by value.
  ZooStatus status = 6 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "status"}
  }];
  // Repeated narrow integers widened element by element.
  repeated int64 scores = 7 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "scores"}
  }];
  // Well-known type copied without conversion.
  google.protobuf.Timestamp when = 8 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "when"}
  }];
  // Well-known type copied without conversion.
  google.protobuf.Struct attrs = 9 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "attrs"}
  }];
  // A scalar literal targeting a Value field, which must be wrapped rather
  // than assigned directly.
  google.protobuf.Value tag = 10 [(ai.pipestream.proto.projection.v1.from) = {
    literal: {string_value: "v1"}
  }];
}

// Presence rules, oneof reads, nested paths, and path alternation, gathered so
// that absence is tested distinctly from failure.
message PresenceDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.ScalarZoo"
  };

  // Reads an explicit-presence source field, so an unset source leaves this
  // target field unset rather than zero.
  int32 maybe_count = 1 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "maybe_count"}
  }];
  // Reads one case of a oneof, which is absent whenever the other case is set.
  string choice = 2 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "choice_text"}
  }];
  // Reads an implicit-presence field, where a source value of zero is
  // indistinguishable from absence and must be treated as absent.
  int64 big_when_set = 3 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "big"}
  }];
  // Reaches a leaf through one level of nesting.
  string nested_leaf = 4 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "nested.leaf"}
  }];
  // First path traverses a message that is not set, so resolution must fall
  // through to the second path rather than failing.
  string fallback = 5 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "nested.missing.deep" path: "name"}
  }];
}

// Text that does not parse as a number, projected into an integer target. The
// error must name the target field so a caller can find it.
message BadParseDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.ScalarZoo"
  };

  // Reads the deliberately unparseable source field.
  int32 parsed = 1 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "name"}
  }];
}

// Map targets are refused outright. The refusal is a declared limitation
// rather than an oversight, so it is pinned here.
message MapDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.ScalarZoo"
  };

  // A map target, which the engine must reject with an unsupported error.
  map<string, int32> counts = 1 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "counts"}
  }];
}

// A repeated source read into a singular target. The engine must refuse rather
// than silently taking the first element.
message SingularFromRepeatedDoc {
  option (ai.pipestream.proto.projection.v1.sources) = {
    source: "ai.pipestream.proto.projection.test.v1.ScalarZoo"
  };

  // Singular target fed from a repeated source field.
  int32 first = 1 [(ai.pipestream.proto.projection.v1.from) = {
    paths: {path: "scores"}
  }];
}
