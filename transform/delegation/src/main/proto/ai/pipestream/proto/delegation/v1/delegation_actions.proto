syntax = "proto3";

package ai.pipestream.proto.delegation.v1;

import "ai/pipestream/proto/delegation/v1/delegation.proto";
import "ai/pipestream/proto/grpc/workflow/v1/grpc_workflow.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.delegation.v1";

// ============================================================================
// DELEGATION ACTION CONTRACTS - the request and response messages of the
// twelve delegation catalog verbs.
//
// A catalog verb is invoked with one JSON document, and that document is the
// canonical proto3 JSON of the request message declared here: there is no
// wrapper member and no second encoding. The verb derives its published input
// schema from the request descriptor, so the bounds a caller reads in the tool
// manifest are the bounds the validator enforces.
//
// The payload types the verbs carry (TaskSpec, CompletionCandidate,
// CheckpointReference, TaskOffer, TaskMessage, WorkerCapability,
// TranscriptEntry) are the stream contract's own types from delegation.proto.
// A verb envelope adds only what the catalog surface needs on top of them:
// which worker and task the call concerns, and the call-shaping bounds
// (lease length, batch sizes, poll timeouts) that the bidirectional stream
// expresses in other ways.
//
// Absence is meaningful in several envelopes: proto3 cannot tell an omitted
// scalar from its zero value, so every field whose omission selects a
// coordinator-chosen default says so in its comment, and the one field whose
// zero is itself a legal request (the watch timeout) carries explicit
// presence.
// ============================================================================

// Which way a completion candidate's review went.
enum ReviewDecision {
  // Invalid; a review states its decision.
  REVIEW_DECISION_UNSPECIFIED = 0;
  // The candidate revision is accepted and the task is complete.
  REVIEW_DECISION_ACCEPT = 1;
  // The candidate revision is returned for another revision; the worker
  // keeps the lease.
  REVIEW_DECISION_REVISE = 2;
}

// Offers one bounded task attempt to an admitted worker, with its lease.
message OfferTaskRequest {
  // The admitted worker the offer addresses. Slug-shaped, matching the
  // identity the worker registered under.
  string worker_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The task the offer belongs to. Omitted means a new task: the coordinator
  // generates the uuid and returns it. Re-offering a finished attempt passes
  // the existing task id, which increments the attempt.
  string task_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {uuid: true}
    }
  ];
  // The bounded work itself: objective, allowed scope, constraints, the
  // acceptance checks a candidate must prove, and the context artifacts.
  TaskSpec spec = 3 [
    (ai.pipestream.proto.validate.v1.field).required = true
  ];
  // How long the lease runs without renewal. Omitted means 300 seconds, the
  // coordinator's default. The upper bound is one day: a lease longer than
  // that is a standing assignment, which this protocol does not model.
  int32 lease_seconds = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      int32: {gte: 1, lte: 86400}
    }
  ];
  // Resume point into a prior attempt's recorded checkpoints. Absent means
  // the attempt starts from the spec alone.
  CheckpointReference resume_from = 5;
}

// What one accepted offer emitted.
message OfferTaskResponse {
  // True when the coordinator emitted the offer.
  bool ok = 1;
  // The task the offer belongs to, generated when the request omitted it.
  string task_id = 2;
  // The emitted offer, including the attempt number and lease expiry the
  // coordinator assigned.
  TaskOffer offer = 3;
}

// The worker takes the open offer for a task's current attempt.
message AcceptTaskRequest {
  // The registered worker taking the lease.
  string worker_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The offered task.
  string task_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // The open offer's attempt number. Required: accepting without naming the
  // attempt would let a stale acceptance take a lease it was never offered.
  int32 attempt = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      int32: {gte: 1, lte: 1024}
    }
  ];
}

// What one acceptance took.
message AcceptTaskResponse {
  // True when the coordinator recorded the acceptance.
  bool ok = 1;
  // The task whose lease the worker now holds.
  string task_id = 2;
  // The accepted attempt.
  int32 attempt = 3;
}

// Cancels a task's open offer, lease, or candidate review.
message CancelTaskRequest {
  // The task whose open attempt is cancelled.
  string task_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // Why the work is called off. Required: a cancellation without a reason is
  // not auditable. Bounded as the Cancellation frame bounds it.
  string reason = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 2048}
    }
  ];
}

// What one cancellation ended.
message CancelTaskResponse {
  // True when the coordinator emitted the cancellation.
  bool ok = 1;
  // The cancelled task.
  string task_id = 2;
}

// Submits one revision of completion evidence for coordinator review.
message SubmitCandidateRequest {
  // The registered worker submitting the candidate.
  string worker_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The task the candidate completes.
  string task_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // The evidence itself: the attempt, the revision, a summary, one passing
  // entry per required check, and at least one commit or artifact.
  CompletionCandidate candidate = 3 [
    (ai.pipestream.proto.validate.v1.field).required = true
  ];
}

// What one submitted candidate registered.
message SubmitCandidateResponse {
  // True when the coordinator took the candidate under review.
  bool ok = 1;
  // The task the candidate completes.
  string task_id = 2;
  // The attempt the candidate came from, echoed from the candidate.
  int32 attempt = 3;
  // The revision now under review, echoed from the candidate.
  int32 revision = 4;
}

// Records one resumable checkpoint of worker state on the leased attempt.
message RecordCheckpointRequest {
  // The registered worker recording the checkpoint.
  string worker_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The task being checkpointed.
  string task_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // The leased attempt the checkpoint belongs to. Required: a checkpoint
  // outside its attempt cannot be resumed from.
  int32 attempt = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      int32: {gte: 1, lte: 1024}
    }
  ];
  // The opaque token a later offer's resume_from echoes back. Bounded as the
  // Checkpoint frame bounds it; larger state belongs in the state artifact.
  string resume_token = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 512}
    }
  ];
  // What the checkpoint covers. Absent means the token alone describes it.
  string note = 5 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 1024
  ];
  // The checkpointed state as a content-addressed artifact, for state too
  // large for the token. Absent means the token carries everything.
  ai.pipestream.proto.grpc.workflow.v1.ArtifactReference state = 6;
}

// What one checkpoint recorded.
message RecordCheckpointResponse {
  // True when the coordinator recorded the checkpoint.
  bool ok = 1;
  // The sequence the coordinator assigned inside the attempt; sequences
  // never regress.
  int32 checkpoint_seq = 2;
  // The resume token, echoed so a caller can store the pair it will resume
  // from without re-reading its own request.
  string resume_token = 3;
}

// Sends one non-transitioning structured task message in either direction.
message SendTaskMessageRequest {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "coordinator-message-names-recipient"
      message: "a coordinator message must name the worker it addresses"
      expression: "this.sender != 'coordinator' || size(this.recipient) > 0"
    }
    cel: {
      id: "worker-message-addresses-coordinator"
      message: "a worker message is addressed to 'coordinator'"
      expression: "this.sender == 'coordinator' || size(this.recipient) == 0 || this.recipient == 'coordinator'"
    }
  };

  // The task the message concerns.
  string task_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // Who is speaking: the literal "coordinator", or a registered worker id.
  string sender = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // Who the message is for. A coordinator message must name its worker. A
  // worker message may omit it or name "coordinator"; either way it reaches
  // the coordinator, because the coordinator relays nothing between workers.
  string recipient = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {slug: true, max_len: 128}
    }
  ];
  // What the message is: question, answer, guidance, or note. UNSPECIFIED is
  // refused, because intent is what makes a recorded message readable.
  TaskMessageKind kind = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // The message body. Bounded as the TaskMessage frame bounds it; long
  // content belongs in artifacts.
  string text = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 8192}
    }
  ];
  // The message this answers, when it continues a thread. Absent means the
  // message opens one.
  string reply_to = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {uuid: true}
    }
  ];
  // Content-addressed artifacts the message refers to, by reference only.
  // Bounded as the TaskMessage frame bounds it.
  repeated ai.pipestream.proto.grpc.workflow.v1.ArtifactReference artifacts = 7 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 32
  ];
}

// What one task message recorded.
message SendTaskMessageResponse {
  // True when the coordinator recorded the message.
  bool ok = 1;
  // The recorded message, including the message id a later reply_to names
  // and the timestamp the sender was stamped with.
  TaskMessage message = 2;
}

// Reports one monotonic progress note from the worker on its leased attempt.
message ReportProgressRequest {
  // The registered worker reporting progress.
  string worker_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The task being worked.
  string task_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // The leased attempt the progress belongs to. Required: progress outside
  // its attempt cannot be sequenced.
  int32 attempt = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      int32: {gte: 1, lte: 1024}
    }
  ];
  // What advanced. Bounded as the ProgressEvent frame bounds it.
  string message = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 4096}
    }
  ];
}

// What one progress note recorded.
message ReportProgressResponse {
  // True when the coordinator recorded the note.
  bool ok = 1;
  // The sequence the coordinator assigned; sequences strictly increase
  // inside the attempt.
  int32 progress_seq = 2;
}

// Applies an external review decision to the open completion candidate.
message ReviewCandidateRequest {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "acceptance-carries-verdict"
      message: "an accepted candidate must carry the verdict that accepted it"
      expression: "this.decision != 1 || size(this.verdict) > 0"
    }
    cel: {
      id: "revision-carries-feedback"
      message: "a returned candidate must say what has to change"
      expression: "this.decision != 2 || size(this.feedback) > 0"
    }
    cel: {
      id: "failed-checks-belong-to-a-revision"
      message: "failed checks describe a revision request, not an acceptance"
      expression: "this.decision == 2 || size(this.failed_checks) == 0"
    }
  };

  // The task with an open candidate under review.
  string task_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {uuid: true}
    }
  ];
  // Whether the candidate is accepted or returned for revision.
  ReviewDecision decision = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true, not_in: [0]}
    }
  ];
  // The one-line acceptance verdict, for review display. Required with
  // ACCEPT, absent otherwise. Bounded as the CompletionAccepted frame
  // bounds it.
  string verdict = 3 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 2048
  ];
  // What must change. Required with REVISE, absent otherwise. Bounded as
  // the RevisionRequested frame bounds it.
  string feedback = 4 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 8192
  ];
  // The required checks whose evidence did not convince the reviewer. Only
  // meaningful with REVISE. Bounded as the RevisionRequested frame bounds
  // it, and each entry names a check, so it carries the check-name shape.
  repeated string failed_checks = 5 [
    (ai.pipestream.proto.validate.v1.field).repeated = {
      max_items: 64
      items: {
        string: {slug: true, max_len: 128}
      }
    }
  ];
}

// What one review decided.
message ReviewCandidateResponse {
  // True when the coordinator applied the verdict.
  bool ok = 1;
  // The reviewed task.
  string task_id = 2;
  // The decision applied, echoed.
  ReviewDecision decision = 3;
}

// Reads a bounded slice of the recorded delegation transcript from a cursor.
message ReadTranscriptRequest {
  // Resume position: the read returns events strictly after this cursor.
  // Omitted (0) reads from the beginning.
  int64 after_cursor = 1 [
    (ai.pipestream.proto.validate.v1.field).int64.gte = 0
  ];
  // Restricts the read to one task. Absent reads every task's events.
  string task_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {uuid: true}
    }
  ];
  // The largest slice one call returns. Omitted means 100. The upper bound
  // keeps a single tool result renderable; follow the cursor for more.
  int32 max_entries = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      int32: {gte: 1, lte: 500}
    }
  ];
}

// One bounded slice of the recorded transcript.
message ReadTranscriptResponse {
  // True when the read succeeded.
  bool ok = 1;
  // The events in recorded order.
  repeated ObservedEvent events = 2;
  // The cursor to resume from: the last returned event's cursor. Absent
  // when the slice is empty, because nothing moved the position.
  int64 cursor = 3;
  // True when more events were available than the slice returned.
  bool truncated = 4;
}

// Long-polls the coordinator's event feed from a caller-owned cursor.
message WatchEventsRequest {
  // Resume position: the watch returns events strictly after this cursor.
  // Omitted (0) reads from the beginning.
  int64 after_cursor = 1 [
    (ai.pipestream.proto.validate.v1.field).int64.gte = 0
  ];
  // Restricts the watch to one task. Absent watches every task's events.
  string task_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {uuid: true}
    }
  ];
  // How long to wait for the first event. Omitted means 1000. Explicit
  // presence, because 0 is a legal request (poll and return immediately)
  // and would otherwise be indistinguishable from omission. The upper
  // bound keeps one call inside a normal request deadline.
  optional int32 timeout_ms = 3 [
    (ai.pipestream.proto.validate.v1.field).int32 = {gte: 0, lte: 30000}
  ];
  // The largest batch one call returns. Omitted means 64.
  int32 max_events = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      int32: {gte: 1, lte: 256}
    }
  ];
}

// One long poll's outcome.
message WatchEventsResponse {
  // True when the watch completed, whether or not it saw an event.
  bool ok = 1;
  // The events in recorded order; empty on a timeout.
  repeated ObservedEvent events = 2;
  // The cursor to resume from. On a timeout this is the cursor the caller
  // asked from, so a reconnecting session resumes without a gap.
  int64 cursor = 3;
  // True when more events were available than the batch returned.
  bool truncated = 4;
  // True when the wait elapsed before any event appeared.
  bool timed_out = 5;
}

// One cursor-addressable frame of the recorded delegation feed.
message ObservedEvent {
  // The event's position in the feed; watches and transcript reads resume
  // strictly after a cursor.
  int64 cursor = 1;
  // The worker whose stream carried the frame.
  string worker_id = 2;
  // The task the frame concerns; empty for frames outside any task, such as
  // a worker handshake.
  string task_id = 3;
  // Which side emitted the frame.
  Lane lane = 4;
  // The recorded frame itself.
  TranscriptEntry entry = 5;
}

// Lists the coordinator's worker registrations. The verb takes no input:
// the listing is the coordinator's whole roster, which is small by
// construction and bounded by the response.
message ListWorkersRequest {}

// The coordinator's worker roster.
message ListWorkersResponse {
  // True when the listing succeeded.
  bool ok = 1;
  // The registered workers.
  repeated WorkerRegistrationSummary workers = 2;
  // True when the roster held more workers than the listing returned.
  bool truncated = 3;
}

// One worker's registration as the coordinator holds it.
message WorkerRegistrationSummary {
  // The worker's stable identity.
  string worker_id = 1;
  // Whether the coordinator admitted this worker; only an admitted worker
  // may be offered a task.
  bool admitted = 2;
  // Whether the worker's delegation stream is currently open. An admitted
  // worker that is not connected has registered before and can re-register.
  bool connected = 3;
  // The provider the worker drives. Metadata only.
  string provider = 4;
  // The model the provider runs, when one is configured.
  string model = 5;
  // The provider-reported model version or digest, when reported.
  string model_version = 6;
  // What the worker advertised it can do, most relevant first.
  repeated WorkerCapability capabilities = 7;
}

// Registers a worker: opens its delegation stream and sends the handshake.
message RegisterWorkerRequest {
  // Stable identity for this worker's session. One live stream per identity;
  // re-registering the same identity replaces the stream.
  string worker_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The provider the worker drives (for example "kimi" or "codex"). Absent
  // for a deterministic worker. Metadata only: admission never reads it.
  string provider = 2 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 128
  ];
  // The model the provider runs, when one is configured.
  string model = 3 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 256
  ];
  // The provider-reported model version or digest, when reported.
  string model_version = 4 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 512
  ];
  // What the worker can do, most relevant first. Bounded as the WorkerHello
  // frame bounds it.
  repeated WorkerCapability capabilities = 5 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 64
  ];
}

// The coordinator's admission verdict on one registration.
message RegisterWorkerResponse {
  // True when the registration reached the coordinator, whether or not the
  // worker was admitted.
  bool ok = 1;
  // The registered identity.
  string worker_id = 2;
  // Whether the worker may receive offers. Check this before accepting work.
  bool admitted = 3;
  // The coordinator's session id; empty when the worker was not admitted.
  string session_id = 4;
  // Why admission was refused; empty when the worker was admitted.
  string reason = 5;
}

// The delegation coordinator's task protocol as a typed service.
//
// Every verb the delegation role contributes to the action catalog is one
// method here, taking the same request message the verb accepts. A caller may
// reach the coordinator as an RPC or as a catalog verb; the contract is the
// same either way, because it is stated once.
service DelegationService {
  // Offers a bounded task to an admitted worker.
  rpc OfferTask(OfferTaskRequest) returns (OfferTaskResponse);

  // Takes the open offer's attempt lease.
  rpc AcceptTask(AcceptTaskRequest) returns (AcceptTaskResponse);

  // Cancels a task's open attempt; terminal the moment the coordinator emits it.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Submits a completion candidate for review against an expected revision.
  rpc SubmitCandidate(SubmitCandidateRequest) returns (SubmitCandidateResponse);

  // Records one resumable checkpoint on the leased attempt.
  rpc RecordCheckpoint(RecordCheckpointRequest) returns (RecordCheckpointResponse);

  // Sends a non-transitioning task message in either direction.
  rpc SendTaskMessage(SendTaskMessageRequest) returns (SendTaskMessageResponse);

  // Reports one bounded progress note in a strictly increasing sequence.
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);

  // Applies the verdict on an open candidate: accept, or revise with feedback.
  rpc ReviewCandidate(ReviewCandidateRequest) returns (ReviewCandidateResponse);

  // Reads the recorded transcript from a cursor.
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptResponse);

  // Long-polls the event feed: blocks until an event appears after a cursor,
  // then returns a bounded batch.
  rpc WatchEvents(WatchEventsRequest) returns (WatchEventsResponse);

  // Lists registered workers with identity, admission and lease state.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // Registers this agent as a worker and opens its stream.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
}
