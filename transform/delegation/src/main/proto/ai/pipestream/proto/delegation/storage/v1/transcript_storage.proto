syntax = "proto3";

package ai.pipestream.proto.delegation.storage.v1;

import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.delegation.storage.v1";

// Encryption algorithm used for persisted ProtoMolt state.
enum RepositoryStateEncryptionAlgorithm {
  // No encryption algorithm was selected.
  REPOSITORY_STATE_ENCRYPTION_ALGORITHM_UNSPECIFIED = 0;
  // AES with a 256-bit key, GCM authentication, and a 128-bit tag.
  REPOSITORY_STATE_ENCRYPTION_ALGORITHM_AES_256_GCM = 1;
}

// One encrypted, integrity-checked ProtoMolt state snapshot.
//
// The repository service, its S3-compatible backing store, and its optional
// cache only receive this envelope. Key material is resolved locally from
// key_ref immediately before encryption or decryption and is never persisted.
message EncryptedRepositoryState {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Client-side encrypted ProtoMolt state snapshot stored through repository service."
    owner: "protomolt"
    sensitivity: "secret"
  };

  // Envelope format version. Version 1 is the only accepted format.
  int32 format_version = 1 [
    (ai.pipestream.proto.validate.v1.field).int32.const = 1,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Authenticated encryption algorithm used for ciphertext.
  RepositoryStateEncryptionAlgorithm algorithm = 2 [
    (ai.pipestream.proto.validate.v1.field).enum.defined_only = true,
    (ai.pipestream.proto.validate.v1.field).enum.not_in = 0,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Opaque local key reference. This value is not encryption key material.
  string key_ref = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {
        max_len: 256
        pattern: "^[A-Za-z][A-Za-z0-9+.-]{0,31}:[A-Za-z_][A-Za-z0-9_]{0,127}$"
      }
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Unique 96-bit AES-GCM nonce.
  bytes nonce = 4 [
    (ai.pipestream.proto.validate.v1.field).bytes = {
      min_len: 12
      max_len: 12
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "secret"
  ];
  // Serialized state encrypted with its 128-bit authentication tag.
  bytes ciphertext = 5 [
    (ai.pipestream.proto.validate.v1.field).bytes = {
      min_len: 1
      max_len: 8388624
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "secret"
  ];
  // Lowercase SHA-256 of the serialized plaintext state.
  string plaintext_sha256 = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {pattern: "^[0-9a-f]{64}$"}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Number of logical records in the plaintext state.
  uint32 record_count = 7 [
    (ai.pipestream.proto.validate.v1.field).uint32.lte = 100000,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Time at which this snapshot was encrypted and written.
  google.protobuf.Timestamp saved_at = 8 [
    (ai.pipestream.proto.validate.v1.field).required = true,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Exact media type of the plaintext protobuf message.
  string content_type = 9 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 256}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}
