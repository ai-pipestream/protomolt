syntax = "proto3";

package ai.pipestream.proto.receipt.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.receipt";
option java_outer_classname = "ReceiptProto";

import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

// The receipt layer's wire contract (design of record:
// docs/design/receipts.md). A work record is a canonical, signed,
// self-contained projection of evidence the platform already holds; a
// relying party holding only the record, the issuer's public key, and a
// trust snapshot verifies it offline. Every message here is map-free by
// rule: together with the deterministic serializer that makes the manifest
// bytes a function of the content, and the record's identity is
// sha256 over those bytes (the manifest digest).

// The signed container: the manifest bytes exactly as signed, one or more
// detached signatures, and nothing else. Artifact bytes never ride here —
// the manifest references them by digest. The verifier is strict: unknown
// fields refuse, absent signatures refuse, an algorithm outside the
// profile refuses.
message SignedWorkRecord {
  // The canonical WorkRecord bytes. Verification hashes and checks these
  // bytes as given; it never re-canonicalizes.
  bytes manifest = 1 [
    (ai.pipestream.proto.validate.v1.field).bytes.min_len = 1
  ];
  // Detached signatures over the manifest bytes. The manifest's own
  // key_id must appear among them; every signature present must verify.
  repeated RecordSignature signatures = 2 [
    (ai.pipestream.proto.validate.v1.field).repeated.min_items = 1
  ];
}

// One detached signature over the manifest bytes.
message RecordSignature {
  // The signing key, resolved against the trust snapshot at verification.
  string key_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The algorithm; the v1 profile admits exactly Ed25519.
  SignatureAlgorithm algorithm = 2 [
    (ai.pipestream.proto.validate.v1.field).enum = {
      defined_only: true
      not_in: 0
    }
  ];
  // The signature bytes (64 bytes for Ed25519).
  bytes signature = 3 [
    (ai.pipestream.proto.validate.v1.field).bytes.len = 64
  ];
}

// Signature algorithms the container can name. The v1 verification
// profile accepts only ED25519; the enum exists so a future profile is a
// new value, never a reinterpretation.
enum SignatureAlgorithm {
  // Unset; always refused.
  SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
  // Ed25519 (RFC 8032), the JDK-native default.
  SIGNATURE_ALGORITHM_ED25519 = 1;
}

// The manifest: everything the record claims, all facts the platform
// already emits. Serialized deterministically; those bytes are the
// record's identity.
message WorkRecord {
  // The manifest format version. A verifier refuses a version it does
  // not know; this is the freeze boundary.
  uint32 manifest_version = 1 [
    (ai.pipestream.proto.validate.v1.field).uint32 = {gte: 1}
  ];
  // The record's own name, unique per issuer.
  string record_id = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // Who issued (and signs) this record.
  string issuer = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 256}
    }
  ];
  // The key the issuer signed with; must carry a valid signature in the
  // container and resolve in the trust snapshot.
  string key_id = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // Issuance time as claimed by the issuer. Verification checks the key's
  // validity window against it and reports its honesty as a non-claim.
  google.protobuf.Timestamp issued_at = 5 [
    (ai.pipestream.proto.validate.v1.field).required = true
  ];
  // What work this records.
  RecordSubject subject = 6 [
    (ai.pipestream.proto.validate.v1.field).required = true
  ];
  // Per-step evidence, in execution order.
  repeated RecordStep steps = 7 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 1024
  ];
  // Artifacts the record references at run scope (inputs and outputs).
  // Bytes live outside the record, content-addressed.
  repeated RecordArtifact artifacts = 8 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 1024
  ];
  // What this record claims about its own coverage, against a committed
  // evidence policy.
  Completeness completeness = 9 [
    (ai.pipestream.proto.validate.v1.field).required = true
  ];
  // The prior record's manifest digest when this record re-issues one.
  // A revision chain is walkable offline.
  string prior_manifest_sha256 = 10 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {sha256_hex: true}
    }
  ];
  // Present exactly when this record is a masked projection of another.
  Disclosure disclosure = 11;
}

// The work a record describes. Kinds are a closed vocabulary per manifest
// version; v1 defines "workflow-run" and "delegation-task".
message RecordSubject {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "subject.known_kind"
      message: "the subject kind is one this manifest version defines"
      expression: "this.kind in ['workflow-run', 'delegation-task']"
    }
    cel: {
      id: "subject.workflow_fields"
      message: "a workflow-run subject names the workflow, its fingerprint, and the run"
      expression: "this.kind != 'workflow-run' || (this.workflow_name != '' && this.workflow_fingerprint != '' && this.run_id != '')"
    }
    cel: {
      id: "subject.delegation_fields"
      message: "a delegation-task subject names the task, its worker, and the spec fingerprint"
      expression: "this.kind != 'delegation-task' || (this.task_id != '' && this.worker_id != '' && this.spec_sha256 != '')"
    }
  };

  // The subject kind; the trust snapshot authorizes issuers per kind, and
  // each kind requires its own identity fields through the rules above.
  string kind = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 64}
    }
  ];
  // The workflow that ran; workflow-run subjects only.
  string workflow_name = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The promoted version the run executed, when one exists; empty for a
  // draft probe.
  string workflow_version = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The workflow definition's fingerprint; workflow-run subjects only.
  string workflow_fingerprint = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {sha256_hex: true}
    }
  ];
  // The run this record projects; workflow-run subjects only.
  string run_id = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The delegated task this record projects; delegation-task subjects only.
  string task_id = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {uuid: true}
    }
  ];
  // The worker the task was delegated to; delegation-task subjects only.
  string worker_id = 7 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {slug: true, max_len: 128}
    }
  ];
  // Fingerprint of the offered TaskSpec's deterministic bytes: the contract
  // the work was judged against, playing the role the workflow fingerprint
  // plays for a run. Delegation-task subjects only.
  string spec_sha256 = 8 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {sha256_hex: true}
    }
  ];
}

// One step's evidence, projected.
message RecordStep {
  // The step name, unique within the record.
  string name = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The fully-qualified "Service/Method" the step invoked; empty for a
  // model-driven step.
  string method = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 512}
    }
  ];
  // How the step ended.
  StepOutcome outcome = 3 [
    (ai.pipestream.proto.validate.v1.field).enum = {
      defined_only: true
      not_in: 0
    }
  ];
  // When the step started.
  google.protobuf.Timestamp started_at = 4;
  // When the step completed.
  google.protobuf.Timestamp completed_at = 5;
  // The recorded request payload, by digest.
  RecordArtifact request_artifact = 6;
  // The recorded response payload, by digest.
  RecordArtifact response_artifact = 7;
  // Prompt tokens consumed by a model-driven step; zero otherwise.
  int64 prompt_tokens = 8 [
    (ai.pipestream.proto.validate.v1.field).int64 = {gte: 0}
  ];
  // Completion tokens produced by a model-driven step; zero otherwise.
  int64 completion_tokens = 9 [
    (ai.pipestream.proto.validate.v1.field).int64 = {gte: 0}
  ];
  // The model a model-driven step ran; empty otherwise.
  string model = 10 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 256}
    }
  ];
  // The model version as reported at execution; empty when unknown.
  string model_version = 11 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 512}
    }
  ];
  // A bounded human-readable note; never payload content.
  string summary = 12 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 4096}
    }
  ];
}

// Step outcomes, the projection of the run's step statuses.
enum StepOutcome {
  // Unset; always refused.
  STEP_OUTCOME_UNSPECIFIED = 0;
  // The step completed and its response was recorded.
  STEP_OUTCOME_SUCCEEDED = 1;
  // The step failed; the failure is part of the record.
  STEP_OUTCOME_FAILED = 2;
  // The step never ran because an earlier step failed.
  STEP_OUTCOME_SKIPPED = 3;
  // The run was cancelled before or during the step.
  STEP_OUTCOME_CANCELLED = 4;
}

// A content-addressed artifact reference. The bytes live outside the
// record; the rehash check verifies supplied bytes against digest and
// size, all-or-nothing.
message RecordArtifact {
  // SHA-256 of the artifact bytes.
  string sha256 = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    }
  ];
  // The artifact's media type.
  string media_type = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {mime_type: true}
    }
  ];
  // The artifact's size in bytes.
  uint64 size_bytes = 3;
  // Whether sensitive content was removed before the artifact was stored.
  bool redacted = 4;
}

// What the record claims about its own coverage. The policy is the
// denominator: completeness is only meaningful against a committed
// statement of what evidence a complete record carries.
message Completeness {
  // The claim.
  CompletenessStatus status = 1 [
    (ai.pipestream.proto.validate.v1.field).enum = {
      defined_only: true
      not_in: 0
    }
  ];
  // Why evidence is missing, in order; empty exactly when complete.
  repeated string missing_reasons = 2 [
    (ai.pipestream.proto.validate.v1.field).repeated = {
      max_items: 64
      items: {
        string: {min_len: 1, max_len: 512}
      }
    }
  ];
  // The evidence policy this claim is evaluated against.
  string policy_id = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The policy's version.
  string policy_version = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {max_len: 128}
    }
  ];
  // The policy document's digest.
  string policy_sha256 = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    }
  ];
}

// Completeness claims.
enum CompletenessStatus {
  // Unset; always refused.
  COMPLETENESS_STATUS_UNSPECIFIED = 0;
  // Every evidence item the policy names is present.
  COMPLETENESS_STATUS_COMPLETE = 1;
  // Evidence the policy names is missing; the reasons say what and why.
  COMPLETENESS_STATUS_PARTIAL = 2;
  // The record was projected under a policy adopted after the work ran;
  // the reasons say what the era could not have captured.
  COMPLETENESS_STATUS_HISTORICAL = 3;
}

// Present on a record that is a masked projection of another record's
// evidence. Every audience gets a whole, verifiable record; nobody gets a
// record with holes punched in someone else's signature.
message Disclosure {
  // The manifest digest of the record this one is a projection of.
  string source_manifest_sha256 = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    }
  ];
  // The sensitivity policy that produced the projection.
  string policy = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 512}
    }
  ];
}

// The verifier's trust input: who may sign what, with which keys, in
// which windows. Caller-supplied; verification makes zero network calls.
// Inside the platform this distributes as a config document on the config
// lane; outside it is a file the relying party pins. Same document, two
// custody models.
message TrustSnapshot {
  // The issuers this snapshot trusts.
  repeated TrustedIssuer issuers = 1 [
    (ai.pipestream.proto.validate.v1.field).repeated = {
      min_items: 1
      max_items: 256
    }
  ];
}

// One issuer: its keys and what it is authorized to sign.
message TrustedIssuer {
  // The issuer name records carry.
  string issuer = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 256}
    }
  ];
  // The issuer's keys, across rotations.
  repeated TrustedKey keys = 2 [
    (ai.pipestream.proto.validate.v1.field).repeated = {
      min_items: 1
      max_items: 256
    }
  ];
  // The subject kinds this issuer may sign. Authorization is explicit:
  // a kind not named here refuses.
  repeated string subject_kinds = 3 [
    (ai.pipestream.proto.validate.v1.field).repeated = {
      min_items: 1
      max_items: 64
      unique: true
      items: {
        string: {slug: true, max_len: 64}
      }
    }
  ];
}

// One key: material, state, and validity window.
message TrustedKey {
  // The key id records name.
  string key_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // The key's algorithm.
  SignatureAlgorithm algorithm = 2 [
    (ai.pipestream.proto.validate.v1.field).enum = {
      defined_only: true
      not_in: 0
    }
  ];
  // The public key in the algorithm's raw encoding (32 bytes for
  // Ed25519, RFC 8032).
  bytes public_key = 3 [
    (ai.pipestream.proto.validate.v1.field).bytes.len = 32
  ];
  // The key's state. A revoked key refuses; what a revoked key's past
  // signatures mean is the relying party's policy, reported, not decided.
  KeyState state = 4 [
    (ai.pipestream.proto.validate.v1.field).enum = {
      defined_only: true
      not_in: 0
    }
  ];
  // Start of the validity window; absent means unbounded below.
  google.protobuf.Timestamp not_before = 5;
  // End of the validity window; absent means unbounded above. A retired
  // key keeps its window, so records it signed keep verifying.
  google.protobuf.Timestamp not_after = 6;
}

// The registry-published log of issued records. One document per lane
// (subject "work-records"); each publish is a registry commit, so the
// commit history is the append-only view and the document is the current
// one. A relying party who can see the registry detects equivocation (two
// entries claiming one record id with different digests) and rollback (an
// entry the history shows and the document no longer carries).
message WorkRecordLog {
  // Issued records, appended in issuance order.
  repeated WorkRecordLogEntry entries = 1 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 4096
  ];
}

// One issued record's log entry.
message WorkRecordLogEntry {
  // The record's own name, unique per issuer.
  string record_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    }
  ];
  // Who issued the record.
  string issuer = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 256}
    }
  ];
  // The record's manifest digest.
  string manifest_sha256 = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    }
  ];
  // The prior record's manifest digest when the record is a re-issue.
  string prior_manifest_sha256 = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {sha256_hex: true}
    }
  ];
}

// Key states.
enum KeyState {
  // Unset; always refused.
  KEY_STATE_UNSPECIFIED = 0;
  // The key signs new records.
  KEY_STATE_ACTIVE = 1;
  // The key signs nothing new; records inside its window keep verifying.
  KEY_STATE_RETIRED = 2;
  // The key is distrusted; every record naming it refuses.
  KEY_STATE_REVOKED = 3;
}
