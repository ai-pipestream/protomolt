syntax = "proto3";

package ai.pipestream.proto.screening.testdata;

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.screening.testdata";

import "ai/pipestream/proto/meta/v1/metadata.proto";

// A nested carrier: its note is screened, its kind is not.
message Contact {
  string note = 1 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  string kind = 2;
}

// The screening walk fixture: screened and unscreened fields side by side in
// every shape the walk covers (singular, repeated, nested, map values).
message Profile {
  string display_name = 1;
  string bio = 2 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  repeated string aliases = 3 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  Contact contact = 4;
  map<string, string> notes = 5 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  repeated Contact contacts = 6;
}
