syntax = "proto3";

package ai.pipestream.proto.screening.testdata.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.screening.testdata.v1";

import "ai/pipestream/proto/meta/v1/metadata.proto";
import "google/protobuf/any.proto";

// A nested carrier used to prove the screening walk descends into message
// fields and applies each field's own sensitivity rather than inheriting the
// parent's.
message Contact {
  // Carries a sensitivity annotation, so the walk must screen it even though
  // it is reached through a nested message rather than at the top level.
  string note = 1 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  // Carries no annotation, so it must survive screening unchanged. Paired with
  // the field above to show that screening is per field, not per message.
  string kind = 2;
}

// The primary screening walk fixture. Each field shape the walk supports
// appears here in both an annotated and an unannotated form, so a single pass
// over this message exercises every branch and shows that an unannotated field
// of the same shape is left alone.
message Profile {
  // Unannotated scalar. Establishes the baseline that screening changes
  // nothing without an explicit sensitivity.
  string display_name = 1;
  // Annotated singular scalar: the simplest case the walk must screen.
  string bio = 2 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  // Annotated repeated scalar. Every element must be screened, not just the
  // first.
  repeated string aliases = 3 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  // Unannotated singular message. The walk must still descend, because the
  // sensitivity lives on the nested fields rather than on this one.
  Contact contact = 4;
  // Annotated map. Values are screened; keys are left intact, because a
  // screened key would make the entry unaddressable.
  map<string, string> notes = 5 [(ai.pipestream.proto.meta.v1.field).sensitivity = "pii"];
  // Unannotated repeated message. Exercises descent into every element rather
  // than into the first alone.
  repeated Contact contacts = 6;
  // Singular Any. The walk must resolve the packed type before it can decide
  // what inside the payload is sensitive.
  google.protobuf.Any payload = 7;
  // Repeated Any. Each element may pack a different type, so resolution has to
  // happen per element rather than once for the field.
  repeated google.protobuf.Any attachments = 8;
}
