description = 'The workflow manager: configured, type-checked compositions of gRPC calls - one endpoint in, one composed answer out'

dependencies {
    api project(':protomolt-shapes')
    api project(':protomolt-grpc-invoke')
    api project(':protomolt-grpc-channel-policy')
    // RunWorkflowAction and CheckWorkflowAction implement ProtoAction from this module.
    api project(':protomolt-actions')
    // WorkflowCompiler emits the durable workflow contract from this module.
    api project(':protomolt-grpc-workflow')
    // Structured-generation steps execute through this coordinator.
    api project(':protomolt-inference-structured')
    // Typed edges project their produced values with this compiled projection.
    api project(':protomolt-projection')
    // Run evidence projects into canonical signed work records.
    api project(':protomolt-receipt')

    implementation project(':protomolt-json')
    implementation project(':protomolt-protobuf-validation')
    implementation project(':protomolt-protobuf-metadata')
    // Prompt/schema fingerprints of a structured step are recomputed with the
    // same persona-free renderer the coordinator uses.
    implementation project(':protomolt-protobuf-prompt')
    implementation libs.protobuf.java.util

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation project(':protomolt-proto-sources')
    testImplementation libs.grpc.inprocess
    testImplementation libs.grpc.stub
    testImplementation libs.grpc.protobuf
    testRuntimeOnly libs.junit.platform.launcher
}
