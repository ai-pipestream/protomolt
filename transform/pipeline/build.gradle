plugins {
    alias(libs.plugins.protobuf)
}

description = 'The pipeline contract: the compiled, streaming-aware form of a gRPC recipe, plus its offline static checker'

dependencies {
    api libs.protobuf.java
    // The pipeline contract embeds the recipe's ServiceDependency, TypedEdge,
    // FanOutSpec, StructuredGenerationSpec, StepCompletion, and CelMappingRule
    // unchanged, and validates them with RecipeValidation.
    api project(':protomolt-grpc-recipe')
    // Persisted pipeline fields carry the house validation and sensitivity
    // metadata options.
    api project(':protomolt-protobuf-validation')
    api project(':protomolt-protobuf-metadata')

    // The checker type-checks mappings, CEL, and gates with the same rule
    // checker the chain verifier uses.
    implementation project(':protomolt-shapes')
    // Edge projection targets resolve through the compiled projection.
    implementation project(':protomolt-projection')
    implementation project(':protomolt-descriptors')

    testImplementation project(':protomolt-proto-sources')
    // The end-to-end tests compile chains into recipes with the existing
    // compiler before compiling recipes into pipelines.
    testImplementation project(':protomolt-chain')
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.1"
    }
}
