plugins {
    alias(libs.plugins.protobuf)
}

description = 'Examples for Pipestream protobuf tools'

// Compile the existing court-decoration contract directly for deterministic
// regressions; the schema remains owned by protobuf/llm/examples.
sourceSets.main.proto.srcDir '../protobuf/llm/examples/court-decoration/proto'

dependencies {
    implementation project(':protomolt-correction')
    // Starter contracts reuse the existing task, workflow, projection and receipt
    // models. They add examples and validation fixtures, not a mounted service.
    implementation project(':protomolt-delegation')
    implementation project(':protomolt-projection')
    implementation project(':protomolt-workflow')
    implementation project(':protomolt-protobuf-llm')
    implementation project(':protomolt-inference-service')
    implementation project(':protomolt-inference-openai')
    implementation project(':protomolt-registry')
    testImplementation project(':protomolt-grpc-service-contract')
    testImplementation project(':protomolt-http-jsonschema')
    testImplementation project(':protomolt-http-openapi')
    implementation project(':protomolt-mapper-cel')
    implementation project(':protomolt-server-jdk')
    // Live SharePoint read -> infer-schema sample.
    implementation project(':protomolt-acquire-msgraph')
    implementation project(':protomolt-shapes')
    implementation libs.protobuf.java.util

    // Court Document -> NDJSON -> Lucene sample.
    implementation project(':protomolt-repo-proto')
    implementation project(':protomolt-search-index-spi')
    implementation project(':protomolt-search-index-ndjson')
    implementation project(':protomolt-search-index-lucene')
    implementation project(':protomolt-search-embedding-model2vec')
    implementation libs.jackson.databind

    // The shared test-dependencies block in the root build skips samples.
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly libs.junit.platform.launcher

    // Streaming demo: the ACP client drives the agent against the server-streaming search server.
    implementation project(':protomolt-acp')
    implementation libs.grpc.stub
    implementation libs.grpc.protobuf
    implementation libs.grpc.netty.shaded
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.register('runCelMapping', JavaExec) {
    group = 'application'
    description = 'Run CelMappingSample'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.protomolt.proto.samples.CelMappingSample'
}

tasks.register('runCorrection', JavaExec) {
    group = 'application'
    description = 'Recorded contact correction, configured evaluation and offline-verified receipts; -PliveCorrection opts into a configured live provider'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.protomolt.proto.correction.CorrectionSample'
    doFirst {
        args '--workspace', (findProperty('correctionWorkspace') ?: layout.buildDirectory.dir('correction-example').get().asFile).toString()
        if (project.hasProperty('liveCorrection')) args '--live'
        if (project.hasProperty('verifyCorrectionRun')) {
            if (!project.hasProperty('correctionTrust')) {
                throw new GradleException('Offline verification needs -PcorrectionTrust=/path/to/trust.pb')
            }
            args '--verify', project.property('verifyCorrectionRun').toString()
            args '--trust', project.property('correctionTrust').toString()
        }
    }
}

tasks.register('runJsonRestServer', JavaExec) {
    group = 'application'
    description = 'Run JsonRestServerSample (JDK HttpServer)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.protomolt.proto.samples.JsonRestServerSample'
    args = ['8080', 'secret']
}

tasks.register('runGraphInferSchema', JavaExec) {
    group = 'application'
    description = 'Live SharePoint read -> infer-schema: -Ptenant=... -Pclient=... [-Pfolder=...] [-Ptype=...] [-Plimit=...]'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.protomolt.proto.samples.GraphInferSchemaSample'
    doFirst {
        def probeArgs = []
        ['tenant', 'client', 'folder', 'type', 'limit'].each { name ->
            def value = findProperty(name)
            if (value) {
                probeArgs += ["--${name}".toString(), value.toString()]
            }
        }
        args probeArgs
    }
}

tasks.register('runDemoSearch', JavaExec) {
    group = 'application'
    description = 'Run the server-streaming demo search on localhost:9777'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.protomolt.proto.samples.DemoSearchServer'
}

tasks.register('runAcpStreamingDemo', JavaExec) {
    group = 'application'
    description = 'Drive the ACP agent against the demo search and print chunks live'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.protomolt.proto.samples.AcpStreamingDemo'
    workingDir = rootDir
}

tasks.register('runCourtDocIndex', JavaExec) {
    group = 'application'
    description = 'CourtListener JSONL -> Document -> NDJSON + Lucene (text + HNSW vectors):' +
            ' -Pfixtures=... -Pout=... -Plimit=... [-Pmodel2vec=...]'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ai.protomolt.proto.samples.CourtDocumentIndexSample'
    doFirst {
        def sampleArgs = []
        ['fixtures', 'out', 'limit'].each { name ->
            def value = findProperty(name)
            if (value) {
                sampleArgs += ["--${name}".toString(), value.toString()]
            }
        }
        args sampleArgs
        def model = findProperty('model2vec')
        if (model) {
            systemProperty 'protomolt.embeddings.model2vec.path', model.toString()
        }
    }
}
