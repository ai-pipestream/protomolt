# Buf STANDARD lint for Pipestream protobuf standards.
# Lint only — codegen stays protoc / protobuf-gradle-plugin. Not a runtime dependency.
version: v2
modules:
  - path: protobuf/metadata/src/main/proto
    name: buf.build/ai-pipestream/protobuf-metadata
  - path: protobuf/llm/src/main/proto
    name: buf.build/ai-pipestream/protobuf-llm
  - path: protobuf/prompt/src/main/proto
    name: buf.build/ai-pipestream/protobuf-prompt
  - path: protobuf/quality/src/main/proto
    name: buf.build/ai-pipestream/protobuf-quality
  - path: protobuf/llm/src/test/proto
    name: buf.build/ai-pipestream/protobuf-llm-testdata
  - path: protobuf/prompt/src/test/proto
    name: buf.build/ai-pipestream/protobuf-prompt-testdata
  - path: surface/grpc/service/src/main/resources
    name: buf.build/ai-pipestream/protomolt-service
  - path: protobuf/validation/src/main/proto
    name: buf.build/ai-pipestream/protobuf-validation
  - path: search/index/spi/src/main/proto
    name: buf.build/ai-pipestream/protobuf-indexing-hints
  - path: protobuf/metadata/src/test/proto
    name: buf.build/ai-pipestream/protobuf-metadata-testdata
  - path: protobuf/validation/src/test/proto
    name: buf.build/ai-pipestream/protobuf-validation-testdata
  - path: protobuf/indexing/src/test/proto
    name: buf.build/ai-pipestream/protobuf-indexing-testdata
  - path: surface/http/jsonschema/src/test/proto
    name: buf.build/ai-pipestream/jsonschema-testdata
  - path: repo/proto/src/main/proto
    name: buf.build/ai-pipestream/repo
  - path: account/proto/src/main/proto
    name: buf.build/ai-pipestream/account
  - path: acquire/confluence/src/main/proto
    name: buf.build/ai-pipestream/acquire-confluence
lint:
  use:
    - STANDARD
    - COMMENTS
  ignore_only:
    # GetDocument and GetDocumentByReference deliberately share
    # GetDocumentResponse: same payload, two coordinate systems.
    RPC_REQUEST_RESPONSE_UNIQUE:
      - repo/proto/src/main/proto/ai/pipestream/proto/repo/v1/document_service.proto
      # ProtoMoltService returns google.protobuf.Struct from its render/invoke
      # verbs by design: the service is descriptor-native and the canonical
      # proto3 JSON form of each action envelope IS the response payload.
      - surface/grpc/service/src/main/resources/ai/pipestream/protomolt/v1/protomolt_service.proto
    RPC_RESPONSE_STANDARD_NAME:
      - repo/proto/src/main/proto/ai/pipestream/proto/repo/v1/document_service.proto
      # Same deliberate Struct responses as RPC_REQUEST_RESPONSE_UNIQUE above.
      - surface/grpc/service/src/main/resources/ai/pipestream/protomolt/v1/protomolt_service.proto
breaking:
  use:
    - FILE
    # The standing rule is no ignores: repo/ and acquire-confluence are
    # pre-release, but the ignore mechanism breaks the workspace image
    # comparison for any PR that adds a module, and repo/'s NodeAddress wire
    # break (the reason the waiver existed) is long merged. A deliberate wire
    # break gets flagged here and decided in its own PR — which is this one.
  #
  # TEMPORARY, REMOVED BY THE FOLLOW-UP PR. parsed_metadata -> parser_results
  # replaces ParsedMetadata with ParserResult, redefining tags 1-3 (tag 2
  # especially: an old parser_name now reads back as parser_version, silently).
  # repo/ is pre-release with no stored payloads and no downstream consumer, so
  # the break is taken deliberately, once, here. This PR adds no buf module, so
  # the image sets match and the waiver actually applies. Scoped per-rule to the
  # one reshaped file, so an UNRELATED break in document.proto still fails.
  ignore_only:
    MESSAGE_NO_DELETE:
      - repo/proto/src/main/proto/ai/pipestream/proto/repo/v1/document.proto
    FIELD_SAME_JSON_NAME:
      - repo/proto/src/main/proto/ai/pipestream/proto/repo/v1/document.proto
    FIELD_SAME_TYPE:
      - repo/proto/src/main/proto/ai/pipestream/proto/repo/v1/document.proto
    FIELD_SAME_NAME:
      - repo/proto/src/main/proto/ai/pipestream/proto/repo/v1/document.proto
