# Buf STANDARD lint for Pipestream protobuf standards.
# Lint only — codegen stays protoc / protobuf-gradle-plugin. Not a runtime dependency.
version: v2
modules:
  - path: protobuf/metadata/src/main/proto
    name: buf.build/ai-pipestream/protobuf-metadata
  - path: protobuf/llm/src/main/proto
    name: buf.build/ai-pipestream/protobuf-llm
  - path: protobuf/metric/src/main/proto
    name: buf.build/ai-pipestream/protobuf-metric
  - path: protobuf/prompt/src/main/proto
    name: buf.build/ai-pipestream/protobuf-prompt
  - path: protobuf/quality/src/main/proto
    name: buf.build/ai-pipestream/protobuf-quality
  - path: protobuf/llm/src/test/proto
    name: buf.build/ai-pipestream/protobuf-llm-testdata
  - path: protobuf/prompt/src/test/proto
    name: buf.build/ai-pipestream/protobuf-prompt-testdata
  - path: surface/grpc/service-contract/src/main/resources
    name: buf.build/ai-pipestream/protomolt-service
  - path: protobuf/validation/src/main/proto
    name: buf.build/ai-pipestream/protobuf-validation
  - path: protobuf/types/src/main/proto
    name: buf.build/ai-pipestream/protobuf-types
  - path: search/index/spi/src/main/proto
    name: buf.build/ai-pipestream/protobuf-indexing-hints
  - path: protobuf/seo/src/main/proto
    name: buf.build/ai-pipestream/protobuf-seo
  - path: protobuf/metadata/src/test/proto
    name: buf.build/ai-pipestream/protobuf-metadata-testdata
  - path: protobuf/validation/src/test/proto
    name: buf.build/ai-pipestream/protobuf-validation-testdata
  - path: search/index/protobuf/src/test/proto
    name: buf.build/ai-pipestream/protobuf-indexing-testdata
  - path: surface/http/jsonschema/src/test/proto
    name: buf.build/ai-pipestream/jsonschema-testdata
  - path: asset/proto/src/main/proto
    name: buf.build/ai-pipestream/asset
  - path: repo/proto/src/main/proto
    name: buf.build/ai-pipestream/repo
  - path: account/proto/src/main/proto
    name: buf.build/ai-pipestream/account
  - path: jobs/proto/src/main/proto
    name: buf.build/ai-pipestream/jobs
  - path: intake/proto/src/main/proto
    name: buf.build/ai-pipestream/intake
  - path: inference/proto/src/main/proto
    name: buf.build/ai-pipestream/inference
  - path: inference/structured/src/test/proto
    name: buf.build/ai-pipestream/inference-structured-testdata
  - path: parse/proto/src/main/proto
    name: buf.build/ai-pipestream/parse
  - path: metric/proto/src/main/proto
    name: buf.build/ai-pipestream/metric
  - path: search/proto/src/main/proto
    name: buf.build/ai-pipestream/search
  - path: schema/registry/proto/src/main/proto
    name: buf.build/ai-pipestream/schema-registry
  # The canonical parser-fleet document model; fleet repos re-vendor it from
  # here, byte-identical. It keeps the fleet's docling-parity lint bar, so it
  # is exempted from lint (in the TOP-LEVEL lint.ignore below: a
  # module-level lint block silently breaks the workspace image that
  # `buf breaking` compares, making every later branch report all files
  # deleted).
  - path: parse/document/src/main/proto
    name: buf.build/ai-pipestream/document
  # The gRParse streaming wire surface, canonical here; the gRParse repo
  # re-vendors it byte-identical so the parse/grparse adapter can bridge it
  # onto the parser plugin contract. Same regime as the fleet document model
  # above: lint exemption lives in the TOP-LEVEL lint.ignore, never a
  # module-level lint block.
  - path: parse/grparse/src/main/proto
    name: buf.build/ai-pipestream/parse-grparse
  - path: acquire/confluence/src/main/proto
    name: buf.build/ai-pipestream/acquire-confluence
  - path: acquire/pull/src/main/proto
    name: buf.build/ai-pipestream/acquire-pull
  - path: transform/projection/src/main/proto
    name: buf.build/ai-pipestream/projection
  - path: surface/grpc/workflow/src/main/proto
    name: buf.build/ai-pipestream/grpc-workflow
  - path: transform/pipeline/src/main/proto
    name: buf.build/ai-pipestream/pipeline
  - path: transform/delegation/src/main/proto
    name: buf.build/ai-pipestream/delegation
  - path: mesh/proto/src/main/proto
    name: buf.build/ai-pipestream/mesh
  - path: mesh/contracts/src/test/proto
    name: buf.build/ai-pipestream/mesh-testdata
  - path: mesh/cluster/src/main/proto
    name: buf.build/ai-pipestream/mesh-cluster
  - path: surface/grpc/service-profile/src/main/proto
    name: buf.build/ai-pipestream/grpc-service-profile
  - path: transform/receipt/src/main/proto
    name: buf.build/ai-pipestream/receipt
  - path: protobuf/quality/src/test/proto
    name: buf.build/ai-pipestream/protobuf-quality-testdata
  - path: transform/projection/src/test/proto
    name: buf.build/ai-pipestream/projection-testdata
  - path: transform/screening/src/test/proto
    name: buf.build/ai-pipestream/screening-testdata
  - path: sink/kafka/serde/src/test/proto
    name: buf.build/ai-pipestream/kafka-serde-testdata
  - path: samples/src/main/proto
    name: buf.build/ai-pipestream/samples
lint:
  use:
    - STANDARD
    - COMMENTS
  ignore:
    # The vendored parser-fleet document model keeps the fleet's own lint
    # bar; see the module comment above. Top-level ignore ONLY: a
    # module-level lint block breaks the workspace image `buf breaking`
    # compares.
    - parse/document/src/main/proto/ai/protomolt/proto/parse/document/v1/document.proto
    # The vendored gRParse streaming surface keeps gRParse's own lint bar for
    # the same byte-identity reason.
    - parse/grparse/src/main/proto/ai/protomolt/proto/parse/grparse/v1/parse_stream.proto
    - parse/grparse/src/main/proto/ai/protomolt/proto/parse/grparse/v1/parse_types.proto
  ignore_only:
    # GetDocument and GetDocumentByReference deliberately share
    # GetDocumentResponse: same payload, two coordinate systems.
    RPC_REQUEST_RESPONSE_UNIQUE:
      - repo/proto/src/main/proto/ai/protomolt/proto/repo/v1/document_service.proto
    # Every ProtoMolt proto that generates Java sets java_multiple_files. These
    # two fixtures are deliberately inconsistent with each other because they
    # stand in for FOREIGN descriptors, which ProtoMolt must consume whatever
    # options they carry. GeneratedMessages reads the option off the descriptor
    # and reconstructs protoc's outer-class rule when it is absent, including
    # the OuterClass suffix protoc appends when a top-level type already claims
    # the file's derived name. legacy_event.proto is the only fixture that
    # reaches that branch. Aligning the option would delete the case under test.
    PACKAGE_SAME_JAVA_MULTIPLE_FILES:
      - sink/kafka/serde/src/test/proto/serde/gen/v1/gen_order.proto
      - sink/kafka/serde/src/test/proto/serde/gen/v1/legacy_event.proto
    RPC_RESPONSE_STANDARD_NAME:
      - repo/proto/src/main/proto/ai/protomolt/proto/repo/v1/document_service.proto
breaking:
  use:
    - FILE
  # For a deliberate pre-GA wire break, carry a temporary rule-level
  # `except` block here in the SAME PR (buf reads breaking config from the
  # input side) and drop it in the next PR. Path-based breaking.ignore
  # entries never match in this multi-module v2 workspace — do not try
  # them again (proven on buf 1.70 with a real break present).
  # Standing note: repo/ and acquire-confluence are pre-release, but the
  # ignore mechanism breaks the workspace image comparison for any PR
  # that adds a module, and repo/'s NodeAddress wire break (the reason
  # a waiver once existed) is long merged. A future deliberate wire break
  # gets flagged here and decided in its own PR.
