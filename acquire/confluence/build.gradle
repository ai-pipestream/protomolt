plugins {
    alias(libs.plugins.protobuf)
}

description = 'Confluence Cloud REST API v2: entity protos for every API group, the ConfluenceEntity wrapper and crawl/live-update envelopes, plus the crawler core (REST client, JSON-to-proto mapper, ChangeSink SPI)'

dependencies {
    api project(':protomolt-index-spi')
    api project(':protomolt-protobuf-validation')
    api libs.protobuf.java
    // ConfluenceClient and ConfluenceMapper read the REST v2 JSON payloads.
    api libs.jackson.databind

    // Extract the indexing-hints and validation .proto for protoc imports.
    protobuf project(':protomolt-index-spi')
    protobuf project(':protomolt-protobuf-validation')
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.1"
    }
}
