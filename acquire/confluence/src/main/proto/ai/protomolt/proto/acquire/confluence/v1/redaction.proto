syntax = "proto3";

package ai.protomolt.proto.acquire.confluence.v1;

import "ai/protomolt/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.acquire.confluence.v1";

// ============================================================================
// REDACTIONS (read side: redactions that were applied to content)
// ============================================================================

// One redaction applied to content: a located text range plus its id.
message Redaction {
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: {
      id: "redaction.range"
      message: "a redaction range must not end before it starts"
      expression: "this.to == 0 || this.from <= this.to"
    }
  };

  // JSON pointer indicating where the redaction was applied.
  string pointer = 1 [(ai.protomolt.proto.validate.v1.field) = { required: true }];
  // Starting character index where redaction was applied.
  int32 from = 2 [(ai.protomolt.proto.validate.v1.field) = { int32: { gte: 0 } }];
  // Ending character index where redaction was applied.
  int32 to = 3 [(ai.protomolt.proto.validate.v1.field) = { int32: { gte: 0 } }];
  // Reason for the redaction.
  string reason = 4;
  // Unique identifier for this redaction (a UUID). Can be used to restore
  // the redacted content later.
  string redaction_id = 5 [(ai.protomolt.proto.validate.v1.field) = {
    cel: {
      id: "redaction.id_uuid"
      message: "redaction_id must be empty or a UUID"
      expression: "this == '' || this.matches('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')"
    }
  }];
}

// The redactions applied to one section of the content.
message RedactionSectionResponse {
  // List of redactions that were applied to this section.
  repeated Redaction redactions = 1;
}

// Details of all redactions that were applied to the content. Each redaction
// includes a unique ID for restoration, except that code block redactions
// cannot be restored.
message RedactionResponse {
  // The redactions applied to the content body.
  RedactionSectionResponse body = 1;
  // The redactions applied to the content title.
  RedactionSectionResponse title = 2;
}
