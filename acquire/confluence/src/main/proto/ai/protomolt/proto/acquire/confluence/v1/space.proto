syntax = "proto3";

package ai.protomolt.proto.acquire.confluence.v1;

import "ai/protomolt/proto/acquire/confluence/v1/common.proto";
import "ai/protomolt/proto/acquire/confluence/v1/label.proto";
import "ai/protomolt/proto/acquire/confluence/v1/operation.proto";
import "ai/protomolt/proto/acquire/confluence/v1/permission.proto";
import "ai/protomolt/proto/acquire/confluence/v1/property.proto";
import "ai/protomolt/proto/index/hints/v1/indexing_hints.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.acquire.confluence.v1";

// ============================================================================
// SPACE and DATA POLICIES
// ============================================================================

// The type of space.
enum SpaceType {
  // Not specified.
  SPACE_TYPE_UNSPECIFIED = 0;
  // A global space (a shared team space, as opposed to a personal space).
  SPACE_TYPE_GLOBAL = 1;
  // A collaboration space.
  SPACE_TYPE_COLLABORATION = 2;
  // A knowledge-base space.
  SPACE_TYPE_KNOWLEDGE_BASE = 3;
  // A user's personal space.
  SPACE_TYPE_PERSONAL = 4;
  // A system space.
  SPACE_TYPE_SYSTEM = 5;
  // An onboarding space (created for product onboarding).
  SPACE_TYPE_ONBOARDING = 6;
  // A sample space created by xflow.
  SPACE_TYPE_XFLOW_SAMPLE_SPACE = 7;
}

// The status of the space.
enum SpaceStatus {
  // Not specified.
  SPACE_STATUS_UNSPECIFIED = 0;
  // The space is active.
  SPACE_STATUS_CURRENT = 1;
  // The space is archived.
  SPACE_STATUS_ARCHIVED = 2;
}

// The icon of the space.
message SpaceIcon {
  // The path (relative to base URL) at which the space's icon can be
  // retrieved, like `/wiki/download/...` or `/wiki/aa-avatar/...`.
  string path = 1;
  // URL the space icon binary downloads from (relative to the tenant base
  // URL). A content pointer; use this instead of `path` to fetch the icon.
  string api_download_url = 2;
}

// The description of a space: one field per representation, present when
// requested. Distinct from Body because spaces use the plain/view
// representations.
message SpaceDescription {
  // The plain-text representation of the space description.
  BodyType plain = 1;
  // The rendered view representation of the space description.
  BodyType view = 2;
}

// A space: the top-level container of Confluence content.
message Space {
  // ID of the space.
  string id = 1 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD },
    (ai.protomolt.proto.validate.v1.field) = { required: true }
  ];
  // Key of the space.
  string key = 2 [
    (ai.protomolt.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_KEYWORD
      sortable: true
    },
    (ai.protomolt.proto.validate.v1.field) = { required: true }
  ];
  // Name of the space.
  string name = 3 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_TEXT }
  ];
  // The type of the space.
  SpaceType type = 4 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // The status of the space.
  SpaceStatus status = 5 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // The account ID of the user who created this space originally.
  string author_id = 6 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // The account ID of the user who owns this space.
  string space_owner_id = 7 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // Currently active alias for a Confluence space.
  string current_active_alias = 8;
  // Date and time when the space was created.
  google.protobuf.Timestamp created_at = 9 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // ID of the space's homepage.
  string homepage_id = 10;
  // The description of the space, in the fetched representations.
  SpaceDescription description = 11;
  // The icon of the space.
  SpaceIcon icon = 12;
  // The labels attached to the space.
  repeated Label labels = 13;
  // The properties of the space.
  repeated ContentProperty properties = 14;
  // The operations permitted on the space.
  repeated Operation operations = 15;
  // The space permission assignments in effect for the space.
  repeated SpacePermissionAssignment permissions = 16;
  // Human-facing URL of the content, for search results and UIs.
  string web_url = 17;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}

// Data-policy details at the workspace level.
message DataPolicyMetadata {
  // Whether the workspace contains any content blocked for (inaccessible to)
  // the requesting client application.
  bool any_content_blocked = 1;
}

// The data-policy view of a space: whether content in the space is blocked
// for the requesting client application.
message DataPolicy {
  // ID of the space.
  string id = 1 [(ai.protomolt.proto.validate.v1.field) = { required: true }];
  // Key of the space.
  string key = 2 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // Name of the space.
  string name = 3;
  // The description of the space, in the fetched representations.
  SpaceDescription description = 4;
  // Whether the space contains any content blocked for (inaccessible to) the
  // requesting client application.
  bool any_content_blocked = 5;
  // The icon of the space.
  SpaceIcon icon = 6;
  // Human-facing URL of the content, for search results and UIs.
  string web_url = 7;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
