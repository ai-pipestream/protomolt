syntax = "proto3";

package ai.protomolt.proto.acquire.confluence.v1;

import "ai/protomolt/proto/acquire/confluence/v1/admin_key.proto";
import "ai/protomolt/proto/acquire/confluence/v1/attachment.proto";
import "ai/protomolt/proto/acquire/confluence/v1/blogpost.proto";
import "ai/protomolt/proto/acquire/confluence/v1/classification.proto";
import "ai/protomolt/proto/acquire/confluence/v1/comment.proto";
import "ai/protomolt/proto/acquire/confluence/v1/common.proto";
import "ai/protomolt/proto/acquire/confluence/v1/content.proto";
import "ai/protomolt/proto/acquire/confluence/v1/label.proto";
import "ai/protomolt/proto/acquire/confluence/v1/operation.proto";
import "ai/protomolt/proto/acquire/confluence/v1/page.proto";
import "ai/protomolt/proto/acquire/confluence/v1/permission.proto";
import "ai/protomolt/proto/acquire/confluence/v1/property.proto";
import "ai/protomolt/proto/acquire/confluence/v1/redaction.proto";
import "ai/protomolt/proto/acquire/confluence/v1/space.proto";
import "ai/protomolt/proto/acquire/confluence/v1/task.proto";
import "ai/protomolt/proto/acquire/confluence/v1/user.proto";
import "ai/protomolt/proto/index/hints/v1/indexing_hints.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.acquire.confluence.v1";

// ============================================================================
// CONFLUENCE ENTITY - the keystone wrapper.
//
// One Confluence entity as the crawler read it, wrapped for transport and
// storage. This is the Kafka / parquet / round-trip unit: the crawler
// publishes ConfluenceEntity, the repo sink maps the content arms to
// Documents, the parquet sink writes them as-is, and the document-events
// feed projects them into Lucene via the indexing hints on the inner fields.
//
// entity_id is the Confluence id of the wrapped entity (string; Confluence
// declares ids as strings holding numbers). One arm per entity kind.
// ============================================================================
message ConfluenceEntity {
  // The Confluence id of the wrapped entity.
  string entity_id = 1 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD },
    (ai.protomolt.proto.validate.v1.field) = { required: true }
  ];
  // When the crawler ingested this record.
  google.protobuf.Timestamp ingested_at = 2 [
    (ai.protomolt.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE },
    (ai.protomolt.proto.validate.v1.field) = { required: true }
  ];
  // The wrapped entity. Exactly one arm is set; the set arm identifies the
  // entity kind.
  oneof entity {
    // Set when the wrapped entity is a page.
    Page page = 10;
    // Set when the wrapped entity is a blog post.
    BlogPost blog_post = 11;
    // Set when the wrapped entity is a comment.
    Comment comment = 12;
    // Set when the wrapped entity is an attachment.
    Attachment attachment = 13;
    // Set when the wrapped entity is a space.
    Space space = 14;
    // Set when the wrapped entity is a label.
    Label label = 15;
    // Set when the wrapped entity is a task.
    Task task = 16;
    // Set when the wrapped entity is a user.
    User user = 17;
    // Set when the wrapped entity is a whiteboard.
    Whiteboard whiteboard = 18;
    // Set when the wrapped entity is a database.
    Database database = 19;
    // Set when the wrapped entity is a folder.
    Folder folder = 20;
    // Set when the wrapped entity is a piece of custom content.
    CustomContent custom_content = 21;
    // Set when the wrapped entity is a Smart Link.
    SmartLink smart_link = 22;
    // Set when the wrapped entity is a classification level.
    ClassificationLevel classification_level = 23;
    // Set when the wrapped entity is a content property.
    ContentProperty content_property = 24;
    // Set when the wrapped entity is a space property.
    SpaceProperty space_property = 25;
    // Set when the wrapped entity is an app property.
    AppProperty app_property = 26;
    // Set when the wrapped entity is the data-policy view of a space.
    DataPolicy data_policy = 27;
    // Set when the wrapped entity is a like.
    Like like = 28;
    // Set when the wrapped entity is an ancestor.
    Ancestor ancestor = 29;
    // Set when the wrapped entity is a version.
    Version version = 30;
    // Set when the wrapped entity is an admin key response.
    AdminKeyResponse admin_key = 31;
    // Set when the wrapped entity is an operation.
    Operation operation = 32;
    // Set when the wrapped entity is a redaction response.
    RedactionResponse redaction = 33;
    // Set when the wrapped entity is a space role.
    SpaceRole space_role = 34;
    // Set when the wrapped entity is a space permission assignment.
    SpacePermissionAssignment space_permission_assignment = 35;
    // Set when the wrapped entity is a content tree entry.
    ContentTreeEntry tree_entry = 36;
  }
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
