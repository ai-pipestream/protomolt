syntax = "proto3";

package ai.pipestream.proto.acquire.confluence.v1;

import "ai/pipestream/proto/acquire/confluence/v1/common.proto";
import "ai/pipestream/proto/acquire/confluence/v1/label.proto";
import "ai/pipestream/proto/acquire/confluence/v1/operation.proto";
import "ai/pipestream/proto/acquire/confluence/v1/property.proto";
import "ai/pipestream/proto/index/hints/v1/indexing_hints.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.acquire.confluence.v1";

// ============================================================================
// ATTACHMENT
// ============================================================================

// A file attached to a page, blog post, or custom content.
message Attachment {
  // ID of the attachment.
  string id = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD },
    (ai.pipestream.proto.validate.v1.field) = { required: true }
  ];
  // The status of the attachment.
  ContentStatus status = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // Title of the attachment (carries the filename for uploaded files).
  string title = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = {
      type: INDEX_FIELD_TYPE_TEXT
      analyzer: "english"
      sub_fields: [{ type: INDEX_FIELD_TYPE_KEYWORD, name: "raw" }]
    }
  ];
  // When the attachment was created.
  google.protobuf.Timestamp created_at = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // ID of the containing page, if the container is a page.
  string page_id = 5;
  // ID of the containing blog post, if the container is a blog post.
  string blog_post_id = 6;
  // ID of the containing custom content, if the container is custom content.
  string custom_content_id = 7;
  // Media type of the attachment.
  string media_type = 8 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // Media type description of the attachment.
  string media_type_description = 9;
  // Comment for the attachment.
  string comment = 10;
  // File ID of the attachment. This is the ID referenced in
  // `atlas_doc_format` bodies and is distinct from the attachment ID.
  string file_id = 11;
  // File size of the attachment.
  int64 file_size = 12 [(ai.pipestream.proto.validate.v1.field) = { int64: { gte: 0 } }];
  // Human-facing URL of the attachment, for search results and UIs.
  string web_url = 13;
  // URL the binary downloads from. A content pointer, not navigation.
  string download_url = 14;
  // The current version of the attachment.
  Version version = 15;
  // The attachment binary. Optional: populated when the crawler fetches the
  // download, empty for metadata-only records. The crawler may later route
  // these bytes through the repo blob store instead of inlining them.
  optional bytes content = 21;
  // The labels attached to the attachment.
  repeated Label labels = 16;
  // The content properties attached to the attachment.
  repeated ContentProperty properties = 17;
  // The operations the calling user is permitted to perform on the attachment.
  repeated Operation operations = 18;
  // The version history of the attachment.
  repeated Version versions = 19;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
