syntax = "proto3";

package ai.pipestream.proto.acquire.confluence.v1;

import "ai/pipestream/proto/index/hints/v1/indexing_hints.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.acquire.confluence.v1";

// ============================================================================
// CONFLUENCE DOMAIN MODEL - shared sub-structures.
//
// This package is a domain model of Confluence content, not a serialization
// of REST response shapes. Every message is a content concept; hypermedia
// affordances (_links blocks beyond the human-facing URL, pagination
// transport) are deliberately absent because URLs are derivable from the
// tenant base URL plus the entity id at the crawl edge. Entity shapes are
// grounded in the official Confluence Cloud REST API v2 spec: field-level
// fidelity (ids as strings, ISO-8601 date-times as Timestamps) is preserved,
// while the spec's mechanical duplication (Bulk vs Single read variants,
// per-entity identical link and body containers) is collapsed into one
// canonical message per entity kind.
// ============================================================================

// ============================================================================
// BODY
// ============================================================================

// The declared format of a body value. Storage is XHTML, atlas_doc_format is
// serialized ProseMirror JSON, the view formats are rendered XHTML variants.
enum BodyFormat {
  // Zero value; a populated body value must not declare this.
  BODY_FORMAT_UNSPECIFIED = 0;
  // Confluence storage format (XHTML).
  BODY_FORMAT_STORAGE_XHTML = 1;
  // Serialized ProseMirror document (JSON).
  BODY_FORMAT_ATLAS_DOC_FORMAT = 2;
  // Rendered view (XHTML).
  BODY_FORMAT_RENDERED_XHTML = 3;
  // Rendered export view (XHTML).
  BODY_FORMAT_EXPORT_XHTML = 4;
  // Rendered export view without site chrome (XHTML).
  BODY_FORMAT_ANONYMOUS_EXPORT_XHTML = 5;
  // Rendered view with styling (XHTML).
  BODY_FORMAT_STYLED_XHTML = 6;
  // Editor representation.
  BODY_FORMAT_EDITOR = 7;
  // Wiki markup.
  BODY_FORMAT_WIKI = 8;
  // Unprocessed editor content (custom content only).
  BODY_FORMAT_RAW = 9;
  // Plain text.
  BODY_FORMAT_PLAIN_TEXT = 10;
}

// One body in one declared format. The value stays a string by design: it is
// serialized content in a declared format (XHTML or serialized ProseMirror
// JSON), not schema-less data, so Struct would be the wrong model.
message BodyType {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "body_type.format_declared"
      message: "a populated body value must declare its format"
      expression: "this.value == '' || this.format != 0"
    }
  };

  // The format the value is serialized in.
  BodyFormat format = 1;
  // The content, serialized in `format`.
  string value = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_TEXT }
  ];
}

// The body of a piece of content: one slot per format, populated when that
// format was fetched.
message Body {
  // The body in storage format (XHTML), populated when storage was fetched.
  BodyType storage = 1;
  // The body as a serialized ProseMirror document, populated when
  // atlas_doc_format was fetched.
  BodyType atlas_doc_format = 2;
  // The rendered body (XHTML), populated when the view format was fetched.
  BodyType view = 3;
  // Unprocessed editor content; only custom content has this format.
  BodyType raw = 4;
}

// ============================================================================
// VERSION
// ============================================================================

// A version of a piece of content. Version-history entries additionally carry
// a snapshot of the entity at that version (`entity`).
message Version {
  // When the version was created.
  google.protobuf.Timestamp created_at = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // Message associated with the version.
  string message = 2;
  // The version number.
  int32 number = 3 [(ai.pipestream.proto.validate.v1.field) = { int32: { gte: 0 } }];
  // Whether this version is a minor version. Email notifications and activity
  // stream updates are not created for minor versions.
  bool minor_edit = 4;
  // The account ID of the user who created this version.
  string author_id = 5 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // The entity snapshot at this version. Only present on version-history
  // entries.
  VersionedEntity entity = 6;
}

// A version with change-set detail.
message DetailedVersion {
  // The version number.
  int32 number = 1 [(ai.pipestream.proto.validate.v1.field) = { int32: { gte: 0 } }];
  // The account ID of the user who created this version.
  string author_id = 2 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // Message associated with the version.
  string message = 3;
  // When the version was created.
  google.protobuf.Timestamp created_at = 4 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // Whether this version is a minor version.
  bool minor_edit = 5;
  // Whether the content type changed in this version (e.g. page to blog).
  bool content_type_modified = 6;
  // The account IDs of users that collaborated on this version.
  repeated string collaborators = 7;
  // The version number prior to this one.
  optional int32 prev_version = 8 [(ai.pipestream.proto.validate.v1.field) = { int32: { gte: 1 } }];
  // The version number after this one.
  optional int32 next_version = 9 [(ai.pipestream.proto.validate.v1.field) = { int32: { gte: 1 } }];
}

// The snapshot of an entity at one version.
message VersionedEntity {
  // Title of the entity.
  string title = 1;
  // ID of the entity.
  string id = 2 [(ai.pipestream.proto.validate.v1.field) = { required: true }];
  // Body of the entity at this version.
  Body body = 3;
}

// ============================================================================
// SHARED ENUMS
// ============================================================================

// The lifecycle status of a piece of content.
enum ContentStatus {
  // Zero value; the status is unknown or was not returned.
  CONTENT_STATUS_UNSPECIFIED = 0;
  // The current, published version of the content.
  CONTENT_STATUS_CURRENT = 1;
  // An unpublished draft.
  CONTENT_STATUS_DRAFT = 2;
  // Archived content; hidden from normal navigation but retained.
  CONTENT_STATUS_ARCHIVED = 3;
  // A superseded version kept in the version history.
  CONTENT_STATUS_HISTORICAL = 4;
  // Content moved to the trash.
  CONTENT_STATUS_TRASHED = 5;
  // Content permanently deleted (purged from the trash).
  CONTENT_STATUS_DELETED = 6;
  // Filter-only value matching content in any status; never a stored status.
  CONTENT_STATUS_ANY = 7;
}

// The content kind of a parent, or unset if there is no parent.
enum ParentContentType {
  // Zero value; there is no parent.
  PARENT_CONTENT_TYPE_UNSPECIFIED = 0;
  // The parent is a page.
  PARENT_CONTENT_TYPE_PAGE = 1;
  // The parent is a whiteboard.
  PARENT_CONTENT_TYPE_WHITEBOARD = 2;
  // The parent is a database.
  PARENT_CONTENT_TYPE_DATABASE = 3;
  // The parent is an embed.
  PARENT_CONTENT_TYPE_EMBED = 4;
  // The parent is a folder.
  PARENT_CONTENT_TYPE_FOLDER = 5;
}
