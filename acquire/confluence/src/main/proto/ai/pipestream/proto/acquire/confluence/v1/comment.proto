syntax = "proto3";

package ai.pipestream.proto.acquire.confluence.v1;

import "ai/pipestream/proto/acquire/confluence/v1/common.proto";
import "ai/pipestream/proto/acquire/confluence/v1/label.proto";
import "ai/pipestream/proto/acquire/confluence/v1/operation.proto";
import "ai/pipestream/proto/acquire/confluence/v1/property.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.acquire.confluence.v1";

// ============================================================================
// COMMENT - footer and inline comments on pages, blog posts, attachments and
// custom content.
// ============================================================================

// Inline comment resolution status.
enum InlineCommentResolutionStatus {
  // Zero value; the resolution status is unknown or not applicable (e.g. on
  // footer comments).
  INLINE_COMMENT_RESOLUTION_STATUS_UNSPECIFIED = 0;
  // The comment is open and awaiting resolution.
  INLINE_COMMENT_RESOLUTION_STATUS_OPEN = 1;
  // The comment was resolved and then reopened.
  INLINE_COMMENT_RESOLUTION_STATUS_REOPENED = 2;
  // The comment is resolved.
  INLINE_COMMENT_RESOLUTION_STATUS_RESOLVED = 3;
  // The highlighted text the comment referred to no longer exists.
  INLINE_COMMENT_RESOLUTION_STATUS_DANGLING = 4;
}

// Properties describing the highlighted text an inline comment refers to.
message InlineCommentProperties {
  // Property value used to reference the highlighted element in DOM.
  string inline_marker_ref = 1;
  // Text that is highlighted.
  string inline_original_selection = 2;
}

// A comment on a page, blog post, attachment or custom content, top-level
// or a reply. Footer and inline comments share this shape; the inline-only
// fields (resolution state, highlighted text) are unset on footer comments.
message Comment {
  // ID of the comment.
  string id = 1 [(ai.pipestream.proto.validate.v1.field) = { required: true }];
  // The lifecycle status of the comment.
  ContentStatus status = 2;
  // Title of the comment.
  string title = 3;
  // ID of the blog post containing the comment, if on a blog post.
  string blog_post_id = 4;
  // ID of the page containing the comment, if on a page.
  string page_id = 5;
  // ID of the attachment containing the comment, if on an attachment.
  string attachment_id = 6;
  // ID of the custom content containing the comment, if on custom content.
  string custom_content_id = 7;
  // ID of the parent comment, if the comment is a reply.
  string parent_comment_id = 8;
  // The current version of the comment.
  Version version = 9;
  // The body of the comment, in the formats that were fetched.
  Body body = 10;
  // Atlassian account ID of the last person who modified the resolve state of
  // the comment. Null until the comment is resolved or reopened. Inline
  // comments only.
  optional string resolution_last_modifier_id = 11;
  // Timestamp of the last modification to the comment's resolution status.
  // Null until the comment is resolved or reopened. Inline comments only.
  optional google.protobuf.Timestamp resolution_last_modified_at = 12;
  // Resolution state. Inline comments only.
  InlineCommentResolutionStatus resolution_status = 13;
  // The highlighted text the comment refers to. Inline comments only.
  InlineCommentProperties inline_properties = 14;
  // Content properties of the comment.
  repeated ContentProperty properties = 15;
  // Operations permitted on the comment.
  repeated Operation operations = 16;
  // Likes on the comment.
  repeated Like likes = 17;
  // Version-history entries for the comment.
  repeated Version versions = 18;
  // Human-facing URL of the content, for search results and UIs.
  string web_url = 19;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
