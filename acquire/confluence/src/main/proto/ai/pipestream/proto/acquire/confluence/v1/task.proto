syntax = "proto3";

package ai.pipestream.proto.acquire.confluence.v1;

import "ai/pipestream/proto/acquire/confluence/v1/common.proto";
import "ai/pipestream/proto/index/hints/v1/indexing_hints.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.proto.acquire.confluence.v1";

// ============================================================================
// TASK (inline tasks on pages and blog posts)
// ============================================================================

// The status of a task.
enum TaskStatus {
  // Zero value; the status is unknown or was not returned.
  TASK_STATUS_UNSPECIFIED = 0;
  // The task has been completed.
  TASK_STATUS_COMPLETE = 1;
  // The task has not been completed.
  TASK_STATUS_INCOMPLETE = 2;
}

// An inline task.
message Task {
  // ID of the task.
  string id = 1 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD },
    (ai.pipestream.proto.validate.v1.field) = { required: true }
  ];
  // Local ID of the task. This ID is local to the corresponding page or blog
  // post.
  string local_id = 2;
  // ID of the space the task is in.
  string space_id = 3 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // ID of the page the task is in.
  string page_id = 4;
  // ID of the blog post the task is in.
  string blog_post_id = 5;
  // The status of the task.
  TaskStatus status = 6 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // The body of the task (its text content).
  Body body = 7;
  // Account ID of the user who created this task.
  string created_by = 8 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // Account ID of the user to whom this task is assigned.
  string assigned_to = 9 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_KEYWORD }
  ];
  // Account ID of the user who completed this task.
  string completed_by = 10;
  // Date and time when the task was created.
  google.protobuf.Timestamp created_at = 11 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // Date and time when the task was updated.
  google.protobuf.Timestamp updated_at = 12 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // Date and time when the task is due.
  google.protobuf.Timestamp due_at = 13 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // Date and time when the task was completed.
  google.protobuf.Timestamp completed_at = 14 [
    (ai.pipestream.proto.index.hints.v1.index) = { type: INDEX_FIELD_TYPE_DATE }
  ];
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
