syntax = "proto3";

package ai.pipestream.proto.acquire.confluence.v1;

import "ai/pipestream/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.acquire.confluence.v1";

// ============================================================================
// CLASSIFICATION LEVEL
// ============================================================================

// The status of a classification level.
enum ClassificationLevelStatus {
  // Zero value; the status is unknown or was not returned.
  CLASSIFICATION_LEVEL_STATUS_UNSPECIFIED = 0;
  // The level is a draft and not yet in effect.
  CLASSIFICATION_LEVEL_STATUS_DRAFT = 1;
  // The level is published and available for use.
  CLASSIFICATION_LEVEL_STATUS_PUBLISHED = 2;
  // The level is archived and no longer available for use.
  CLASSIFICATION_LEVEL_STATUS_ARCHIVED = 3;
}

// The color of a classification level.
enum ClassificationLevelColor {
  // Zero value; the color is unknown or was not returned.
  CLASSIFICATION_LEVEL_COLOR_UNSPECIFIED = 0;
  // Red.
  CLASSIFICATION_LEVEL_COLOR_RED = 1;
  // Red, displayed in bold.
  CLASSIFICATION_LEVEL_COLOR_RED_BOLD = 2;
  // Orange.
  CLASSIFICATION_LEVEL_COLOR_ORANGE = 3;
  // Yellow.
  CLASSIFICATION_LEVEL_COLOR_YELLOW = 4;
  // Green.
  CLASSIFICATION_LEVEL_COLOR_GREEN = 5;
  // Blue.
  CLASSIFICATION_LEVEL_COLOR_BLUE = 6;
  // Navy.
  CLASSIFICATION_LEVEL_COLOR_NAVY = 7;
  // Teal.
  CLASSIFICATION_LEVEL_COLOR_TEAL = 8;
  // Purple.
  CLASSIFICATION_LEVEL_COLOR_PURPLE = 9;
  // Grey.
  CLASSIFICATION_LEVEL_COLOR_GREY = 10;
  // Lime.
  CLASSIFICATION_LEVEL_COLOR_LIME = 11;
}

// A unit of data classification defined by an organization. A classification
// level may be associated with specific storage and handling requirements or
// expectations.
message ClassificationLevel {
  // The ID of the classification level.
  string id = 1 [(ai.pipestream.proto.validate.v1.field) = { required: true }];
  // The status of the classification level.
  ClassificationLevelStatus status = 2;
  // The order of the classification level object (a JSON number in the spec).
  double order = 3;
  // The name of the classification level object.
  string name = 4;
  // The description of the classification level object.
  string description = 5;
  // The guideline of the classification level object.
  string guideline = 6;
  // The color of the classification level object.
  ClassificationLevelColor color = 7;
  // Extensible key-value metadata (extension-metadata map - see convention).
  map<string, string> metadata = 99;
}
