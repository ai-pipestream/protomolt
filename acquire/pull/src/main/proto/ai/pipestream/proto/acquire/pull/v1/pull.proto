// Contracts for the pull connectors: bounded, resumable passes that read from
// an external source and hand documents to intake.
//
// A pull is a single pass, not a running crawl. The caller supplies the
// watermark the previous pass returned and receives the next one, so
// resumption is the caller's to hold rather than state the connector keeps.
// A pass that fails part way returns the watermark of the last item before the
// first failure, so a retry resumes at the item that failed and no item is
// stepped over because the pass ended early.
syntax = "proto3";

package ai.pipestream.proto.acquire.pull.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.acquire.pull.v1";
option java_outer_classname = "PullProto";

import "ai/pipestream/proto/validate/v1/validate.proto";

// What one pull pass moved, and where to resume.
message PullReport {
  // Items newly saved through the intake service.
  int32 submitted = 1;
  // Items the repository already held. Counted separately from submissions so
  // a caller can tell a pass that found nothing new from one that found
  // nothing at all.
  int32 deduplicated = 2;
  // Items that errored. They remain ahead of the watermark and are retried by
  // the next pass rather than being lost.
  int32 failed = 3;
  // One line per failed item, in the order the failures occurred.
  repeated string errors = 4;
  // Watermark for the next pass. It advances only through an unbroken run of
  // successes: the first failure freezes it, so a retry resumes at the failed
  // item instead of stepping over it.
  string watermark = 5;
}

// One pass over an object store prefix.
message PullFromS3Request {
  // Bucket to read from. It must already exist and be readable by the
  // credentials the connector was configured with; the pass does not create
  // it and does not fall back to another.
  string bucket = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 255}
    }
  ];
  // Key prefix restricting the pass. Empty covers the whole bucket, which is
  // the correct choice only for a bucket dedicated to one datasource.
  string prefix = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 1024}
    }
  ];
  // Datasource the pulled documents belong to. Required: a document whose
  // origin is unknown cannot be reconciled or re-pulled later.
  string datasource_id = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Drive the documents land on. Empty uses the intake mount's default.
  string drive = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 200}
    }
  ];
  // Watermark returned by the previous pass. Empty starts from the beginning.
  string watermark = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 1024}
    }
  ];
  // Cap on objects processed in this pass. Zero means no cap, which is only
  // safe when the caller can afford a pass proportional to the whole prefix.
  int32 max_objects = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0}
    }
  ];
}

// What the object-store pass moved.
message PullFromS3Response {
  // The pass result and its resumption point.
  PullReport report = 1;
}

// One pass over a relational query.
message PullFromJdbcRequest {
  // Query to run. For an incremental pass it carries exactly one placeholder,
  // bound to the watermark, and orders ascending by the watermark column, so
  // that resuming cannot skip or repeat a row.
  string query = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 8000}
    }
  ];
  // Result-set column carrying each row's stable identity. Re-pulling a row
  // with the same identity replaces it rather than duplicating it.
  string id_column = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Result-set column the watermark advances along. It must be the column the
  // query orders by, or a later pass will start from a position rows still
  // precede.
  string watermark_column = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Datasource the pulled documents belong to. Required for the same reason
  // as in the object-store pass.
  string datasource_id = 4 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Drive the documents land on. Empty uses the intake mount's default.
  string drive = 5 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 200}
    }
  ];
  // Watermark returned by the previous pass, bound to the query's
  // placeholder. Empty starts from the beginning.
  string watermark = 6 [
    (ai.pipestream.proto.validate.v1.field) = {
      string: {max_len: 1024}
    }
  ];
  // Cap on rows processed in this pass. Zero means no cap, which is only
  // safe when the caller can afford a pass proportional to the whole result
  // set the query returns.
  int32 max_rows = 7 [
    (ai.pipestream.proto.validate.v1.field) = {
      int32: {gte: 0}
    }
  ];
}

// What the relational pass moved.
message PullFromJdbcResponse {
  // The pass result and its resumption point.
  PullReport report = 1;
}

// The pull connectors as a typed service.
//
// Each verb the connector roles contribute to the action catalog is one method
// here, taking the same request message the verb accepts. A connector is
// stateless and holds no schedule, so a method is one pass, not a subscription.
service PullService {
  // Pulls objects new or changed past a watermark from an S3 bucket and feeds
  // them through intake with stable identity.
  rpc PullFromS3(PullFromS3Request) returns (PullFromS3Response);

  // Runs a watermark query against a source database and feeds each row
  // through intake with stable identity.
  rpc PullFromJdbc(PullFromJdbcRequest) returns (PullFromJdbcResponse);
}
