plugins {
    alias(libs.plugins.protobuf)
}

description = 'The mesh cluster directory: cluster advertisement and presence contracts, the in-memory TTL directory, and the delegation hello bridge'

dependencies {
    api libs.protobuf.java
    api libs.protobuf.java.util
    api libs.grpc.api
    api libs.grpc.stub
    api libs.grpc.protobuf
    // The cluster contracts reuse the mesh core SchemaReference and
    // ProcessorKind, and the directory builds on the contract gate's canonical
    // digest and validation conventions.
    api project(':protomolt-mesh-contracts')
    api project(':protomolt-mesh-runtime-proto')
    // The bridge derives leased processor advertisements from delegation
    // WorkerHello frames.
    api project(':protomolt-delegation')
    // Durable directory event logs use repository-service raw blob RPCs.
    api project(':protomolt-repo-proto')
    // Persisted cluster fields carry the house validation, sensitivity, and
    // index-hint options.
    api project(':protomolt-protobuf-validation')
    api project(':protomolt-protobuf-metadata')
    api project(':protomolt-search-index-spi')
    // Cluster directory mutations are mounted as bounded JSON actions on the
    // same REST, gRPC catalog, and MCP surfaces as the other ProtoMolt verbs.
    api project(':protomolt-actions')
    // Verb input schemas are derived from the request descriptors rather than
    // hand-written, so the declared rules reach every caller that reads the manifest.
    implementation project(':protomolt-http-jsonschema')

    testImplementation libs.grpc.inprocess
    compileOnly libs.javax.annotation.api
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all().configureEach {
            plugins {
                grpc {}
            }
        }
    }
}
