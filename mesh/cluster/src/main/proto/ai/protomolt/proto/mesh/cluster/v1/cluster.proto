syntax = "proto3";

package ai.protomolt.proto.mesh.cluster.v1;

import "ai/protomolt/proto/index/hints/v1/indexing_hints.proto";
import "ai/protomolt/proto/mesh/v1/entity.proto";
import "ai/protomolt/proto/mesh/runtime/v1/processor_contract.proto";
import "ai/protomolt/proto/meta/v1/metadata.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.mesh.cluster.v1";

// ============================================================================
// MESH CLUSTER CONTRACTS: cluster advertisement, presence, and the
// deterministic directory snapshot. Transport-independent wire types only; the
// in-memory directory and the delegation bridge live in this module's Java
// sources, and no networking, storage, or processor logic appears here.
//
// A ClusterDescriptor names one cluster with a canonical fingerprint computed
// over the descriptor's own serialization with the fingerprint field cleared.
// A NodeAdvertisement declares what one node can serve (capabilities, schemas,
// endpoints) under a fencing epoch and a per-epoch sequence; it carries
// addressing metadata and TLS posture but never credentials or trust material.
// A ProcessorAdvertisement declares one processor under a lease epoch and
// expiry. A CapacityAdvertisement is a point-in-time limits snapshot. A
// NodePresence is the heartbeat/TTL liveness record. A ClusterSnapshot is the
// directory's deterministic point-in-time view, ordered by node and processor
// id. A ClusterEvent is one typed membership, presence, or capacity change in
// the directory's replayable event log.
//
// Every persisted field carries validate.v1 bounds and meta.v1 sensitivity.
// Index hints appear only on the named discovery-query fields, the exact
// allowlist:
//
//   ClusterDescriptor.cluster_id         (find the cluster by id)
//   ClusterDescriptor.trust_domain       (partition eligible clusters)
//   NodeAdvertisement.node_id            (find a node by id)
//   NodeAdvertisement.cluster_id         (list the nodes of a cluster)
//   NodePresence.node_id                 (presence of one node)
//   NodePresence.cluster_id              (presence across a cluster)
//   NodePresence.state                   (list nodes by liveness state)
//   NodePresence.expires_at              (sweep expired registrations)
//   ProcessorAdvertisement.processor_id  (find a processor by id)
//   ProcessorAdvertisement.node_id       (list a node's processors)
//   ProcessorAdvertisement.kind          (list processors by kind)
//   ProcessorAdvertisement.capabilities  (eligibility: capability Y)
//   ProcessorAdvertisement.lease_expires_at (sweep expired leases)
//   CapacityAdvertisement.node_id        (capacity of one node)
//
// Schema names resolve through the reused mesh.v1 SchemaReference, whose
// type_name is already indexed in the core contract. Endpoint addresses,
// TLS posture, fingerprints, epochs, sequences, non-expiry timestamps, and
// every ClusterEvent field are not search fields: events are replayed, not
// searched.
// ============================================================================

// One cluster's identity. The fingerprint commits to the identity material:
// it is the lowercase SHA-256 hex of this descriptor serialized with the
// fingerprint field cleared, so a renamed or re-purposed cluster id or trust
// domain fingerprints differently and a receiver can detect substitution.
message ClusterDescriptor {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Cluster identity: path-safe id, trust domain, supported protocol revisions, creation time, canonical fingerprint."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Stable path-safe cluster identity.
  string cluster_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // Human-readable cluster name, for display only.
  string display_name = 2 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 256,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The trust domain the cluster authenticates nodes within; empty when the
  // deployment does not partition trust.
  string trust_domain = 3 [
    (ai.protomolt.proto.validate.v1.field) = {ignore_if_zero: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // Mesh protocol revisions the cluster accepts, preferred first.
  repeated int32 protocol_revisions = 4 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      min_items: 1
      max_items: 16
      unique: true
      items: {
        int32: {gte: 1}
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // When the cluster descriptor was minted.
  google.protobuf.Timestamp created_at = 5 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Lowercase SHA-256 hex of this descriptor serialized with the fingerprint
  // field cleared.
  string fingerprint = 6 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// How one endpoint protects its connections. Advertisements declare posture
// only; trust material and credentials resolve at connection time and never
// appear in an advertisement.
enum TlsMode {
  // Invalid; every endpoint declares its TLS posture explicitly.
  TLS_MODE_UNSPECIFIED = 0;
  // Plaintext; only acceptable inside a trust domain that permits it.
  TLS_MODE_DISABLED = 1;
  // TLS with the system's trust roots.
  TLS_MODE_SYSTEM = 2;
  // Mutual TLS within the cluster's trust domain.
  TLS_MODE_MUTUAL = 3;
}

// One advertised endpoint's addressing metadata. Coordinates and posture only:
// an endpoint never carries credentials, tokens, or trust material.
message Endpoint {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "One endpoint: path-safe id, host:port or URI address, TLS posture, direct or relayed reachability."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Path-safe endpoint identity inside the advertising node.
  string endpoint_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Where the endpoint listens: a host:port pair with a dialable port,
  // or an absolute URI.
  string address = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {endpoint_address: true, max_len: 2048}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The TLS authority a client should expect, when it differs from the
  // address host; empty means the address host is the authority.
  string authority = 3 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 255,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The endpoint's TLS posture; UNSPECIFIED is invalid.
  TlsMode tls_mode = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {
        defined_only: true
        not_in: [0]
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // True when a peer may connect to the address directly; false when the
  // endpoint is reachable only relayed through the advertising node.
  bool direct = 5 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
}

// What one node can serve, under a fencing epoch and a per-epoch sequence.
// The directory accepts a changed advertisement only from a newer (epoch,
// seq) pair; re-applying the identical advertisement is an idempotent no-op.
// Liveness comes from the paired NodePresence: advertised_at plus ttl is the
// initial liveness window, and heartbeats extend it.
message NodeAdvertisement {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Node advertisement: identity, capabilities, schemas served, endpoints, TTL, fencing epoch and sequence."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Stable path-safe node identity.
  string node_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // The cluster the node belongs to; a directory rejects advertisements for
  // any other cluster.
  string cluster_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // Node-level mesh capabilities (for example "relay" or "reflection"), most
  // relevant first.
  repeated string capabilities = 3 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      max_items: 64
      unique: true
      items: {
        string: {slug: true, max_len: 128}
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Schemas the node resolves and serves to peers, with exact descriptor
  // fingerprints.
  repeated ai.protomolt.proto.mesh.v1.SchemaReference schemas_served = 4 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      max_items: 256
      unique: true
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Endpoints the node exposes, addressing metadata only.
  repeated Endpoint endpoints = 5 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 64,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // When the node emitted this advertisement.
  google.protobuf.Timestamp advertised_at = 6 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // How long the advertisement's liveness window runs without a heartbeat.
  google.protobuf.Duration ttl = 7 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      duration: {
        gte: {nanos: 1}
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The fencing epoch of this node identity: a restarted node rejoins under a
  // higher epoch, and every advertisement from an older epoch conflicts.
  int64 epoch = 8 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // 1-based, strictly increasing inside the epoch; a changed payload with a
  // stale (epoch, seq) pair is a conflicting update.
  int64 seq = 9 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// Human-readable detail for one processor capability. Routing uses the indexed
// capability name on ProcessorAdvertisement; this record explains it to agents
// without changing admission semantics.
message CapabilityDescription {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Bounded descriptive metadata for one processor capability."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Capability name, matching one entry in ProcessorAdvertisement.capabilities.
  string name = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Display-only explanation of the capability.
  string description = 2 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 2048,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// One processor a node hosts, leased under an epoch and an absolute expiry.
// Accepted schemas carry exact descriptor fingerprints, so eligibility is
// judged against schema identity, not type names alone.
message ProcessorAdvertisement {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Processor advertisement: identity, kind, capabilities, accepted schemas, lease epoch and expiry."
    owner: "protomolt"
    sensitivity: "internal"
  };
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: [
      {
        id: "lease-outlives-advertisement"
        message: "the lease expiry must fall after the advertisement time"
        expression: "this.lease_expires_at > this.advertised_at"
      },
      {
        id: "model-requires-provider"
        message: "model metadata requires a provider"
        expression: "size(this.model) == 0 || size(this.provider) > 0"
      },
      {
        id: "resume-support-has-grace"
        message: "session resume support and disconnect grace must be declared together"
        expression: "this.supports_session_resume == has(this.max_disconnect_grace)"
      }
    ]
  };

  // Stable path-safe processor identity, unique inside the cluster.
  string processor_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // The node hosting the processor; the node must be registered first.
  string node_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // What kind of processor this is; UNSPECIFIED is invalid.
  ai.protomolt.proto.mesh.v1.ProcessorKind kind = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {
        defined_only: true
        not_in: [0]
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // What the processor can do, most relevant first; eligibility queries match
  // required capability names against this set.
  repeated string capabilities = 4 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      max_items: 64
      unique: true
      items: {
        string: {slug: true, max_len: 128}
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // The exact schemas the processor accepts as input.
  repeated ai.protomolt.proto.mesh.v1.SchemaReference accepted_schemas = 5 [
    (ai.protomolt.proto.validate.v1.field).repeated = {
      max_items: 256
      unique: true
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The lease fencing epoch: a processor re-leased after expiry rejoins under
  // a higher epoch, and an advertisement from an older epoch conflicts.
  int64 lease_epoch = 6 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The coordinator or node-declared lease expiry. A processor past its lease
  // expiry is not eligible and is swept from the directory.
  google.protobuf.Timestamp lease_expires_at = 7 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_DATE}
  ];
  // When the node emitted this advertisement.
  google.protobuf.Timestamp advertised_at = 8 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // 1-based, strictly increasing inside the lease epoch.
  int64 seq = 9 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Fencing epoch of the hosting node. A processor advertisement from an older
  // node incarnation is rejected even when its own lease has not yet expired.
  int64 node_epoch = 10 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Provider driven by this processor, such as "codex" or "kimi". Empty for a
  // deterministic processor.
  string provider = 11 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 128,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Provider model identity, when configured.
  string model = 12 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 256,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Provider-reported model version or digest, when available.
  string model_version = 13 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 512,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Display-only descriptions for capability names. Names must be unique and
  // must also appear in the indexed capabilities field.
  repeated CapabilityDescription capability_details = 14 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 64,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Whether this processor can restore a disconnected provider conversation.
  bool supports_session_resume = 15 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  // Maximum time a disconnected session may remain recoverable. Present
  // exactly when session resume is supported.
  google.protobuf.Duration max_disconnect_grace = 16 [
    (ai.protomolt.proto.validate.v1.field).duration.gte = {nanos: 1},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Maximum concurrently active agent sessions; 0 means no declared limit.
  uint32 max_active_sessions = 17 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  // Exact executable contract advertised under this processor lease. The
  // nested fingerprint commits to processor id, exact schemas, output bound,
  // and execution guarantees.
  ai.protomolt.proto.mesh.runtime.v1.ProcessorContract contract = 18 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// A point-in-time capacity and limits snapshot for one node, or for one
// processor on that node when processor_id is set. Zero limits mean no
// declared limit. Updates order by seq per (node_id, processor_id) key.
message CapacityAdvertisement {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Capacity snapshot: in-flight load and declared limits for a node or one of its processors."
    owner: "protomolt"
    sensitivity: "internal"
  };
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: [
      {
        id: "in-flight-within-limit"
        message: "in-flight work must fit inside a declared in-flight limit"
        expression: "this.max_in_flight == 0u || this.in_flight <= this.max_in_flight"
      },
      {
        id: "sessions-within-limit"
        message: "active sessions must fit inside a declared session limit"
        expression: "this.max_active_sessions == 0u || this.active_sessions <= this.max_active_sessions"
      }
    ]
  };

  // The node the snapshot describes.
  string node_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // The processor the snapshot describes; empty for a node-wide snapshot.
  string processor_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {ignore_if_zero: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Maximum entities the target executes concurrently; 0 declares no limit.
  uint32 max_in_flight = 3 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  // Entities currently executing.
  uint32 in_flight = 4 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  // Largest payload the target accepts, in bytes; 0 declares no limit.
  uint64 max_payload_bytes = 5 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  // When the target measured this snapshot.
  google.protobuf.Timestamp observed_at = 6 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // 1-based, strictly increasing per (node_id, processor_id) key.
  int64 seq = 7 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Fencing epoch of the source: node epoch for node-wide capacity, processor
  // lease epoch for processor capacity.
  int64 source_epoch = 8 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Provider conversations currently active on the target.
  uint32 active_sessions = 9 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  // Maximum active provider conversations; 0 means no declared limit.
  uint32 max_active_sessions = 10 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
}

// Administrator-authored readiness gate. This never replaces the worker's
// signed advertisement or observed node liveness; it can only remove a leased
// processor from placement until an administrator marks it ready again.
message ProcessorReadinessOverlay {
  string processor_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string node_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  int64 node_epoch = 3 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  int64 processor_lease_epoch = 4 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  bool ready = 5 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  string reason = 6 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 2048,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  uint64 revision = 7 [
    (ai.protomolt.proto.validate.v1.field).uint64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  google.protobuf.Timestamp updated_at = 8 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// One node's liveness record: the heartbeat that keeps a registration alive.
// expires_at is the directory's only expiry input for the node; a node whose
// presence expires, or whose state is GONE, is swept with its processors.
message NodePresence {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Node liveness: state, last heartbeat, TTL, and the computed expiry the directory sweeps on."
    owner: "protomolt"
    sensitivity: "internal"
  };
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: [
      {
        id: "presence-expiry-after-heartbeat"
        message: "the presence expiry must fall after the last heartbeat"
        expression: "this.expires_at > this.last_heartbeat_at"
      },
      {
        id: "presence-expiry-matches-ttl"
        message: "the presence expiry must equal the last heartbeat plus the TTL"
        expression: "this.expires_at == this.last_heartbeat_at + this.ttl"
      }
    ]
  };

  // The node this presence belongs to.
  string node_id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // The cluster the node belongs to; must match the directory's cluster.
  string cluster_id = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // Current liveness state; UNSPECIFIED is invalid.
  PresenceState state = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {
        defined_only: true
        not_in: [0]
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_KEYWORD}
  ];
  // When the node last proved liveness.
  google.protobuf.Timestamp last_heartbeat_at = 4 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // 1-based, strictly increasing per node; a stale heartbeat conflicts.
  int64 heartbeat_seq = 5 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // How long liveness runs from the last heartbeat without a new one.
  google.protobuf.Duration ttl = 6 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      duration: {
        gte: {nanos: 1}
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The absolute liveness expiry the directory sweeps on.
  google.protobuf.Timestamp expires_at = 7 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal",
    (ai.protomolt.proto.index.hints.v1.index) = {type: INDEX_FIELD_TYPE_DATE}
  ];
  // Fencing epoch of the node incarnation that emitted this presence.
  int64 node_epoch = 8 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// Where one node is in its liveness lifecycle.
enum PresenceState {
  // Invalid; every presence record names a real state.
  PRESENCE_STATE_UNSPECIFIED = 0;
  // Heartbeats are arriving inside the TTL window.
  PRESENCE_STATE_ACTIVE = 1;
  // A heartbeat is late but the expiry has not passed; the node stays
  // registered but eligibility queries may skip it.
  PRESENCE_STATE_SUSPECT = 2;
  // The node left or its presence expired; the next sweep removes it.
  PRESENCE_STATE_GONE = 3;
  // The node is healthy but accepts no new work while existing work drains.
  PRESENCE_STATE_DRAINING = 4;
}

// The highest position accepted for one identity, retained after the identity
// itself is gone so a delayed frame from a superseded incarnation cannot be
// admitted. Replaying an event log rebuilds these; a compacted log carries them
// explicitly, because compaction is what drops the events they were derived
// from.
message FencingPosition {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Highest accepted (epoch, seq) for one node or processor identity, retained as a fencing tombstone."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The node id or processor id this position fences.
  string id = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {path_safe_name: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The highest accepted fencing epoch for the identity.
  int64 epoch = 2 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 0,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The highest accepted sequence within that epoch.
  int64 seq = 3 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 0,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// A directory folded into state, so the events that produced it need not be
// retained. A checkpoint plus the events after it replays to exactly the
// directory the full log would have produced, which is what lets a log that
// grows one event per heartbeat stay bounded.
message DirectoryCheckpoint {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Folded directory state plus fencing tombstones, replacing every event up to its snapshot_seq."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The folded directory. Its snapshot_seq is the sequence of the last event
  // folded in, and the events retained beside it continue from the next one.
  ClusterSnapshot state = 1 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Node fencing tombstones, ordered by id, including nodes no longer present.
  repeated FencingPosition node_positions = 2 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 65536,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Processor fencing tombstones, ordered by id, including expired processors.
  repeated FencingPosition processor_positions = 3 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 65536,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Monotonic generation of the retained watch history. Each compaction
  // advances it so a cursor into discarded events is never mistaken as live.
  uint64 directory_generation = 4 [
    (ai.protomolt.proto.validate.v1.field).uint64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// One node's entry in a cluster snapshot: advertisement, presence, and the
// node-wide capacity snapshot when one was published.
message NodeRecord {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "One snapshot node entry: the advertisement, the presence record, and optional node-wide capacity."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The node's current advertisement.
  NodeAdvertisement advertisement = 1 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The node's current presence record.
  NodePresence presence = 2 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The node-wide capacity snapshot, when the node publishes one.
  CapacityAdvertisement capacity = 3 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
}

// The directory's canonical point-in-time view. Nodes order by node_id,
// processors by processor_id, and processor-level capacity snapshots by
// (node_id, processor_id). The same directory state captured at the same time
// serializes to the same bytes. The fingerprint commits to that view: the
// lowercase SHA-256 hex of this snapshot serialized with the fingerprint field
// cleared.
message ClusterSnapshot {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "Deterministic directory view: cluster, capture time, event position, ordered node and processor entries, fingerprint."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The cluster this snapshot views.
  ClusterDescriptor cluster = 1 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // When the directory captured the snapshot, on the directory's clock.
  google.protobuf.Timestamp captured_at = 2 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The directory event sequence at capture time; 0 before any event.
  int64 snapshot_seq = 3 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 0,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The live node entries, ordered by node_id.
  repeated NodeRecord nodes = 4 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 65536,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The live processor advertisements, ordered by processor_id.
  repeated ProcessorAdvertisement processors = 5 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 65536,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The processor-level capacity snapshots, ordered by (node_id,
  // processor_id). Node-wide capacity travels inside each NodeRecord.
  repeated CapacityAdvertisement capacities = 6 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 65536,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Lowercase SHA-256 hex of this snapshot serialized with the fingerprint
  // field cleared.
  string fingerprint = 7 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Administrator-authored readiness gates, ordered by processor id.
  repeated ProcessorReadinessOverlay readiness_overlays = 8 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 65536,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

// One typed membership, presence, or capacity change in the directory's
// replayable event log. Events order by a directory-global sequence. Events
// carry no index hints: the log is replayed, not searched.
message ClusterEvent {
  option (ai.protomolt.proto.meta.v1.message) = {
    description: "One directory event: sequence, time, type, subject identity, and the state that changed."
    owner: "protomolt"
    sensitivity: "internal"
  };
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: [
      {
        id: "event-has-detail"
        message: "a cluster event must carry one typed detail"
        expression: "has(this.node) || has(this.processor) || has(this.presence) || has(this.capacity) || has(this.readiness)"
      },
      {
        id: "event-type-matches-detail"
        message: "the event type must match its typed detail"
        expression: "((this.type == 1 || this.type == 2) && has(this.node)) || ((this.type == 3 || this.type == 4) && has(this.processor)) || (this.type == 5 && has(this.presence)) || (this.type == 6 && has(this.capacity)) || (this.type == 7 && has(this.readiness))"
      },
      {
        id: "event-subject-matches-detail"
        message: "event subject ids must match the embedded record"
        expression: "(has(this.node) && this.node_id == this.node.node_id && size(this.processor_id) == 0) || (has(this.processor) && this.node_id == this.processor.node_id && this.processor_id == this.processor.processor_id) || (has(this.presence) && this.node_id == this.presence.node_id && size(this.processor_id) == 0) || (has(this.capacity) && this.node_id == this.capacity.node_id && this.processor_id == this.capacity.processor_id) || (has(this.readiness) && this.node_id == this.readiness.node_id && this.processor_id == this.readiness.processor_id)"
      }
    ]
  };

  // 1-based, directory-global, strictly increasing.
  int64 seq = 1 [
    (ai.protomolt.proto.validate.v1.field).int64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // When the directory applied the change, on the directory's clock.
  google.protobuf.Timestamp occurred_at = 2 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // What changed; UNSPECIFIED is invalid.
  ClusterEventType type = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {
        defined_only: true
        not_in: [0]
      }
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The node the event concerns.
  string node_id = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The processor the event concerns, for processor events.
  string processor_id = 5 [
    (ai.protomolt.proto.validate.v1.field) = {ignore_if_zero: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The state that changed, matching the event type.
  oneof detail {
    // The registered or updated node advertisement.
    NodeAdvertisement node = 10 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    // The registered, updated, or expired processor advertisement.
    ProcessorAdvertisement processor = 11 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    // The new presence record.
    NodePresence presence = 12 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    // The new capacity snapshot.
    CapacityAdvertisement capacity = 13 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    // The new administrator readiness overlay.
    ProcessorReadinessOverlay readiness = 14 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  }
}

// What kind of change one cluster event records.
enum ClusterEventType {
  // Invalid; every event names a real type.
  CLUSTER_EVENT_TYPE_UNSPECIFIED = 0;
  // A node registered, or re-registered with a changed advertisement.
  CLUSTER_EVENT_TYPE_NODE_REGISTERED = 1;
  // A node's presence expired or went GONE and the sweep removed it.
  CLUSTER_EVENT_TYPE_NODE_EXPIRED = 2;
  // A processor registered, or re-registered with a changed advertisement.
  CLUSTER_EVENT_TYPE_PROCESSOR_REGISTERED = 3;
  // A processor's lease expired, or its hosting node was swept.
  CLUSTER_EVENT_TYPE_PROCESSOR_EXPIRED = 4;
  // A heartbeat or state change replaced a node's presence record.
  CLUSTER_EVENT_TYPE_PRESENCE_UPDATED = 5;
  // A capacity snapshot replaced the previous one for its key.
  CLUSTER_EVENT_TYPE_CAPACITY_UPDATED = 6;
  // An administrator changed a processor readiness gate.
  CLUSTER_EVENT_TYPE_READINESS_UPDATED = 7;
}
