syntax = "proto3";

package ai.pipestream.proto.mesh.cluster.storage.v1;

import "ai/pipestream/proto/mesh/cluster/v1/cluster.proto";
import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.mesh.cluster.storage.v1";

// Complete, gap-free replay log for one cluster directory.
message ClusterEventLog {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Complete replay log for one cluster directory identity."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // Stable cluster identity whose directory emitted the events.
  string cluster_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Canonical fingerprint of the exact ClusterDescriptor used for replay.
  string cluster_fingerprint = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {sha256_hex: true}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // Directory events in strictly increasing sequence order. A log with no
  // checkpoint begins at one; a compacted log begins at the event after the
  // checkpoint's snapshot_seq.
  repeated ai.pipestream.proto.mesh.cluster.v1.ClusterEvent events = 3 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 100000,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
  // The directory state the retained events replay onto. Absent in a log that
  // has never been compacted, where the events are the complete history from
  // sequence one. Present once the log is folded, which is what keeps a
  // directory that emits an event per heartbeat from growing without bound and
  // from eventually refusing every mutation at the events cap.
  ai.pipestream.proto.mesh.cluster.v1.DirectoryCheckpoint checkpoint = 4 [
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal"
  ];
}
