syntax = "proto3";

package ai.pipestream.proto.mesh.v1;

import "ai/pipestream/proto/mesh/v1/entity.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/descriptor.proto";

option java_multiple_files = true;
option java_outer_classname = "MeshOptionsProto";
option java_package = "ai.pipestream.proto.mesh.v1";

// ============================================================================
// MESH PROCESSING OPTIONS: strongly typed message and field options that
// declare default mesh processing semantics on an application contract.
//
// These options describe; they do not grant authority. They name versioned
// profiles by reference and mark field roles. They contain no endpoint
// addresses, no credentials, and no executable policy.
//
// The existing metadata, validation, indexing, LLM, quality, and projection
// options remain authoritative in their domains. The mesh options reference
// that behavior (for example the instruction role marks which fields feed the
// llm.v1 instruction channel; pii_scan_target marks fields the PII processor
// inspects on top of meta.v1 sensitivity) instead of copying their fields.
// ============================================================================

// Mesh processing semantics declared on one message type.
message MeshMessageOptions {
  // The processing profile processors should apply to this type by default,
  // by reference.
  ProfileReference processing_profile = 1;
  // Fully qualified name of the result type a processor is expected to
  // produce from this message; empty when the processor's own contract
  // declares it.
  string result_type = 2 [(ai.pipestream.proto.validate.v1.field).string.pattern = "^$|^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)+$"];
  // Processor capabilities a route must require to handle this type, most
  // relevant first.
  repeated string capabilities = 3 [(ai.pipestream.proto.validate.v1.field).repeated = {
    max_items: 64
    items: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"}
    }
  }];
  // The default route profile for entities of this type, by reference.
  ProfileReference route_profile = 4;
  // How far entities of this type may recursively dehydrate.
  RecursionLimits recursion = 5;
  // The profile governing how this type scatters into children, by reference.
  ProfileReference scatter_profile = 6;
  // The profile governing how this type's scope rehydrates child results, by
  // reference.
  ProfileReference rehydration_profile = 7;
  // Whether an LLM processor may execute this type. The llm.v1 options stay
  // authoritative for how the LLM is prompted; this flag only gates whether
  // LLM execution is permitted at all.
  bool llm_allowed = 8;
  // Whether content PII inspection must run before this type crosses a trust
  // boundary, on top of the schema-declared meta.v1 sensitivity.
  bool pii_scan_required = 9;
  // When human or policy approval is required for entities of this type.
  ApprovalPolicy approval_policy = 10 [(ai.pipestream.proto.validate.v1.field).enum.defined_only = true];
  // How much execution evidence entities of this type must produce.
  EvidencePolicy evidence_policy = 11 [(ai.pipestream.proto.validate.v1.field).enum.defined_only = true];
}

// Bounds on recursive scatter for one message type.
message RecursionLimits {
  // Maximum dehydration depth below the root entity; 0 forbids scatter.
  uint32 max_depth = 1 [(ai.pipestream.proto.validate.v1.field).uint32.lte = 64];
  // Maximum direct children one entity of this type may dehydrate into; 0
  // forbids scatter.
  uint32 max_children = 2 [(ai.pipestream.proto.validate.v1.field).uint32.lte = 1024];
}

// When approval is required before an entity's work is treated as done.
enum ApprovalPolicy {
  // Invalid where a policy is required; the profile default where optional.
  APPROVAL_POLICY_UNSPECIFIED = 0;
  // No approval step.
  APPROVAL_POLICY_NONE = 1;
  // The completion candidate is held until an approver accepts it.
  APPROVAL_POLICY_ON_COMPLETION = 2;
  // Approval is required before the entity may be sent to a remote processor.
  APPROVAL_POLICY_BEFORE_REMOTE_EXECUTION = 3;
}

// How much evidence an execution must record.
enum EvidencePolicy {
  // Invalid where a policy is required; the profile default where optional.
  EVIDENCE_POLICY_UNSPECIFIED = 0;
  // No evidence beyond the terminal state.
  EVIDENCE_POLICY_NONE = 1;
  // Bounded summaries plus content-addressed artifact references.
  EVIDENCE_POLICY_SUMMARY = 2;
  // The full replayable execution record.
  EVIDENCE_POLICY_FULL = 3;
}

// The mesh roles one field plays. A field may carry several roles at once
// (for example a body field can be both a grounding source and a PII scan
// target). Roles identify; the referenced subsystems own the semantics.
message MeshFieldOptions {
  // Route profiles may extract this field's value as a routing key.
  bool routing_key = 1;
  // This field carries instruction content for the processor (the llm.v1
  // options own how instructions are rendered for a model).
  bool instruction = 2;
  // This field carries grounding or context the processor should honor.
  bool grounding = 3;
  // This field carries an attachment or claim-check reference, not inline
  // content.
  bool attachment = 4;
  // Scatter profiles may fan out over this field's values.
  bool scatter_source = 5;
  // This field carries (or will carry) the processing result.
  bool result = 6;
  // This field carries execution evidence references.
  bool evidence = 7;
  // The PII processor must inspect this field's content, on top of any
  // meta.v1 sensitivity the field declares.
  bool pii_scan_target = 8;
  // This field's value must never leave the trust domain: no remote processor
  // and no LLM provider may receive it.
  bool remote_disclosure_prohibited = 9;
}

extend google.protobuf.MessageOptions {
  // Mesh processing semantics for one message type.
  MeshMessageOptions message = 59100532;
}

extend google.protobuf.FieldOptions {
  // The mesh roles one field plays.
  MeshFieldOptions field = 59100531;
}
