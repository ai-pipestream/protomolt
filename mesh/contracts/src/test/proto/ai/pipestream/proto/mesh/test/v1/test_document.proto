syntax = "proto3";

package ai.pipestream.proto.mesh.test.v1;

import "ai/pipestream/proto/mesh/v1/options.proto";
import "ai/pipestream/proto/meta/v1/metadata.proto";
import "ai/pipestream/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.mesh.test.v1";

// Test fixture for the mesh contracts module: an application contract fully
// annotated with the mesh message and field options, used by the option
// round-trip, fingerprint, resolver, and envelope validation tests.
message TestDocument {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Fixture application document carrying every mesh option role."
    owner: "protomolt"
    sensitivity: "internal"
  };
  option (ai.pipestream.proto.mesh.v1.message) = {
    processing_profile: {
      name: "nlp-standard"
      version: "1.2.0"
    }
    result_type: "ai.pipestream.proto.mesh.test.v1.TestResult"
    capabilities: [
      "opennlp-ner",
      "java-build"
    ]
    route_profile: {name: "default-routes"}
    recursion: {
      max_depth: 4
      max_children: 16
    }
    scatter_profile: {name: "line-scatter"}
    rehydration_profile: {name: "ordered-collect"}
    llm_allowed: true
    pii_scan_required: true
    approval_policy: APPROVAL_POLICY_ON_COMPLETION
    evidence_policy: EVIDENCE_POLICY_SUMMARY
  };

  // Document id, doubling as a routing key.
  string document_id = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 128}
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal",
    (ai.pipestream.proto.mesh.v1.field) = {routing_key: true}
  ];
  // Instruction text for the processor.
  string instruction = 2 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 4096,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal",
    (ai.pipestream.proto.mesh.v1.field) = {instruction: true}
  ];
  // Free text body: grounding content and a PII scan target.
  string body = 3 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 65536,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal",
    (ai.pipestream.proto.mesh.v1.field) = {
      grounding: true
      pii_scan_target: true
    }
  ];
  // A secret the mesh must never send to a remote processor.
  string api_token = 4 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 512,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "secret",
    (ai.pipestream.proto.mesh.v1.field) = {remote_disclosure_prohibited: true}
  ];
  // Attachment references, not inline content.
  repeated string attachments = 5 [
    (ai.pipestream.proto.validate.v1.field).repeated = {
      max_items: 16
      items: {
        string: {max_len: 512}
      }
    },
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal",
    (ai.pipestream.proto.mesh.v1.field) = {attachment: true}
  ];
  // Lines a scatter profile may fan out over.
  repeated string scatter_lines = 6 [
    (ai.pipestream.proto.validate.v1.field).repeated.max_items = 1024,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal",
    (ai.pipestream.proto.mesh.v1.field) = {scatter_source: true}
  ];
}

// The fixture result type the TestDocument option names.
message TestResult {
  option (ai.pipestream.proto.meta.v1.message) = {
    description: "Fixture processing result: summary plus evidence reference."
    owner: "protomolt"
    sensitivity: "internal"
  };

  // The processing result.
  string summary = 1 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 8192,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal",
    (ai.pipestream.proto.mesh.v1.field) = {result: true}
  ];
  // Where the execution evidence lives, by reference.
  string evidence_reference = 2 [
    (ai.pipestream.proto.validate.v1.field).string.max_len = 512,
    (ai.pipestream.proto.meta.v1.field).sensitivity = "internal",
    (ai.pipestream.proto.mesh.v1.field) = {evidence: true}
  ];
}
