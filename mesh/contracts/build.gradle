plugins {
    alias(libs.plugins.protobuf)
}

description = 'The protobuf mesh contract gate: fail-fast envelope validation, canonical descriptor-set fingerprinting, and the schema-identity resolver'

dependencies {
    api project(':protomolt-mesh-proto')
    api project(':protomolt-mesh-runtime-proto')

    // The entry point composes the validate.v1 annotation evaluation with the
    // semantic checks the annotations cannot express (digest/length, expiry).
    implementation project(':protomolt-protobuf-validation')
    // The resolver proves schema identity against descriptor registries.
    implementation project(':protomolt-descriptors')
    implementation libs.protobuf.java.util

    // The annotated test fixture contract imports the mesh options, validate,
    // and meta protos.
    testImplementation project(':protomolt-protobuf-metadata')
    protobuf project(':protomolt-mesh-proto')
    protobuf project(':protomolt-protobuf-validation')
    protobuf project(':protomolt-protobuf-metadata')
}

// Test fixture protos only; the module's own contract lives in mesh/proto.
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}"
    }
}
