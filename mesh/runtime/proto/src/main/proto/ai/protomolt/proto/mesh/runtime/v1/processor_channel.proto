  string delivery_id = 2 [(ai.protomolt.proto.validate.v1.field) = {required: true, string: {uuid: true}}];
  string run_id = 3 [(ai.protomolt.proto.validate.v1.field) = {required: true, string: {uuid: true}}];
  string invocation_id = 4 [(ai.protomolt.proto.validate.v1.field) = {required: true, string: {uuid: true}}];
  string workflow_name = 5 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  string workflow_version = 6 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  string plan_fingerprint = 7 [(ai.protomolt.proto.validate.v1.field).string.max_len = 64];
  uint64 deployment_revision = 8;
  string processor_id = 9 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  string node_id = 10 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
