  repeated OutcomeCause causes = 3 [(ai.protomolt.proto.validate.v1.field).repeated.max_items = 32];
  RetryAdvice retry_advice = 4 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  SettlementEffect settlement_effect = 5;
}

