enum ProcessorOutcomeKind {
  PROCESSOR_OUTCOME_KIND_UNSPECIFIED = 0;
  PROCESSOR_OUTCOME_KIND_SUCCESS = 1;
  PROCESSOR_OUTCOME_KIND_RETRYABLE = 2;
  PROCESSOR_OUTCOME_KIND_PERMANENT = 3;
  PROCESSOR_OUTCOME_KIND_SKIPPED = 4;
  PROCESSOR_OUTCOME_KIND_ABANDONED = 5;
  PROCESSOR_OUTCOME_KIND_CANCELLED = 6;
}

enum RetryStrategy {
  RETRY_STRATEGY_UNSPECIFIED = 0;
  RETRY_STRATEGY_NONE = 1;
  RETRY_STRATEGY_FIXED_DELAY = 2;
  RETRY_STRATEGY_EXPONENTIAL_BACKOFF = 3;
  RETRY_STRATEGY_RETRY_AFTER = 4;
}

enum RetryJitterPolicy {
  RETRY_JITTER_POLICY_UNSPECIFIED = 0;
  RETRY_JITTER_POLICY_NONE = 1;
  RETRY_JITTER_POLICY_FULL = 2;
  RETRY_JITTER_POLICY_EQUAL = 3;
}

enum SettlementEffect {
  SETTLEMENT_EFFECT_UNSPECIFIED = 0;
  SETTLEMENT_EFFECT_SETTLE = 1;
  SETTLEMENT_EFFECT_RELEASE = 2;
  SETTLEMENT_EFFECT_DEAD_LETTER = 3;
  SETTLEMENT_EFFECT_COMPENSATE = 4;
  SETTLEMENT_EFFECT_NONE = 5;
}

