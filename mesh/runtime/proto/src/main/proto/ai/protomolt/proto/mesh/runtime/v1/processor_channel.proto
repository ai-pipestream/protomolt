    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  uint32 max_attempts = 9 [
    (ai.protomolt.proto.validate.v1.field).uint32 = {gte: 1, lte: 100},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string workflow_name = 10 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  string workflow_version = 11 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  string plan_fingerprint = 12 [(ai.protomolt.proto.validate.v1.field).string.max_len = 64];
