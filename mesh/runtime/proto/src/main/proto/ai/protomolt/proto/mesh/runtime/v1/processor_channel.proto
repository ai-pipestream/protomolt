// The only durable processor-channel record. Implementations append these
// protobuf bytes directly; JSON is not a persistence format for this protocol.
message ChannelRecord {
  uint64 sequence = 1 [
    (ai.protomolt.proto.validate.v1.field).uint64.gte = 1,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  google.protobuf.Timestamp recorded_at = 2 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  oneof event {
    WorkEnqueued enqueued = 10 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    WorkClaimed claimed = 11 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    WorkCompleted completed = 12 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    WorkReleased released = 13 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    WorkFailed failed = 14 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    WorkSettled settled = 15 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
    DeadLetterStatusChanged dead_letter_status_changed = 16 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  }
}

