}

message RetryAdvice {
  RetryStrategy strategy = 1;
  google.protobuf.Duration delay = 2 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  google.protobuf.Timestamp retry_after = 3 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  google.protobuf.Duration maximum_delay = 4 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  uint32 maximum_attempts = 5 [(ai.protomolt.proto.validate.v1.field).uint32.lte = 100];
  RetryJitterPolicy jitter_policy = 6;
}

message ProcessorOutcome {
  string outcome_id = 1 [(ai.protomolt.proto.validate.v1.field) = {required: true, string: {uuid: true}}];
