  DEAD_LETTER_REPLAY_STATUS_COMPLETED = 4;
  DEAD_LETTER_REPLAY_STATUS_FAILED = 5;
  DEAD_LETTER_REPLAY_STATUS_ACKNOWLEDGED = 6;
