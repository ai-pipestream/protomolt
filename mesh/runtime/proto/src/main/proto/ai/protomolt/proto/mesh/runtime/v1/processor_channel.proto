option java_multiple_files = true;
option java_package = "ai.protomolt.proto.mesh.runtime.v1";

// Workers initiate one long-lived channel and explicitly grant demand. The
// coordinator never pushes work beyond those permits.
service DemandProcessorService {
  rpc Connect(stream WorkerFrame) returns (stream CoordinatorFrame);
}

