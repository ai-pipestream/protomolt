  ProcessorOutcome outcome = 13 [(ai.protomolt.proto.validate.v1.field).required = true];
  repeated DeliveryAttemptRecord attempts = 14 [(ai.protomolt.proto.validate.v1.field).repeated.max_items = 100];
  google.protobuf.Timestamp first_failure_at = 15 [(ai.protomolt.proto.validate.v1.field).required = true];
  google.protobuf.Timestamp last_failure_at = 16 [(ai.protomolt.proto.validate.v1.field).required = true];
  string channel_policy_id = 17 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  uint64 source_history_sequence = 18;
  DeadLetterReplayStatus replay_status = 19;
  string replay_run_id = 20 [(ai.protomolt.proto.validate.v1.field).string.max_len = 64];
  string namespace = 21 [(ai.protomolt.proto.validate.v1.field) = {required: true, string: {max_len: 256}}];
  string retention_policy_reference = 22 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  string legal_hold_policy_reference = 23 [(ai.protomolt.proto.validate.v1.field).string.max_len = 128];
  bool retention_hold = 24;
  string completion_id = 25 [(ai.protomolt.proto.validate.v1.field) = {required: true, string: {uuid: true}}];
  ProcessorContract processor_contract = 26 [(ai.protomolt.proto.validate.v1.field).required = true];
