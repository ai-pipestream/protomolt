syntax = "proto3";

package ai.protomolt.proto.mesh.runtime.v1;

import "ai/protomolt/proto/mesh/runtime/v1/flow.proto";
import "ai/protomolt/proto/mesh/v1/entity.proto";
import "ai/protomolt/proto/meta/v1/metadata.proto";
import "ai/protomolt/proto/validate/v1/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.mesh.runtime.v1";

// Durable lifecycle for exact compiled directed flows. Stored and executed
// values are protobuf binary. JSON may exist at an external REST or human
// boundary but never participates in identity, processing, history, or recovery.
service FlowLifecycleService {
  rpc ValidateFlow(ValidateFlowRequest) returns (FlowValidationReport);
  rpc PublishFlow(PublishFlowRequest) returns (PublishFlowResponse);
  rpc GetPublishedFlow(GetPublishedFlowRequest) returns (PublishedFlowVersion);
  rpc SetDeployment(SetDeploymentRequest) returns (DeploymentPointer);
  rpc GetDeployment(GetDeploymentRequest) returns (DeploymentPointer);
  rpc StartRun(StartRunRequest) returns (DurableFlowRun);
  rpc ResumeRun(ResumeRunRequest) returns (DurableFlowRun);
  rpc GetRun(GetRunRequest) returns (DurableFlowRun);
  rpc ReadRunHistory(ReadRunHistoryRequest) returns (ReadRunHistoryResponse);
  rpc CancelRun(CancelRunRequest) returns (DurableFlowRun);
  rpc ReplayRun(ReplayRunRequest) returns (DurableFlowRun);
}

message FlowValidationFinding {
  string code = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string path = 2 [
    (ai.protomolt.proto.validate.v1.field).string.max_len = 1024,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string message = 3 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {max_len: 8192}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

message FlowValidationReport {
  string workflow_name = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string definition_fingerprint = 3 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {sha256_hex: true}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  bool valid = 4 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
  repeated FlowValidationFinding findings = 5 [
    (ai.protomolt.proto.validate.v1.field).repeated.max_items = 256,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  CompiledFlowPlan plan = 6 [(ai.protomolt.proto.meta.v1.field).sensitivity = "internal"];
}

message PublishedFlowVersion {
  string workflow_name = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  CompiledFlowPlan plan = 3 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  google.protobuf.Timestamp published_at = 4 [
    (ai.protomolt.proto.validate.v1.field).required = true,
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
}

message DeploymentPointer {
  string workflow_name = 1 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string version = 2 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {slug: true, max_len: 128}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  string plan_fingerprint = 3 [
    (ai.protomolt.proto.validate.v1.field) = {required: true, string: {sha256_hex: true}},
    (ai.protomolt.proto.meta.v1.field).sensitivity = "internal"
  ];
  uint64 revision = 4 [
