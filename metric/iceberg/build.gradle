description = 'Iceberg metric executor: one DuckDB SELECT over the Parquet files of the table the Iceberg sink wrote'

dependencies {
    api project(':protomolt-metric-spi')
    api libs.iceberg.api
    implementation libs.iceberg.core
    // The rollup sink writes through the lake module's emitter, the same
    // append path every Iceberg table here takes.
    implementation project(':protomolt-iceberg')
    // The in-process reader over the table's files, not a warehouse we
    // operate; isolated to this module the way the sink isolates Iceberg.
    implementation libs.duckdb.jdbc
    implementation libs.slf4j.api

    // The proof writes the fixture table through the real sink and reads
    // the numbers back through the executor.
    testImplementation project(':protomolt-sources')
    // The object-store proof: the sink writes to LocalStack S3 through
    // S3FileIO and the executor materializes the scan back.
    testImplementation project(':protomolt-iceberg-s3')
    testImplementation platform(libs.awssdk.bom)
    testImplementation libs.awssdk.s3
    testImplementation libs.awssdk.url.connection.client
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.localstack
    // The fixture catalog: JdbcCatalog over sqlite honors io-impl, so the
    // sink's Parquet lands on real disk for DuckDB to read.
    testRuntimeOnly libs.sqlite.jdbc
    testRuntimeOnly libs.slf4j.simple
}
