description = 'Lucene metric executor — aggregate collectors over the doc values the search service already writes'

dependencies {
    api project(':protomolt-authz')
    api project(':protomolt-metric-spi')
    api project(':protomolt-search-index-spi')
    api libs.lucene.core
    // The metrics role module: composer types in its signature, the metric
    // services behind it, and the search service's store it aggregates over.
    api project(':protomolt-composer')
    implementation project(':protomolt-metric-service')
    implementation project(':protomolt-search-service')
    implementation project(':protomolt-actions')
    // With a co-mounted registry the module registers the rebuild-rollup
    // workflow, the way the search service registers its own.
    implementation project(':protomolt-registry')
    implementation libs.grpc.api
    implementation libs.slf4j.api

    // The composed-role proof dials the fake repo and the metric service over
    // their real wire contracts.
    testImplementation project(':protomolt-repo-proto')
    testImplementation libs.grpc.netty.shaded
    testImplementation libs.grpc.inprocess
    testRuntimeOnly libs.slf4j.simple
}

// The Lucene 11 line ships Java 25 bytecode, so this module's tests cannot run on an
// older JVM: the test launcher stays on the toolchain JDK and -PtestJdk is ignored
// here (same pin as :protomolt-search-index-lucene).
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
