description = 'Schema registry core: subject/version store SPI and the git-backed implementation'

dependencies {
    api project(':protomolt-proto-sources')
    // The config gate parses proto3-JSON documents and runs the type's own
    // declared rules before anything reaches Git.
    implementation project(':protomolt-protobuf-validation')
    implementation libs.protobuf.java.util
    api project(':protomolt-compat')
    // Versioned workflow promotion is stored alongside subjects in the same git repository.
    api project(':protomolt-grpc-workflow')

    implementation libs.jgit
    implementation libs.jackson.databind
}
