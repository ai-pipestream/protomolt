plugins { id 'java-test-fixtures' }

description = 'Schema registry contracts, validation and in-memory storage'

dependencies {
    testFixturesImplementation platform(libs.junit.bom)
    testFixturesImplementation libs.junit.jupiter
    testFixturesImplementation libs.assertj.core
    api project(':protomolt-sources')
    // The config gate parses proto3-JSON documents and runs the type's own
    // declared rules before anything reaches Git.
    implementation project(':protomolt-protobuf-validation')
    implementation libs.protobuf.java.util
    api project(':protomolt-compat')

    implementation libs.jackson.databind
}

ext.forbiddenRuntimeModules = ['org.eclipse.jgit', 'protomolt-schema-registry-git', 'protomolt-grpc-workflow', 'protomolt-workflow']
apply from: rootProject.file('gradle/runtime-boundaries.gradle')
