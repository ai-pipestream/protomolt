// Administrative contracts for a registry mount: publishing configuration
// documents, and managing the remote registries a mount federates with.
//
// These are the operations an operator or an agent performs against a
// registry, as distinct from the descriptor exchange that services perform
// against each other.
syntax = "proto3";

package ai.pipestream.proto.schema.registry.v1;

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.schema.registry.v1";
option java_outer_classname = "RegistryAdminProto";

import "ai/pipestream/proto/validate/v1/validate.proto";
import "google/protobuf/struct.proto";

// Publishes one configuration document under a named subject.
//
// The document is validated against the declared type before it is stored, so
// a subject never holds a document its own type would reject.
message PublishConfigRequest {
  // Subject to publish under, for example "parse-routing" or
  // "taxonomy:products". A subject names one configuration slot; publishing
  // to it replaces what that slot holds.
  string name = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 200}
    }
  ];
  // Full name of the document's protobuf type. It must resolve against the
  // schemas this mount holds, because the document is parsed and validated
  // as that type rather than stored as opaque text.
  string message_type = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {protobuf_fqn: true}
    }
  ];
  // The document itself, as canonical proto3 JSON of the declared type. It
  // is carried as a structure because its shape is whatever the caller's
  // type declares, which this contract cannot know.
  google.protobuf.Struct config = 3 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
}

// Where the published document landed.
message PublishConfigResponse {
  // The subject it was published under, echoed.
  string name = 1;
  // The type it was validated as, echoed, so a caller can confirm the mount
  // resolved the name it meant.
  string message_type = 2;
  // Version the publication produced. Consumers read a subject at a version,
  // so this identifies exactly what a later reader will see.
  string version = 3;
}

// Which remote operation to perform.
enum RemoteOperation {
  // Unset. Refused, because the alternative is guessing whether the caller
  // meant to read the remotes or to change them.
  REMOTE_OPERATION_UNSPECIFIED = 0;
  // Return the configured remotes without changing them.
  REMOTE_OPERATION_LIST = 1;
  // Add a remote under a name.
  REMOTE_OPERATION_ADD = 2;
  // Remove the remote held under a name.
  REMOTE_OPERATION_REMOVE = 3;
}

// Reads or changes the set of remote registries this mount federates with.
message RegistryRemotesRequest {
  option (ai.pipestream.proto.validate.v1.message) = {
    cel: {
      id: "remotes.name_required_to_change"
      message: "adding or removing a remote requires name"
      expression: "this.operation == 1 || this.name != ''"
    }
    cel: {
      id: "remotes.url_required_to_add"
      message: "adding a remote requires url"
      expression: "this.operation != 2 || this.url != ''"
    }
    cel: {
      id: "remotes.no_url_unless_adding"
      message: "url applies only when adding a remote"
      expression: "this.operation == 2 || this.url == ''"
    }
  };

  // The operation to perform. Required: there is no safe default between
  // reading the remotes and changing them.
  RemoteOperation operation = 1 [
    (ai.pipestream.proto.validate.v1.field) = {required: true}
  ];
  // Name the remote is held under. Required to add or remove one, and
  // meaningless when listing.
  string name = 2 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {slug: true, max_len: 100}
    }
  ];
  // Git URL of the remote registry. Required to add a remote and refused
  // otherwise, because a URL supplied while removing one would suggest the
  // removal was matched on the URL rather than the name.
  string url = 3 [
    (ai.pipestream.proto.validate.v1.field) = {
      ignore_if_zero: true
      string: {max_len: 2000}
    }
  ];
}

// One configured remote registry.
message RemoteRegistry {
  // Name the remote is held under, unique within this mount.
  string name = 1;
  // Git URL the remote is fetched from.
  string url = 2;
}

// The remotes this mount holds after the operation.
message RegistryRemotesResponse {
  // Every configured remote, in name order. Returned for all three
  // operations, so a caller that adds or removes one sees the resulting set
  // without a second call.
  repeated RemoteRegistry remotes = 1;
}

// Fetches a remote registry and merges what it holds into this mount.
message RegistrySyncRequest {
  // Name of a configured remote. Synchronizing names a remote rather than
  // taking a URL, so a mount can only pull from somewhere an operator has
  // already approved by adding it.
  string remote = 1 [
    (ai.pipestream.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 100}
    }
  ];
}

// What one subject's import produced.
message ImportedSubject {
  // Subject name as the remote holds it.
  string remote_subject = 1;
  // Subject name as this mount holds it, which is the remote's name under
  // the remote's prefix so two remotes cannot collide.
  string local_subject = 2;
  // Descriptors taken from this subject.
  int32 imported = 3;
  // Descriptors skipped because this mount already held them unchanged.
  int32 already_present = 4;
  // Descriptors refused, one line each. A rejection is a descriptor the
  // remote offered that this mount would not accept, which is a disagreement
  // worth reading rather than a failure of the sync.
  repeated string rejections = 5;
}

// What the synchronization brought in.
message RegistrySyncResponse {
  // The remote that was fetched, echoed.
  string remote = 1;
  // One entry per subject the remote offered, in the order they were read.
  repeated ImportedSubject subjects = 2;
  // Total descriptors taken across every subject.
  int32 descriptors_imported = 3;
  // Failures that stopped a subject being read at all, as distinct from the
  // per-subject rejections above.
  repeated string errors = 4;
}

// The registry's administrative surface as a typed service.
//
// Every verb the registry role contributes to the action catalog is one method
// here, taking the same request message the verb accepts, so the contract is
// stated once and reached two ways.
service RegistryAdminService {
  // Publishes one typed config document through the registry's config gate,
  // parsed strictly as its declared message type.
  rpc PublishConfig(PublishConfigRequest) returns (PublishConfigResponse);

  // Manages the git remotes this registry federates from: list, add, remove.
  rpc RegistryRemotes(RegistryRemotesRequest) returns (RegistryRemotesResponse);

  // Fetches a configured remote and imports its subjects with their
  // descriptor artifacts.
  rpc RegistrySync(RegistrySyncRequest) returns (RegistrySyncResponse);
}
