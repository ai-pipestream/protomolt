syntax = "proto3";

package ai.protomolt.proto.asset.v1;

import "ai/protomolt/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.asset.v1";

// ============================================================================
// CONTENT CLASSES — what an asset's content is structurally, as distinct
// from what its bytes are physically. Format routes storage and
// validation; content class routes bridging and consumption. A content
// profile attaches to the rendition whose content it describes —
// typically a derived one — and its measurements are measured, never
// asserted.
// ============================================================================

// The structural nature of some content.
enum ContentClass {
  // Unset; never a stored class.
  CONTENT_CLASS_UNSPECIFIED = 0;
  // Prose written to inform: articles, reports, documentation.
  CONTENT_CLASS_INFORMATIONAL_TEXT = 1;
  // Turn-taking text: chat exports, transcripts, threads.
  CONTENT_CLASS_CONVERSATIONAL_TEXT = 2;
  // Rows-and-measures data that loads into an analysis tool.
  CONTENT_CLASS_TABULAR_DATA = 3;
  // Text recovered from images or scans. Presumed lossy; carries a
  // measured quality score, never an assumed one.
  CONTENT_CLASS_OCR_TEXT = 4;
  // Source code and configuration.
  CONTENT_CLASS_CODE = 5;
}

// One measured quality dimension: a named lens with its score and its
// weight in the aggregate.
message QualityDimension {
  // The dimension's name (e.g. "character-confidence",
  // "dictionary-hit-rate", "layout-coherence").
  string name = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {slug: true, max_len: 100}
    }
  ];
  // The dimension's score in [0, 1].
  double score = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 1.0}
    }
  ];
  // The dimension's weight in the aggregate, in [0, 1].
  double weight = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 1.0}
    }
  ];
}

// A measured quality score: the weighted aggregate and the dimensions it
// aggregates. Produced by the platform's quality-scoring machinery;
// consumers gate on it the way they gate on classification state.
message QualityScore {
  // The weighted aggregate in [0, 1].
  double score = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      double: {gte: 0.0, lte: 1.0}
    }
  ];
  // The measured dimensions.
  repeated QualityDimension dimensions = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      repeated: {max_items: 32}
    }
  ];
}

// What one rendition's content is, with its measurements.
message ContentProfile {
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: {
      id: "content.class_known"
      message: "the content class must be a defined, non-unspecified class"
      expression: "int(this.content_class) >= 1 && int(this.content_class) <= 5"
    }
    cel: {
      id: "content.ocr_measures_quality"
      message: "OCR text carries a measured quality score, never an assumed one"
      expression: "int(this.content_class) != 4 || has(this.quality)"
    }
  };

  // The content's structural class.
  ContentClass content_class = 1;
  // Class-specific measured quality (required for OCR text).
  QualityScore quality = 2;
}
