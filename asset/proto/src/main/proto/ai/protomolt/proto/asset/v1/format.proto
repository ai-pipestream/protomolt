// A raster image.
message RasterImage {
  // The image's filename.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.(png|jpe?g|gif|webp|tiff?|bmp)$", max_len: 500}
      ignore_if_zero: true
    }
  ];
  // The image's media type; must be an image type when stated.
  string media_type = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {mime_type: true, prefix: "image/", max_len: 200}
      ignore_if_zero: true
    }
  ];
}

// The typed union of every format the platform recognizes. Exactly one
// arm; an empty fact is not a classification.
message FormatFact {
  // The format — exactly one arm must be set.
  oneof format {
    // POSIX tar archive, plain or gzipped.
    TarArchive tar = 1;
    // ZIP archive.
    ZipArchive zip = 2;
    // gzip-compressed single file (non-tar).
    GzipFile gzip = 3;
    // Apache Parquet dataset.
    ParquetDataset parquet = 4;
    // Apache Avro object-container file.
    AvroDataset avro = 5;
    // Delimiter-separated table.
    DelimitedTable delimited = 6;
    // Newline-delimited JSON dataset.
    NdjsonDataset ndjson = 7;
    // Single JSON document.
    JsonDocument json = 8;
    // XML document.
    XmlDocument xml = 9;
    // YAML document.
    YamlDocument yaml = 10;
    // PDF document.
    PdfDocument pdf = 11;
    // Word-processing document.
    WordDocument word = 12;
    // Spreadsheet document.
    SpreadsheetDocument spreadsheet = 13;
    // Presentation document.
    PresentationDocument presentation = 14;
    // Markdown document.
    MarkdownDocument markdown = 15;
    // HTML document.
    HtmlDocument html = 16;
    // Unstructured plain text.
    PlainText text = 17;
    // Raster image.
    RasterImage image = 18;
  }
}

// Where an asset came from when it arrived from object storage. Not a
// format — an origin, carried beside the classification — and strict by
// the platform's no-assumed-defaults rule: an asset claiming an
// object-store origin without its coordinates is refused naming the
// missing field.
message ObjectStoreOrigin {
  // The source bucket.
  string bucket = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 255}
    }
  ];
  // The source object key.
  string object_key = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {min_len: 1, max_len: 1024}
    }
  ];
  // The store's region, when the provider has one.
  string region = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 100}
      ignore_if_zero: true
    }
  ];
  // The provider's storage class, when reported.
  string storage_class = 4 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {max_len: 100}
      ignore_if_zero: true
    }
  ];
  // The source object's provider metadata attributes, carried verbatim.
  map<string, string> attributes = 99;
}
