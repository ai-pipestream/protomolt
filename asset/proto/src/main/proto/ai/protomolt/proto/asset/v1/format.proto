syntax = "proto3";

package ai.protomolt.proto.asset.v1;

import "ai/protomolt/proto/validate/v1/validate.proto";

option java_multiple_files = true;
option java_package = "ai.protomolt.proto.asset.v1";

// ============================================================================
// FORMATS — the typed registry of what an asset's bytes are physically.
//
// Each format the platform recognizes is one message whose fields carry
// that format's invariants as validate.v1 rules: the annotation IS the
// claim's contract, and a declaration that fails its format's rules never
// lands. The union is a closed oneof on purpose — format claims gate
// behavior (validation, bridging), and behavior-gating vocabulary must be
// exhaustive at compile time. Growing the registry is an additive change:
// a new message, its rules, and a new oneof arm.
//
// A filename, when stated, is held to the format's name grammar and
// nothing else. Presence is the door's rule, split by role: a producer's
// DECLARATION must carry the filename (the claim is about a named file),
// while characterization's IDENTIFIED fact may omit it — bytes can prove
// a format without endorsing a name that contradicts it. Detection
// evidence (magic bytes, probes) lives on the classification, not here —
// a FormatFact states what is claimed or concluded, never how.
// ============================================================================

// A POSIX tar archive, plain or gzip-compressed.
message TarArchive {
  // The archive's filename; the tar name grammar and nothing else.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.(tar|tar\\.gz|tgz)$", max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// A ZIP archive.
message ZipArchive {
  // The archive's filename.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.zip$", max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// A gzip-compressed single file that is NOT a tar (that is TarArchive's
// .tar.gz/.tgz arm).
message GzipFile {
  option (ai.protomolt.proto.validate.v1.message) = {
    cel: {
      id: "gzip.not_a_tar"
      message: "a .tar.gz names a tar archive, not a gzip file"
      expression: "!this.filename.matches('(?i).*\\\\.tar\\\\.gz$')"
    }
  };
  // The compressed file's name.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.gz$", max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// An Apache Parquet dataset file.
message ParquetDataset {
  // The dataset file's name.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.parquet$", max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// An Apache Avro object-container file.
message AvroDataset {
  // The dataset file's name.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.avro$", max_len: 500}
      ignore_if_zero: true
    }
  ];
}

// Whether a delimited table's first row is a header. An explicit
// three-state enum, not a bool: a table whose header presence is unstated
// is not a classified table.
enum HeaderPresence {
  // Unset; never a stored value — the claim must state it.
  HEADER_PRESENCE_UNSPECIFIED = 0;
  // The first row names the columns.
  HEADER_PRESENCE_PRESENT = 1;
  // Data starts at row one.
  HEADER_PRESENCE_ABSENT = 2;
}

// A delimiter-separated table (CSV, TSV, and kin). A table whose parsing
// rules are unstated is not a classified table: the delimiter and header
// presence are part of the claim.
message DelimitedTable {
  // The table file's name.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.(csv|tsv|psv)$", max_len: 500}
      ignore_if_zero: true
    }
  ];
  // The field delimiter, exactly one character (e.g. ",", "\t", "|").
  string delimiter = 2 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      string: {len: 1}
    }
  ];
  // Whether the first row is a header. Must be stated.
  HeaderPresence header = 3 [
    (ai.protomolt.proto.validate.v1.field) = {
      required: true
      enum: {defined_only: true}
    }
  ];
}

// A newline-delimited JSON dataset: one JSON value per line.
message NdjsonDataset {
  // The dataset file's name.
  string filename = 1 [
    (ai.protomolt.proto.validate.v1.field) = {
      string: {pattern: "(?i)^.+\\.(ndjson|jsonl)$", max_len: 500}
      ignore_if_zero: true
    }
  ];
}

