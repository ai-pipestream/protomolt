# Always-on ProtoMolt coordinator for the NAS Portainer endpoint.
#
# Portainer owns this stack. Do not run this file with an unrelated local Compose
# project on the NAS because doing so creates a second lifecycle owner for the
# same persistent data. Required secrets are supplied as Portainer stack
# environment variables and are deliberately absent from this file.

services:
  serve-init:
    image: busybox:1.38.0
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /data/registry.git /data/services /data/workflows
        chown -R 10001:10001 /data
    volumes:
      - protomolt-data:/data
    restart: "no"

  serve:
    # The delegation transcript flags below need an edge image built from a main
    # that includes them. The default tag follows the Docker Publish workflow;
    # pin a verified build by setting PROTOMOLT_SERVE_IMAGE to
    # ghcr.io/ai-pipestream/protomolt-serve:edge@sha256:<digest> in Portainer.
    image: ${PROTOMOLT_SERVE_IMAGE:-ghcr.io/ai-pipestream/protomolt-serve:edge}
    container_name: protomolt-coordinator
    command:
      - --registry-git
      - /data/registry.git
      - --service-workspace
      - /data/services
      - --workflow-workspace
      - /data/workflows
      - --delegation-repo-endpoint
      - repo-service:9090
      - --delegation-repo-drive
      - ${PROTOMOLT_DELEGATION_REPO_DRIVE:-protomolt}
      - --mesh-cluster-id
      - ${PROTOMOLT_MESH_CLUSTER_ID:-protomolt}
      - --mesh-cluster-name
      - ${PROTOMOLT_MESH_CLUSTER_NAME:-ProtoMolt private mesh}
      - --mesh-trust-domain
      - ${PROTOMOLT_MESH_TRUST_DOMAIN:-taild24b1c.ts.net}
      - --mesh-created-at
      - ${PROTOMOLT_MESH_CREATED_AT:-2026-08-14T00:00:00Z}
      - --demo
    environment:
      # Durable workflow runs: the job row in Postgres is the truth. The
      # credentials ride the environment rather than the command line, which
      # docker inspect shows in full. No broker here, so the worker drains
      # the store directly; --jobs-kafka is what adds propagation later. The
      # database itself is created by jobs-init below, on every deploy, so
      # the stack is correct on a fresh volume and on the one in service.
      PROTOMOLT_JOBS_JDBC: jdbc:postgresql://repo-postgres:5432/${PROTOMOLT_JOBS_DB_NAME:-jobs}
      PROTOMOLT_JOBS_USER: ${PROTOMOLT_REPO_DB_USER:-documents}
      PROTOMOLT_JOBS_PASSWORD: ${PROTOMOLT_REPO_DB_PASSWORD:?set PROTOMOLT_REPO_DB_PASSWORD in Portainer}
      PROTOMOLT_API_TOKEN: ${PROTOMOLT_API_TOKEN:?set PROTOMOLT_API_TOKEN in Portainer}
      PROTOMOLT_TASK_CONSOLE_TOKEN: ${PROTOMOLT_TASK_CONSOLE_TOKEN:?set PROTOMOLT_TASK_CONSOLE_TOKEN in Portainer}
      PROTOMOLT_TASK_CONSOLE_SESSION_SECONDS: ${PROTOMOLT_TASK_CONSOLE_SESSION_SECONDS:-43200}
      PROTOMOLT_TRANSCRIPT_KEY: ${PROTOMOLT_TRANSCRIPT_KEY:?set PROTOMOLT_TRANSCRIPT_KEY in Portainer}
    depends_on:
      serve-init:
        condition: service_completed_successfully
      repo-init:
        condition: service_completed_successfully
      jobs-init:
        condition: service_completed_successfully
    volumes:
      - protomolt-data:/data
    ports:
      - "${PROTOMOLT_HTTP_PORT:-19902}:8080"
      - "${PROTOMOLT_GRPC_PORT:-19903}:9090"
      - "${PROTOMOLT_REGISTRY_PORT:-19904}:8081"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}"
      - "traefik.http.routers.protomolt.rule=Host(`${PROTOMOLT_HOSTNAME:-protomolt.rokkon.com}`)"
      - "traefik.http.routers.protomolt.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.protomolt.tls=true"
      - "traefik.http.routers.protomolt.service=protomolt-http"
      - "traefik.http.services.protomolt-http.loadbalancer.server.port=8080"
      - "traefik.http.routers.protomolt-grpc.rule=Host(`${PROTOMOLT_GRPC_HOSTNAME:-protomolt-grpc.rokkon.com}`)"
      - "traefik.http.routers.protomolt-grpc.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.protomolt-grpc.tls=true"
      - "traefik.http.routers.protomolt-grpc.service=protomolt-grpc"
      - "traefik.http.services.protomolt-grpc.loadbalancer.server.port=9090"
      - "traefik.http.services.protomolt-grpc.loadbalancer.server.scheme=h2c"
      - "traefik.http.routers.protomolt-registry.rule=Host(`${PROTOMOLT_REGISTRY_HOSTNAME:-protomolt-registry.rokkon.com}`)"
      - "traefik.http.routers.protomolt-registry.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.protomolt-registry.tls=true"
      - "traefik.http.routers.protomolt-registry.service=protomolt-registry"
      - "traefik.http.services.protomolt-registry.loadbalancer.server.port=8081"
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11-preview.1
    container_name: protomolt-rustfs
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${PROTOMOLT_RUSTFS_ACCESS_KEY:-protomolt}
      RUSTFS_SECRET_KEY: ${PROTOMOLT_RUSTFS_SECRET_KEY:?set PROTOMOLT_RUSTFS_SECRET_KEY in Portainer}
    volumes:
      - rustfs-data:/data
    ports:
      - "${PROTOMOLT_RUSTFS_PORT:-31900}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 1g
    restart: unless-stopped

  rustfs-init:
    image: curlimages/curl:8.21.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      PROTOMOLT_RUSTFS_ACCESS_KEY: ${PROTOMOLT_RUSTFS_ACCESS_KEY:-protomolt}
      PROTOMOLT_RUSTFS_SECRET_KEY: ${PROTOMOLT_RUSTFS_SECRET_KEY:?set PROTOMOLT_RUSTFS_SECRET_KEY in Portainer}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for bucket in protomolt protomolt-lake; do
          curl --fail --silent --show-error --output /dev/null \
            --aws-sigv4 aws:amz:us-east-1:s3 \
            --user "$${PROTOMOLT_RUSTFS_ACCESS_KEY}:$${PROTOMOLT_RUSTFS_SECRET_KEY}" \
            -X PUT "http://rustfs:9000/$${bucket}"
        done
    restart: "no"

  repo-postgres:
    image: postgres:18.6-alpine
    container_name: protomolt-repo-postgres
    environment:
      POSTGRES_USER: ${PROTOMOLT_REPO_DB_USER:-documents}
      POSTGRES_PASSWORD: ${PROTOMOLT_REPO_DB_PASSWORD:?set PROTOMOLT_REPO_DB_PASSWORD in Portainer}
      POSTGRES_DB: ${PROTOMOLT_REPO_DB_NAME:-documents}
    volumes:
      # The 18 images moved PGDATA into a version-scoped subdirectory
      # (/var/lib/postgresql/18/docker) and declare /var/lib/postgresql as the
      # volume; 17 used /var/lib/postgresql/data for both. Mounting the 17 path
      # under 18 does not fail loudly: the server initialises a fresh cluster on
      # a path this file does not mount, reports healthy on an empty database,
      # and loses it on the next recreate. Mount the parent so the versioned
      # directory lives inside the volume, and so the next major lands beside
      # this one instead of on top of it.
      - repo-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 512m
    restart: unless-stopped

  repo-service:
    # Published by the Docker Publish workflow from repo/service/Dockerfile.
    # Pin a verified build with PROTOMOLT_REPO_SERVICE_IMAGE, same procedure
    # as PROTOMOLT_SERVE_IMAGE above.
    image: ${PROTOMOLT_REPO_SERVICE_IMAGE:-ghcr.io/ai-pipestream/protomolt-repo-service:edge}
    container_name: protomolt-repo-service
    environment:
      DOCUMENT_PLATFORM_GRPC_PORT: "9090"
      DOCUMENT_PLATFORM_HTTP_PORT: "off"
      DOCUMENT_PLATFORM_JDBC_URL: jdbc:postgresql://repo-postgres:5432/${PROTOMOLT_REPO_DB_NAME:-documents}
      DOCUMENT_PLATFORM_USERNAME: ${PROTOMOLT_REPO_DB_USER:-documents}
      DOCUMENT_PLATFORM_PASSWORD: ${PROTOMOLT_REPO_DB_PASSWORD:?set PROTOMOLT_REPO_DB_PASSWORD in Portainer}
      DOCUMENT_PLATFORM_S3_ENDPOINT: http://rustfs:9000
      DOCUMENT_PLATFORM_S3_REGION: us-east-1
      DOCUMENT_PLATFORM_S3_ACCESS_KEY: ${PROTOMOLT_RUSTFS_ACCESS_KEY:-protomolt}
      DOCUMENT_PLATFORM_S3_SECRET_KEY: ${PROTOMOLT_RUSTFS_SECRET_KEY:?set PROTOMOLT_RUSTFS_SECRET_KEY in Portainer}
    depends_on:
      repo-postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped

  repo-init:
    # Ensures the delegation transcript drive exists. CreateDrive is
    # idempotent per account and name, so redeploys are safe. The drive binds
    # the existing protomolt bucket created by rustfs-init.
    image: fullstorydev/grpcurl:v1.9.3-alpine
    depends_on:
      repo-service:
        condition: service_healthy
    environment:
      DELEGATION_DRIVE: ${PROTOMOLT_DELEGATION_REPO_DRIVE:-protomolt}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        grpcurl -plaintext \
          -d "{\"name\": \"$${DELEGATION_DRIVE}\", \"account_id\": \"protomolt\", \"drive_type\": \"DRIVE_TYPE_CUSTOM\", \"bucket\": \"protomolt\"}" \
          repo-service:9090 ai.pipestream.proto.repo.v1.DriveService/CreateDrive
    restart: "no"

  jobs-init:
    # Ensures the workflow-runs database exists beside the repo-service ledger
    # in the one PostgreSQL instance; separate databases keep the two Flyway
    # histories apart. This runs psql on every deploy rather than relying on
    # docker-entrypoint-initdb.d, which PostgreSQL executes only against an
    # empty data directory: on the NAS the volume already existed, so an
    # initdb.d script created nothing and the coordinator was pointed at a
    # database that was not there. Same image as repo-postgres so the psql
    # client matches the server. The role password rides PGPASSWORD, never
    # argv. Covered by test/jobs-init-test.sh, which runs this exact script
    # with a fake psql and is part of scripts/check-deployment-statics.sh.
    image: postgres:18.6-alpine
    depends_on:
      repo-postgres:
        condition: service_healthy
    environment:
      PGUSER: ${PROTOMOLT_REPO_DB_USER:-documents}
      PGPASSWORD: ${PROTOMOLT_REPO_DB_PASSWORD:?set PROTOMOLT_REPO_DB_PASSWORD in Portainer}
      JOBS_DB: ${PROTOMOLT_JOBS_DB_NAME:-jobs}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${JOBS_DB}" in
          *[!a-z0-9_]*|"") echo "PROTOMOLT_JOBS_DB_NAME must be a plain lowercase identifier, got '$${JOBS_DB}'" >&2; exit 1 ;;
        esac
        exists="$$(psql -v ON_ERROR_STOP=1 -h repo-postgres -U "$${PGUSER}" -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = '$${JOBS_DB}'")"
        if [ "$${exists}" = "1" ]; then
          echo "jobs database '$${JOBS_DB}' already exists"
          exit 0
        fi
        psql -v ON_ERROR_STOP=1 -h repo-postgres -U "$${PGUSER}" -d postgres \
          -c "CREATE DATABASE \"$${JOBS_DB}\" OWNER \"$${PGUSER}\""
        echo "created jobs database '$${JOBS_DB}' owned by $${PGUSER}"
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: protomolt-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PROTOMOLT_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PROTOMOLT_KEYCLOAK_ADMIN_PASSWORD:?set PROTOMOLT_KEYCLOAK_ADMIN_PASSWORD in Portainer}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${PROTOMOLT_KEYCLOAK_HOSTNAME:-https://keycloak.rokkon.com}
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65
      PROTOMOLT_KEYCLOAK_CLIENT_SECRET: ${PROTOMOLT_KEYCLOAK_CLIENT_SECRET:?set PROTOMOLT_KEYCLOAK_CLIENT_SECRET in Portainer}
    configs:
      - source: protomolt-realm
        target: /opt/keycloak/data/import/protomolt-realm.json
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "${PROTOMOLT_KEYCLOAK_PORT:-19901}:8080"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}"
      - "traefik.http.routers.protomolt-keycloak.rule=Host(`${PROTOMOLT_KEYCLOAK_ROUTER_HOST:-keycloak.rokkon.com}`)"
      - "traefik.http.routers.protomolt-keycloak.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.protomolt-keycloak.tls=true"
      - "traefik.http.services.protomolt-keycloak.loadbalancer.server.port=8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q '200'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

configs:
  protomolt-realm:
    content: |
      {
        "realm": "protomolt",
        "displayName": "ProtoMolt",
        "enabled": true,
        "registrationAllowed": false,
        "resetPasswordAllowed": false,
        "roles": {
          "realm": [
            {"name": "protomolt-agent"},
            {"name": "protomolt-admin"}
          ]
        },
        "clients": [
          {
            "clientId": "protomolt-coordinator",
            "name": "ProtoMolt coordinator service client",
            "enabled": true,
            "protocol": "openid-connect",
            "clientAuthenticatorType": "client-secret",
            "secret": "$${PROTOMOLT_KEYCLOAK_CLIENT_SECRET}",
            "publicClient": false,
            "serviceAccountsEnabled": true,
            "standardFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "authorizationServicesEnabled": false
          }
        ]
      }

volumes:
  protomolt-data:
  rustfs-data:
  keycloak-data:
  repo-postgres-data:

networks:
  default:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_network}
