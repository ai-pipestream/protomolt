# The document platform, self-contained: one platform container (repo-service,
# intake door, parsing coordinator with the embedded reference parser, durable
# jobs worker, schema registry, parser playground), one PostgreSQL instance
# carrying the two platform databases, and RustFS as the S3-compatible object
# store. Build the app first:
#
#   ./gradlew :protomolt-document-platform:installDist
#   docker compose -f deploy/document-platform/compose.yml up --build
#
# Then: playground http://localhost:8095, registry http://localhost:8081,
# intake gRPC localhost:9092 (demo key: demo-key -> account demo).
name: protomolt-document-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: protomolt
      POSTGRES_PASSWORD: protomolt
      POSTGRES_DB: documents
    volumes:
      - ./init-jobs-db.sql:/docker-entrypoint-initdb.d/init-jobs-db.sql:ro
      - platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protomolt -d documents"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Pinned concrete tag: RustFS is pre-1.0, moving fast (same pin rationale as
  # the integration compose).
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11-preview.1
    environment:
      RUSTFS_ACCESS_KEY: protomolt
      RUSTFS_SECRET_KEY: protomoltsecret
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - platform-rustfs:/data/rustfs0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  platform:
    build:
      context: ../../apps/document-platform
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # Repository (the DOCUMENT_PLATFORM_* family repo-service documents).
      DOCUMENT_PLATFORM_JDBC_URL: jdbc:postgresql://postgres:5432/documents
      DOCUMENT_PLATFORM_USERNAME: protomolt
      DOCUMENT_PLATFORM_PASSWORD: protomolt
      DOCUMENT_PLATFORM_S3_ENDPOINT: http://rustfs:9000
      DOCUMENT_PLATFORM_S3_REGION: us-east-1
      DOCUMENT_PLATFORM_S3_ACCESS_KEY: protomolt
      DOCUMENT_PLATFORM_S3_SECRET_KEY: protomoltsecret
      DOCUMENT_PLATFORM_SEED_ACCOUNT_ID: demo
      # Jobs store (its own database, its own Flyway history).
      DOCUMENT_PLATFORM_JOBS_JDBC_URL: jdbc:postgresql://postgres:5432/jobs
      DOCUMENT_PLATFORM_JOBS_USERNAME: protomolt
      DOCUMENT_PLATFORM_JOBS_PASSWORD: protomolt
      # Registry git repository on the /data volume.
      DOCUMENT_PLATFORM_REGISTRY_GIT: /data/registry.git
      # Demo key store: key demo-key, account demo (the seeded account).
      DOCUMENT_PLATFORM_INTAKE_KEYS: demo-key=demo
      # Search index on the /data volume. To activate the vector lane, mount
      # a Model2Vec model directory and set PROTOMOLT_MODEL2VEC_PATH to it;
      # without one the repo-document subject serves the lexical lane only.
      DOCUMENT_PLATFORM_SEARCH_INDEX_DIR: /data/search-index
    ports:
      - "9090:9090"   # repo gRPC
      - "9092:9092"   # intake gRPC
      - "9093:9093"   # parse gRPC
      - "9094:9094"   # search gRPC
      - "8081:8081"   # registry HTTP (+ jobs verbs on /protomolt/actions)
      - "8095:8095"   # parser playground
    volumes:
      - platform-registry:/data

volumes:
  platform-postgres:
  platform-rustfs:
  platform-registry:
