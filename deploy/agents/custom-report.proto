syntax = "proto3";

package ai.protomolt.proto.starter.protocol.v1;

import "ai/protomolt/proto/validate/v1/validate.proto";

// Caller-owned qualification contract, distinct from the bundled starter report.
message CustomProtocolReport {
  option (ai.protomolt.proto.validate.v1.message).cel = {
    id: "protocol-observation-count"
    message: "observation_count must equal the number of observations"
    expression: "this.observation_count == this.observations.size()"
  };

  string title = 1 [(ai.protomolt.proto.validate.v1.field) = {
    required: true
    string: {min_len: 8, max_len: 160}
  }];
  repeated string observations = 2 [(ai.protomolt.proto.validate.v1.field).repeated = {
    min_items: 1
    max_items: 8
    items: {string: {min_len: 1, max_len: 512}}
  }];
  int32 observation_count = 3 [(ai.protomolt.proto.validate.v1.field).int32 = {
    gte: 1
    lte: 8
  }];
  string evidence_digest = 4 [(ai.protomolt.proto.validate.v1.field) = {
    required: true
    string: {sha256_hex: true}
  }];
}
