description = 'Unpublished end-to-end system tests exercising the toolkit across module boundaries'

dependencies {
    testImplementation project(':protomolt-grpc-service')
    testImplementation project(':protomolt-mcp')
    testImplementation project(':protomolt-descriptors')
    testImplementation project(':protomolt-proto-sources')
    testImplementation project(':protomolt-gather')
    testImplementation project(':protomolt-gather-git')
    testImplementation project(':protomolt-compat')
    testImplementation project(':protomolt-registry')
    testImplementation project(':protomolt-registry-server')
    testImplementation project(':protomolt-schema-confluent')
    testImplementation project(':protomolt-protobuf-validation')
    testImplementation project(':protomolt-json')
    testImplementation project(':protomolt-jsonschema')
    testImplementation project(':protomolt-index-spi')
    testImplementation project(':protomolt-index-opensearch')
    testImplementation libs.jackson.databind
    testImplementation libs.jgit
}

// The checked-in action inventory is generated from the actual full and standalone
// catalog constructors. Run this task whenever an action registration changes; the
// system test makes a stale generated file fail the build.
tasks.register('generateActionInventory', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.pipestream.proto.mcp.CatalogInventoryGenerator'
    args rootProject.file('docs/generated/action-inventory.json').absolutePath
}
