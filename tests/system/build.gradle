// The checked-in action inventory is generated from the actual full and standalone
// catalog constructors. Run this task whenever an action registration changes; the
// system test makes a stale generated file fail the build.
tasks.register('generateActionInventory', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.protomolt.proto.mcp.CatalogInventoryGenerator'
    args rootProject.file('docs/generated/action-inventory.json').absolutePath
}

tasks.register('updateCompatibilityBaseline', JavaExec) {
    group = 'verification'
    description = 'Advances or regenerates the 5-surface release compatibility baseline in compatibility/baseline/'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.protomolt.proto.compat.CompatibilityBaselineGenerator'
    args '--update', rootProject.file('compatibility/baseline').absolutePath
}

tasks.register('checkCompatibilityBaseline', JavaExec) {
    group = 'verification'
    description = 'Verifies current repository surfaces against the recorded compatibility/baseline/ snapshot'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.protomolt.proto.compat.CompatibilityBaselineGenerator'
    args '--check', rootProject.file('compatibility/baseline').absolutePath
}
