    testImplementation project(':protomolt-http-rest')
    testImplementation project(':protomolt-http-openapi')
    testImplementation project(':protomolt-authz')
    testImplementation project(':protomolt-delegation')
    testImplementation project(':protomolt-delegation-proto')
    testImplementation project(':protomolt-delegation-repository')
    testImplementation project(':protomolt-emit-renderer')
    testImplementation project(':protomolt-mesh-proto')
    testImplementation project(':protomolt-mesh-cluster')
    testImplementation project(':protomolt-metric-service')
    testImplementation project(':protomolt-repo-admission')
    testImplementation project(':protomolt-repo-proto')
    testImplementation project(':protomolt-receipt')
    testImplementation project(':protomolt-serve')
    testImplementation project(':protomolt-search-index-spi')
    testImplementation project(':protomolt-search-index-opensearch')
    testImplementation project(':protomolt-search-service')
    testImplementation project(':protomolt-workflow-authoring')
    testImplementation libs.awssdk.s3
    testImplementation libs.jackson.databind
    testImplementation libs.jgit

    // The golden-path system test: the whole document platform in one JVM.
    testImplementation project(':protomolt-intake-service')
    testImplementation project(':protomolt-parse-service')
    testImplementation project(':protomolt-parse-text')
    testImplementation project(':protomolt-parse-document')
    testImplementation project(':protomolt-repo-service')
    testImplementation project(':protomolt-repo-container')
    testImplementation project(':protomolt-jobs-service')
    testImplementation project(':protomolt-workflow')
    testImplementation project(':protomolt-actions')
    testImplementation project(':protomolt-search-index-lucene')
    testImplementation project(':protomolt-mapper')
    testImplementation project(':protomolt-search-embedding')
    testImplementation project(':protomolt-search-embedding-model2vec')
    testImplementation project(':protomolt-search-chunk')
