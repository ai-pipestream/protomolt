    // Complete published BOM inventory scanned in an isolated child ClassLoader so
    // framework-specific loggers (Quarkus JBoss LogManager, CLI slf4j-nop) never
    // pollute the system-test JVM runtime classpath.
    publishedBomModuleNames.each { moduleName ->
        compatibilityInventory project(":${moduleName}")
    }
    compatibilityInventory platform(libs.quarkus.bom)
    compatibilityInventory libs.hadoop.client.api
    compatibilityInventory libs.kafka.connect.api
    compatibilityInventory libs.kafka.clients
    compatibilityInventory libs.spring.context
    compatibilityInventory libs.spring.web
    compatibilityInventory libs.spring.boot.autoconfigure
    compatibilityInventory libs.micronaut.inject
    compatibilityInventory libs.javax.annotation.api
    compatibilityInventory libs.tomcat.annotations.api
}

def compatibilityInventoryFile = layout.buildDirectory.file('compatibility-inventory/classpath.txt')

def writeCompatibilityInventoryClasspath = tasks.register('writeCompatibilityInventoryClasspath') {
    description = 'Writes resolved published BOM inventory classpath entries for CompatibilityBaselineGenerator'
    inputs.files(configurations.compatibilityInventory)
    outputs.file(compatibilityInventoryFile)
    outputs.cacheIf { false }
    doLast {
        File out = compatibilityInventoryFile.get().asFile
        out.parentFile.mkdirs()
        out.text = configurations.compatibilityInventory.files
                .collect { it.absolutePath }
                .join('\n') + '\n'
    }
}

tasks.withType(Test).configureEach {
    dependsOn writeCompatibilityInventoryClasspath
    jvmArgumentProviders.add({
        ["-Dprotomolt.compat.inventoryClasspathFile=${compatibilityInventoryFile.get().asFile.absolutePath}".toString()]
    } as CommandLineArgumentProvider)
}

// The checked-in action inventory is generated from the actual full and standalone
// catalog constructors. Run this task whenever an action registration changes; the
// system test makes a stale generated file fail the build.
tasks.register('generateActionInventory', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.protomolt.proto.mcp.CatalogInventoryGenerator'
    args rootProject.file('docs/generated/action-inventory.json').absolutePath
}

tasks.register('updateCompatibilityBaseline', JavaExec) {
    group = 'verification'
    description = 'Advances or regenerates the 5-surface release compatibility baseline in compatibility/baseline/'
    dependsOn tasks.named('testClasses'), writeCompatibilityInventoryClasspath
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.protomolt.proto.compat.CompatibilityBaselineGenerator'
    if (System.getProperty('protomolt.compat.allowMajorReleaseBreak') != null) {
        systemProperty 'protomolt.compat.allowMajorReleaseBreak',
                System.getProperty('protomolt.compat.allowMajorReleaseBreak')
    }
    jvmArgumentProviders.add({
        ["-Dprotomolt.compat.inventoryClasspathFile=${compatibilityInventoryFile.get().asFile.absolutePath}".toString()]
    } as CommandLineArgumentProvider)
    args '--update', rootProject.file('compatibility/baseline').absolutePath
}

tasks.register('checkCompatibilityBaseline', JavaExec) {
    group = 'verification'
    description = 'Verifies current repository surfaces against the recorded compatibility/baseline/ snapshot'
    dependsOn tasks.named('testClasses'), writeCompatibilityInventoryClasspath
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.protomolt.proto.compat.CompatibilityBaselineGenerator'
    jvmArgumentProviders.add({
        ["-Dprotomolt.compat.inventoryClasspathFile=${compatibilityInventoryFile.get().asFile.absolutePath}".toString()]
    } as CommandLineArgumentProvider)
    args '--check', rootProject.file('compatibility/baseline').absolutePath
}
