    testImplementation project(':protomolt-registry-service')
    testImplementation project(':protomolt-schema-confluent')
    testImplementation project(':protomolt-protobuf-validation')
    testImplementation project(':protomolt-protobuf-metadata')
    testImplementation project(':protomolt-helpers')
    testImplementation project(':protomolt-http-json')
