description = 'Unpublished end-to-end system tests exercising the toolkit across module boundaries'

dependencies {
    testImplementation project(':protomolt-grpc-service')
    testImplementation project(':protomolt-mcp')
    testImplementation project(':protomolt-descriptors')
    testImplementation project(':protomolt-sources')
    testImplementation project(':protomolt-acquire-gather')
    testImplementation project(':protomolt-acquire-gather-git')
    testImplementation project(':protomolt-compat')
    testImplementation project(':protomolt-registry')
    testImplementation project(':protomolt-registry-service')
    testImplementation project(':protomolt-schema-confluent')
    testImplementation project(':protomolt-protobuf-validation')
    testImplementation project(':protomolt-http-json')
    testImplementation project(':protomolt-http-jsonschema')
    testImplementation project(':protomolt-search-index-spi')
    testImplementation project(':protomolt-search-index-opensearch')
    testImplementation libs.jackson.databind
    testImplementation libs.jgit

    // The golden-path system test: the whole document platform in one JVM.
    testImplementation project(':protomolt-intake-service')
    testImplementation project(':protomolt-parse-service')
    testImplementation project(':protomolt-parse-text')
    testImplementation project(':protomolt-parse-document')
    testImplementation project(':protomolt-repo-service')
    testImplementation project(':protomolt-repo-container')
    testImplementation project(':protomolt-jobs-service')
    testImplementation project(':protomolt-workflow')
    testImplementation project(':protomolt-actions')
    testImplementation project(':protomolt-search-index-lucene')
    testImplementation project(':protomolt-mapper')
    testImplementation project(':protomolt-search-embedding')
    testImplementation project(':protomolt-search-embedding-model2vec')
    testImplementation project(':protomolt-search-chunk')
    testImplementation project(':protomolt-protobuf-seo')
    // The court corpus fixture rides the samples jar's resources.
    testImplementation project(':samples')
    testImplementation libs.grpc.inprocess
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.junit.jupiter
}

// The Lucene 11 line ships Java 25 bytecode, so the golden-path system test
// cannot run on an older JVM: the test launcher stays on the toolchain JDK
// and -PtestJdk is ignored here (same pin as :protomolt-search-index-lucene).
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// The checked-in action inventory is generated from the actual full and standalone
// catalog constructors. Run this task whenever an action registration changes; the
// system test makes a stale generated file fail the build.
tasks.register('generateActionInventory', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.protomolt.proto.mcp.CatalogInventoryGenerator'
    args rootProject.file('docs/generated/action-inventory.json').absolutePath
}
